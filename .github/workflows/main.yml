                                      } else {
                                          map.setTileSource(TileSourceFactory.DEFAULT_TILE_SOURCE)
                                      }
                                      map.setUseDataConnection(false)
                                  } catch (e: Exception) {
                                      map.setTileSource(MapSetup.layerFor("topo").source)
                                  }
                              } else {
                                  map.setTileSource(MapSetup.layerFor(p.baseLayer).source)
