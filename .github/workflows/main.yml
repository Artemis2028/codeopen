          cat > 'settings.gradle.kts' <<'EOF_GRIDFIX'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GridFix"
          include(":app")
          EOF_GRIDFIX
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Sync source from bootstrap workflow'
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build status branch
        if: always()
        env:
          OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          mkdir -p /tmp/ci-status
          cd /tmp/ci-status
          git init -q -b ci-status
          {
            echo "outcome=$OUTCOME"
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > outcome.txt
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > buildlog.txt 2>/dev/null || echo "no log" > buildlog.txt
          if [ "$OUTCOME" = "success" ]; then
            cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" gridfix-debug.apk
          fi
          git add -A
          git -c user.email='ci@gridfix.local' -c user.name='GridFix CI' commit -qm "build ${{ github.run_number }}: $OUTCOME"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-status

      - name: Upload APK artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gridfix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest release for phone install
        if: steps.gradle.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gridfix-debug.apk
          gh release delete latest --yes || true
          git push --delete origin refs/tags/latest || true
          gh release create latest gridfix-debug.apk \
            --title "GridFix debug build ${{ github.run_number }}" \
            --notes 'On your Android phone: tap gridfix-debug.apk below, allow the install when prompted, open GridFix.'

      - name: Fail the job if the build failed
        if: steps.gradle.outcome != 'success'
        run: exit 1
