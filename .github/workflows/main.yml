          private fun listMbtiles(context: Context): List<String> =
              MapSetup.mbtilesDir(context).listFiles()
                  ?.filter { it.isFile && it.name.endsWith(".mbtiles", ignoreCase = true) }
                  ?.map { it.name }
                  ?.sorted()
                  ?: emptyList()

          /**
           * Copy the picked document into the app's MBTiles folder and sanity-check it.
           * Returns (importedFileName or null, user message).
           */
          private suspend fun importMbtiles(context: Context, uri: Uri): Pair<String?, String> =
              withContext(Dispatchers.IO) {
                  try {
                      var display = "imported.mbtiles"
                      context.contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (idx >= 0 && cursor.moveToFirst()) {
                              cursor.getString(idx)?.let { display = it }
                          }
                      }
                      var name = display.replace(Regex("[^A-Za-z0-9 ._-]"), "_").trim()
                      if (!name.endsWith(".mbtiles", ignoreCase = true)) name += ".mbtiles"
                      val dir = MapSetup.mbtilesDir(context)
                      var target = File(dir, name)
                      var counter = 2
                      while (target.exists()) {
                          target = File(dir, name.removeSuffix(".mbtiles") + "-$counter.mbtiles")
                          counter++
                      }
                      val input = context.contentResolver.openInputStream(uri)
                          ?: return@withContext null to "Couldn't open that file"
                      input.use { stream ->
                          target.outputStream().use { output -> stream.copyTo(output) }
                      }
                      // Sanity check: must be SQLite with tiles, and raster (not vector) format
                      val db = SQLiteDatabase.openDatabase(target.absolutePath, null, SQLiteDatabase.OPEN_READONLY)
                      var format = ""
                      var hasTiles = false
                      db.use { d ->
                          d.rawQuery(
                              "SELECT name FROM sqlite_master WHERE type IN ('table','view') AND name='tiles'",
                              null,
                          ).use { c -> hasTiles = c.moveToFirst() }
                          runCatching {
                              d.rawQuery("SELECT value FROM metadata WHERE name='format'", null).use { c ->
                                  if (c.moveToFirst()) format = c.getString(0) ?: ""
                              }
                          }
                      }
                      if (!hasTiles) {
                          target.delete()
                          return@withContext null to "Not a usable MBTiles file (no tiles table)"
                      }
                      if (format.equals("pbf", ignoreCase = true)) {
                          target.delete()
                          return@withContext null to "Vector MBTiles aren't supported — use raster (png/jpg) tiles"
                      }
                      target.name to "Imported ${target.name}"
                  } catch (e: Exception) {
                      null to "Import failed: ${e.message ?: "unknown error"}"
                  }
              }
          EOF_GRIDFIX
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Sync v0.8.3 (doctrine graphics II) source from bootstrap workflow'
            git push origin HEAD:main
          fi

      - name: Materialize symbol tree from icon pack
        run: |
          if [ ! -f 'Nato Icons.zip' ]; then
            echo 'ERROR: Nato Icons.zip is not in the repo root.'
            echo 'Upload it once on GitHub: Add file -> Upload files -> drop the zip -> Commit.'
            exit 1
          fi
          python3 - <<'PYEOF'
          import sys, zipfile, pathlib
          dirs = {"f": ("Friend Land", "1"), "h": ("Hostile Land", "3"),
                  "n": ("Neutral Land", "2"), "u": ("Unknown Land", "0")}
          out = pathlib.Path("app/src/main/res/drawable-nodpi")
          z = zipfile.ZipFile("Nato Icons.zip")
          names = set(z.namelist())
          rows = []
          for line in open("app/symbol-manifest.tsv"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              key, dim, func = line.split("\t")
              rows.append((key, dim, func))
          missing = []
          count = 0
          for key, dim, func in rows:
              for aff, (d, p) in dirs.items():
                  entry = d + "/" + p + "." + ("s" + aff + dim + "p" + func).ljust(15, "-") + ".png"
                  if entry not in names:
                      missing.append(entry)
                      continue
                  (out / ("nato_" + aff + "_" + key + ".png")).write_bytes(z.read(entry))
                  count += 1
          if missing:
              print("MISSING ICONS:", missing)
              sys.exit(1)
          print("materialized", count, "symbol PNGs from the icon pack")
          PYEOF

      - name: Guard NATO symbol assets
        run: |
          COUNT=$(ls app/src/main/res/drawable-nodpi 2>/dev/null | grep -c '^nato_' || true)
          if [ "$COUNT" -lt 112 ]; then
            echo "ERROR: expected 112 curated NATO symbol PNGs in the repo, found $COUNT."
            echo "52 committed by the v0.2.2 bootstrap + 60 by the v0.7.8 doctrine pack; do not delete them."
            exit 1
          fi
          echo "$COUNT NATO symbols present"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build status branch
        if: always()
        env:
          OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          mkdir -p /tmp/ci-status
          cd /tmp/ci-status
          git init -q -b ci-status
          {
            echo "outcome=$OUTCOME"
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > outcome.txt
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > buildlog.txt 2>/dev/null || echo "no log" > buildlog.txt
          if [ "$OUTCOME" = "success" ]; then
            cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" gridfix-debug.apk
          fi
          git add -A
          git -c user.email='ci@gridfix.local' -c user.name='GridFix CI' commit -qm "build ${{ github.run_number }}: $OUTCOME"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-status

      - name: Upload APK artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gridfix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest release for phone install
        if: steps.gradle.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gridfix-debug.apk
          gh release delete latest --yes || true
          git push --delete origin refs/tags/latest || true
          gh release create latest gridfix-debug.apk \
            --title "GridFix debug build ${{ github.run_number }}" \
            --notes 'On your Android phone: tap gridfix-debug.apk below, allow the install when prompted, open GridFix.'

      - name: Fail the job if the build failed
        if: steps.gradle.outcome != 'success'
        run: exit 1
