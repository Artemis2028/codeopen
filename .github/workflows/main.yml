          import java.util.Locale

          @Composable
          fun SymbolRow(
              keys: List<String>,
              selected: String,
              affiliation: String,
              labelFor: ((String) -> String)? = null,
              night: Boolean = false,
              onSelect: (String) -> Unit,
          ) {
              Row(
                  modifier = Modifier.horizontalScroll(rememberScrollState()),
                  horizontalArrangement = Arrangement.spacedBy(8.dp),
              ) {
                  keys.forEach { key ->
                      val isSelected = key == selected
                      Column(
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(2.dp),
                      ) {
                          Box(
                              modifier = Modifier
                                  .size(46.dp)
                                  .clip(CircleShape)
                                  .border(
                                      width = if (isSelected) 2.dp else 1.dp,
                                      color = if (isSelected) MaterialTheme.colorScheme.primary
                                      else MaterialTheme.colorScheme.outline,
                                      shape = CircleShape,
                                  )
                                  .clickable { onSelect(key) },
                              contentAlignment = Alignment.Center,
                          ) {
                              WaypointMarker(symbol = key, affiliation = affiliation, size = 32.dp, night = night)
                          }
                          labelFor?.let { f ->
                              Text(
                                  f(key),
                                  style = MaterialTheme.typography.labelSmall,
                                  fontSize = 9.sp,
                                  maxLines = 1,
                                  color = if (isSelected) MaterialTheme.colorScheme.primary
                                  else MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          }
                      }
                  }
              }
          }

          /**
           * Create/edit dialog for a waypoint, shared by the Waypoints screen (preset =
           * current GPS position) and the Map screen (preset = crosshair position).
           */
          @Composable
          fun WaypointDialog(
              initial: Waypoint?,
              presetLat: Double?,
              presetLon: Double?,
              presetLabel: String,
              folderNames: List<String>,
              defaultName: String,
              onConfirm: (WaypointDraft) -> Unit,
              onDismiss: () -> Unit,
              night: Boolean = false,
          ) {
              val baseParts = remember(initial) {
                  when {
                      initial != null -> Coordinates.mgrs(initial.lat, initial.lon, 10)
                      presetLat != null && presetLon != null -> Coordinates.mgrs(presetLat, presetLon, 10)
                      else -> null
                  }
              }

              var name by remember(initial) { mutableStateOf(initial?.name ?: "") }
              var folder by remember(initial) { mutableStateOf(initial?.folder ?: DEFAULT_FOLDER) }
              var symbol by remember(initial) { mutableStateOf(initial?.symbol ?: "flag") }
              var affiliation by remember(initial) { mutableStateOf(initial?.affiliation ?: "none") }
              var echelon by remember(initial) { mutableStateOf(initial?.echelon ?: "") }
              var designation by remember(initial) { mutableStateOf(initial?.designation ?: "") }
              var usePreset by remember(initial) { mutableStateOf(initial == null && presetLat != null) }
              var gzdSquare by remember(initial) {
                  mutableStateOf(baseParts?.let { "${it.gzd} ${it.square}" } ?: "")
              }
              var easting by remember(initial) { mutableStateOf(baseParts?.easting ?: "") }
              var northing by remember(initial) { mutableStateOf(baseParts?.northing ?: "") }
              var error by remember(initial) { mutableStateOf<String?>(null) }

              val bigDigits = LocalTextStyle.current.copy(
                  fontFamily = FontFamily.Monospace,
                  fontSize = 22.sp,
                  textAlign = TextAlign.Center,
              )

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(if (initial == null) "New waypoint" else "Edit waypoint") },
                  text = {
                      Column(
                          modifier = Modifier.verticalScroll(rememberScrollState()),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          OutlinedTextField(
                              value = name,
                              onValueChange = { name = it },
                              label = { Text("Name") },
                              placeholder = { Text(defaultName) },
                              singleLine = true,
                          )

                          Text("Affiliation", style = MaterialTheme.typography.labelLarge)
                          Row(
                              modifier = Modifier.horizontalScroll(rememberScrollState()),
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                          ) {
                              Affiliations.all.forEach { key ->
                                  FilterChip(
                                      selected = key == affiliation,
                                      onClick = { affiliation = key },
                                      label = { Text(Affiliations.label(key)) },
                                  )
                              }
                          }

                          Text("Symbol", style = MaterialTheme.typography.labelLarge)
                          SymbolRow(
                              keys = WaypointSymbols.all,
                              selected = symbol,
                              affiliation = affiliation,
                              labelFor = { WaypointSymbols.label(it) },
                              night = night,
                          ) { symbol = it }

                          Text("Tactical task", style = MaterialTheme.typography.labelLarge)
                          SymbolRow(
                              keys = WaypointSymbols.tasks,
                              selected = symbol,
                              affiliation = affiliation,
                              labelFor = { WaypointSymbols.taskLabel(it) },
                              night = night,
                          ) { symbol = it }

                          Text("NATO units", style = MaterialTheme.typography.labelLarge)
                          NatoSymbols.affiliations.forEach { (aff, affLabel) ->
                              Text(
                                  affLabel,
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                              SymbolRow(
                                  keys = NatoSymbols.keysFor(aff),
                                  selected = symbol,
                                  affiliation = affiliation,
                                  labelFor = { NatoSymbols.functionLabel(it) },
                                  night = night,
                              ) { symbol = it }
                          }

                          Text("Echelon", style = MaterialTheme.typography.labelLarge)
                          Row(
                              modifier = Modifier.horizontalScroll(rememberScrollState()),
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                          ) {
                              Echelons.all.forEach { (key, label) ->
                                  FilterChip(
                                      selected = key == echelon,
                                      onClick = { echelon = key },
                                      label = { Text(label) },
                                  )
                              }
                          }
                          OutlinedTextField(
                              value = designation,
                              onValueChange = { designation = it.take(24) },
                              label = { Text("Unit designation (optional)") },
                              placeholder = { Text("e.g. A/1-502") },
                              singleLine = true,
                          )

                          Text("Folder", style = MaterialTheme.typography.labelLarge)
                          if (folderNames.isNotEmpty()) {
                              Row(
                                  modifier = Modifier.horizontalScroll(rememberScrollState()),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                              ) {
                                  folderNames.forEach { f ->
                                      FilterChip(
                                          selected = f == folder,
                                          onClick = { folder = f },
                                          label = { Text(f) },
                                      )
                                  }
                              }
                          }
                          OutlinedTextField(
                              value = folder,
                              onValueChange = { folder = it },
                              label = { Text("Folder (type to create new)") },
                              singleLine = true,
                          )

                          Text("Position", style = MaterialTheme.typography.labelLarge)
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              FilterChip(
                                  selected = usePreset,
                                  onClick = { usePreset = true },
                                  label = { Text(presetLabel) },
                                  enabled = presetLat != null,
                              )
                              FilterChip(
                                  selected = !usePreset,
                                  onClick = { usePreset = false },
                                  label = { Text("MGRS grid") },
                              )
                          }
                          if (!usePreset) {
                              OutlinedTextField(
                                  value = gzdSquare,
                                  onValueChange = { v ->
                                      gzdSquare = v.uppercase(Locale.US)
                                          .filter { it.isLetterOrDigit() || it == ' ' }
                                          .take(7)
                                      error = null
                                  },
                                  label = { Text("Grid zone") },
                                  placeholder = { Text("39R TM") },
                                  singleLine = true,
                                  textStyle = bigDigits,
                                  keyboardOptions = KeyboardOptions(capitalization = KeyboardCapitalization.Characters),
                                  modifier = Modifier.fillMaxWidth(),
                              )
                              Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  OutlinedTextField(
                                      value = easting,
                                      onValueChange = { v ->
                                          easting = v.filter { it.isDigit() }.take(5)
                                          error = null
                                      },
                                      label = { Text("Easting") },
                                      placeholder = { Text("23559") },
                                      singleLine = true,
                                      textStyle = bigDigits,
                                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                                      modifier = Modifier.weight(1f),
                                  )
                                  OutlinedTextField(
                                      value = northing,
                                      onValueChange = { v ->
                                          northing = v.filter { it.isDigit() }.take(5)
                                          error = null
                                      },
                                      label = { Text("Northing") },
                                      placeholder = { Text("96991") },
                                      singleLine = true,
                                      textStyle = bigDigits,
                                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                                      modifier = Modifier.weight(1f),
                                  )
                              }
                          } else if (presetLat != null && presetLon != null) {
                              Text(
                                  "$presetLabel: " + (Coordinates.mgrs(presetLat, presetLon, 10)?.full ?: "—"),
                                  style = MaterialTheme.typography.bodySmall,
                                  fontFamily = FontFamily.Monospace,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          }
                          error?.let {
                              Text(
                                  it,
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.error,
                              )
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = {
                          val finalName = name.ifBlank { defaultName }
                          val finalFolder = folder.ifBlank { DEFAULT_FOLDER }
                          if (usePreset && presetLat != null && presetLon != null) {
                              onConfirm(
                                  WaypointDraft(
                                      finalName, presetLat, presetLon, finalFolder, symbol, affiliation,
                                      echelon, designation.trim(),
                                  )
                              )
                          } else if (easting.isEmpty() || easting.length != northing.length) {
                              error = "Easting and northing need the same number of digits."
                          } else {
                              val parsed = Coordinates.parseMgrs(gzdSquare + easting + northing)
                              if (parsed == null) {
                                  error = "Couldn't read that grid — check the zone letters and digits."
                              } else {
                                  onConfirm(
                                      WaypointDraft(
                                          finalName, parsed.first, parsed.second, finalFolder, symbol, affiliation,
                                          echelon, designation.trim(),
                                      )
                                  )
                              }
                          }
                      }) { Text(if (initial == null) "Add" else "Save") }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) { Text("Cancel") }
                  },
              )
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/ui'
          cat > 'app/src/main/java/app/gridfix/android/ui/WaypointMarker.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.ui

          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.size
          import androidx.compose.material3.Icon
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ColorFilter
          import androidx.compose.ui.graphics.ColorMatrix
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.drawscope.DrawScope
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.drawscope.rotate
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlin.math.cos
          import kotlin.math.sin

          /** MIL-STD-2525-style affiliation colors. */
          object Affiliations {
              val all = listOf("none", "friendly", "hostile", "neutral", "unknown")

              fun label(key: String): String = when (key) {
                  "friendly" -> "Friendly"
                  "hostile" -> "Hostile"
                  "neutral" -> "Neutral"
                  "unknown" -> "Unknown"
                  else -> "None"
              }

              fun color(key: String, fallback: Color): Color = when (key) {
                  "friendly" -> Color(0xFF5BC8F5)   // crystal blue
                  "hostile" -> Color(0xFFFF6B60)    // salmon red
                  "neutral" -> Color(0xFF8FE38F)    // bamboo green
                  "unknown" -> Color(0xFFF0E060)    // light yellow
                  else -> fallback
              }
          }

          /**
           * Renders a waypoint marker:
           * - NATO unit keys (nato_*) render the bundled MIL-STD-2525B symbol image
           * - tactical task keys (task_*) render drawn task glyphs or letter badges
           * - shape keys render plain drawn shapes
           * - everything else renders a material icon
           * Non-NATO markers get an affiliation frame (friendly rectangle, hostile diamond,
           * neutral square, unknown circle) except tasks, which stand alone per doctrine.
           */
          /** Night-vision red: luminance mapped onto the red channel, green/blue dropped. */
          private val NightImageFilter = ColorFilter.colorMatrix(
              ColorMatrix(
                  floatArrayOf(
                      0.35f, 0.50f, 0.15f, 0f, 30f,
                      0f, 0f, 0f, 0f, 0f,
                      0f, 0f, 0f, 0f, 0f,
                      0f, 0f, 0f, 1f, 0f,
                  )
              )
          )
          private val NightRed = Color(0xFFFF3B30)

          @Composable
          fun WaypointMarker(
              symbol: String,
              affiliation: String,
              modifier: Modifier = Modifier,
              size: Dp = 30.dp,
              echelon: String = "",
              night: Boolean = false,
          ) {
              if (NatoSymbols.isNato(symbol)) {
                  val res = NatoSymbols.resId(symbol)
                  if (res != null) {
                      Box(modifier.size(size)) {
                          Image(
                              painter = painterResource(res),
                              contentDescription = NatoSymbols.label(symbol),
                              modifier = Modifier.fillMaxSize(),
                              colorFilter = if (night) NightImageFilter else null,
                          )
                          EchelonMarks(
                              echelon = echelon,
                              color = if (night) NightRed
                              else Affiliations.color(affiliation, MaterialTheme.colorScheme.primary),
                              halo = MaterialTheme.colorScheme.background,
                          )
                      }
                      return
                  }
              }

              val color = if (night) NightRed
              else Affiliations.color(affiliation, MaterialTheme.colorScheme.primary)
              val isShape = WaypointSymbols.isShape(symbol)
              val isTask = WaypointSymbols.isTask(symbol)
              val taskLetter = if (isTask) WaypointSymbols.taskLetter(symbol) else null

              Box(modifier.size(size), contentAlignment = Alignment.Center) {
                  Canvas(Modifier.fillMaxSize()) {
                      val w = this.size.width
                      val h = this.size.height
                      val frameStroke = Stroke(width = w * 0.07f)
                      val glyphStroke = w * 0.08f

                      if (!isTask) {
                          when (affiliation) {
                              "friendly" -> drawRoundRect(
                                  color = color,
                                  topLeft = Offset(w * 0.04f, h * 0.20f),
                                  size = Size(w * 0.92f, h * 0.60f),
                                  cornerRadius = CornerRadius(w * 0.08f),
                                  style = frameStroke,
                              )
                              "hostile" -> {
                                  val p = Path().apply {
                                      moveTo(w / 2f, h * 0.05f)
                                      lineTo(w * 0.95f, h / 2f)
                                      lineTo(w / 2f, h * 0.95f)
                                      lineTo(w * 0.05f, h / 2f)
                                      close()
                                  }
                                  drawPath(p, color, style = frameStroke)
                              }
                              "neutral" -> drawRect(
                                  color = color,
                                  topLeft = Offset(w * 0.10f, h * 0.10f),
                                  size = Size(w * 0.80f, h * 0.80f),
                                  style = frameStroke,
                              )
                              "unknown" -> drawCircle(
                                  color = color,
                                  radius = w * 0.44f,
                                  style = frameStroke,
                              )
                          }
                      }

                      if (isShape) {
                          val s = w * 0.36f
                          when (symbol) {
                              "dot" -> drawCircle(color, radius = s * 0.45f)
                              "square" -> drawRect(
                                  color,
                                  topLeft = Offset(w / 2f - s * 0.42f, h / 2f - s * 0.42f),
                                  size = Size(s * 0.84f, s * 0.84f),
                              )
                              "triangle" -> {
                                  val p = Path().apply {
                                      moveTo(w / 2f, h / 2f - s * 0.55f)
                                      lineTo(w / 2f + s * 0.58f, h / 2f + s * 0.42f)
                                      lineTo(w / 2f - s * 0.58f, h / 2f + s * 0.42f)
                                      close()
                                  }
                                  drawPath(p, color)
                              }
                              "diamond" -> {
                                  val p = Path().apply {
                                      moveTo(w / 2f, h / 2f - s * 0.6f)
                                      lineTo(w / 2f + s * 0.6f, h / 2f)
                                      lineTo(w / 2f, h / 2f + s * 0.6f)
                                      lineTo(w / 2f - s * 0.6f, h / 2f)
                                      close()
                                  }
                                  drawPath(p, color)
                              }
                              "cross" -> rotate(45f) {
                                  val half = s * 0.6f
                                  val t = s * 0.3f
                                  drawLine(color, Offset(w / 2f - half, h / 2f), Offset(w / 2f + half, h / 2f), strokeWidth = t)
                                  drawLine(color, Offset(w / 2f, h / 2f - half), Offset(w / 2f, h / 2f + half), strokeWidth = t)
                              }
                          }
                      }

                      if (isTask && taskLetter == null) {
                          when (symbol) {
                              "task_block" -> {
                                  drawLine(color, Offset(w * 0.08f, h * 0.5f), Offset(w * 0.72f, h * 0.5f), glyphStroke)
                                  drawLine(color, Offset(w * 0.72f, h * 0.16f), Offset(w * 0.72f, h * 0.84f), glyphStroke)
                              }
                              "task_ambush" -> {
                                  drawLine(color, Offset(w * 0.30f, h * 0.5f), Offset(w * 0.86f, h * 0.5f), glyphStroke)
                                  arrowHead(Offset(w * 0.92f, h * 0.5f), 0f, w * 0.16f, color, glyphStroke)
                                  drawLine(color, Offset(w * 0.30f, h * 0.5f), Offset(w * 0.08f, h * 0.16f), glyphStroke)
                                  drawLine(color, Offset(w * 0.30f, h * 0.5f), Offset(w * 0.04f, h * 0.5f), glyphStroke)
                                  drawLine(color, Offset(w * 0.30f, h * 0.5f), Offset(w * 0.08f, h * 0.84f), glyphStroke)
                              }
                              "task_sbf" -> {
                                  drawLine(color, Offset(w * 0.5f, h * 0.9f), Offset(w * 0.5f, h * 0.45f), glyphStroke)
                                  drawLine(color, Offset(w * 0.5f, h * 0.45f), Offset(w * 0.22f, h * 0.18f), glyphStroke)
                                  drawLine(color, Offset(w * 0.5f, h * 0.45f), Offset(w * 0.78f, h * 0.18f), glyphStroke)
                                  arrowHead(Offset(w * 0.20f, h * 0.16f), 225f, w * 0.13f, color, glyphStroke)
                                  arrowHead(Offset(w * 0.80f, h * 0.16f), 315f, w * 0.13f, color, glyphStroke)
                              }
                              "task_fix" -> {
                                  drawLine(color, Offset(w * 0.06f, h * 0.5f), Offset(w * 0.22f, h * 0.5f), glyphStroke)
                                  var x = w * 0.22f
                                  var up = true
                                  while (x < w * 0.66f) {
                                      val nx = x + w * 0.11f
                                      drawLine(
                                          color,
                                          Offset(x, if (up) h * 0.5f else h * 0.32f),
                                          Offset(nx, if (up) h * 0.32f else h * 0.5f),
                                          glyphStroke,
                                      )
                                      x = nx
                                      up = !up
                                  }
                                  drawLine(color, Offset(x, h * 0.5f), Offset(w * 0.86f, h * 0.5f), glyphStroke)
                                  arrowHead(Offset(w * 0.92f, h * 0.5f), 0f, w * 0.15f, color, glyphStroke)
                              }
                              "task_secure" -> {
                                  drawCircle(color, radius = w * 0.34f, style = Stroke(glyphStroke))
                                  arrowHead(Offset(w * 0.5f, h * 0.16f), 180f, w * 0.16f, color, glyphStroke)
                              }
                              "task_occupy" -> {
                                  drawCircle(color, radius = w * 0.32f, style = Stroke(glyphStroke))
                                  val cx = w * 0.24f
                                  val cy = h * 0.76f
                                  val a = w * 0.11f
                                  drawLine(color, Offset(cx - a, cy - a), Offset(cx + a, cy + a), glyphStroke)
                                  drawLine(color, Offset(cx - a, cy + a), Offset(cx + a, cy - a), glyphStroke)
                              }
                              "task_retain" -> {
                                  drawCircle(color, radius = w * 0.28f, style = Stroke(glyphStroke))
                                  for (i in 0 until 10) {
                                      val ang = Math.toRadians(i * 36.0)
                                      val x1 = w / 2f + (w * 0.28f) * cos(ang).toFloat()
                                      val y1 = h / 2f + (w * 0.28f) * sin(ang).toFloat()
                                      val x2 = w / 2f + (w * 0.40f) * cos(ang).toFloat()
                                      val y2 = h / 2f + (w * 0.40f) * sin(ang).toFloat()
                                      drawLine(color, Offset(x1, y1), Offset(x2, y2), glyphStroke * 0.75f)
                                  }
                              }
                          }
                      }
                  }
                  if (!isShape && !isTask && symbol.isNotEmpty()) {
                      Icon(
                          WaypointSymbols.icon(symbol),
                          contentDescription = null,
                          tint = color,
                          modifier = Modifier.size(size * 0.5f),
                      )
                  }
                  if (taskLetter != null) {
                      Text(
                          taskLetter,
                          color = color,
                          fontFamily = FontFamily.Monospace,
                          fontWeight = FontWeight.Bold,
                          fontSize = (size.value * 0.55f).sp,
                      )
                  }
                  if (!isTask) {
                      EchelonMarks(echelon = echelon, color = color, halo = MaterialTheme.colorScheme.background)
                  }
              }
          }

          /**
           * MIL-STD-2525-style echelon marks drawn along the top edge of the marker:
           * team = slashed circle, squad/section/platoon = 1–3 dots,
           * company/battalion/regiment = 1–3 bars, brigade = X.
           */
          @Composable
          private fun EchelonMarks(echelon: String, color: Color, halo: Color) {
              if (echelon.isEmpty()) return
              Canvas(Modifier.fillMaxSize()) {
                  val w = this.size.width
                  val cy = w * 0.085f
                  val s = w * 0.13f
                  val stroke = s * 0.30f

                  fun marks(count: Int, dot: Boolean) {
                      val gap = if (dot) s * 0.78f else s * 0.62f
                      val x0 = w / 2f - gap * (count - 1) / 2f
                      for (i in 0 until count) {
                          val x = x0 + gap * i
                          if (dot) {
                              drawCircle(halo, radius = s * 0.30f + stroke * 0.5f, center = Offset(x, cy))
                              drawCircle(color, radius = s * 0.30f, center = Offset(x, cy))
                          } else {
                              drawLine(halo, Offset(x, cy - s * 0.55f), Offset(x, cy + s * 0.55f), stroke * 1.9f)
                              drawLine(color, Offset(x, cy - s * 0.55f), Offset(x, cy + s * 0.55f), stroke)
                          }
                      }
                  }

                  when (echelon) {
                      "tm" -> {
                          drawCircle(halo, radius = s * 0.62f, center = Offset(w / 2f, cy), style = Stroke(stroke * 1.9f))
                          drawCircle(color, radius = s * 0.62f, center = Offset(w / 2f, cy), style = Stroke(stroke))
                          drawLine(
                              halo,
                              Offset(w / 2f - s * 0.85f, cy + s * 0.85f),
                              Offset(w / 2f + s * 0.85f, cy - s * 0.85f),
                              stroke * 1.9f,
                          )
                          drawLine(
                              color,
                              Offset(w / 2f - s * 0.85f, cy + s * 0.85f),
                              Offset(w / 2f + s * 0.85f, cy - s * 0.85f),
                              stroke,
                          )
                      }
                      "sqd" -> marks(1, dot = true)
                      "sec" -> marks(2, dot = true)
                      "plt" -> marks(3, dot = true)
                      "co" -> marks(1, dot = false)
                      "bn" -> marks(2, dot = false)
                      "rgt" -> marks(3, dot = false)
                      "bde" -> {
                          val r = s * 0.60f
                          listOf(
                              Offset(w / 2f - r, cy - r) to Offset(w / 2f + r, cy + r),
                              Offset(w / 2f - r, cy + r) to Offset(w / 2f + r, cy - r),
                          ).forEach { (a, b) ->
                              drawLine(halo, a, b, stroke * 1.9f)
                              drawLine(color, a, b, stroke)
                          }
                      }
                  }
              }
          }

          /** Small open arrowhead at [tip], pointing along [angleDeg] (0° = +x, clockwise). */
          private fun DrawScope.arrowHead(tip: Offset, angleDeg: Float, len: Float, color: Color, stroke: Float) {
              val a = Math.toRadians(angleDeg.toDouble())
              val back = 150.0 * Math.PI / 180.0
              val a1 = a + back
              val a2 = a - back
              drawLine(color, tip, Offset(tip.x + len * cos(a1).toFloat(), tip.y + len * sin(a1).toFloat()), stroke)
              drawLine(color, tip, Offset(tip.x + len * cos(a2).toFloat(), tip.y + len * sin(a2).toFloat()), stroke)
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/ui'
          cat > 'app/src/main/java/app/gridfix/android/ui/WaypointSymbols.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.ui

          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.outlined.Adjust
          import androidx.compose.material.icons.outlined.Cabin
          import androidx.compose.material.icons.outlined.CellTower
          import androidx.compose.material.icons.outlined.DirectionsCar
          import androidx.compose.material.icons.outlined.Flag
          import androidx.compose.material.icons.outlined.Home
          import androidx.compose.material.icons.outlined.MedicalServices
          import androidx.compose.material.icons.outlined.Star
          import androidx.compose.material.icons.outlined.WaterDrop
          import androidx.compose.material.icons.outlined.Warning
          import androidx.compose.ui.graphics.vector.ImageVector

          /** Echelon amplifier drawn above a unit frame (MIL-STD-2525 style marks). */
          object Echelons {
              val all = listOf(
                  "" to "None",
                  "tm" to "Team",
                  "sqd" to "Squad",
                  "sec" to "Section",
                  "plt" to "Platoon",
                  "co" to "Company",
                  "bn" to "Battalion",
                  "rgt" to "Regiment",
                  "bde" to "Brigade",
              )

              fun label(key: String): String = all.firstOrNull { it.first == key }?.second ?: key
          }

          /** Symbols a waypoint can carry. Keys are stored with the waypoint; icons resolve here. */
          object WaypointSymbols {

              /** Plain drawn shapes (rendered by WaypointMarker, not material icons). */
              val shapes = listOf("dot", "triangle", "square", "diamond", "cross")

              val all = listOf(
                  "dot", "triangle", "square", "diamond", "cross",
                  "flag", "target", "star", "home", "danger",
                  "water", "camp", "vehicle", "antenna", "medic",
              )

              fun isShape(key: String): Boolean = key in shapes

              /** Short display label for a basic symbol or shape (pickers). */
              fun label(key: String): String = when (key) {
                  "dot" -> "Dot"
                  "triangle" -> "Triangle"
                  "square" -> "Square"
                  "diamond" -> "Diamond"
                  "cross" -> "Cross"
                  "flag" -> "Flag"
                  "target" -> "Target"
                  "star" -> "Star"
                  "home" -> "Home"
                  "danger" -> "Danger"
                  "water" -> "Water"
                  "camp" -> "Camp"
                  "vehicle" -> "Vehicle"
                  "antenna" -> "Antenna"
                  "medic" -> "Medic"
                  else -> key
              }

              /** Tactical mission task symbols (drawn by WaypointMarker). */
              val tasks = listOf(
                  "task_block", "task_ambush", "task_sbf", "task_fix", "task_secure",
                  "task_occupy", "task_retain", "task_screen", "task_guard", "task_cover",
              )

              fun isTask(key: String): Boolean = key.startsWith("task_")

              fun taskLabel(key: String): String = when (key) {
                  "task_block" -> "Block"
                  "task_ambush" -> "Ambush"
                  "task_sbf" -> "Support by fire"
                  "task_fix" -> "Fix"
                  "task_secure" -> "Secure"
                  "task_occupy" -> "Occupy"
                  "task_retain" -> "Retain"
                  "task_screen" -> "Screen"
                  "task_guard" -> "Guard"
                  "task_cover" -> "Cover"
                  else -> key
              }

              /** Letter-badge tasks render as a letter instead of a glyph. */
              fun taskLetter(key: String): String? = when (key) {
                  "task_screen" -> "S"
                  "task_guard" -> "G"
                  "task_cover" -> "C"
                  else -> null
              }

              fun icon(key: String): ImageVector = when (key) {
                  "target" -> Icons.Outlined.Adjust
                  "star" -> Icons.Outlined.Star
                  "home" -> Icons.Outlined.Home
                  "danger" -> Icons.Outlined.Warning
                  "water" -> Icons.Outlined.WaterDrop
                  "camp" -> Icons.Outlined.Cabin
                  "vehicle" -> Icons.Outlined.DirectionsCar
                  "antenna" -> Icons.Outlined.CellTower
                  "medic" -> Icons.Outlined.MedicalServices
                  else -> Icons.Outlined.Flag
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/ui/screens'
          cat > 'app/src/main/java/app/gridfix/android/ui/screens/MapScreen.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.ui.screens

          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.hardware.GeomagneticField
          import android.net.Uri
          import android.provider.OpenableColumns
