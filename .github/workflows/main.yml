              secondary = Amber,
              onSecondary = Color(0xFF000000),
              secondaryContainer = Color(0xFF1A1F26),
              onSecondaryContainer = Bone,
              tertiary = Lume,
              onTertiary = Color(0xFF000000),
              tertiaryContainer = Color(0xFF1E2E10),
              onTertiaryContainer = Lume,
              background = Color(0xFF000000),
              onBackground = Bone,
              surface = Color(0xFF0B0D10),
              onSurface = Bone,
              surfaceVariant = Color(0xFF141920),
              onSurfaceVariant = Muted,
              surfaceContainerLowest = Color(0xFF000000),
              surfaceContainerLow = Color(0xFF0B0D10),
              surfaceContainer = Color(0xFF0F1216),
              surfaceContainerHigh = Color(0xFF141920),
              surfaceContainerHighest = Color(0xFF1A2028),
              outline = Rule,
              outlineVariant = Color(0xFF151A21),
              error = Color(0xFFFF6B61),
              onError = Color(0xFF000000),
          )

          // Night-vision palette: red on black to preserve dark adaptation
          private val NightColors = darkColorScheme(
              primary = Color(0xFFFF3B30),
              onPrimary = Color(0xFF000000),
              primaryContainer = Color(0xFF3A0A06),
              onPrimaryContainer = Color(0xFFFF3B30),
              secondary = Color(0xFFB3251C),
              onSecondary = Color(0xFF000000),
              secondaryContainer = Color(0xFF1C0300),
              onSecondaryContainer = Color(0xFFFF3B30),
              tertiary = Color(0xFFFF3B30),
              onTertiary = Color(0xFF000000),
              tertiaryContainer = Color(0xFF3A0A06),
              onTertiaryContainer = Color(0xFFFF3B30),
              background = Color(0xFF000000),
              onBackground = Color(0xFFFF3B30),
              surface = Color(0xFF120000),
              onSurface = Color(0xFFFF3B30),
              surfaceVariant = Color(0xFF1C0300),
              onSurfaceVariant = Color(0xFFB3251C),
              surfaceContainerLowest = Color(0xFF000000),
              surfaceContainerLow = Color(0xFF0A0000),
              surfaceContainer = Color(0xFF120000),
              surfaceContainerHigh = Color(0xFF1C0300),
              surfaceContainerHighest = Color(0xFF260500),
              outline = Color(0xFF5A100A),
              outlineVariant = Color(0xFF3A0A06),
              error = Color(0xFFFF3B30),
              onError = Color(0xFF000000),
          )

          private fun Typography.withFamily(family: FontFamily): Typography = Typography(
              displayLarge = displayLarge.copy(fontFamily = family),
              displayMedium = displayMedium.copy(fontFamily = family),
              displaySmall = displaySmall.copy(fontFamily = family),
              headlineLarge = headlineLarge.copy(fontFamily = family),
              headlineMedium = headlineMedium.copy(fontFamily = family),
              headlineSmall = headlineSmall.copy(fontFamily = family),
              titleLarge = titleLarge.copy(fontFamily = family),
              titleMedium = titleMedium.copy(fontFamily = family, fontWeight = FontWeight.SemiBold),
              titleSmall = titleSmall.copy(fontFamily = family, fontWeight = FontWeight.SemiBold),
              bodyLarge = bodyLarge.copy(fontFamily = family),
              bodyMedium = bodyMedium.copy(fontFamily = family),
              bodySmall = bodySmall.copy(fontFamily = family),
              labelLarge = labelLarge.copy(fontFamily = family, fontWeight = FontWeight.Medium),
              labelMedium = labelMedium.copy(fontFamily = family, fontWeight = FontWeight.Medium),
              labelSmall = labelSmall.copy(fontFamily = family, fontWeight = FontWeight.Medium),
          )

          private val GridFixTypography = Typography().withFamily(LabelFamily)

          // Equipment corners: near-square. Buttons keep Material's pill shape.
          private val GridFixShapes = Shapes(
              extraSmall = RoundedCornerShape(2.dp),
              small = RoundedCornerShape(2.dp),
              medium = RoundedCornerShape(4.dp),
              large = RoundedCornerShape(6.dp),
              extraLarge = RoundedCornerShape(8.dp),
          )

          @Composable
          fun GridFixTheme(
              nightMode: Boolean,
              content: @Composable () -> Unit,
          ) {
              MaterialTheme(
                  colorScheme = if (nightMode) NightColors else BlackoutColors,
                  typography = GridFixTypography,
                  shapes = GridFixShapes,
                  content = content,
              )
          }
          EOF_GRIDFIX
          python3 - 'app/src/main/java/app/gridfix/android/ui/CourseDialog.kt' 'app/src/main/java/app/gridfix/android/ui/FieldTools.kt' 'app/src/main/java/app/gridfix/android/ui/LosDialog.kt' 'app/src/main/java/app/gridfix/android/ui/QrDialog.kt' 'app/src/main/java/app/gridfix/android/ui/RouteCardDialog.kt' 'app/src/main/java/app/gridfix/android/ui/WaypointDialog.kt' 'app/src/main/java/app/gridfix/android/ui/WaypointMarker.kt' 'app/src/main/java/app/gridfix/android/ui/screens/MapScreen.kt' 'app/src/main/java/app/gridfix/android/ui/screens/ReferenceScreen.kt' 'app/src/main/java/app/gridfix/android/ui/screens/WaypointsScreen.kt' <<'PYEOF_GRIDFIX_TRANSFORM'
          import pathlib, sys
          def transform(t):
              t = t.replace("FontFamily.Monospace", "MonoFamily")
              imp = "import app.gridfix.android.ui.theme.MonoFamily"
              if imp not in t:
                  lines = t.split("\n")
                  idx = next((i for i, l in enumerate(lines) if l.startswith("import app.gridfix")), None)
                  if idx is None:
                      idx = max(i for i, l in enumerate(lines) if l.startswith("import ")) + 1
                  lines.insert(idx, imp)
                  t = "\n".join(lines)
              old = "import androidx.compose.ui.text.font.FontFamily\n"
              if old in t:
                  rest = t.replace(old, "")
                  probe = rest.replace("MonoFamily", "").replace("LabelFamily", "").replace("NumeralFamily", "")
                  if "FontFamily" not in probe:
                      t = rest
              return t
          if __name__ == "__main__":
              for rel in sys.argv[1:]:
                  p = pathlib.Path(rel)
                  p.write_text(transform(p.read_text()))
                  print("transformed", rel)
          PYEOF_GRIDFIX_TRANSFORM
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Sync v0.9.7 (blackout + faces) source from bootstrap workflow'
            git push origin HEAD:main
          fi

      - name: Fetch bundled fonts (OFL; committed to main the first time)
        run: |
          mkdir -p app/src/main/res/font
          fetch_font() {  # dest-name  google/fonts path  css2 family spec (fallback)
            local dest="app/src/main/res/font/$1"
            if [ -s "$dest" ]; then echo "have $1"; return 0; fi
            curl -fsSL --retry 3 -o "$dest" "https://raw.githubusercontent.com/google/fonts/main/ofl/$2" || rm -f "$dest"
            if [ ! -s "$dest" ] && [ -n "$3" ]; then
              url=$(curl -fsSL -A 'curl/8' "https://fonts.googleapis.com/css2?family=$3" | grep -o 'https://fonts.gstatic.com[^)]*\.ttf' | head -1)
              if [ -n "$url" ]; then curl -fsSL --retry 3 -o "$dest" "$url" || rm -f "$dest"; fi
            fi
            if [ ! -s "$dest" ]; then echo "ERROR: could not fetch font $1"; exit 1; fi
            case "$(head -c 4 "$dest" | od -An -tx1 | tr -d ' \n')" in
              00010000|74727565|4f54544f) ;;
              *) echo "ERROR: $1 is not a TrueType/OpenType file:"; head -c 300 "$dest"; echo; exit 1 ;;
            esac
            echo "fetched $1 ($(wc -c < "$dest") bytes)"
          }
          fetch_font antonio.ttf 'antonio/Antonio%5Bwght%5D.ttf' 'Antonio:wght@700'
          fetch_font saira_semi_condensed_regular.ttf 'sairasemicondensed/SairaSemiCondensed-Regular.ttf' 'Saira+Semi+Condensed'
          fetch_font saira_semi_condensed_medium.ttf 'sairasemicondensed/SairaSemiCondensed-Medium.ttf' 'Saira+Semi+Condensed:wght@500'
          fetch_font saira_semi_condensed_semibold.ttf 'sairasemicondensed/SairaSemiCondensed-SemiBold.ttf' 'Saira+Semi+Condensed:wght@600'
          fetch_font saira_semi_condensed_bold.ttf 'sairasemicondensed/SairaSemiCondensed-Bold.ttf' 'Saira+Semi+Condensed:wght@700'
          fetch_font fira_mono_regular.ttf 'firamono/FiraMono-Regular.ttf' 'Fira+Mono'
          fetch_font fira_mono_medium.ttf 'firamono/FiraMono-Medium.ttf' 'Fira+Mono:wght@500'
          fetch_font fira_mono_bold.ttf 'firamono/FiraMono-Bold.ttf' 'Fira+Mono:wght@700'
          if [ -n "$(git status --porcelain app/src/main/res/font)" ]; then
            git add app/src/main/res/font
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Add bundled fonts (Antonio, Saira Semi Condensed, Fira Mono - OFL)'
            git push origin HEAD:main
          fi

      - name: Materialize symbol tree from icon pack
        run: |
          if [ ! -f 'Nato Icons.zip' ]; then
            echo 'ERROR: Nato Icons.zip is not in the repo root.'
            echo 'Upload it once on GitHub: Add file -> Upload files -> drop the zip -> Commit.'
            exit 1
          fi
          python3 - <<'PYEOF'
          import sys, zipfile, pathlib
          dirs = {"f": ("Friend Land", "1"), "h": ("Hostile Land", "3"),
                  "n": ("Neutral Land", "2"), "u": ("Unknown Land", "0")}
          out = pathlib.Path("app/src/main/res/drawable-nodpi")
          z = zipfile.ZipFile("Nato Icons.zip")
          names = set(z.namelist())
          rows = []
          for line in open("app/symbol-manifest.tsv"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              key, dim, func = line.split("\t")
              rows.append((key, dim, func))
          missing = []
          count = 0
          for key, dim, func in rows:
              for aff, (d, p) in dirs.items():
                  entry = d + "/" + p + "." + ("s" + aff + dim + "p" + func).ljust(15, "-") + ".png"
                  if entry not in names:
                      missing.append(entry)
                      continue
                  (out / ("nato_" + aff + "_" + key + ".png")).write_bytes(z.read(entry))
                  count += 1
          if missing:
              print("MISSING ICONS:", missing)
              sys.exit(1)
          print("materialized", count, "symbol PNGs from the icon pack")
          PYEOF

      - name: Guard NATO symbol assets
        run: |
          COUNT=$(ls app/src/main/res/drawable-nodpi 2>/dev/null | grep -c '^nato_' || true)
          if [ "$COUNT" -lt 112 ]; then
            echo "ERROR: expected 112 curated NATO symbol PNGs in the repo, found $COUNT."
            echo "52 committed by the v0.2.2 bootstrap + 60 by the v0.7.8 doctrine pack; do not delete them."
            exit 1
          fi
          echo "$COUNT NATO symbols present"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        id: gradle
        continue-on-error: true
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build signed release AAB for Play (needs keystore secrets)
        id: aab
        if: steps.gradle.outcome == 'success'
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GRIDFIX_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_B64 secret set - skipping release AAB"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/gridfix-upload.p12
          export GRIDFIX_KS=/tmp/gridfix-upload.p12
          set -o pipefail
          gradle bundleRelease --no-daemon 2>&1 | tail -n 80
          cp app/build/outputs/bundle/release/app-release.aab gridfix-release.aab
          echo "signed release AAB ready: gridfix-release.aab"

      - name: Publish build status branch
        if: always()
        env:
          OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          mkdir -p /tmp/ci-status
          cd /tmp/ci-status
          git init -q -b ci-status
          {
            echo "outcome=$OUTCOME"
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > outcome.txt
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > buildlog.txt 2>/dev/null || echo "no log" > buildlog.txt
          if [ "$OUTCOME" = "success" ]; then
            cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" gridfix-debug.apk
          fi
          git add -A
          git -c user.email='ci@gridfix.local' -c user.name='GridFix CI' commit -qm "build ${{ github.run_number }}: $OUTCOME"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-status

      - name: Upload APK artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gridfix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest release for phone install
        if: steps.gradle.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gridfix-debug.apk
          EXTRA=""
          if [ -f gridfix-release.aab ]; then EXTRA="gridfix-release.aab"; fi
          gh release delete latest --yes || true
          git push --delete origin refs/tags/latest || true
          gh release create latest gridfix-debug.apk $EXTRA \
            --title "MGRS GPS build ${{ github.run_number }}" \
            --notes 'Phone install: tap gridfix-debug.apk below, allow the install, open MGRS GPS. gridfix-release.aab (when present) is the signed bundle to upload to Play Console - do not install it on a phone.'
          # Keep a permanent copy of every build under its version, for rollback
          VN=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          gh release create "v${VN}-b${{ github.run_number }}" gridfix-debug.apk $EXTRA \
            --prerelease \
            --title "MGRS GPS v${VN} (build ${{ github.run_number }})" \
            --notes 'Archived build. The latest release is the one to install day to day.' || true

      - name: Fail the job if the build failed
        if: steps.gradle.outcome != 'success'
        run: exit 1
