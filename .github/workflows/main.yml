          /** Small uppercase caption above a control. */
          @Composable
          private fun Setting(label: String, content: @Composable () -> Unit) {
              Column {
                  Text(
                      label.uppercase(),
                      fontFamily = LabelFamily,
                      fontSize = 11.sp,
                      fontWeight = FontWeight.Medium,
