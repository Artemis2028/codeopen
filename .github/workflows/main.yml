name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.12 (fixes, worn landscape) delta, plain text, auditable below)
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 40
                  versionName = "0.9.12"
                  // MapTiler API key from the CI secret; empty in builds without it (community-tile fallback)
                  buildConfigField("String", "MAPTILER_KEY", "\"" + (System.getenv("MAPTILER_KEY") ?: "") + "\"")
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")

              // Transitive androidx.fragment 1.1.0 is flagged outdated by Play; pin a current one
              implementation("androidx.fragment:fragment:1.8.5")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/Backup.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.InputStream
          import java.io.OutputStream
          import java.util.Locale
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream

          /**
           * Whole-app backup as one zip: a JSON snapshot of waypoints, folders,
           * graphics, settings, and the practice log, plus each track's point file.
           * Restore is idempotent — everything keeps its original id and anything
           * already on the device is skipped, so restoring twice never duplicates.
           */
          object Backup {

              const val VERSION = 1

              suspend fun export(
                  context: Context,
                  out: OutputStream,
                  waypoints: List<Waypoint>,
                  folders: List<FolderInfo>,
                  graphics: List<TacGraphic>,
                  settings: AppSettings,
                  tracks: List<TrackInfo>,
                  courseHistory: List<CourseResult>,
                  nowMillis: Long,
              ) = withContext(Dispatchers.IO) {
                  val root = JSONObject()
                      .put("app", "GridFix")
                      .put("version", VERSION)
                      .put("exportedAt", nowMillis)
                  root.put("waypoints", JSONArray().also { a ->
                      for (w in waypoints) a.put(
                          JSONObject()
                              .put("id", w.id).put("name", w.name)
                              .put("lat", w.lat).put("lon", w.lon)
                              .put("createdAt", w.createdAt).put("folder", w.folder)
                              .put("symbol", w.symbol).put("affiliation", w.affiliation)
                              .put("echelon", w.echelon).put("designation", w.designation)
                              .put("kind", w.kind).put("rotation", w.rotation.toDouble())
                      )
                  })
                  root.put("folders", JSONArray().also { a ->
                      for (f in folders) a.put(JSONObject().put("name", f.name).put("visible", f.visible))
                  })
                  root.put("graphics", JSONArray().also { a ->
                      for (g in graphics) {
                          val pts = JSONArray()
                          for (v in g.points) pts.put(JSONArray().put(v.lat).put(v.lon))
                          a.put(
                              JSONObject()
                                  .put("id", g.id).put("name", g.name).put("type", g.type)
                                  .put("points", pts).put("folder", g.folder)
                                  .put("affiliation", g.affiliation).put("createdAt", g.createdAt)
                                  .put("echelon", g.echelon)
                          )
                      }
                  })
                  root.put("settings", JSONObject()
                      .put("nightMode", settings.nightMode)
                      .put("keepScreenOn", settings.keepScreenOn)
                      .put("mgrsDigits", settings.mgrsDigits)
                      .put("latLonFormat", settings.latLonFormat)
                      .put("units", settings.units)
                      .put("angleUnit", settings.angleUnit)
                      .put("northRef", settings.northRef)
                      .put("pacePer100m", settings.pacePer100m)
                      .put("face", settings.face)
                      .put("orientation", settings.orientation)
                  )
                  root.put("tracks", JSONArray().also { a ->
                      for (t in tracks) a.put(
                          JSONObject()
                              .put("id", t.id).put("name", t.name)
                              .put("startedAt", t.startedAt).put("endedAt", t.endedAt)
                              .put("distanceM", t.distanceM).put("pointCount", t.pointCount)
                              .put("folder", t.folder)
                      )
                  })
                  root.put("courseHistory", JSONArray().also { a ->
                      for (r in courseHistory) a.put(
                          JSONObject()
                              .put("name", r.name).put("points", r.points)
                              .put("started", r.startedAt).put("total", r.totalMillis)
                              .put("splits", JSONArray(r.splitsMillis))
                      )
                  })

                  val zip = ZipOutputStream(out)
                  zip.putNextEntry(ZipEntry("gridfix-backup.json"))
                  zip.write(root.toString(2).toByteArray())
                  zip.closeEntry()
                  for (t in tracks) {
                      val pts = TrackRepository.readPoints(context, t.id)
                      if (pts.isEmpty()) continue
                      zip.putNextEntry(ZipEntry("tracks/${t.id}.txt"))
                      zip.write(
                          pts.joinToString("") {
                              String.format(Locale.US, "%.7f %.7f %d %.1f\n", it.lat, it.lon, it.time, it.alt)
                          }.toByteArray()
                      )
                      zip.closeEntry()
                  }
                  zip.finish()
              }

              data class RestoreResult(
                  val waypoints: Int,
                  val graphics: Int,
                  val tracks: Int,
                  val course: Int,
                  val settingsApplied: Boolean,
              ) {
                  fun summary(): String {
                      val parts = mutableListOf<String>()
                      if (waypoints > 0) parts.add("$waypoints waypoints")
                      if (graphics > 0) parts.add("$graphics graphics")
                      if (tracks > 0) parts.add("$tracks tracks")
                      if (course > 0) parts.add("$course course results")
                      if (settingsApplied) parts.add("settings")
                      return if (parts.isEmpty()) "Nothing new to restore — everything was already here"
                      else "Restored " + parts.joinToString(", ")
                  }
              }

              suspend fun restore(
                  input: InputStream,
                  waypointRepo: WaypointRepository,
                  graphicsRepo: GraphicsRepository,
                  trackRepo: TrackRepository,
                  settingsRepo: SettingsRepository,
                  courseRepo: CourseRepository,
              ): RestoreResult = withContext(Dispatchers.IO) {
                  val entries = HashMap<String, ByteArray>()
                  val zin = ZipInputStream(input)
                  var e: ZipEntry? = zin.nextEntry
                  while (e != null) {
                      val wanted = e.name == "gridfix-backup.json" || e.name.startsWith("tracks/")
                      if (!e.isDirectory && wanted) {
                          val out = java.io.ByteArrayOutputStream()
                          val buf = ByteArray(16 * 1024)
                          var total = 0L
                          var tooBig = false
                          while (true) {
                              val n = zin.read(buf)
                              if (n < 0) break
                              total += n
                              if (total > 64L * 1024 * 1024) { tooBig = true; break }
                              out.write(buf, 0, n)
                          }
                          if (!tooBig) entries[e.name] = out.toByteArray()
                      }
                      zin.closeEntry()
                      e = zin.nextEntry
                  }
                  val rootBytes = entries["gridfix-backup.json"]
                      ?: throw IllegalArgumentException("not an MGRS GPS backup")
                  val root = JSONObject(String(rootBytes))

                  val wps = ArrayList<Waypoint>()
                  root.optJSONArray("waypoints")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          wps.add(
                              Waypoint(
                                  id = o.getString("id"), name = o.getString("name"),
                                  lat = o.getDouble("lat"), lon = o.getDouble("lon"),
                                  createdAt = o.optLong("createdAt"),
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                                  symbol = o.optString("symbol", DEFAULT_SYMBOL),
                                  affiliation = o.optString("affiliation", "none"),
                                  echelon = o.optString("echelon", ""),
                                  designation = o.optString("designation", ""),
                                  kind = o.optString("kind", KIND_WP),
                                  rotation = o.optDouble("rotation", 0.0).toFloat(),
                              )
                          )
                      }
                  }
                  val folderInfos = ArrayList<FolderInfo>()
                  root.optJSONArray("folders")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          folderInfos.add(FolderInfo(canonicalFolder(o.getString("name")), o.optBoolean("visible", true)))
                      }
                  }
                  val addedWp = waypointRepo.restore(wps, folderInfos)

                  val gfx = ArrayList<TacGraphic>()
                  root.optJSONArray("graphics")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val ptsArr = o.getJSONArray("points")
                          val pts = ArrayList<GeoVertex>()
                          for (j in 0 until ptsArr.length()) {
                              val v = ptsArr.getJSONArray(j)
                              pts.add(GeoVertex(v.getDouble(0), v.getDouble(1)))
                          }
                          gfx.add(
                              TacGraphic(
                                  id = o.getString("id"), name = o.getString("name"),
                                  type = o.getString("type"), points = pts,
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                                  affiliation = o.optString("affiliation", "none"),
                                  createdAt = o.optLong("createdAt"),
                                  echelon = o.optString("echelon", ""),
                              )
                          )
                      }
                  }
                  val addedG = graphicsRepo.restore(gfx)

                  var addedT = 0
                  root.optJSONArray("tracks")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val info = TrackInfo(
                              id = o.getString("id"), name = o.getString("name"),
                              startedAt = o.optLong("startedAt"), endedAt = o.optLong("endedAt"),
                              distanceM = o.optDouble("distanceM", 0.0),
                              pointCount = o.optInt("pointCount", 0),
                              folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                          )
                          val ptBytes = entries["tracks/${info.id}.txt"] ?: continue
                          val pts = String(ptBytes).lines().mapNotNull { line ->
                              val parts = line.trim().split(" ")
                              if (parts.size < 3) return@mapNotNull null
                              runCatching {
                                  TrackPoint(
                                      lat = parts[0].toDouble(), lon = parts[1].toDouble(),
                                      time = parts[2].toLong(),
                                      alt = parts.getOrNull(3)?.toDouble() ?: 0.0,
                                  )
                              }.getOrNull()
                          }
                          if (trackRepo.restore(info, pts)) addedT++
                      }
                  }

                  var settingsApplied = false
                  root.optJSONObject("settings")?.let { s ->
                      settingsRepo.applyAll(
                          AppSettings(
                              nightMode = s.optBoolean("nightMode", false),
                              keepScreenOn = s.optBoolean("keepScreenOn", true),
                              mgrsDigits = s.optInt("mgrsDigits", 10),
                              latLonFormat = s.optInt("latLonFormat", 1),
                              units = s.optInt("units", 0),
                              angleUnit = s.optInt("angleUnit", 0),
                              northRef = s.optInt("northRef", 0),
                              pacePer100m = s.optInt("pacePer100m", 65),
                              face = s.optInt("face", 1),
                              orientation = s.optInt("orientation", 0),
                          )
                      )
                      settingsApplied = true
                  }

                  val results = ArrayList<CourseResult>()
                  root.optJSONArray("courseHistory")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val splits = o.getJSONArray("splits")
                          results.add(
                              CourseResult(
                                  name = o.getString("name"), points = o.getInt("points"),
                                  startedAt = o.getLong("started"), totalMillis = o.getLong("total"),
                                  splitsMillis = buildList {
                                      for (j in 0 until splits.length()) add(splits.getLong(j))
                                  },
                              )
                          )
                      }
                  }
                  val addedC = courseRepo.restoreHistory(results)

                  RestoreResult(addedWp, addedG, addedT, addedC, settingsApplied)
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/SettingsRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import androidx.datastore.preferences.core.booleanPreferencesKey
          import androidx.datastore.core.handlers.ReplaceFileCorruptionHandler
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.core.intPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map

          private val Context.dataStore by preferencesDataStore(
              name = "settings",
              corruptionHandler = ReplaceFileCorruptionHandler { emptyPreferences() },
          )

          data class AppSettings(
              val nightMode: Boolean = false,
              val keepScreenOn: Boolean = true,
              val mgrsDigits: Int = 10,     // 4, 6, 8, or 10
              val latLonFormat: Int = 1,    // 0 = DD, 1 = DDM, 2 = DMS
              val units: Int = 0,           // 0 = metric, 1 = imperial, 2 = nautical
              val angleUnit: Int = 0,       // 0 = degrees, 1 = NATO mils (6400)
              val northRef: Int = 0,        // 0 = true, 1 = magnetic, 2 = grid
              val pacePer100m: Int = 65,    // user's pace count per 100 m, for route cards
              val face: Int = 1,            // Position/Navigate face: 0 = Glance, 1 = Lensatic, 2 = Dial
              val orientation: Int = 0,     // 0 = follow the device, 1 = portrait, 2 = landscape, 3 = landscape flipped
          )

          class SettingsRepository(private val context: Context) {

              private object Keys {
                  val NIGHT_MODE = booleanPreferencesKey("night_mode")
                  val KEEP_SCREEN_ON = booleanPreferencesKey("keep_screen_on")
                  val MGRS_DIGITS = intPreferencesKey("mgrs_digits")
                  val LATLON_FORMAT = intPreferencesKey("latlon_format")
                  val UNITS = intPreferencesKey("units")
                  val ANGLE_UNIT = intPreferencesKey("angle_unit")
                  val NORTH_REF = intPreferencesKey("north_ref")
                  val PACE_PER_100M = intPreferencesKey("pace_per_100m")
                  val FACE = intPreferencesKey("face")
                  val ORIENTATION = intPreferencesKey("orientation")
              }

              val settings: Flow<AppSettings> = context.dataStore.data.map { p ->
                  AppSettings(
                      nightMode = p[Keys.NIGHT_MODE] ?: false,
                      keepScreenOn = p[Keys.KEEP_SCREEN_ON] ?: true,
                      mgrsDigits = p[Keys.MGRS_DIGITS] ?: 10,
                      latLonFormat = p[Keys.LATLON_FORMAT] ?: 1,
                      units = p[Keys.UNITS] ?: 0,
                      angleUnit = p[Keys.ANGLE_UNIT] ?: 0,
                      northRef = p[Keys.NORTH_REF] ?: 0,
                      pacePer100m = p[Keys.PACE_PER_100M] ?: 65,
                      face = (p[Keys.FACE] ?: 1).coerceIn(0, 2),
                      orientation = (p[Keys.ORIENTATION] ?: 0).coerceIn(0, 3),
                  )
              }

              /** Apply every setting at once (backup restore). */
              suspend fun applyAll(s: AppSettings) {
                  context.dataStore.edit { p ->
                      p[Keys.NIGHT_MODE] = s.nightMode
                      p[Keys.KEEP_SCREEN_ON] = s.keepScreenOn
                      p[Keys.MGRS_DIGITS] = s.mgrsDigits
                      p[Keys.LATLON_FORMAT] = s.latLonFormat
                      p[Keys.UNITS] = s.units
                      p[Keys.ANGLE_UNIT] = s.angleUnit
                      p[Keys.NORTH_REF] = s.northRef
                      p[Keys.PACE_PER_100M] = s.pacePer100m
                      p[Keys.FACE] = s.face
                      p[Keys.ORIENTATION] = s.orientation
                  }
              }

              suspend fun setNightMode(value: Boolean) {
                  context.dataStore.edit { it[Keys.NIGHT_MODE] = value }
              }

              suspend fun setKeepScreenOn(value: Boolean) {
                  context.dataStore.edit { it[Keys.KEEP_SCREEN_ON] = value }
              }

              suspend fun setMgrsDigits(value: Int) {
                  context.dataStore.edit { it[Keys.MGRS_DIGITS] = value }
              }

              suspend fun setLatLonFormat(value: Int) {
                  context.dataStore.edit { it[Keys.LATLON_FORMAT] = value }
              }

              suspend fun setUnits(value: Int) {
                  context.dataStore.edit { it[Keys.UNITS] = value }
              }

              suspend fun setAngleUnit(value: Int) {
                  context.dataStore.edit { it[Keys.ANGLE_UNIT] = value }
              }

              suspend fun setNorthRef(value: Int) {
                  context.dataStore.edit { it[Keys.NORTH_REF] = value }
              }

              suspend fun setPacePer100m(value: Int) {
                  context.dataStore.edit { it[Keys.PACE_PER_100M] = value.coerceIn(30, 200) }
              }

              suspend fun setFace(value: Int) {
                  context.dataStore.edit { it[Keys.FACE] = value.coerceIn(0, 2) }
              }

              suspend fun setOrientation(value: Int) {
                  context.dataStore.edit { it[Keys.ORIENTATION] = value.coerceIn(0, 3) }
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/WaypointRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import androidx.datastore.core.handlers.ReplaceFileCorruptionHandler
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Locale
          import java.util.UUID

          private val Context.wpStore by preferencesDataStore(
              name = "waypoints",
              corruptionHandler = ReplaceFileCorruptionHandler { emptyPreferences() },
          )

          const val DEFAULT_FOLDER = "Base"

          /**
           * Folder names as stored. Before 0.9.9 waypoints defaulted to "Waypoints" and drawn
           * graphics to "Graphics"; both collapse into the one base folder that now holds
           * waypoints, graphics and tracks together, so one eye switch clears the map.
           */
          fun canonicalFolder(raw: String?): String = when (raw?.trim().orEmpty()) {
              "", "Waypoints", "Graphics" -> DEFAULT_FOLDER
              else -> raw!!.trim()
          }
          const val DEFAULT_SYMBOL = "flag"

          data class Waypoint(
              val id: String,
              val name: String,
              val lat: Double,
              val lon: Double,
              val createdAt: Long,
              val folder: String = DEFAULT_FOLDER,
              val symbol: String = DEFAULT_SYMBOL,
              val affiliation: String = "none",
              val echelon: String = "",       // "", tm, sqd, sec, plt, co, bn, rgt, bde
              val designation: String = "",   // free-text unit designation amplifier
              val kind: String = KIND_WP,     // KIND_WP (navigation point) or KIND_UNIT (plotted unit)
              val rotation: Float = 0f,       // degrees clockwise from north; direction of fire for task symbols
          )

          const val KIND_WP = "wp"
          const val KIND_UNIT = "unit"

          /** Everything needed to create or update a waypoint. */
          data class WaypointDraft(
              val name: String,
              val lat: Double,
              val lon: Double,
              val folder: String,
              val symbol: String,
              val affiliation: String,
              val echelon: String = "",
              val designation: String = "",
              val kind: String = KIND_WP,
              val rotation: Float = 0f,
          )

          /** A waypoint folder ("overlay"): can exist empty, and can be toggled visible/hidden. */
          data class FolderInfo(val name: String, val visible: Boolean = true)

          class WaypointRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")
              private val selectedKey = stringPreferencesKey("selected")
              private val foldersKey = stringPreferencesKey("folders")

              val waypoints: Flow<List<Waypoint>> = context.wpStore.data.map { p ->
                  decode(p[listKey] ?: "[]")
              }

              val selectedId: Flow<String?> = context.wpStore.data.map { p -> p[selectedKey] }

              /** Stored folders unioned with any folder referenced by a waypoint, sorted by name. */
              val folders: Flow<List<FolderInfo>> = context.wpStore.data.map { p ->
                  val stored = decodeFolders(p[foldersKey] ?: "[]")
                  val referenced = decode(p[listKey] ?: "[]").map { it.folder }
                  val names = (stored.map { it.name } + referenced + DEFAULT_FOLDER).distinct()
                  names.map { n -> stored.firstOrNull { it.name == n } ?: FolderInfo(n) }
                      .sortedBy { it.name.lowercase(Locale.US) }
              }

              suspend fun addFolder(name: String) {
                  val clean = canonicalFolder(name)
                  if (name.isBlank()) return
                  context.wpStore.edit { p ->
                      p[foldersKey] = encodeFolders(
                          upsertFolder(decodeFolders(p[foldersKey] ?: "[]"), clean, null)
                      )
                  }
              }

              suspend fun setFolderVisible(name: String, visible: Boolean) {
                  context.wpStore.edit { p ->
                      p[foldersKey] = encodeFolders(
                          upsertFolder(decodeFolders(p[foldersKey] ?: "[]"), name, visible)
                      )
                  }
              }

              suspend fun add(draft: WaypointDraft, nowMillis: Long): String {
                  val newId = UUID.randomUUID().toString()
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      val wp = Waypoint(
                          id = newId,
                          name = draft.name,
                          lat = draft.lat,
                          lon = draft.lon,
                          createdAt = nowMillis,
                          folder = canonicalFolder(draft.folder),
                          symbol = draft.symbol.ifBlank { DEFAULT_SYMBOL },
                          affiliation = draft.affiliation,
                          echelon = draft.echelon,
                          designation = draft.designation,
                          kind = draft.kind,
                          rotation = draft.rotation,
                      )
                      p[listKey] = encode(current + wp)
                      p[foldersKey] = encodeFolders(
                          upsertFolder(decodeFolders(p[foldersKey] ?: "[]"), wp.folder, null)
                      )
                      if (p[selectedKey] == null) {
                          p[selectedKey] = wp.id
                      }
                  }
                  return newId
              }

              /** Bulk add (imports): one datastore write however many points arrive. */
              suspend fun addAll(drafts: List<WaypointDraft>, nowMillis: Long) {
                  if (drafts.isEmpty()) return
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      var folders = decodeFolders(p[foldersKey] ?: "[]")
                      val added = drafts.map { draft ->
                          folders = upsertFolder(folders, canonicalFolder(draft.folder), null)
                          Waypoint(
                              id = UUID.randomUUID().toString(),
                              name = draft.name,
                              lat = draft.lat,
                              lon = draft.lon,
                              createdAt = nowMillis,
                              folder = canonicalFolder(draft.folder),
                              symbol = draft.symbol.ifBlank { DEFAULT_SYMBOL },
                              affiliation = draft.affiliation,
                              echelon = draft.echelon,
                              designation = draft.designation,
                              kind = draft.kind,
                              rotation = draft.rotation,
                          )
                      }
                      p[listKey] = encode(current + added)
                      p[foldersKey] = encodeFolders(folders)
                  }
              }

              /**
               * Merge a backup: waypoints keep their original ids and ids already on the
               * device are skipped, so restoring twice never duplicates. Folder entries
               * merge by name (existing visibility wins). Returns how many were added.
               */
              suspend fun restore(imported: List<Waypoint>, importedFolders: List<FolderInfo>): Int {
                  var added = 0
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      val ids = current.map { it.id }.toSet()
                      val fresh = imported.filter { it.id !in ids }
                      added = fresh.size
                      p[listKey] = encode(current + fresh)
                      val merged = decodeFolders(p[foldersKey] ?: "[]").toMutableList()
                      val known = merged.map { it.name }.toSet()
                      // folders new to this device come in with their backed-up visibility; existing ones keep theirs
                      for (f in importedFolders.map { it.copy(name = canonicalFolder(it.name)) }) {
                          if (f.name !in known) mergeFolder(merged, f)
                      }
                      var folders: List<FolderInfo> = merged
                      for (w in fresh) folders = upsertFolder(folders, w.folder, null)
                      p[foldersKey] = encodeFolders(folders)
                  }
                  return added
              }

              suspend fun update(id: String, draft: WaypointDraft) {
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      p[listKey] = encode(
                          current.map {
                              if (it.id == id) it.copy(
                                  name = draft.name,
                                  lat = draft.lat,
                                  lon = draft.lon,
                                  folder = canonicalFolder(draft.folder),
                                  symbol = draft.symbol.ifBlank { DEFAULT_SYMBOL },
                                  affiliation = draft.affiliation,
                                  echelon = draft.echelon,
                                  designation = draft.designation,
                                  kind = draft.kind,
                                  rotation = draft.rotation,
                              ) else it
                          }
                      )
                      p[foldersKey] = encodeFolders(
                          upsertFolder(
                              decodeFolders(p[foldersKey] ?: "[]"),
                              canonicalFolder(draft.folder),
                              null,
                          )
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      p[listKey] = encode(current.filterNot { it.id == id })
                      if (p[selectedKey] == id) {
                          p.remove(selectedKey)
                      }
                  }
              }

              suspend fun select(id: String) {
                  context.wpStore.edit { p -> p[selectedKey] = id }
              }

              // One damaged record must not take the whole list with it: skip it, keep the rest.
              private fun decode(json: String): List<Waypoint> {
                  val arr = runCatching { JSONArray(json) }.getOrNull() ?: return emptyList()
                  return buildList {
                      for (i in 0 until arr.length()) {
                          val o = runCatching { arr.getJSONObject(i) }.getOrNull() ?: continue
                          runCatching {
                              Waypoint(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  lat = o.getDouble("lat"),
                                  lon = o.getDouble("lon"),
                                  createdAt = o.optLong("createdAt"),
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                                  symbol = o.optString("symbol", DEFAULT_SYMBOL),
                                  affiliation = o.optString("affiliation", "none"),
                                  echelon = o.optString("echelon", ""),
                                  designation = o.optString("designation", ""),
                                  kind = o.optString(
                                      "kind",
                                      // migrate pre-0.5 data: NATO symbols were always units
                                      if (o.optString("symbol", "").startsWith("nato_")) KIND_UNIT else KIND_WP,
                                  ),
                                  rotation = o.optDouble("rotation", 0.0).toFloat(),
                              )
                          }.getOrNull()?.let { add(it) }
                      }
                  }
              }

              /** Add or update a folder entry; visible == null keeps the existing visibility. */
              private fun upsertFolder(list: List<FolderInfo>, name: String, visible: Boolean?): List<FolderInfo> {
                  val existing = list.firstOrNull { it.name == name }
                  return when {
                      existing == null -> list + FolderInfo(name, visible ?: true)
                      visible == null -> list
                      else -> list.map { if (it.name == name) it.copy(visible = visible) else it }
                  }
              }

              private fun decodeFolders(json: String): List<FolderInfo> = runCatching {
                  val arr = JSONArray(json)
                  val out = ArrayList<FolderInfo>()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      mergeFolder(out, FolderInfo(canonicalFolder(o.getString("name")), o.optBoolean("visible", true)))
                  }
                  out
              }.getOrDefault(emptyList())

              /**
               * Add a folder entry, merging by canonical name. Legacy "Waypoints" and "Graphics"
               * both map to Base: if either was visible, Base is visible - nothing a user could
               * see before an upgrade disappears from the map because of the merge.
               */
              private fun mergeFolder(list: MutableList<FolderInfo>, f: FolderInfo) {
                  val idx = list.indexOfFirst { it.name == f.name }
                  if (idx < 0) list.add(f)
                  else if (f.visible && !list[idx].visible) list[idx] = list[idx].copy(visible = true)
              }

              private fun encodeFolders(list: List<FolderInfo>): String {
                  val arr = JSONArray()
                  for (f in list) {
                      arr.put(JSONObject().put("name", f.name).put("visible", f.visible))
                  }
                  return arr.toString()
              }

              private fun encode(list: List<Waypoint>): String {
                  val arr = JSONArray()
                  for (w in list) {
                      arr.put(
                          JSONObject()
                              .put("id", w.id)
                              .put("name", w.name)
                              .put("lat", w.lat)
                              .put("lon", w.lon)
                              .put("createdAt", w.createdAt)
                              .put("folder", w.folder)
                              .put("symbol", w.symbol)
                              .put("affiliation", w.affiliation)
                              .put("echelon", w.echelon)
                              .put("designation", w.designation)
                              .put("kind", w.kind)
                              .put("rotation", w.rotation.toDouble())
                      )
                  }
                  return arr.toString()
              }
          }
