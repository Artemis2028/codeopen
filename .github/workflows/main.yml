name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.6.0 (M4a interop - GPX/KML + projection) delta, plain text, auditable below)
        run: |
          mkdir -p '.'
          cat > 'README.md' <<'EOF_GRIDFIX'
          # GridFix (working title)

          MGRS land-navigation app for Android. Inspired by the category MilGPS defined on iOS,
          built independently with its own design and code.

          **Status: Milestone 4a (interop)** — GPX + KML/KMZ import/export (waypoints, routes,
          areas, tracks), waypoint projection (azimuth + distance from any known point), smart MGRS
          entry (auto-advance, full-grid paste). Doctrinal ambush/SBF glyphs + direction-of-fire
          rotation landed in 0.5.2.

          ## Roadmap

          - **M1** — Shell + live position readout *(done)*
          - **M2** — Waypoints + compass navigation (bearing arrow, distance, back-azimuth, mils) *(done)*
          - **M3** — Map view with MGRS grid overlay, offline maps, MBTiles import *(this build)*
          - **M4** — GPX import/export, waypoint projection, Play Billing (3-day trial → subscription), store launch

          ## Tech

          Kotlin · Jetpack Compose · Material 3 · platform LocationManager + GNSS status ·
          [NGA MGRS library](https://github.com/ngageoint/mgrs-java) (MIT) ·
          [osmdroid](https://github.com/osmdroid/osmdroid) (Apache 2.0) · DataStore · GitHub Actions CI

          Basemaps: OpenStreetMap (streets), OpenTopoMap (topo), Esri World Imagery (satellite) —
          attribution shown in-app. Tile sources may need commercial-use review before store launch.

          ## Build

          Pushes to `main` build a debug APK automatically (Actions tab → latest run → `gridfix-debug-apk` artifact).

          Local build: `gradle assembleDebug` with JDK 17 and the Android SDK installed.

          ## Principles

          Offline-first. No accounts, no analytics, no data collection. Not a primary means of navigation.
          EOF_GRIDFIX
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 34

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 11
                  versionName = "0.6.0-m4a"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/InterchangeFiles.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.util.Xml
          import org.xmlpull.v1.XmlPullParser
          import java.io.InputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.zip.ZipInputStream

          /**
           * GPX 1.1 and KML/KMZ interchange: the file formats land-nav and TAK users
           * actually trade. Import is tolerant (skips what it can't read); export writes
           * plain, widely-accepted documents. Everything is streamed with XmlPullParser —
           * no external dependencies.
           */
          object InterchangeFiles {

              data class ImportedLine(val name: String, val folder: String, val points: List<GeoVertex>)
              data class ImportedTrack(val name: String, val points: List<TrackPoint>)

              data class ImportedData(
                  val waypoints: List<WaypointDraft> = emptyList(),
                  val lines: List<ImportedLine> = emptyList(),      // become route graphics
                  val areas: List<ImportedLine> = emptyList(),      // become assembly-area graphics
                  val tracks: List<ImportedTrack> = emptyList(),
              ) {
                  val isEmpty: Boolean
                      get() = waypoints.isEmpty() && lines.isEmpty() && areas.isEmpty() && tracks.isEmpty()

                  fun summary(): String {
                      val parts = mutableListOf<String>()
                      if (waypoints.isNotEmpty()) parts.add("${waypoints.size} waypoints")
                      if (lines.isNotEmpty()) parts.add("${lines.size} lines")
                      if (areas.isNotEmpty()) parts.add("${areas.size} areas")
                      if (tracks.isNotEmpty()) parts.add("${tracks.size} tracks")
                      return if (parts.isEmpty()) "nothing importable found" else "Imported " + parts.joinToString(", ")
                  }
              }

              const val IMPORT_FOLDER = "Imported"

              /** Route by file name; returns null when the format isn't recognized. */
              fun parse(fileName: String, stream: InputStream): ImportedData? {
                  val lower = fileName.lowercase(Locale.US)
                  return when {
                      lower.endsWith(".gpx") -> parseGpx(stream)
                      lower.endsWith(".kml") -> parseKml(stream)
                      lower.endsWith(".kmz") -> parseKmz(stream)
                      else -> null
                  }
              }

              // ---------------- GPX ----------------

              fun parseGpx(stream: InputStream): ImportedData {
                  val wps = ArrayList<WaypointDraft>()
                  val tracks = ArrayList<ImportedTrack>()
                  val lines = ArrayList<ImportedLine>()

                  val parser = Xml.newPullParser()
                  parser.setInput(stream, null)

                  var wptLat = 0.0
                  var wptLon = 0.0
                  var inWpt = false
                  var name = ""
                  var trkName = ""
                  var trkPts = ArrayList<TrackPoint>()
                  var inTrk = false
                  var rteName = ""
                  var rtePts = ArrayList<GeoVertex>()
                  var inRte = false
                  var pendingTime = 0L
                  var pendingEle = 0.0
                  var textBuf = ""

                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              textBuf = ""
                              when (parser.name) {
                                  "wpt" -> {
                                      inWpt = true
                                      name = ""
                                      wptLat = parser.getAttributeValue(null, "lat")?.toDoubleOrNull() ?: Double.NaN
                                      wptLon = parser.getAttributeValue(null, "lon")?.toDoubleOrNull() ?: Double.NaN
                                  }
                                  "trk" -> {
                                      inTrk = true
                                      trkName = ""
                                      trkPts = ArrayList()
                                  }
                                  "rte" -> {
                                      inRte = true
                                      rteName = ""
                                      rtePts = ArrayList()
                                  }
                                  "trkpt" -> {
                                      val lat = parser.getAttributeValue(null, "lat")?.toDoubleOrNull()
                                      val lon = parser.getAttributeValue(null, "lon")?.toDoubleOrNull()
                                      pendingTime = 0L
                                      pendingEle = 0.0
                                      if (lat != null && lon != null && inTrk) {
                                          trkPts.add(TrackPoint(lat, lon, 0L, 0.0))
                                      }
                                  }
                                  "rtept" -> {
                                      val lat = parser.getAttributeValue(null, "lat")?.toDoubleOrNull()
                                      val lon = parser.getAttributeValue(null, "lon")?.toDoubleOrNull()
                                      if (lat != null && lon != null && inRte) {
                                          rtePts.add(GeoVertex(lat, lon))
                                      }
                                  }
                              }
                          }
                          XmlPullParser.TEXT -> textBuf += parser.text ?: ""
                          XmlPullParser.END_TAG -> {
                              when (parser.name) {
                                  "name" -> {
                                      val t = textBuf.trim()
                                      if (inWpt && name.isEmpty()) name = t
                                      else if (inTrk && trkName.isEmpty()) trkName = t
                                      else if (inRte && rteName.isEmpty()) rteName = t
                                  }
                                  "ele" -> pendingEle = textBuf.trim().toDoubleOrNull() ?: 0.0
                                  "time" -> pendingTime = parseIsoTime(textBuf.trim())
                                  "trkpt" -> {
                                      if (inTrk && trkPts.isNotEmpty()) {
                                          val last = trkPts.removeAt(trkPts.size - 1)
                                          trkPts.add(last.copy(time = pendingTime, alt = pendingEle))
                                      }
                                  }
                                  "wpt" -> {
                                      if (inWpt && !wptLat.isNaN() && !wptLon.isNaN()) {
                                          wps.add(
                                              WaypointDraft(
                                                  name = name.ifBlank { "WP ${wps.size + 1}" },
                                                  lat = wptLat,
                                                  lon = wptLon,
                                                  folder = IMPORT_FOLDER,
                                                  symbol = "flag",
                                                  affiliation = "none",
                                              )
                                          )
                                      }
                                      inWpt = false
                                  }
                                  "trk" -> {
                                      if (inTrk && trkPts.size >= 2) {
                                          tracks.add(
                                              ImportedTrack(trkName.ifBlank { "Imported track" }, trkPts)
                                          )
                                      }
                                      inTrk = false
                                  }
                                  "rte" -> {
                                      if (inRte && rtePts.size >= 2) {
                                          lines.add(
                                              ImportedLine(rteName.ifBlank { "Imported route" }, IMPORT_FOLDER, rtePts)
                                          )
                                      }
                                      inRte = false
                                  }
                              }
                          }
                      }
                      event = parser.next()
                  }
                  return ImportedData(waypoints = wps, lines = lines, tracks = tracks)
              }

              fun buildGpx(
                  waypoints: List<Waypoint>,
                  routes: List<TacGraphic>,
                  tracks: List<Pair<TrackInfo, List<TrackPoint>>>,
              ): String {
                  val sb = StringBuilder()
                  sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                  sb.append("<gpx version=\"1.1\" creator=\"GridFix\" xmlns=\"http://www.topografix.com/GPX/1/1\">\n")
                  for (w in waypoints) {
                      sb.append(
                          String.format(
                              Locale.US, "  <wpt lat=\"%.7f\" lon=\"%.7f\"><name>%s</name></wpt>\n",
                              w.lat, w.lon, escapeXml(w.name),
                          )
                      )
                  }
                  for (r in routes) {
                      sb.append("  <rte><name>").append(escapeXml(r.name)).append("</name>\n")
                      for (p in r.points) {
                          sb.append(
                              String.format(Locale.US, "    <rtept lat=\"%.7f\" lon=\"%.7f\"/>\n", p.lat, p.lon)
                          )
                      }
                      sb.append("  </rte>\n")
                  }
                  val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US)
                  sdf.timeZone = TimeZone.getTimeZone("UTC")
                  for ((info, pts) in tracks) {
                      sb.append("  <trk><name>").append(escapeXml(info.name)).append("</name><trkseg>\n")
                      for (p in pts) {
                          sb.append(
                              String.format(
                                  Locale.US,
                                  "    <trkpt lat=\"%.7f\" lon=\"%.7f\"><ele>%.1f</ele><time>%s</time></trkpt>\n",
                                  p.lat, p.lon, p.alt, sdf.format(Date(p.time)),
                              )
                          )
                      }
                      sb.append("  </trkseg></trk>\n")
                  }
                  sb.append("</gpx>\n")
                  return sb.toString()
              }

              // ---------------- KML / KMZ ----------------

              fun parseKmz(stream: InputStream): ImportedData {
                  ZipInputStream(stream).use { zip ->
                      var entry = zip.nextEntry
                      while (entry != null) {
                          if (!entry.isDirectory && entry.name.lowercase(Locale.US).endsWith(".kml")) {
                              return parseKml(zip)
                          }
                          entry = zip.nextEntry
                      }
                  }
                  return ImportedData()
              }

              fun parseKml(stream: InputStream): ImportedData {
                  val wps = ArrayList<WaypointDraft>()
                  val lines = ArrayList<ImportedLine>()
                  val areas = ArrayList<ImportedLine>()

                  val parser = Xml.newPullParser()
                  parser.setInput(stream, null)

                  val folderStack = ArrayDeque<String>()
                  var awaitingFolderName = false
                  var inPlacemark = false
                  var pmName = ""
                  var geomType = ""        // point / line / polygon
                  var coordText = ""
                  var inCoordinates = false
                  var textBuf = ""

                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              textBuf = ""
                              when (parser.name) {
                                  "Folder" -> {
                                      folderStack.addLast("")
                                      awaitingFolderName = true
                                  }
                                  "Placemark" -> {
                                      inPlacemark = true
                                      pmName = ""
                                      geomType = ""
                                      coordText = ""
                                  }
                                  "Point" -> if (inPlacemark) geomType = "point"
                                  "LineString" -> if (inPlacemark) geomType = "line"
                                  "Polygon" -> if (inPlacemark) geomType = "polygon"
                                  "coordinates" -> inCoordinates = true
                              }
                          }
                          XmlPullParser.TEXT -> textBuf += parser.text ?: ""
                          XmlPullParser.END_TAG -> {
                              when (parser.name) {
                                  "name" -> {
                                      val t = textBuf.trim()
                                      if (inPlacemark) {
                                          if (pmName.isEmpty()) pmName = t
                                      } else if (awaitingFolderName && folderStack.isNotEmpty()) {
                                          folderStack.removeLast()
                                          folderStack.addLast(t)
                                          awaitingFolderName = false
                                      }
                                  }
                                  "coordinates" -> {
                                      inCoordinates = false
                                      if (inPlacemark && coordText.isEmpty()) coordText = textBuf
                                  }
                                  "Folder" -> {
                                      if (folderStack.isNotEmpty()) folderStack.removeLast()
                                      awaitingFolderName = false
                                  }
                                  "Placemark" -> {
                                      if (inPlacemark) {
                                          val folder = folderStack.lastOrNull { it.isNotBlank() } ?: IMPORT_FOLDER
                                          val pts = parseKmlCoordinates(coordText)
                                          when {
                                              geomType == "point" && pts.isNotEmpty() -> wps.add(
                                                  WaypointDraft(
                                                      name = pmName.ifBlank { "WP ${wps.size + 1}" },
                                                      lat = pts[0].lat,
                                                      lon = pts[0].lon,
                                                      folder = folder,
                                                      symbol = "flag",
                                                      affiliation = "none",
                                                  )
                                              )
                                              geomType == "line" && pts.size >= 2 -> lines.add(
                                                  ImportedLine(pmName.ifBlank { "Imported line" }, folder, pts)
                                              )
                                              geomType == "polygon" && pts.size >= 3 -> areas.add(
                                                  ImportedLine(pmName.ifBlank { "Imported area" }, folder, pts)
                                              )
                                          }
                                      }
                                      inPlacemark = false
                                  }
                              }
                          }
                      }
                      event = parser.next()
                  }
                  return ImportedData(waypoints = wps, lines = lines, areas = areas)
              }

              /** KML coordinate lists are "lon,lat[,alt]" tuples separated by whitespace. */
              private fun parseKmlCoordinates(text: String): List<GeoVertex> =
                  text.trim().split(Regex("\\s+")).mapNotNull { tuple ->
                      val parts = tuple.split(",")
                      if (parts.size < 2) return@mapNotNull null
                      val lon = parts[0].toDoubleOrNull() ?: return@mapNotNull null
                      val lat = parts[1].toDoubleOrNull() ?: return@mapNotNull null
                      if (lat in -90.0..90.0 && lon in -180.0..180.0) GeoVertex(lat, lon) else null
                  }.let { pts ->
                      // drop the duplicated closing vertex polygons carry
                      if (pts.size >= 2 && pts.first() == pts.last()) pts.dropLast(1) else pts
                  }

              fun buildKml(
                  waypoints: List<Waypoint>,
                  graphics: List<TacGraphic>,
                  tracks: List<Pair<TrackInfo, List<TrackPoint>>>,
              ): String {
                  val sb = StringBuilder()
                  sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                  sb.append("<kml xmlns=\"http://www.opengis.net/kml/2.2\"><Document>\n")
                  sb.append("<name>GridFix export</name>\n")

                  for ((folder, list) in waypoints.groupBy { it.folder }) {
                      sb.append("<Folder><name>").append(escapeXml(folder)).append("</name>\n")
                      for (w in list) {
                          sb.append("<Placemark><name>").append(escapeXml(w.name)).append("</name>")
                          sb.append(
                              String.format(
                                  Locale.US, "<Point><coordinates>%.7f,%.7f,0</coordinates></Point>",
                                  w.lon, w.lat,
                              )
                          )
                          sb.append("</Placemark>\n")
                      }
                      sb.append("</Folder>\n")
                  }

                  if (graphics.isNotEmpty()) {
                      sb.append("<Folder><name>Graphics</name>\n")
                      for (g in graphics) {
                          val closed = GraphicTypes.isArea(g.type) && g.points.size >= 3
                          sb.append("<Placemark><name>")
                              .append(escapeXml(GraphicTypes.labelPrefix(g.type) + g.name))
                              .append("</name>")
                          val coords = StringBuilder()
                          for (p in g.points) {
                              coords.append(String.format(Locale.US, "%.7f,%.7f,0 ", p.lon, p.lat))
                          }
                          if (closed && g.points.isNotEmpty()) {
                              coords.append(
                                  String.format(Locale.US, "%.7f,%.7f,0", g.points[0].lon, g.points[0].lat)
                              )
                          }
                          if (closed) {
                              sb.append("<Polygon><outerBoundaryIs><LinearRing><coordinates>")
                                  .append(coords.toString().trim())
                                  .append("</coordinates></LinearRing></outerBoundaryIs></Polygon>")
                          } else {
                              sb.append("<LineString><tessellate>1</tessellate><coordinates>")
                                  .append(coords.toString().trim())
                                  .append("</coordinates></LineString>")
                          }
                          sb.append("</Placemark>\n")
                      }
                      sb.append("</Folder>\n")
                  }

                  if (tracks.isNotEmpty()) {
                      sb.append("<Folder><name>Tracks</name>\n")
                      for ((info, pts) in tracks) {
                          sb.append("<Placemark><name>").append(escapeXml(info.name)).append("</name>")
                          sb.append("<LineString><tessellate>1</tessellate><coordinates>")
                          for (p in pts) {
                              sb.append(String.format(Locale.US, "%.7f,%.7f,0 ", p.lon, p.lat))
                          }
                          sb.append("</coordinates></LineString></Placemark>\n")
                      }
                      sb.append("</Folder>\n")
                  }

                  sb.append("</Document></kml>\n")
                  return sb.toString()
              }

              // ---------------- helpers ----------------

              private fun parseIsoTime(text: String): Long = runCatching {
                  val cleaned = text.replace(Regex("\\.\\d+"), "").removeSuffix("Z")
                  val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss", Locale.US)
                  sdf.timeZone = TimeZone.getTimeZone("UTC")
                  sdf.parse(cleaned)?.time ?: 0L
              }.getOrDefault(0L)

              private fun escapeXml(s: String): String = s
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace("\"", "&quot;")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/TrackRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import android.location.Location
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.UUID

          private val Context.trackStore by preferencesDataStore(name = "tracks")

          /** Track metadata; the point log lives in files/tracks/<id>.txt (one point per line). */
          data class TrackInfo(
              val id: String,
              val name: String,
              val startedAt: Long,
              val endedAt: Long,        // 0 while recording
              val distanceM: Double,
              val pointCount: Int,
          )

          data class TrackPoint(val lat: Double, val lon: Double, val time: Long, val alt: Double)

          class TrackRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")

              val tracks: Flow<List<TrackInfo>> = context.trackStore.data.map { p ->
                  decode(p[listKey] ?: "[]").sortedByDescending { it.startedAt }
              }

              suspend fun startTrack(nowMillis: Long): String {
                  val id = UUID.randomUUID().toString()
                  val info = TrackInfo(
                      id = id,
                      name = "Track " + dtgShort(nowMillis),
                      startedAt = nowMillis,
                      endedAt = 0L,
                      distanceM = 0.0,
                      pointCount = 0,
                  )
                  withContext(Dispatchers.IO) { pointsFile(context, id).parentFile?.mkdirs() }
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + info)
                  }
                  return id
              }

              /** Close out a finished recording: compute stats from the point log. */
              suspend fun finishTrack(id: String, name: String?, nowMillis: Long) {
                  val pts = readPoints(context, id)
                  var dist = 0.0
                  for (i in 1 until pts.size) {
                      val out = FloatArray(1)
                      Location.distanceBetween(
                          pts[i - 1].lat, pts[i - 1].lon, pts[i].lat, pts[i].lon, out
                      )
                      dist += out[0]
                  }
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(
                                  name = name?.trim()?.ifBlank { it.name } ?: it.name,
                                  endedAt = nowMillis,
                                  distanceM = dist,
                                  pointCount = pts.size,
                              ) else it
                          }
                      )
                  }
              }

              /** Create a finished track from imported points (GPX trk import). */
              suspend fun importTrack(name: String, points: List<TrackPoint>, nowMillis: Long): String {
                  val id = UUID.randomUUID().toString()
                  withContext(Dispatchers.IO) {
                      val f = pointsFile(context, id)
                      f.parentFile?.mkdirs()
                      f.bufferedWriter().use { out ->
                          for (p in points) {
                              out.write(
                                  String.format(Locale.US, "%.7f %.7f %d %.1f\n", p.lat, p.lon, p.time, p.alt)
                              )
                          }
                      }
                  }
                  var dist = 0.0
                  for (i in 1 until points.size) {
                      val out = FloatArray(1)
                      Location.distanceBetween(
                          points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon, out
                      )
                      dist += out[0]
                  }
                  val start = points.firstOrNull()?.time?.takeIf { it > 0 } ?: nowMillis
                  val end = points.lastOrNull()?.time?.takeIf { it > 0 } ?: nowMillis
                  val info = TrackInfo(
                      id = id,
                      name = name.trim().ifBlank { "Imported track" },
                      startedAt = start,
                      endedAt = end,
                      distanceM = dist,
                      pointCount = points.size,
                  )
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + info)
                  }
                  return id
              }

              suspend fun rename(id: String, name: String) {
                  if (name.isBlank()) return
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(name = name.trim()) else it
                          }
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.id == id })
                  }
                  withContext(Dispatchers.IO) { pointsFile(context, id).delete() }
              }

              /** Remove a recording that was discarded before saving. */
              suspend fun discard(id: String) = delete(id)

              private fun decode(json: String): List<TrackInfo> = runCatching {
                  val arr = JSONArray(json)
                  buildList {
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          add(
                              TrackInfo(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  startedAt = o.optLong("startedAt"),
                                  endedAt = o.optLong("endedAt"),
                                  distanceM = o.optDouble("distanceM", 0.0),
                                  pointCount = o.optInt("pointCount", 0),
                              )
                          )
                      }
                  }
              }.getOrDefault(emptyList())

              private fun encode(list: List<TrackInfo>): String {
                  val arr = JSONArray()
                  for (t in list) {
                      arr.put(
                          JSONObject()
                              .put("id", t.id)
                              .put("name", t.name)
                              .put("startedAt", t.startedAt)
                              .put("endedAt", t.endedAt)
                              .put("distanceM", t.distanceM)
                              .put("pointCount", t.pointCount)
                      )
                  }
                  return arr.toString()
              }

              companion object {
                  fun pointsFile(context: Context, id: String): File =
                      File(File(context.filesDir, "tracks"), "$id.txt")

                  /** Append one point; called from the recorder service's worker thread. */
                  fun appendPoint(context: Context, id: String, lat: Double, lon: Double, time: Long, alt: Double) {
                      runCatching {
                          val f = pointsFile(context, id)
                          f.parentFile?.mkdirs()
                          f.appendText(
                              String.format(Locale.US, "%.7f %.7f %d %.1f\n", lat, lon, time, alt)
                          )
                      }
                  }

                  suspend fun readPoints(context: Context, id: String): List<TrackPoint> =
                      withContext(Dispatchers.IO) {
                          val f = pointsFile(context, id)
                          if (!f.exists()) return@withContext emptyList()
                          f.readLines().mapNotNull { line ->
                              val parts = line.trim().split(" ")
                              if (parts.size < 3) return@mapNotNull null
                              runCatching {
                                  TrackPoint(
                                      lat = parts[0].toDouble(),
                                      lon = parts[1].toDouble(),
                                      time = parts[2].toLong(),
                                      alt = parts.getOrNull(3)?.toDouble() ?: 0.0,
                                  )
                              }.getOrNull()
                          }
                      }

                  /** Minimal GPX 1.1 document for one track. */
                  fun buildGpx(name: String, points: List<TrackPoint>): String {
                      val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US)
                      sdf.timeZone = TimeZone.getTimeZone("UTC")
                      val sb = StringBuilder()
                      sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                      sb.append("<gpx version=\"1.1\" creator=\"GridFix\" xmlns=\"http://www.topografix.com/GPX/1/1\">\n")
                      sb.append("  <trk>\n    <name>").append(escapeXml(name)).append("</name>\n    <trkseg>\n")
                      for (p in points) {
                          sb.append(
                              String.format(
                                  Locale.US,
                                  "      <trkpt lat=\"%.7f\" lon=\"%.7f\"><ele>%.1f</ele><time>%s</time></trkpt>\n",
                                  p.lat, p.lon, p.alt, sdf.format(Date(p.time)),
                              )
                          )
                      }
                      sb.append("    </trkseg>\n  </trk>\n</gpx>\n")
                      return sb.toString()
                  }

                  private fun escapeXml(s: String): String = s
                      .replace("&", "&amp;")
                      .replace("<", "&lt;")
                      .replace(">", "&gt;")
                      .replace("\"", "&quot;")

                  private fun dtgShort(timeMillis: Long): String {
                      val sdf = SimpleDateFormat("ddHHmm'Z'", Locale.US)
                      sdf.timeZone = TimeZone.getTimeZone("UTC")
                      return sdf.format(Date(timeMillis))
                  }
              }
          }
