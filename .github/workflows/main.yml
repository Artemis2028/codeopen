name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.4 (hardening) delta, plain text, auditable below)
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 32
                  versionName = "0.9.4"
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")

              // Transitive androidx.fragment 1.1.0 is flagged outdated by Play; pin a current one
              implementation("androidx.fragment:fragment:1.8.5")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android'
          cat > 'app/src/main/java/app/gridfix/android/MainActivity.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import app.gridfix.android.ui.GridFixApp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent {
                      GridFixApp()
                  }
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/billing'
          cat > 'app/src/main/java/app/gridfix/android/billing/BillingManager.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.billing

          import android.app.Activity
          import android.content.Context
          import androidx.datastore.core.handlers.ReplaceFileCorruptionHandler
          import androidx.datastore.preferences.core.booleanPreferencesKey
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.preferencesDataStore
          import com.android.billingclient.api.AcknowledgePurchaseParams
          import com.android.billingclient.api.BillingClient
          import com.android.billingclient.api.BillingClientStateListener
          import com.android.billingclient.api.BillingFlowParams
          import com.android.billingclient.api.BillingResult
          import com.android.billingclient.api.PendingPurchasesParams
          import com.android.billingclient.api.ProductDetails
          import com.android.billingclient.api.Purchase
          import com.android.billingclient.api.PurchasesUpdatedListener
          import com.android.billingclient.api.QueryProductDetailsParams
          import com.android.billingclient.api.QueryPurchasesParams
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.launch

          private val Context.billingStore by preferencesDataStore(
              name = "billing",
              corruptionHandler = ReplaceFileCorruptionHandler { emptyPreferences() },
          )

          /**
           * MGRS GPS Pro subscription state via Google Play Billing.
           *
           * Entitlement model: an active (purchased) subscription unlocks the app. The
           * last known result is cached in DataStore so a subscriber who opens the app
           * offline — days into a field problem — is never locked out; the cache is
           * corrected the next time Play answers. Free trials are configured on the
           * products in Play Console, not here: eligible users simply see an offer
           * whose first pricing phase is free.
           *
           * Robustness rules: the startup check is time-bounded (a Play Store that never
           * answers falls back to the cache instead of a spinner forever), every Play
           * error path lands on the cache, only one BillingClient exists at a time, and
           * every user action that can fail produces a readable notice.
           */
          class BillingManager(private val context: Context) : PurchasesUpdatedListener {

              enum class State { CHECKING, ENTITLED, LOCKED }

              enum class PlansStatus { LOADING, LOADED, EMPTY, ERROR }

              data class Plan(
                  val productId: String,
                  val title: String,          // "Monthly" / "Annual"
                  val price: String,          // formatted recurring price, e.g. "$2.99"
                  val period: String,         // "month" / "year" / "week"
                  val priceMicros: Long,      // recurring price in micros, for savings math
                  val trialDays: Int,         // 0 when the user has no free-trial offer
                  val offerToken: String,
                  val details: ProductDetails,
              )

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              private val stateFlow = MutableStateFlow(State.CHECKING)
              val state: StateFlow<State> = stateFlow
              private val plansFlow = MutableStateFlow<List<Plan>>(emptyList())
              val plans: StateFlow<List<Plan>> = plansFlow
              private val plansStatusFlow = MutableStateFlow(PlansStatus.LOADING)
              val plansStatus: StateFlow<PlansStatus> = plansStatusFlow
              private val noticeFlow = MutableStateFlow<String?>(null)
              val notice: StateFlow<String?> = noticeFlow

              private var client: BillingClient? = null
              private var connecting = false
              private var userRestore = false

              companion object {
                  const val MONTHLY = "gridfix_pro_monthly"
                  const val ANNUAL = "gridfix_pro_annual"
                  const val MANAGE_URL =
                      "https://play.google.com/store/account/subscriptions?package=app.gridfix.android"
                  private val ENTITLED_KEY = booleanPreferencesKey("entitled")
                  private const val STARTUP_TIMEOUT_MS = 10_000L
              }

              private suspend fun cachedEntitled(): Boolean =
                  runCatching { context.billingStore.data.first()[ENTITLED_KEY] ?: false }.getOrDefault(false)

              fun start() {
                  scope.launch {
                      // Seed from cache first so a known subscriber is unlocked instantly,
                      // network or not; Play's answer then confirms or corrects it.
                      if (cachedEntitled() && stateFlow.value == State.CHECKING) {
                          stateFlow.value = State.ENTITLED
                      }
                      connect()
                      delay(STARTUP_TIMEOUT_MS)
                      if (stateFlow.value == State.CHECKING) fallBackToCache()
                  }
              }

              fun close() {
                  client?.endConnection()
                  client = null
                  connecting = false
              }

              /** Re-check purchases when the app comes back to the foreground. */
              fun refresh() {
                  val c = client
                  if (c != null && c.isReady) refreshPurchases() else if (!connecting) connect()
              }

              /** Paywall "Restore purchases" / retry: reconnect if needed, re-query everything. */
              fun restore() {
                  noticeFlow.value = null
                  userRestore = true
                  plansStatusFlow.value = PlansStatus.LOADING
                  val c = client
                  if (c != null && c.isReady) {
                      refreshPurchases()
                      queryPlans()
                  } else {
                      connect()
                  }
              }

              private fun connect() {
                  if (connecting) return
                  client?.let { old ->
                      if (old.isReady) {
                          refreshPurchases()
                          queryPlans()
                          return
                      }
                      old.endConnection()
                  }
                  connecting = true
                  val c = BillingClient.newBuilder(context)
                      .setListener(this)
                      .enablePendingPurchases(
                          PendingPurchasesParams.newBuilder().enableOneTimeProducts().build()
                      )
                      .build()
                  client = c
                  c.startConnection(object : BillingClientStateListener {
                      override fun onBillingSetupFinished(result: BillingResult) {
                          connecting = false
                          if (c !== client) return   // superseded by a newer client
                          if (result.responseCode == BillingClient.BillingResponseCode.OK) {
                              refreshPurchases()
                              queryPlans()
                          } else {
                              plansStatusFlow.value = PlansStatus.ERROR
                              fallBackToCache(describe(result))
                          }
                      }

                      override fun onBillingServiceDisconnected() {
                          connecting = false
                          if (c !== client) return
                          if (stateFlow.value == State.CHECKING) fallBackToCache(null)
                          if (plansStatusFlow.value == PlansStatus.LOADING) {
                              plansStatusFlow.value = PlansStatus.ERROR
                              noticeFlow.value = "Google Play disconnected — tap Retry"
                          }
                      }
                  })
                  armPlansTimeout()
              }

              /** A plan query that never answers must not leave the paywall spinning. */
              private fun armPlansTimeout() {
                  scope.launch {
                      delay(STARTUP_TIMEOUT_MS)
                      if (plansStatusFlow.value == PlansStatus.LOADING) {
                          plansStatusFlow.value = PlansStatus.ERROR
                          if (noticeFlow.value == null) {
                              noticeFlow.value = "Google Play is not answering — check your connection and tap Retry"
                          }
                      }
                  }
              }

              private fun refreshPurchases() {
                  val c = client ?: return
                  val params = QueryPurchasesParams.newBuilder()
                      .setProductType(BillingClient.ProductType.SUBS)
                      .build()
                  c.queryPurchasesAsync(params) { result, purchases ->
                      if (result.responseCode == BillingClient.BillingResponseCode.OK) {
                          applyPurchases(purchases)
                      } else {
                          fallBackToCache(describe(result))
                      }
                  }
              }

              private fun applyPurchases(purchases: List<Purchase>) {
                  val active = purchases.filter { it.purchaseState == Purchase.PurchaseState.PURCHASED }
                  // Google refunds unacknowledged purchases after 3 days — acknowledge promptly.
                  active.filter { !it.isAcknowledged }.forEach { p ->
                      val c = client ?: return@forEach
                      val ack = AcknowledgePurchaseParams.newBuilder()
                          .setPurchaseToken(p.purchaseToken)
                          .build()
                      c.acknowledgePurchase(ack) { }
                  }
                  val entitled = active.isNotEmpty()
                  val pending = purchases.any { it.purchaseState == Purchase.PurchaseState.PENDING }
                  val fromRestore = userRestore
                  userRestore = false
                  scope.launch {
                      runCatching { context.billingStore.edit { it[ENTITLED_KEY] = entitled } }
                      stateFlow.value = if (entitled) State.ENTITLED else State.LOCKED
                      noticeFlow.value = when {
                          entitled -> null
                          pending -> "Purchase pending — finish payment, then tap Restore purchases"
                          fromRestore -> "No active subscription found for this Google account"
                          else -> null
                      }
                  }
              }

              private fun fallBackToCache(reason: String? = null) {
                  scope.launch {
                      val cached = cachedEntitled()
                      stateFlow.value = if (cached) State.ENTITLED else State.LOCKED
                      if (!cached) {
                          noticeFlow.value = reason ?: "Google Play billing is not reachable right now"
                      }
                  }
              }

              private fun queryPlans() {
                  val c = client ?: return
                  plansStatusFlow.value = PlansStatus.LOADING
                  armPlansTimeout()
                  val params = QueryProductDetailsParams.newBuilder()
                      .setProductList(
                          listOf(MONTHLY, ANNUAL).map { id ->
                              QueryProductDetailsParams.Product.newBuilder()
                                  .setProductId(id)
                                  .setProductType(BillingClient.ProductType.SUBS)
                                  .build()
                          }
                      )
                      .build()
                  c.queryProductDetailsAsync(params) { result, detailsResult ->
                      if (result.responseCode != BillingClient.BillingResponseCode.OK) {
                          plansStatusFlow.value = PlansStatus.ERROR
                          noticeFlow.value = "Google Play could not load the plans — " + describe(result)
                          return@queryProductDetailsAsync
                      }
                      val list = detailsResult.productDetailsList.mapNotNull { toPlan(it) }
                      plansFlow.value = list.sortedBy { if (it.productId == MONTHLY) 0 else 1 }
                      if (list.isEmpty()) {
                          plansStatusFlow.value = PlansStatus.EMPTY
                          noticeFlow.value = "No plans are available for this install. Install MGRS GPS " +
                              "from the Play Store and make sure you are signed in to Google Play."
                      } else {
                          plansStatusFlow.value = PlansStatus.LOADED
                      }
                  }
              }

              /**
               * Pick the offer to sell: prefer one containing a free phase (the trial —
               * Play only returns offers this user is eligible for), else the base plan.
               * The recurring price is the last non-free pricing phase.
               */
              private fun toPlan(pd: ProductDetails): Plan? {
                  val offers = pd.subscriptionOfferDetails ?: return null
                  if (offers.isEmpty()) return null
                  val chosen = offers.firstOrNull { o ->
                      o.pricingPhases.pricingPhaseList.any { it.priceAmountMicros == 0L }
                  } ?: offers.first()
                  val phases = chosen.pricingPhases.pricingPhaseList
                  val paid = phases.lastOrNull { it.priceAmountMicros > 0L } ?: return null
                  val trial = phases.firstOrNull { it.priceAmountMicros == 0L }
                  val iso = paid.billingPeriod
                  val count = iso.filter { it.isDigit() }.toIntOrNull() ?: 1
                  val period = when {
                      iso.endsWith("Y") -> "year"
                      iso.endsWith("W") -> "week"
                      else -> "month"
                  }
                  val title = when {
                      period == "year" && count == 1 -> "Annual"
                      period == "month" && count == 1 -> "Monthly"
                      period == "week" && count == 1 -> "Weekly"
                      else -> "Every $count ${period}s"
                  }
                  return Plan(
                      productId = pd.productId,
                      title = title,
                      price = paid.formattedPrice,
                      period = if (count == 1) period else "$count ${period}s",
                      priceMicros = paid.priceAmountMicros,
                      trialDays = trial?.let { periodDays(it.billingPeriod) } ?: 0,
                      offerToken = chosen.offerToken,
                      details = pd,
                  )
              }

              private fun periodDays(iso: String): Int {
                  val n = iso.filter { it.isDigit() }.toIntOrNull() ?: 0
                  return when {
                      iso.endsWith("W") -> n * 7
                      iso.endsWith("M") -> n * 30
                      iso.endsWith("Y") -> n * 365
                      else -> n
                  }
              }

              fun launchPurchase(activity: Activity, plan: Plan) {
                  noticeFlow.value = null
                  val c = client
                  if (c == null || !c.isReady) {
                      noticeFlow.value = "Reconnecting to Google Play — try again in a moment"
                      connect()
                      return
                  }
                  val flow = BillingFlowParams.newBuilder()
                      .setProductDetailsParamsList(
                          listOf(
                              BillingFlowParams.ProductDetailsParams.newBuilder()
                                  .setProductDetails(plan.details)
                                  .setOfferToken(plan.offerToken)
                                  .build()
                          )
                      )
                      .build()
                  val r = c.launchBillingFlow(activity, flow)
                  if (r.responseCode != BillingClient.BillingResponseCode.OK) {
                      noticeFlow.value = "Could not open Google Play checkout — " + describe(r)
                  }
              }

              override fun onPurchasesUpdated(result: BillingResult, purchases: List<Purchase>?) {
                  when (result.responseCode) {
                      BillingClient.BillingResponseCode.OK -> {
                          if (purchases.isNullOrEmpty()) refreshPurchases() else applyPurchases(purchases)
                      }
                      BillingClient.BillingResponseCode.USER_CANCELED -> Unit
                      BillingClient.BillingResponseCode.ITEM_ALREADY_OWNED -> refreshPurchases()
                      else -> noticeFlow.value = "Purchase did not complete — " + describe(result)
                  }
              }

              /** Human wording for the Play response codes a user can actually act on. */
              private fun describe(r: BillingResult): String = when (r.responseCode) {
                  BillingClient.BillingResponseCode.BILLING_UNAVAILABLE ->
                      "sign in to Google Play on this device and try again"
                  BillingClient.BillingResponseCode.SERVICE_UNAVAILABLE,
                  BillingClient.BillingResponseCode.NETWORK_ERROR ->
                      "no connection to Google Play (check your network)"
                  BillingClient.BillingResponseCode.SERVICE_DISCONNECTED ->
                      "Google Play disconnected, tap Retry"
                  BillingClient.BillingResponseCode.ITEM_UNAVAILABLE ->
                      "this plan is not available in your country yet"
                  BillingClient.BillingResponseCode.FEATURE_NOT_SUPPORTED ->
                      "this device's Play Store does not support subscriptions"
                  BillingClient.BillingResponseCode.DEVELOPER_ERROR ->
                      "configuration problem (Play error ${r.responseCode})"
                  else -> "Play error ${r.responseCode}"
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/Backup.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.InputStream
          import java.io.OutputStream
          import java.util.Locale
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream

          /**
           * Whole-app backup as one zip: a JSON snapshot of waypoints, folders,
           * graphics, settings, and the practice log, plus each track's point file.
           * Restore is idempotent — everything keeps its original id and anything
           * already on the device is skipped, so restoring twice never duplicates.
           */
          object Backup {

              const val VERSION = 1

              suspend fun export(
                  context: Context,
                  out: OutputStream,
                  waypoints: List<Waypoint>,
                  folders: List<FolderInfo>,
                  graphics: List<TacGraphic>,
                  settings: AppSettings,
                  tracks: List<TrackInfo>,
                  courseHistory: List<CourseResult>,
                  nowMillis: Long,
              ) = withContext(Dispatchers.IO) {
                  val root = JSONObject()
                      .put("app", "GridFix")
                      .put("version", VERSION)
                      .put("exportedAt", nowMillis)
                  root.put("waypoints", JSONArray().also { a ->
                      for (w in waypoints) a.put(
                          JSONObject()
                              .put("id", w.id).put("name", w.name)
                              .put("lat", w.lat).put("lon", w.lon)
                              .put("createdAt", w.createdAt).put("folder", w.folder)
                              .put("symbol", w.symbol).put("affiliation", w.affiliation)
                              .put("echelon", w.echelon).put("designation", w.designation)
                              .put("kind", w.kind).put("rotation", w.rotation.toDouble())
                      )
                  })
                  root.put("folders", JSONArray().also { a ->
                      for (f in folders) a.put(JSONObject().put("name", f.name).put("visible", f.visible))
                  })
                  root.put("graphics", JSONArray().also { a ->
                      for (g in graphics) {
                          val pts = JSONArray()
                          for (v in g.points) pts.put(JSONArray().put(v.lat).put(v.lon))
                          a.put(
                              JSONObject()
                                  .put("id", g.id).put("name", g.name).put("type", g.type)
                                  .put("points", pts).put("folder", g.folder)
                                  .put("affiliation", g.affiliation).put("createdAt", g.createdAt)
                                  .put("echelon", g.echelon)
                          )
                      }
                  })
                  root.put("settings", JSONObject()
                      .put("nightMode", settings.nightMode)
                      .put("keepScreenOn", settings.keepScreenOn)
                      .put("mgrsDigits", settings.mgrsDigits)
                      .put("latLonFormat", settings.latLonFormat)
                      .put("units", settings.units)
                      .put("angleUnit", settings.angleUnit)
                      .put("northRef", settings.northRef)
                      .put("pacePer100m", settings.pacePer100m)
                  )
                  root.put("tracks", JSONArray().also { a ->
                      for (t in tracks) a.put(
                          JSONObject()
                              .put("id", t.id).put("name", t.name)
                              .put("startedAt", t.startedAt).put("endedAt", t.endedAt)
                              .put("distanceM", t.distanceM).put("pointCount", t.pointCount)
                      )
                  })
                  root.put("courseHistory", JSONArray().also { a ->
                      for (r in courseHistory) a.put(
                          JSONObject()
                              .put("name", r.name).put("points", r.points)
                              .put("started", r.startedAt).put("total", r.totalMillis)
                              .put("splits", JSONArray(r.splitsMillis))
                      )
                  })

                  val zip = ZipOutputStream(out)
                  zip.putNextEntry(ZipEntry("gridfix-backup.json"))
                  zip.write(root.toString(2).toByteArray())
                  zip.closeEntry()
                  for (t in tracks) {
                      val pts = TrackRepository.readPoints(context, t.id)
                      if (pts.isEmpty()) continue
                      zip.putNextEntry(ZipEntry("tracks/${t.id}.txt"))
                      zip.write(
                          pts.joinToString("") {
                              String.format(Locale.US, "%.7f %.7f %d %.1f\n", it.lat, it.lon, it.time, it.alt)
                          }.toByteArray()
                      )
                      zip.closeEntry()
                  }
                  zip.finish()
              }

              data class RestoreResult(
                  val waypoints: Int,
                  val graphics: Int,
                  val tracks: Int,
                  val course: Int,
                  val settingsApplied: Boolean,
              ) {
                  fun summary(): String {
                      val parts = mutableListOf<String>()
                      if (waypoints > 0) parts.add("$waypoints waypoints")
                      if (graphics > 0) parts.add("$graphics graphics")
                      if (tracks > 0) parts.add("$tracks tracks")
                      if (course > 0) parts.add("$course course results")
                      if (settingsApplied) parts.add("settings")
                      return if (parts.isEmpty()) "Nothing new to restore — everything was already here"
                      else "Restored " + parts.joinToString(", ")
                  }
              }

              suspend fun restore(
                  input: InputStream,
                  waypointRepo: WaypointRepository,
                  graphicsRepo: GraphicsRepository,
                  trackRepo: TrackRepository,
                  settingsRepo: SettingsRepository,
                  courseRepo: CourseRepository,
              ): RestoreResult = withContext(Dispatchers.IO) {
                  val entries = HashMap<String, ByteArray>()
                  val zin = ZipInputStream(input)
                  var e: ZipEntry? = zin.nextEntry
                  while (e != null) {
                      val wanted = e.name == "gridfix-backup.json" || e.name.startsWith("tracks/")
                      if (!e.isDirectory && wanted) {
                          val out = java.io.ByteArrayOutputStream()
                          val buf = ByteArray(16 * 1024)
                          var total = 0L
                          var tooBig = false
                          while (true) {
                              val n = zin.read(buf)
                              if (n < 0) break
                              total += n
                              if (total > 64L * 1024 * 1024) { tooBig = true; break }
                              out.write(buf, 0, n)
                          }
                          if (!tooBig) entries[e.name] = out.toByteArray()
                      }
                      zin.closeEntry()
                      e = zin.nextEntry
                  }
                  val rootBytes = entries["gridfix-backup.json"]
                      ?: throw IllegalArgumentException("not an MGRS GPS backup")
                  val root = JSONObject(String(rootBytes))

                  val wps = ArrayList<Waypoint>()
                  root.optJSONArray("waypoints")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          wps.add(
                              Waypoint(
                                  id = o.getString("id"), name = o.getString("name"),
                                  lat = o.getDouble("lat"), lon = o.getDouble("lon"),
                                  createdAt = o.optLong("createdAt"),
                                  folder = o.optString("folder", DEFAULT_FOLDER),
                                  symbol = o.optString("symbol", DEFAULT_SYMBOL),
                                  affiliation = o.optString("affiliation", "none"),
                                  echelon = o.optString("echelon", ""),
                                  designation = o.optString("designation", ""),
                                  kind = o.optString("kind", KIND_WP),
                                  rotation = o.optDouble("rotation", 0.0).toFloat(),
                              )
                          )
                      }
                  }
                  val folderInfos = ArrayList<FolderInfo>()
                  root.optJSONArray("folders")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          folderInfos.add(FolderInfo(o.getString("name"), o.optBoolean("visible", true)))
                      }
                  }
                  val addedWp = waypointRepo.restore(wps, folderInfos)

                  val gfx = ArrayList<TacGraphic>()
                  root.optJSONArray("graphics")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val ptsArr = o.getJSONArray("points")
                          val pts = ArrayList<GeoVertex>()
                          for (j in 0 until ptsArr.length()) {
                              val v = ptsArr.getJSONArray(j)
                              pts.add(GeoVertex(v.getDouble(0), v.getDouble(1)))
                          }
                          gfx.add(
                              TacGraphic(
                                  id = o.getString("id"), name = o.getString("name"),
                                  type = o.getString("type"), points = pts,
                                  folder = o.optString("folder", DEFAULT_FOLDER),
                                  affiliation = o.optString("affiliation", "none"),
                                  createdAt = o.optLong("createdAt"),
                                  echelon = o.optString("echelon", ""),
                              )
                          )
                      }
                  }
                  val addedG = graphicsRepo.restore(gfx)

                  var addedT = 0
                  root.optJSONArray("tracks")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val info = TrackInfo(
                              id = o.getString("id"), name = o.getString("name"),
                              startedAt = o.optLong("startedAt"), endedAt = o.optLong("endedAt"),
                              distanceM = o.optDouble("distanceM", 0.0),
                              pointCount = o.optInt("pointCount", 0),
                          )
                          val ptBytes = entries["tracks/${info.id}.txt"] ?: continue
                          val pts = String(ptBytes).lines().mapNotNull { line ->
                              val parts = line.trim().split(" ")
                              if (parts.size < 3) return@mapNotNull null
                              runCatching {
                                  TrackPoint(
                                      lat = parts[0].toDouble(), lon = parts[1].toDouble(),
                                      time = parts[2].toLong(),
                                      alt = parts.getOrNull(3)?.toDouble() ?: 0.0,
                                  )
                              }.getOrNull()
                          }
                          if (trackRepo.restore(info, pts)) addedT++
                      }
                  }

                  var settingsApplied = false
                  root.optJSONObject("settings")?.let { s ->
                      settingsRepo.applyAll(
                          AppSettings(
                              nightMode = s.optBoolean("nightMode", false),
                              keepScreenOn = s.optBoolean("keepScreenOn", true),
                              mgrsDigits = s.optInt("mgrsDigits", 10),
                              latLonFormat = s.optInt("latLonFormat", 1),
                              units = s.optInt("units", 0),
                              angleUnit = s.optInt("angleUnit", 0),
                              northRef = s.optInt("northRef", 0),
                              pacePer100m = s.optInt("pacePer100m", 65),
                          )
                      )
                      settingsApplied = true
                  }

                  val results = ArrayList<CourseResult>()
                  root.optJSONArray("courseHistory")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val splits = o.getJSONArray("splits")
                          results.add(
                              CourseResult(
                                  name = o.getString("name"), points = o.getInt("points"),
                                  startedAt = o.getLong("started"), totalMillis = o.getLong("total"),
                                  splitsMillis = buildList {
                                      for (j in 0 until splits.length()) add(splits.getLong(j))
                                  },
                              )
                          )
                      }
                  }
                  val addedC = courseRepo.restoreHistory(results)

                  RestoreResult(addedWp, addedG, addedT, addedC, settingsApplied)
              }
          }
