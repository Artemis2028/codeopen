                  "task_block" -> "Block"
                  "task_ambush" -> "Ambush"
                  "task_sbf" -> "Support by fire"
                  "task_abf" -> "Attack by fire"
                  "task_fix" -> "Fix"
                  "task_secure" -> "Secure"
                  "task_seize" -> "Seize"
                  "task_occupy" -> "Occupy"
                  "task_retain" -> "Retain"
                  "task_clear" -> "Clear"
                  "task_destroy" -> "Destroy"
                  "task_contain" -> "Contain"
                  "task_isolate" -> "Isolate"
                  "task_disrupt" -> "Disrupt"
                  "task_breach" -> "Breach"
                  "task_bypass" -> "Bypass"
                  "task_penetrate" -> "Penetrate"
                  "task_screen" -> "Screen"
                  "task_guard" -> "Guard"
                  "task_cover" -> "Cover"
                  else -> key
              }

              /** Letter-badge tasks render as a letter instead of a glyph. */
              fun taskLetter(key: String): String? = when (key) {
                  "task_screen" -> "S"
                  "task_guard" -> "G"
