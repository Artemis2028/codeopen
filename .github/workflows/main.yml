              <color name="ic_launcher_background">#0B0E13</color>
          </resources>
          EOF_GRIDFIX
          mkdir -p 'app/src/main/res/values'
          cat > 'app/src/main/res/values/strings.xml' <<'EOF_GRIDFIX'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">GridFix</string>
          </resources>
          EOF_GRIDFIX
          mkdir -p 'app/src/main/res/values'
          cat > 'app/src/main/res/values/themes.xml' <<'EOF_GRIDFIX'
