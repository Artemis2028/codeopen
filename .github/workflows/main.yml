name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.7.5 (sketch pack + contours) delta, plain text, auditable below)
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 34

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 16
                  versionName = "0.7.5"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/GraphicsRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.UUID

          private val Context.graphicsStore by preferencesDataStore(name = "graphics")

          /** A simple lat/lon vertex for tactical graphics. */
          data class GeoVertex(val lat: Double, val lon: Double)

          /**
           * A tactical control-measure graphic drawn on the map.
           * Types: phase_line, boundary, axis, doa, objective, aa, route.
           * Area types (objective, aa) are closed automatically when rendered.
           */
          data class TacGraphic(
              val id: String,
              val name: String,
              val type: String,
              val points: List<GeoVertex>,
              val folder: String = DEFAULT_FOLDER,
              val affiliation: String = "none",
              val createdAt: Long = 0L,
          )

          object GraphicTypes {
              /** type key -> (label, minimum vertices, isArea) */
              val all = listOf(
                  Triple("phase_line", "Phase line", 2),
                  Triple("boundary", "Boundary", 2),
                  Triple("axis", "Axis of advance", 2),
                  Triple("doa", "Direction of attack", 2),
                  Triple("objective", "Objective", 3),
                  Triple("aa", "Assembly area", 3),
                  Triple("route", "Route", 2),
                  Triple("lz", "Landing zone", 3),
                  Triple("pz", "Pickup zone", 3),
                  Triple("area", "Area (sketch)", 3),
                  Triple("ring", "Range ring", 2),
                  Triple("sector", "Sector of fire", 3),
                  Triple("trp", "Target ref point", 1),
                  Triple("checkpoint", "Checkpoint", 1),
                  Triple("text", "Text label", 1),
              )

              fun label(type: String): String = all.firstOrNull { it.first == type }?.second ?: type

              fun minPoints(type: String): Int = all.firstOrNull { it.first == type }?.third ?: 2

              fun isArea(type: String): Boolean =
                  type == "objective" || type == "aa" || type == "lz" || type == "pz" || type == "area"

              /**
               * Types placed with a fixed number of taps finish themselves — no Done press.
               * Ring: center then range edge. Sector: apex, left limit, right limit.
               */
              fun fixedPoints(type: String): Int? = when (type) {
                  "ring" -> 2
                  "sector" -> 3
                  "trp", "checkpoint", "text" -> 1
                  else -> null
              }

              /** Placement hint shown when the type is picked. */
              fun placeHint(type: String): String? = when (type) {
                  "ring" -> "Tap the center, then the range edge"
                  "sector" -> "Tap the apex, then left limit, then right limit"
                  "trp", "checkpoint" -> "Tap the map to place it"
                  "text" -> "Tap the map where the text goes"
                  else -> null
              }

              /** Display prefix used in the on-map label, per doctrine shorthand. */
              fun labelPrefix(type: String): String = when (type) {
                  "phase_line" -> "PL "
                  "objective" -> "OBJ "
                  "aa" -> "AA "
                  "lz" -> "LZ "
                  "pz" -> "PZ "
                  "trp" -> "TRP "
                  "checkpoint" -> "CP "
                  else -> ""
              }
          }

          class GraphicsRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")

              val graphics: Flow<List<TacGraphic>> = context.graphicsStore.data.map { p ->
                  decode(p[listKey] ?: "[]")
              }

              suspend fun add(
                  name: String,
                  type: String,
                  points: List<GeoVertex>,
                  folder: String,
                  affiliation: String,
                  nowMillis: Long,
              ): String {
                  val g = TacGraphic(
                      id = UUID.randomUUID().toString(),
                      name = name.trim(),
                      type = type,
                      points = points,
                      folder = folder.ifBlank { DEFAULT_FOLDER },
                      affiliation = affiliation,
                      createdAt = nowMillis,
                  )
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + g)
                  }
                  return g.id
              }

              suspend fun rename(id: String, name: String, folder: String, affiliation: String) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(
                                  name = name.trim(),
                                  folder = folder.ifBlank { DEFAULT_FOLDER },
                                  affiliation = affiliation,
                              ) else it
                          }
                      )
                  }
              }

              /** Replace a graphic's vertices — the map's edit-points mode saves through this. */
              suspend fun updatePoints(id: String, points: List<GeoVertex>) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(points = points) else it
                          }
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.id == id })
                  }
              }

              /** Remove every graphic in [folder] — "clear the sketch" in one go. */
              suspend fun deleteFolder(folder: String) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.folder == folder })
                  }
              }

              private fun decode(json: String): List<TacGraphic> = runCatching {
                  val arr = JSONArray(json)
                  buildList {
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val pts = o.getJSONArray("points")
                          val vertices = buildList {
                              for (j in 0 until pts.length()) {
                                  val v = pts.getJSONArray(j)
                                  add(GeoVertex(v.getDouble(0), v.getDouble(1)))
                              }
                          }
                          add(
                              TacGraphic(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  type = o.getString("type"),
                                  points = vertices,
                                  folder = o.optString("folder", DEFAULT_FOLDER),
                                  affiliation = o.optString("affiliation", "none"),
                                  createdAt = o.optLong("createdAt"),
                              )
                          )
                      }
                  }
              }.getOrDefault(emptyList())

              private fun encode(list: List<TacGraphic>): String {
                  val arr = JSONArray()
                  for (g in list) {
                      val pts = JSONArray()
                      for (v in g.points) {
                          pts.put(JSONArray().put(v.lat).put(v.lon))
                      }
                      arr.put(
                          JSONObject()
                              .put("id", g.id)
                              .put("name", g.name)
                              .put("type", g.type)
                              .put("points", pts)
                              .put("folder", g.folder)
                              .put("affiliation", g.affiliation)
                              .put("createdAt", g.createdAt)
                      )
                  }
                  return arr.toString()
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/InterchangeFiles.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.util.Xml
          import org.xmlpull.v1.XmlPullParser
          import java.io.InputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.zip.ZipInputStream

          /**
           * GPX 1.1 and KML/KMZ interchange: the file formats land-nav and TAK users
           * actually trade. Import is tolerant (skips what it can't read); export writes
           * plain, widely-accepted documents. Everything is streamed with XmlPullParser —
           * no external dependencies.
           */
          object InterchangeFiles {

              data class ImportedLine(val name: String, val folder: String, val points: List<GeoVertex>)
              data class ImportedTrack(val name: String, val points: List<TrackPoint>)

              data class ImportedData(
                  val waypoints: List<WaypointDraft> = emptyList(),
                  val lines: List<ImportedLine> = emptyList(),      // become route graphics
                  val areas: List<ImportedLine> = emptyList(),      // become assembly-area graphics
                  val tracks: List<ImportedTrack> = emptyList(),
              ) {
                  val isEmpty: Boolean
                      get() = waypoints.isEmpty() && lines.isEmpty() && areas.isEmpty() && tracks.isEmpty()

                  fun summary(): String {
                      val parts = mutableListOf<String>()
                      if (waypoints.isNotEmpty()) parts.add("${waypoints.size} waypoints")
                      if (lines.isNotEmpty()) parts.add("${lines.size} lines")
                      if (areas.isNotEmpty()) parts.add("${areas.size} areas")
                      if (tracks.isNotEmpty()) parts.add("${tracks.size} tracks")
                      return if (parts.isEmpty()) "nothing importable found" else "Imported " + parts.joinToString(", ")
                  }
              }

              const val IMPORT_FOLDER = "Imported"

              /** Route by file name; returns null when the format isn't recognized. */
              fun parse(fileName: String, stream: InputStream): ImportedData? {
                  val lower = fileName.lowercase(Locale.US)
                  return when {
                      lower.endsWith(".gpx") -> parseGpx(stream)
                      lower.endsWith(".kml") -> parseKml(stream)
                      lower.endsWith(".kmz") -> parseKmz(stream)
                      else -> null
                  }
              }

              // ---------------- GPX ----------------

              fun parseGpx(stream: InputStream): ImportedData {
                  val wps = ArrayList<WaypointDraft>()
                  val tracks = ArrayList<ImportedTrack>()
                  val lines = ArrayList<ImportedLine>()

                  val parser = Xml.newPullParser()
                  parser.setInput(stream, null)

                  var wptLat = 0.0
                  var wptLon = 0.0
                  var inWpt = false
                  var name = ""
                  var trkName = ""
                  var trkPts = ArrayList<TrackPoint>()
                  var inTrk = false
                  var rteName = ""
                  var rtePts = ArrayList<GeoVertex>()
                  var inRte = false
                  var pendingTime = 0L
                  var pendingEle = 0.0
                  var textBuf = ""

                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              textBuf = ""
                              when (parser.name) {
                                  "wpt" -> {
                                      inWpt = true
                                      name = ""
                                      wptLat = parser.getAttributeValue(null, "lat")?.toDoubleOrNull() ?: Double.NaN
                                      wptLon = parser.getAttributeValue(null, "lon")?.toDoubleOrNull() ?: Double.NaN
                                  }
                                  "trk" -> {
                                      inTrk = true
                                      trkName = ""
                                      trkPts = ArrayList()
                                  }
                                  "rte" -> {
                                      inRte = true
                                      rteName = ""
                                      rtePts = ArrayList()
                                  }
                                  "trkpt" -> {
                                      val lat = parser.getAttributeValue(null, "lat")?.toDoubleOrNull()
                                      val lon = parser.getAttributeValue(null, "lon")?.toDoubleOrNull()
                                      pendingTime = 0L
                                      pendingEle = 0.0
                                      if (lat != null && lon != null && inTrk) {
                                          trkPts.add(TrackPoint(lat, lon, 0L, 0.0))
                                      }
                                  }
                                  "rtept" -> {
                                      val lat = parser.getAttributeValue(null, "lat")?.toDoubleOrNull()
                                      val lon = parser.getAttributeValue(null, "lon")?.toDoubleOrNull()
                                      if (lat != null && lon != null && inRte) {
                                          rtePts.add(GeoVertex(lat, lon))
                                      }
                                  }
                              }
                          }
                          XmlPullParser.TEXT -> textBuf += parser.text ?: ""
                          XmlPullParser.END_TAG -> {
                              when (parser.name) {
                                  "name" -> {
                                      val t = textBuf.trim()
                                      if (inWpt && name.isEmpty()) name = t
                                      else if (inTrk && trkName.isEmpty()) trkName = t
                                      else if (inRte && rteName.isEmpty()) rteName = t
                                  }
                                  "ele" -> pendingEle = textBuf.trim().toDoubleOrNull() ?: 0.0
                                  "time" -> pendingTime = parseIsoTime(textBuf.trim())
                                  "trkpt" -> {
                                      if (inTrk && trkPts.isNotEmpty()) {
                                          val last = trkPts.removeAt(trkPts.size - 1)
                                          trkPts.add(last.copy(time = pendingTime, alt = pendingEle))
                                      }
                                  }
                                  "wpt" -> {
                                      if (inWpt && !wptLat.isNaN() && !wptLon.isNaN()) {
                                          wps.add(
                                              WaypointDraft(
                                                  name = name.ifBlank { "WP ${wps.size + 1}" },
                                                  lat = wptLat,
                                                  lon = wptLon,
                                                  folder = IMPORT_FOLDER,
                                                  symbol = "flag",
                                                  affiliation = "none",
                                              )
                                          )
                                      }
                                      inWpt = false
                                  }
                                  "trk" -> {
                                      if (inTrk && trkPts.size >= 2) {
                                          tracks.add(
                                              ImportedTrack(trkName.ifBlank { "Imported track" }, trkPts)
                                          )
                                      }
                                      inTrk = false
                                  }
                                  "rte" -> {
                                      if (inRte && rtePts.size >= 2) {
                                          lines.add(
                                              ImportedLine(rteName.ifBlank { "Imported route" }, IMPORT_FOLDER, rtePts)
                                          )
                                      }
                                      inRte = false
                                  }
                              }
                          }
                      }
                      event = parser.next()
                  }
                  return ImportedData(waypoints = wps, lines = lines, tracks = tracks)
              }

              fun buildGpx(
                  waypoints: List<Waypoint>,
                  routes: List<TacGraphic>,
                  tracks: List<Pair<TrackInfo, List<TrackPoint>>>,
              ): String {
                  val sb = StringBuilder()
                  sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                  sb.append("<gpx version=\"1.1\" creator=\"GridFix\" xmlns=\"http://www.topografix.com/GPX/1/1\">\n")
                  for (w in waypoints) {
                      sb.append(
                          String.format(
                              Locale.US, "  <wpt lat=\"%.7f\" lon=\"%.7f\"><name>%s</name></wpt>\n",
                              w.lat, w.lon, escapeXml(w.name),
                          )
                      )
                  }
                  for (r in routes) {
                      sb.append("  <rte><name>").append(escapeXml(r.name)).append("</name>\n")
                      for (p in r.points) {
                          sb.append(
                              String.format(Locale.US, "    <rtept lat=\"%.7f\" lon=\"%.7f\"/>\n", p.lat, p.lon)
                          )
                      }
                      sb.append("  </rte>\n")
                  }
                  val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US)
                  sdf.timeZone = TimeZone.getTimeZone("UTC")
                  for ((info, pts) in tracks) {
                      sb.append("  <trk><name>").append(escapeXml(info.name)).append("</name><trkseg>\n")
                      for (p in pts) {
                          sb.append(
                              String.format(
                                  Locale.US,
                                  "    <trkpt lat=\"%.7f\" lon=\"%.7f\"><ele>%.1f</ele><time>%s</time></trkpt>\n",
                                  p.lat, p.lon, p.alt, sdf.format(Date(p.time)),
                              )
                          )
                      }
                      sb.append("  </trkseg></trk>\n")
                  }
                  sb.append("</gpx>\n")
                  return sb.toString()
              }

              // ---------------- KML / KMZ ----------------

              fun parseKmz(stream: InputStream): ImportedData {
                  ZipInputStream(stream).use { zip ->
                      var entry = zip.nextEntry
                      while (entry != null) {
                          if (!entry.isDirectory && entry.name.lowercase(Locale.US).endsWith(".kml")) {
                              return parseKml(zip)
                          }
                          entry = zip.nextEntry
                      }
                  }
                  return ImportedData()
              }

              fun parseKml(stream: InputStream): ImportedData {
                  val wps = ArrayList<WaypointDraft>()
                  val lines = ArrayList<ImportedLine>()
                  val areas = ArrayList<ImportedLine>()

                  val parser = Xml.newPullParser()
                  parser.setInput(stream, null)

                  val folderStack = ArrayDeque<String>()
                  var awaitingFolderName = false
                  var inPlacemark = false
                  var pmName = ""
                  var geomType = ""        // point / line / polygon
                  var coordText = ""
                  var inCoordinates = false
                  var textBuf = ""

                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              textBuf = ""
                              when (parser.name) {
                                  "Folder" -> {
                                      folderStack.addLast("")
                                      awaitingFolderName = true
                                  }
                                  "Placemark" -> {
                                      inPlacemark = true
                                      pmName = ""
                                      geomType = ""
                                      coordText = ""
                                  }
                                  "Point" -> if (inPlacemark) geomType = "point"
                                  "LineString" -> if (inPlacemark) geomType = "line"
                                  "Polygon" -> if (inPlacemark) geomType = "polygon"
                                  "coordinates" -> inCoordinates = true
                              }
                          }
                          XmlPullParser.TEXT -> textBuf += parser.text ?: ""
                          XmlPullParser.END_TAG -> {
                              when (parser.name) {
                                  "name" -> {
                                      val t = textBuf.trim()
                                      if (inPlacemark) {
                                          if (pmName.isEmpty()) pmName = t
                                      } else if (awaitingFolderName && folderStack.isNotEmpty()) {
                                          folderStack.removeLast()
                                          folderStack.addLast(t)
                                          awaitingFolderName = false
                                      }
                                  }
                                  "coordinates" -> {
                                      inCoordinates = false
                                      if (inPlacemark && coordText.isEmpty()) coordText = textBuf
                                  }
                                  "Folder" -> {
                                      if (folderStack.isNotEmpty()) folderStack.removeLast()
                                      awaitingFolderName = false
                                  }
                                  "Placemark" -> {
                                      if (inPlacemark) {
                                          val folder = folderStack.lastOrNull { it.isNotBlank() } ?: IMPORT_FOLDER
                                          val pts = parseKmlCoordinates(coordText)
                                          when {
                                              geomType == "point" && pts.isNotEmpty() -> wps.add(
                                                  WaypointDraft(
                                                      name = pmName.ifBlank { "WP ${wps.size + 1}" },
                                                      lat = pts[0].lat,
                                                      lon = pts[0].lon,
                                                      folder = folder,
                                                      symbol = "flag",
                                                      affiliation = "none",
                                                  )
                                              )
                                              geomType == "line" && pts.size >= 2 -> lines.add(
                                                  ImportedLine(pmName.ifBlank { "Imported line" }, folder, pts)
                                              )
                                              geomType == "polygon" && pts.size >= 3 -> areas.add(
                                                  ImportedLine(pmName.ifBlank { "Imported area" }, folder, pts)
                                              )
                                          }
                                      }
                                      inPlacemark = false
                                  }
                              }
                          }
                      }
                      event = parser.next()
                  }
                  return ImportedData(waypoints = wps, lines = lines, areas = areas)
              }

              /** KML coordinate lists are "lon,lat[,alt]" tuples separated by whitespace. */
              private fun parseKmlCoordinates(text: String): List<GeoVertex> =
                  text.trim().split(Regex("\\s+")).mapNotNull { tuple ->
                      val parts = tuple.split(",")
                      if (parts.size < 2) return@mapNotNull null
                      val lon = parts[0].toDoubleOrNull() ?: return@mapNotNull null
                      val lat = parts[1].toDoubleOrNull() ?: return@mapNotNull null
                      if (lat in -90.0..90.0 && lon in -180.0..180.0) GeoVertex(lat, lon) else null
                  }.let { pts ->
                      // drop the duplicated closing vertex polygons carry
                      if (pts.size >= 2 && pts.first() == pts.last()) pts.dropLast(1) else pts
                  }

              fun buildKml(
                  waypoints: List<Waypoint>,
                  graphics: List<TacGraphic>,
                  tracks: List<Pair<TrackInfo, List<TrackPoint>>>,
              ): String {
                  val sb = StringBuilder()
                  sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                  sb.append("<kml xmlns=\"http://www.opengis.net/kml/2.2\"><Document>\n")
                  sb.append("<name>GridFix export</name>\n")

                  for ((folder, list) in waypoints.groupBy { it.folder }) {
                      sb.append("<Folder><name>").append(escapeXml(folder)).append("</name>\n")
                      for (w in list) {
                          sb.append("<Placemark><name>").append(escapeXml(w.name)).append("</name>")
                          sb.append(
                              String.format(
                                  Locale.US, "<Point><coordinates>%.7f,%.7f,0</coordinates></Point>",
                                  w.lon, w.lat,
                              )
                          )
                          sb.append("</Placemark>\n")
                      }
                      sb.append("</Folder>\n")
                  }

                  if (graphics.isNotEmpty()) {
                      sb.append("<Folder><name>Graphics</name>\n")
                      for (g in graphics) {
                          val closed = GraphicTypes.isArea(g.type) && g.points.size >= 3
                          sb.append("<Placemark><name>")
                              .append(escapeXml(GraphicTypes.labelPrefix(g.type) + g.name))
                              .append("</name>")
                          val coords = StringBuilder()
                          for (p in g.points) {
                              coords.append(String.format(Locale.US, "%.7f,%.7f,0 ", p.lon, p.lat))
                          }
                          if (closed && g.points.isNotEmpty()) {
                              coords.append(
                                  String.format(Locale.US, "%.7f,%.7f,0", g.points[0].lon, g.points[0].lat)
                              )
                          }
                          if (g.points.size == 1) {
                              // Point graphics (TRP, checkpoint, text) export as placemarks
                              sb.append(
                                  String.format(
                                      Locale.US, "<Point><coordinates>%.7f,%.7f,0</coordinates></Point>",
                                      g.points[0].lon, g.points[0].lat,
                                  )
                              )
                          } else if (closed) {
                              sb.append("<Polygon><outerBoundaryIs><LinearRing><coordinates>")
                                  .append(coords.toString().trim())
                                  .append("</coordinates></LinearRing></outerBoundaryIs></Polygon>")
                          } else {
                              sb.append("<LineString><tessellate>1</tessellate><coordinates>")
                                  .append(coords.toString().trim())
                                  .append("</coordinates></LineString>")
                          }
                          sb.append("</Placemark>\n")
                      }
                      sb.append("</Folder>\n")
                  }

                  if (tracks.isNotEmpty()) {
                      sb.append("<Folder><name>Tracks</name>\n")
                      for ((info, pts) in tracks) {
                          sb.append("<Placemark><name>").append(escapeXml(info.name)).append("</name>")
                          sb.append("<LineString><tessellate>1</tessellate><coordinates>")
                          for (p in pts) {
                              sb.append(String.format(Locale.US, "%.7f,%.7f,0 ", p.lon, p.lat))
                          }
                          sb.append("</coordinates></LineString></Placemark>\n")
                      }
                      sb.append("</Folder>\n")
                  }

                  sb.append("</Document></kml>\n")
                  return sb.toString()
              }

              // ---------------- helpers ----------------

              private fun parseIsoTime(text: String): Long = runCatching {
                  val cleaned = text.replace(Regex("\\.\\d+"), "").removeSuffix("Z")
                  val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss", Locale.US)
                  sdf.timeZone = TimeZone.getTimeZone("UTC")
                  sdf.parse(cleaned)?.time ?: 0L
              }.getOrDefault(0L)

              private fun escapeXml(s: String): String = s
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace("\"", "&quot;")
          }
