          cat > 'app/src/main/java/app/gridfix/android/data/TrackRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import android.location.Location
          import androidx.datastore.core.handlers.ReplaceFileCorruptionHandler
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.flow.map
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.UUID

          private val Context.trackStore by preferencesDataStore(
              name = "tracks",
              corruptionHandler = ReplaceFileCorruptionHandler { emptyPreferences() },
          )

          /** Track metadata; the point log lives in files/tracks/<id>.txt (one point per line). */
          data class TrackInfo(
              val id: String,
              val name: String,
              val startedAt: Long,
              val endedAt: Long,        // 0 while recording
              val distanceM: Double,
              val pointCount: Int,
          )

          data class TrackPoint(val lat: Double, val lon: Double, val time: Long, val alt: Double)

          class TrackRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")

              val tracks: Flow<List<TrackInfo>> = context.trackStore.data.map { p ->
                  decode(p[listKey] ?: "[]").sortedByDescending { it.startedAt }
              }

              suspend fun startTrack(nowMillis: Long): String {
                  val id = UUID.randomUUID().toString()
                  val info = TrackInfo(
                      id = id,
                      name = "Track " + dtgShort(nowMillis),
                      startedAt = nowMillis,
                      endedAt = 0L,
                      distanceM = 0.0,
                      pointCount = 0,
                  )
                  withContext(Dispatchers.IO) { pointsFile(context, id).parentFile?.mkdirs() }
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + info)
                  }
                  return id
              }

              /** Close out a finished recording: compute stats from the point log. */
              suspend fun finishTrack(id: String, name: String?, nowMillis: Long) {
                  val pts = readPoints(context, id)
                  var dist = 0.0
                  for (i in 1 until pts.size) {
                      val out = FloatArray(1)
                      Location.distanceBetween(
                          pts[i - 1].lat, pts[i - 1].lon, pts[i].lat, pts[i].lon, out
                      )
                      dist += out[0]
                  }
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(
                                  name = name?.trim()?.ifBlank { it.name } ?: it.name,
                                  endedAt = nowMillis,
                                  distanceM = dist,
                                  pointCount = pts.size,
                              ) else it
                          }
                      )
                  }
              }

              /** Create a finished track from imported points (GPX trk import). */
              suspend fun importTrack(name: String, points: List<TrackPoint>, nowMillis: Long): String {
                  val id = UUID.randomUUID().toString()
                  withContext(Dispatchers.IO) {
                      val f = pointsFile(context, id)
                      f.parentFile?.mkdirs()
                      f.bufferedWriter().use { out ->
                          for (p in points) {
                              out.write(
                                  String.format(Locale.US, "%.7f %.7f %d %.1f\n", p.lat, p.lon, p.time, p.alt)
                              )
                          }
                      }
                  }
                  var dist = 0.0
                  for (i in 1 until points.size) {
                      val out = FloatArray(1)
                      Location.distanceBetween(
                          points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon, out
                      )
                      dist += out[0]
                  }
                  val start = points.firstOrNull()?.time?.takeIf { it > 0 } ?: nowMillis
                  val end = points.lastOrNull()?.time?.takeIf { it > 0 } ?: nowMillis
                  val info = TrackInfo(
                      id = id,
                      name = name.trim().ifBlank { "Imported track" },
                      startedAt = start,
                      endedAt = end,
                      distanceM = dist,
                      pointCount = points.size,
                  )
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + info)
                  }
                  return id
              }

              /** Restore one track from a backup, keeping its id; skipped when already present. */
              suspend fun restore(info: TrackInfo, points: List<TrackPoint>): Boolean {
                  var added = false
                  context.trackStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      if (current.none { it.id == info.id }) {
                          val f = pointsFile(context, info.id)
                          f.parentFile?.mkdirs()
                          f.writeText(
                              points.joinToString("") {
                                  String.format(Locale.US, "%.7f %.7f %d %.1f\n", it.lat, it.lon, it.time, it.alt)
                              }
                          )
                          p[listKey] = encode(current + info)
                          added = true
                      }
                  }
                  return added
              }

              suspend fun rename(id: String, name: String) {
                  if (name.isBlank()) return
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(name = name.trim()) else it
                          }
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.id == id })
                  }
                  withContext(Dispatchers.IO) { pointsFile(context, id).delete() }
              }

              /** Remove a recording that was discarded before saving. */
              suspend fun discard(id: String) = delete(id)

              /**
               * Heal recordings the OS killed mid-way: any track still open (endedAt == 0)
               * that is not the one currently recording is closed out from its point log
               * (the points are on disk — only the summary was lost), or removed when it
               * never logged a point.
               */
              suspend fun finalizeOrphans(activeId: String?) {
                  val open = decode(context.trackStore.data.first()[listKey] ?: "[]")
                      .filter { it.endedAt == 0L && it.id != activeId }
                  for (t in open) {
                      val pts = readPoints(context, t.id)
                      if (pts.isEmpty()) {
                          delete(t.id)
                      } else {
                          val last = pts.last().time
                          finishTrack(t.id, null, if (last > t.startedAt) last else System.currentTimeMillis())
                      }
                  }
              }

              // One damaged record must not take the whole list with it: skip it, keep the rest.
              private fun decode(json: String): List<TrackInfo> {
                  val arr = runCatching { JSONArray(json) }.getOrNull() ?: return emptyList()
                  return buildList {
                      for (i in 0 until arr.length()) {
                          runCatching {
                              val o = arr.getJSONObject(i)
                              TrackInfo(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  startedAt = o.optLong("startedAt"),
                                  endedAt = o.optLong("endedAt"),
                                  distanceM = o.optDouble("distanceM", 0.0),
                                  pointCount = o.optInt("pointCount", 0),
                              )
                          }.getOrNull()?.let { add(it) }
                      }
                  }
              }

              private fun encode(list: List<TrackInfo>): String {
                  val arr = JSONArray()
                  for (t in list) {
                      arr.put(
                          JSONObject()
                              .put("id", t.id)
                              .put("name", t.name)
                              .put("startedAt", t.startedAt)
                              .put("endedAt", t.endedAt)
                              .put("distanceM", t.distanceM)
                              .put("pointCount", t.pointCount)
                      )
                  }
                  return arr.toString()
              }

              companion object {
                  fun pointsFile(context: Context, id: String): File =
                      File(File(context.filesDir, "tracks"), "$id.txt")

                  /** Append one point; called from the recorder service's worker thread. */
                  fun appendPoint(context: Context, id: String, lat: Double, lon: Double, time: Long, alt: Double) {
                      runCatching {
                          val f = pointsFile(context, id)
                          f.parentFile?.mkdirs()
                          f.appendText(
                              String.format(Locale.US, "%.7f %.7f %d %.1f\n", lat, lon, time, alt)
                          )
                      }
                  }

                  suspend fun readPoints(context: Context, id: String): List<TrackPoint> =
                      withContext(Dispatchers.IO) {
                          val f = pointsFile(context, id)
                          if (!f.exists()) return@withContext emptyList()
                          f.readLines().mapNotNull { line ->
                              val parts = line.trim().split(" ")
                              if (parts.size < 3) return@mapNotNull null
                              runCatching {
                                  TrackPoint(
                                      lat = parts[0].toDouble(),
                                      lon = parts[1].toDouble(),
                                      time = parts[2].toLong(),
                                      alt = parts.getOrNull(3)?.toDouble() ?: 0.0,
                                  )
                              }.getOrNull()
                          }
                      }

                  /** Minimal GPX 1.1 document for one track. */
                  fun buildGpx(name: String, points: List<TrackPoint>): String {
                      val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US)
                      sdf.timeZone = TimeZone.getTimeZone("UTC")
                      val sb = StringBuilder()
                      sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                      sb.append("<gpx version=\"1.1\" creator=\"MGRS GPS\" xmlns=\"http://www.topografix.com/GPX/1/1\">\n")
                      sb.append("  <trk>\n    <name>").append(escapeXml(name)).append("</name>\n    <trkseg>\n")
                      for (p in points) {
                          sb.append(
                              String.format(
                                  Locale.US,
                                  "      <trkpt lat=\"%.7f\" lon=\"%.7f\"><ele>%.1f</ele><time>%s</time></trkpt>\n",
                                  p.lat, p.lon, p.alt, sdf.format(Date(p.time)),
                              )
                          )
                      }
                      sb.append("    </trkseg>\n  </trk>\n</gpx>\n")
                      return sb.toString()
                  }

                  private fun escapeXml(s: String): String = s
                      .replace("&", "&amp;")
                      .replace("<", "&lt;")
                      .replace(">", "&gt;")
                      .replace("\"", "&quot;")

                  private fun dtgShort(timeMillis: Long): String {
                      val sdf = SimpleDateFormat("ddHHmm'Z'", Locale.US)
                      sdf.timeZone = TimeZone.getTimeZone("UTC")
                      return sdf.format(Date(timeMillis))
                  }
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/WaypointRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import androidx.datastore.core.handlers.ReplaceFileCorruptionHandler
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Locale
          import java.util.UUID

          private val Context.wpStore by preferencesDataStore(
              name = "waypoints",
              corruptionHandler = ReplaceFileCorruptionHandler { emptyPreferences() },
          )

          const val DEFAULT_FOLDER = "Waypoints"
          const val DEFAULT_SYMBOL = "flag"

          data class Waypoint(
              val id: String,
              val name: String,
              val lat: Double,
              val lon: Double,
              val createdAt: Long,
              val folder: String = DEFAULT_FOLDER,
              val symbol: String = DEFAULT_SYMBOL,
              val affiliation: String = "none",
              val echelon: String = "",       // "", tm, sqd, sec, plt, co, bn, rgt, bde
              val designation: String = "",   // free-text unit designation amplifier
              val kind: String = KIND_WP,     // KIND_WP (navigation point) or KIND_UNIT (plotted unit)
              val rotation: Float = 0f,       // degrees clockwise from north; direction of fire for task symbols
          )

          const val KIND_WP = "wp"
          const val KIND_UNIT = "unit"

          /** Everything needed to create or update a waypoint. */
          data class WaypointDraft(
              val name: String,
              val lat: Double,
              val lon: Double,
              val folder: String,
              val symbol: String,
              val affiliation: String,
              val echelon: String = "",
              val designation: String = "",
              val kind: String = KIND_WP,
              val rotation: Float = 0f,
          )

          /** A waypoint folder ("overlay"): can exist empty, and can be toggled visible/hidden. */
          data class FolderInfo(val name: String, val visible: Boolean = true)

          class WaypointRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")
              private val selectedKey = stringPreferencesKey("selected")
              private val foldersKey = stringPreferencesKey("folders")

              val waypoints: Flow<List<Waypoint>> = context.wpStore.data.map { p ->
                  decode(p[listKey] ?: "[]")
              }

              val selectedId: Flow<String?> = context.wpStore.data.map { p -> p[selectedKey] }

              /** Stored folders unioned with any folder referenced by a waypoint, sorted by name. */
              val folders: Flow<List<FolderInfo>> = context.wpStore.data.map { p ->
                  val stored = decodeFolders(p[foldersKey] ?: "[]")
                  val referenced = decode(p[listKey] ?: "[]").map { it.folder }
                  val names = (stored.map { it.name } + referenced + DEFAULT_FOLDER).distinct()
                  names.map { n -> stored.firstOrNull { it.name == n } ?: FolderInfo(n) }
                      .sortedBy { it.name.lowercase(Locale.US) }
              }

              suspend fun addFolder(name: String) {
                  val clean = name.trim()
                  if (clean.isEmpty()) return
                  context.wpStore.edit { p ->
                      p[foldersKey] = encodeFolders(
                          upsertFolder(decodeFolders(p[foldersKey] ?: "[]"), clean, null)
                      )
                  }
              }

              suspend fun setFolderVisible(name: String, visible: Boolean) {
                  context.wpStore.edit { p ->
                      p[foldersKey] = encodeFolders(
                          upsertFolder(decodeFolders(p[foldersKey] ?: "[]"), name, visible)
                      )
                  }
              }

              suspend fun add(draft: WaypointDraft, nowMillis: Long): String {
                  val newId = UUID.randomUUID().toString()
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      val wp = Waypoint(
                          id = newId,
                          name = draft.name,
                          lat = draft.lat,
                          lon = draft.lon,
                          createdAt = nowMillis,
                          folder = draft.folder.ifBlank { DEFAULT_FOLDER },
                          symbol = draft.symbol.ifBlank { DEFAULT_SYMBOL },
                          affiliation = draft.affiliation,
                          echelon = draft.echelon,
                          designation = draft.designation,
                          kind = draft.kind,
                          rotation = draft.rotation,
                      )
                      p[listKey] = encode(current + wp)
                      p[foldersKey] = encodeFolders(
                          upsertFolder(decodeFolders(p[foldersKey] ?: "[]"), wp.folder, null)
                      )
                      if (p[selectedKey] == null) {
                          p[selectedKey] = wp.id
                      }
                  }
                  return newId
              }

              /** Bulk add (imports): one datastore write however many points arrive. */
              suspend fun addAll(drafts: List<WaypointDraft>, nowMillis: Long) {
                  if (drafts.isEmpty()) return
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      var folders = decodeFolders(p[foldersKey] ?: "[]")
                      val added = drafts.map { draft ->
                          folders = upsertFolder(folders, draft.folder.ifBlank { DEFAULT_FOLDER }, null)
                          Waypoint(
                              id = UUID.randomUUID().toString(),
                              name = draft.name,
                              lat = draft.lat,
                              lon = draft.lon,
                              createdAt = nowMillis,
                              folder = draft.folder.ifBlank { DEFAULT_FOLDER },
                              symbol = draft.symbol.ifBlank { DEFAULT_SYMBOL },
                              affiliation = draft.affiliation,
                              echelon = draft.echelon,
                              designation = draft.designation,
                              kind = draft.kind,
                              rotation = draft.rotation,
                          )
                      }
                      p[listKey] = encode(current + added)
                      p[foldersKey] = encodeFolders(folders)
                  }
              }

              /**
               * Merge a backup: waypoints keep their original ids and ids already on the
               * device are skipped, so restoring twice never duplicates. Folder entries
               * merge by name (existing visibility wins). Returns how many were added.
               */
              suspend fun restore(imported: List<Waypoint>, importedFolders: List<FolderInfo>): Int {
                  var added = 0
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      val ids = current.map { it.id }.toSet()
                      val fresh = imported.filter { it.id !in ids }
                      added = fresh.size
                      p[listKey] = encode(current + fresh)
                      var folders = decodeFolders(p[foldersKey] ?: "[]")
                      val names = folders.map { it.name }.toSet()
                      folders = folders + importedFolders.filter { it.name !in names }
                      for (w in fresh) folders = upsertFolder(folders, w.folder, null)
                      p[foldersKey] = encodeFolders(folders)
                  }
                  return added
              }

              suspend fun update(id: String, draft: WaypointDraft) {
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      p[listKey] = encode(
                          current.map {
                              if (it.id == id) it.copy(
                                  name = draft.name,
                                  lat = draft.lat,
                                  lon = draft.lon,
                                  folder = draft.folder.ifBlank { DEFAULT_FOLDER },
                                  symbol = draft.symbol.ifBlank { DEFAULT_SYMBOL },
                                  affiliation = draft.affiliation,
                                  echelon = draft.echelon,
                                  designation = draft.designation,
                                  kind = draft.kind,
                                  rotation = draft.rotation,
                              ) else it
                          }
                      )
                      p[foldersKey] = encodeFolders(
                          upsertFolder(
                              decodeFolders(p[foldersKey] ?: "[]"),
                              draft.folder.ifBlank { DEFAULT_FOLDER },
                              null,
                          )
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      p[listKey] = encode(current.filterNot { it.id == id })
                      if (p[selectedKey] == id) {
                          p.remove(selectedKey)
                      }
                  }
              }

              suspend fun select(id: String) {
                  context.wpStore.edit { p -> p[selectedKey] = id }
              }

              // One damaged record must not take the whole list with it: skip it, keep the rest.
              private fun decode(json: String): List<Waypoint> {
                  val arr = runCatching { JSONArray(json) }.getOrNull() ?: return emptyList()
                  return buildList {
                      for (i in 0 until arr.length()) {
                          val o = runCatching { arr.getJSONObject(i) }.getOrNull() ?: continue
                          runCatching {
                              Waypoint(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  lat = o.getDouble("lat"),
                                  lon = o.getDouble("lon"),
                                  createdAt = o.optLong("createdAt"),
                                  folder = o.optString("folder", DEFAULT_FOLDER),
                                  symbol = o.optString("symbol", DEFAULT_SYMBOL),
                                  affiliation = o.optString("affiliation", "none"),
                                  echelon = o.optString("echelon", ""),
                                  designation = o.optString("designation", ""),
                                  kind = o.optString(
                                      "kind",
                                      // migrate pre-0.5 data: NATO symbols were always units
                                      if (o.optString("symbol", "").startsWith("nato_")) KIND_UNIT else KIND_WP,
                                  ),
                                  rotation = o.optDouble("rotation", 0.0).toFloat(),
                              )
                          }.getOrNull()?.let { add(it) }
                      }
                  }
              }

              /** Add or update a folder entry; visible == null keeps the existing visibility. */
              private fun upsertFolder(list: List<FolderInfo>, name: String, visible: Boolean?): List<FolderInfo> {
                  val existing = list.firstOrNull { it.name == name }
                  return when {
                      existing == null -> list + FolderInfo(name, visible ?: true)
                      visible == null -> list
                      else -> list.map { if (it.name == name) it.copy(visible = visible) else it }
                  }
              }

              private fun decodeFolders(json: String): List<FolderInfo> = runCatching {
                  val arr = JSONArray(json)
                  buildList {
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          add(FolderInfo(o.getString("name"), o.optBoolean("visible", true)))
                      }
                  }
              }.getOrDefault(emptyList())

              private fun encodeFolders(list: List<FolderInfo>): String {
                  val arr = JSONArray()
                  for (f in list) {
                      arr.put(JSONObject().put("name", f.name).put("visible", f.visible))
                  }
                  return arr.toString()
              }

              private fun encode(list: List<Waypoint>): String {
                  val arr = JSONArray()
                  for (w in list) {
                      arr.put(
                          JSONObject()
                              .put("id", w.id)
                              .put("name", w.name)
                              .put("lat", w.lat)
                              .put("lon", w.lon)
                              .put("createdAt", w.createdAt)
                              .put("folder", w.folder)
                              .put("symbol", w.symbol)
                              .put("affiliation", w.affiliation)
                              .put("echelon", w.echelon)
                              .put("designation", w.designation)
                              .put("kind", w.kind)
                              .put("rotation", w.rotation.toDouble())
                      )
                  }
                  return arr.toString()
              }
          }
