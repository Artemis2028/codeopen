name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.9 (folders, deck fixes) delta, plain text, auditable below)
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 37
                  versionName = "0.9.9"
                  // MapTiler API key from the CI secret; empty in builds without it (community-tile fallback)
                  buildConfigField("String", "MAPTILER_KEY", "\"" + (System.getenv("MAPTILER_KEY") ?: "") + "\"")
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")

              // Transitive androidx.fragment 1.1.0 is flagged outdated by Play; pin a current one
              implementation("androidx.fragment:fragment:1.8.5")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/Backup.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.InputStream
          import java.io.OutputStream
          import java.util.Locale
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream

          /**
           * Whole-app backup as one zip: a JSON snapshot of waypoints, folders,
           * graphics, settings, and the practice log, plus each track's point file.
           * Restore is idempotent — everything keeps its original id and anything
           * already on the device is skipped, so restoring twice never duplicates.
           */
          object Backup {

              const val VERSION = 1

              suspend fun export(
                  context: Context,
                  out: OutputStream,
                  waypoints: List<Waypoint>,
                  folders: List<FolderInfo>,
                  graphics: List<TacGraphic>,
                  settings: AppSettings,
                  tracks: List<TrackInfo>,
                  courseHistory: List<CourseResult>,
                  nowMillis: Long,
              ) = withContext(Dispatchers.IO) {
                  val root = JSONObject()
                      .put("app", "GridFix")
                      .put("version", VERSION)
                      .put("exportedAt", nowMillis)
                  root.put("waypoints", JSONArray().also { a ->
                      for (w in waypoints) a.put(
                          JSONObject()
                              .put("id", w.id).put("name", w.name)
                              .put("lat", w.lat).put("lon", w.lon)
                              .put("createdAt", w.createdAt).put("folder", w.folder)
                              .put("symbol", w.symbol).put("affiliation", w.affiliation)
                              .put("echelon", w.echelon).put("designation", w.designation)
                              .put("kind", w.kind).put("rotation", w.rotation.toDouble())
                      )
                  })
                  root.put("folders", JSONArray().also { a ->
                      for (f in folders) a.put(JSONObject().put("name", f.name).put("visible", f.visible))
                  })
                  root.put("graphics", JSONArray().also { a ->
                      for (g in graphics) {
                          val pts = JSONArray()
                          for (v in g.points) pts.put(JSONArray().put(v.lat).put(v.lon))
                          a.put(
                              JSONObject()
                                  .put("id", g.id).put("name", g.name).put("type", g.type)
                                  .put("points", pts).put("folder", g.folder)
                                  .put("affiliation", g.affiliation).put("createdAt", g.createdAt)
                                  .put("echelon", g.echelon)
                          )
                      }
                  })
                  root.put("settings", JSONObject()
                      .put("nightMode", settings.nightMode)
                      .put("keepScreenOn", settings.keepScreenOn)
                      .put("mgrsDigits", settings.mgrsDigits)
                      .put("latLonFormat", settings.latLonFormat)
                      .put("units", settings.units)
                      .put("angleUnit", settings.angleUnit)
                      .put("northRef", settings.northRef)
                      .put("pacePer100m", settings.pacePer100m)
                      .put("face", settings.face)
                  )
                  root.put("tracks", JSONArray().also { a ->
                      for (t in tracks) a.put(
                          JSONObject()
                              .put("id", t.id).put("name", t.name)
                              .put("startedAt", t.startedAt).put("endedAt", t.endedAt)
                              .put("distanceM", t.distanceM).put("pointCount", t.pointCount)
                              .put("folder", t.folder)
                      )
                  })
                  root.put("courseHistory", JSONArray().also { a ->
                      for (r in courseHistory) a.put(
                          JSONObject()
                              .put("name", r.name).put("points", r.points)
                              .put("started", r.startedAt).put("total", r.totalMillis)
                              .put("splits", JSONArray(r.splitsMillis))
                      )
                  })

                  val zip = ZipOutputStream(out)
                  zip.putNextEntry(ZipEntry("gridfix-backup.json"))
                  zip.write(root.toString(2).toByteArray())
                  zip.closeEntry()
                  for (t in tracks) {
                      val pts = TrackRepository.readPoints(context, t.id)
                      if (pts.isEmpty()) continue
                      zip.putNextEntry(ZipEntry("tracks/${t.id}.txt"))
                      zip.write(
                          pts.joinToString("") {
                              String.format(Locale.US, "%.7f %.7f %d %.1f\n", it.lat, it.lon, it.time, it.alt)
                          }.toByteArray()
                      )
                      zip.closeEntry()
                  }
                  zip.finish()
              }

              data class RestoreResult(
                  val waypoints: Int,
                  val graphics: Int,
                  val tracks: Int,
                  val course: Int,
                  val settingsApplied: Boolean,
              ) {
                  fun summary(): String {
                      val parts = mutableListOf<String>()
                      if (waypoints > 0) parts.add("$waypoints waypoints")
                      if (graphics > 0) parts.add("$graphics graphics")
                      if (tracks > 0) parts.add("$tracks tracks")
                      if (course > 0) parts.add("$course course results")
                      if (settingsApplied) parts.add("settings")
                      return if (parts.isEmpty()) "Nothing new to restore — everything was already here"
                      else "Restored " + parts.joinToString(", ")
                  }
              }

              suspend fun restore(
                  input: InputStream,
                  waypointRepo: WaypointRepository,
                  graphicsRepo: GraphicsRepository,
                  trackRepo: TrackRepository,
                  settingsRepo: SettingsRepository,
                  courseRepo: CourseRepository,
              ): RestoreResult = withContext(Dispatchers.IO) {
                  val entries = HashMap<String, ByteArray>()
                  val zin = ZipInputStream(input)
                  var e: ZipEntry? = zin.nextEntry
                  while (e != null) {
                      val wanted = e.name == "gridfix-backup.json" || e.name.startsWith("tracks/")
                      if (!e.isDirectory && wanted) {
                          val out = java.io.ByteArrayOutputStream()
                          val buf = ByteArray(16 * 1024)
                          var total = 0L
                          var tooBig = false
                          while (true) {
                              val n = zin.read(buf)
                              if (n < 0) break
                              total += n
                              if (total > 64L * 1024 * 1024) { tooBig = true; break }
                              out.write(buf, 0, n)
                          }
                          if (!tooBig) entries[e.name] = out.toByteArray()
                      }
                      zin.closeEntry()
                      e = zin.nextEntry
                  }
                  val rootBytes = entries["gridfix-backup.json"]
                      ?: throw IllegalArgumentException("not an MGRS GPS backup")
                  val root = JSONObject(String(rootBytes))

                  val wps = ArrayList<Waypoint>()
                  root.optJSONArray("waypoints")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          wps.add(
                              Waypoint(
                                  id = o.getString("id"), name = o.getString("name"),
                                  lat = o.getDouble("lat"), lon = o.getDouble("lon"),
                                  createdAt = o.optLong("createdAt"),
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                                  symbol = o.optString("symbol", DEFAULT_SYMBOL),
                                  affiliation = o.optString("affiliation", "none"),
                                  echelon = o.optString("echelon", ""),
                                  designation = o.optString("designation", ""),
                                  kind = o.optString("kind", KIND_WP),
                                  rotation = o.optDouble("rotation", 0.0).toFloat(),
                              )
                          )
                      }
                  }
                  val folderInfos = ArrayList<FolderInfo>()
                  root.optJSONArray("folders")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          folderInfos.add(FolderInfo(o.getString("name"), o.optBoolean("visible", true)))
                      }
                  }
                  val addedWp = waypointRepo.restore(wps, folderInfos)

                  val gfx = ArrayList<TacGraphic>()
                  root.optJSONArray("graphics")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val ptsArr = o.getJSONArray("points")
                          val pts = ArrayList<GeoVertex>()
                          for (j in 0 until ptsArr.length()) {
                              val v = ptsArr.getJSONArray(j)
                              pts.add(GeoVertex(v.getDouble(0), v.getDouble(1)))
                          }
                          gfx.add(
                              TacGraphic(
                                  id = o.getString("id"), name = o.getString("name"),
                                  type = o.getString("type"), points = pts,
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                                  affiliation = o.optString("affiliation", "none"),
                                  createdAt = o.optLong("createdAt"),
                                  echelon = o.optString("echelon", ""),
                              )
                          )
                      }
                  }
                  val addedG = graphicsRepo.restore(gfx)

                  var addedT = 0
                  root.optJSONArray("tracks")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val info = TrackInfo(
                              id = o.getString("id"), name = o.getString("name"),
                              startedAt = o.optLong("startedAt"), endedAt = o.optLong("endedAt"),
                              distanceM = o.optDouble("distanceM", 0.0),
                              pointCount = o.optInt("pointCount", 0),
                              folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                          )
                          val ptBytes = entries["tracks/${info.id}.txt"] ?: continue
                          val pts = String(ptBytes).lines().mapNotNull { line ->
                              val parts = line.trim().split(" ")
                              if (parts.size < 3) return@mapNotNull null
                              runCatching {
                                  TrackPoint(
                                      lat = parts[0].toDouble(), lon = parts[1].toDouble(),
                                      time = parts[2].toLong(),
                                      alt = parts.getOrNull(3)?.toDouble() ?: 0.0,
                                  )
                              }.getOrNull()
                          }
                          if (trackRepo.restore(info, pts)) addedT++
                      }
                  }

                  var settingsApplied = false
                  root.optJSONObject("settings")?.let { s ->
                      settingsRepo.applyAll(
                          AppSettings(
                              nightMode = s.optBoolean("nightMode", false),
                              keepScreenOn = s.optBoolean("keepScreenOn", true),
                              mgrsDigits = s.optInt("mgrsDigits", 10),
                              latLonFormat = s.optInt("latLonFormat", 1),
                              units = s.optInt("units", 0),
                              angleUnit = s.optInt("angleUnit", 0),
                              northRef = s.optInt("northRef", 0),
                              pacePer100m = s.optInt("pacePer100m", 65),
                              face = s.optInt("face", 1),
                          )
                      )
                      settingsApplied = true
                  }

                  val results = ArrayList<CourseResult>()
                  root.optJSONArray("courseHistory")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val splits = o.getJSONArray("splits")
                          results.add(
                              CourseResult(
                                  name = o.getString("name"), points = o.getInt("points"),
                                  startedAt = o.getLong("started"), totalMillis = o.getLong("total"),
                                  splitsMillis = buildList {
                                      for (j in 0 until splits.length()) add(splits.getLong(j))
                                  },
                              )
                          )
                      }
                  }
                  val addedC = courseRepo.restoreHistory(results)

                  RestoreResult(addedWp, addedG, addedT, addedC, settingsApplied)
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/GraphicsRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import androidx.datastore.core.handlers.ReplaceFileCorruptionHandler
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.UUID

          private val Context.graphicsStore by preferencesDataStore(
              name = "graphics",
              corruptionHandler = ReplaceFileCorruptionHandler { emptyPreferences() },
          )

          /** A simple lat/lon vertex for tactical graphics. */
          data class GeoVertex(val lat: Double, val lon: Double)

          /**
           * A tactical control-measure graphic drawn on the map.
           * Types: phase_line, boundary, axis, doa, objective, aa, route.
           * Area types (objective, aa) are closed automatically when rendered.
           */
          data class TacGraphic(
              val id: String,
              val name: String,
              val type: String,
              val points: List<GeoVertex>,
              val folder: String = DEFAULT_FOLDER,
              val affiliation: String = "none",
              val createdAt: Long = 0L,
              val echelon: String = "",   // boundary lines carry the echelon mark on the line
          )

          object GraphicTypes {
              /** type key -> (label, minimum vertices, isArea) */
              val all = listOf(
                  Triple("phase_line", "Phase line", 2),
                  Triple("boundary", "Boundary", 2),
                  Triple("axis", "Axis of advance", 2),
                  Triple("doa", "Direction of attack", 2),
                  Triple("objective", "Objective", 3),
                  Triple("aa", "Assembly area", 3),
                  Triple("route", "Route", 2),
                  Triple("lz", "Landing zone", 3),
                  Triple("pz", "Pickup zone", 3),
                  Triple("bp", "Battle position", 3),
                  Triple("ea", "Engagement area", 3),
                  Triple("nai", "NAI", 3),
                  Triple("tai", "TAI", 3),
                  Triple("area", "Area (sketch)", 3),
                  Triple("screen_l", "Screen line", 2),
                  Triple("guard_l", "Guard line", 2),
                  Triple("cover_l", "Cover line", 2),
                  Triple("flot", "FLOT", 2),
                  Triple("obstacle_line", "Obstacle line", 2),
                  Triple("wire", "Wire obstacle", 2),
                  Triple("lane", "Lane", 2),
                  Triple("minefield", "Minefield", 3),
                  Triple("strongpoint", "Strongpoint", 3),
                  Triple("roadblock", "Roadblock", 1),
                  Triple("ring", "Range ring", 2),
                  Triple("sector", "Sector of fire", 3),
                  Triple("trp", "Target ref point", 1),
                  Triple("checkpoint", "Checkpoint", 1),
                  Triple("dp", "Decision point", 1),
                  Triple("text", "Text label", 1),
              )

              fun label(type: String): String = all.firstOrNull { it.first == type }?.second ?: type

              fun minPoints(type: String): Int = all.firstOrNull { it.first == type }?.third ?: 2

              fun isArea(type: String): Boolean = type in setOf(
                  "objective", "aa", "lz", "pz", "area", "bp", "ea", "nai", "tai",
                  "minefield", "strongpoint",
              )

              /** Security line graphics: letter box mid-line, arrows outward both ends. */
              fun securityLetter(type: String): String? = when (type) {
                  "screen_l" -> "S"
                  "guard_l" -> "G"
                  "cover_l" -> "C"
                  else -> null
              }

              /**
               * Types placed with a fixed number of taps finish themselves — no Done press.
               * Ring: center then range edge. Sector: apex, left limit, right limit.
               */
              fun fixedPoints(type: String): Int? = when (type) {
                  "ring" -> 2
                  "sector" -> 3
                  "trp", "checkpoint", "dp", "text", "roadblock" -> 1
                  else -> null
              }

              /** Placement hint shown when the type is picked. */
              fun placeHint(type: String): String? = when (type) {
                  "ring" -> "Tap the center, then the range edge"
                  "sector" -> "Tap the apex, then left limit, then right limit"
                  "trp", "checkpoint", "dp", "roadblock" -> "Tap the map to place it"
                  "text" -> "Tap the map where the text goes"
                  "screen_l", "guard_l", "cover_l" -> "Tap along the security line, then Done"
                  "flot" -> "Trace your forward line — the scallops face left of your drawing direction (toward the enemy)"
                  "lane" -> "Trace the cleared lane's centerline"
                  "obstacle_line", "wire" -> "Trace along the obstacle"
                  else -> null
              }

              /** Display prefix used in the on-map label, per doctrine shorthand. */
              fun labelPrefix(type: String): String = when (type) {
                  "phase_line" -> "PL "
                  "objective" -> "OBJ "
                  "aa" -> "AA "
                  "lz" -> "LZ "
                  "pz" -> "PZ "
                  "bp" -> "BP "
                  "ea" -> "EA "
                  "nai" -> "NAI "
                  "tai" -> "TAI "
                  "trp" -> "TRP "
                  "checkpoint" -> "CP "
                  "dp" -> "DP "
                  else -> ""
              }
          }

          class GraphicsRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")

              val graphics: Flow<List<TacGraphic>> = context.graphicsStore.data.map { p ->
                  decode(p[listKey] ?: "[]")
              }

              suspend fun add(
                  name: String,
                  type: String,
                  points: List<GeoVertex>,
                  folder: String,
                  affiliation: String,
                  nowMillis: Long,
                  echelon: String = "",
              ): String {
                  val g = TacGraphic(
                      id = UUID.randomUUID().toString(),
                      name = name.trim(),
                      type = type,
                      points = points,
                      folder = canonicalFolder(folder),
                      affiliation = affiliation,
                      createdAt = nowMillis,
                      echelon = echelon,
                  )
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + g)
                  }
                  return g.id
              }

              suspend fun rename(
                  id: String,
                  name: String,
                  folder: String,
                  affiliation: String,
                  echelon: String = "",
              ) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(
                                  name = name.trim(),
                                  folder = canonicalFolder(folder),
                                  affiliation = affiliation,
                                  echelon = echelon,
                              ) else it
                          }
                      )
                  }
              }

              /** Merge a backup by id — already-present graphics are skipped. Returns added count. */
              suspend fun restore(imported: List<TacGraphic>): Int {
                  var added = 0
                  context.graphicsStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      val ids = current.map { it.id }.toSet()
                      val fresh = imported.filter { it.id !in ids }
                      added = fresh.size
                      p[listKey] = encode(current + fresh)
                  }
                  return added
              }

              /** Replace a graphic's vertices — the map's edit-points mode saves through this. */
              suspend fun updatePoints(id: String, points: List<GeoVertex>) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(points = points) else it
                          }
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.id == id })
                  }
              }

              /** Remove every graphic in [folder] — "clear the sketch" in one go. */
              suspend fun deleteFolder(folder: String) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.folder == folder })
                  }
              }

              // One damaged record must not take the whole list with it: skip it, keep the rest.
              private fun decode(json: String): List<TacGraphic> {
                  val arr = runCatching { JSONArray(json) }.getOrNull() ?: return emptyList()
                  return buildList {
                      for (i in 0 until arr.length()) {
                          runCatching {
                              val o = arr.getJSONObject(i)
                              val pts = o.getJSONArray("points")
                              val vertices = buildList {
                                  for (j in 0 until pts.length()) {
                                      val v = pts.getJSONArray(j)
                                      add(GeoVertex(v.getDouble(0), v.getDouble(1)))
                                  }
                              }
                              TacGraphic(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  type = o.getString("type"),
                                  points = vertices,
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                                  affiliation = o.optString("affiliation", "none"),
                                  createdAt = o.optLong("createdAt"),
                                  echelon = o.optString("echelon", ""),
                              )
                          }.getOrNull()?.let { add(it) }
                      }
                  }
              }

              private fun encode(list: List<TacGraphic>): String {
                  val arr = JSONArray()
                  for (g in list) {
                      val pts = JSONArray()
                      for (v in g.points) {
                          pts.put(JSONArray().put(v.lat).put(v.lon))
                      }
                      arr.put(
                          JSONObject()
                              .put("id", g.id)
                              .put("name", g.name)
                              .put("type", g.type)
                              .put("points", pts)
                              .put("folder", g.folder)
                              .put("affiliation", g.affiliation)
                              .put("createdAt", g.createdAt)
                              .put("echelon", g.echelon)
                      )
                  }
                  return arr.toString()
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/TrackRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import android.location.Location
          import androidx.datastore.core.handlers.ReplaceFileCorruptionHandler
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.flow.map
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.UUID

          private val Context.trackStore by preferencesDataStore(
              name = "tracks",
              corruptionHandler = ReplaceFileCorruptionHandler { emptyPreferences() },
          )

          /** Track metadata; the point log lives in files/tracks/<id>.txt (one point per line). */
          data class TrackInfo(
              val id: String,
              val name: String,
              val startedAt: Long,
              val endedAt: Long,        // 0 while recording
              val distanceM: Double,
              val pointCount: Int,
              val folder: String = DEFAULT_FOLDER,   // overlay folder, shares the eye switch with waypoints and graphics
          )

          data class TrackPoint(val lat: Double, val lon: Double, val time: Long, val alt: Double)

          class TrackRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")

              val tracks: Flow<List<TrackInfo>> = context.trackStore.data.map { p ->
                  decode(p[listKey] ?: "[]").sortedByDescending { it.startedAt }
              }

              suspend fun startTrack(nowMillis: Long): String {
                  val id = UUID.randomUUID().toString()
                  val info = TrackInfo(
                      id = id,
                      name = "Track " + dtgShort(nowMillis),
                      startedAt = nowMillis,
                      endedAt = 0L,
                      distanceM = 0.0,
                      pointCount = 0,
                  )
                  withContext(Dispatchers.IO) { pointsFile(context, id).parentFile?.mkdirs() }
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + info)
                  }
                  return id
              }

              /** Close out a finished recording: compute stats from the point log. */
              suspend fun finishTrack(id: String, name: String?, nowMillis: Long) {
                  val pts = readPoints(context, id)
                  var dist = 0.0
                  for (i in 1 until pts.size) {
                      val out = FloatArray(1)
                      Location.distanceBetween(
                          pts[i - 1].lat, pts[i - 1].lon, pts[i].lat, pts[i].lon, out
                      )
                      dist += out[0]
                  }
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(
                                  name = name?.trim()?.ifBlank { it.name } ?: it.name,
                                  endedAt = nowMillis,
                                  distanceM = dist,
                                  pointCount = pts.size,
                              ) else it
                          }
                      )
                  }
              }

              /** Create a finished track from imported points (GPX trk import). */
              suspend fun importTrack(name: String, points: List<TrackPoint>, nowMillis: Long): String {
                  val id = UUID.randomUUID().toString()
                  withContext(Dispatchers.IO) {
                      val f = pointsFile(context, id)
                      f.parentFile?.mkdirs()
                      f.bufferedWriter().use { out ->
                          for (p in points) {
                              out.write(
                                  String.format(Locale.US, "%.7f %.7f %d %.1f\n", p.lat, p.lon, p.time, p.alt)
                              )
                          }
                      }
                  }
                  var dist = 0.0
                  for (i in 1 until points.size) {
                      val out = FloatArray(1)
                      Location.distanceBetween(
                          points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon, out
                      )
                      dist += out[0]
                  }
                  val start = points.firstOrNull()?.time?.takeIf { it > 0 } ?: nowMillis
                  val end = points.lastOrNull()?.time?.takeIf { it > 0 } ?: nowMillis
                  val info = TrackInfo(
                      id = id,
                      name = name.trim().ifBlank { "Imported track" },
                      startedAt = start,
                      endedAt = end,
                      distanceM = dist,
                      pointCount = points.size,
                  )
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + info)
                  }
                  return id
              }

              /** Restore one track from a backup, keeping its id; skipped when already present. */
              suspend fun restore(info: TrackInfo, points: List<TrackPoint>): Boolean {
                  var added = false
                  context.trackStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      if (current.none { it.id == info.id }) {
                          val f = pointsFile(context, info.id)
                          f.parentFile?.mkdirs()
                          f.writeText(
                              points.joinToString("") {
                                  String.format(Locale.US, "%.7f %.7f %d %.1f\n", it.lat, it.lon, it.time, it.alt)
                              }
                          )
                          p[listKey] = encode(current + info)
                          added = true
                      }
                  }
                  return added
              }

              suspend fun rename(id: String, name: String) {
                  if (name.isBlank()) return
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(name = name.trim()) else it
                          }
                      )
                  }
              }

              suspend fun setFolder(id: String, folder: String) {
                  val clean = canonicalFolder(folder)
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(folder = clean) else it
                          }
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.id == id })
                  }
                  withContext(Dispatchers.IO) { pointsFile(context, id).delete() }
              }

              /** Remove a recording that was discarded before saving. */
              suspend fun discard(id: String) = delete(id)

              /**
               * Heal recordings the OS killed mid-way: any track still open (endedAt == 0)
               * that is not the one currently recording is closed out from its point log
               * (the points are on disk — only the summary was lost), or removed when it
               * never logged a point.
               */
              suspend fun finalizeOrphans(activeId: String?) {
                  val open = decode(context.trackStore.data.first()[listKey] ?: "[]")
                      .filter { it.endedAt == 0L && it.id != activeId }
                  for (t in open) {
                      val pts = readPoints(context, t.id)
                      if (pts.isEmpty()) {
                          delete(t.id)
                      } else {
                          val last = pts.last().time
                          finishTrack(t.id, null, if (last > t.startedAt) last else System.currentTimeMillis())
                      }
                  }
              }

              // One damaged record must not take the whole list with it: skip it, keep the rest.
              private fun decode(json: String): List<TrackInfo> {
                  val arr = runCatching { JSONArray(json) }.getOrNull() ?: return emptyList()
                  return buildList {
                      for (i in 0 until arr.length()) {
                          runCatching {
                              val o = arr.getJSONObject(i)
                              TrackInfo(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  startedAt = o.optLong("startedAt"),
                                  endedAt = o.optLong("endedAt"),
                                  distanceM = o.optDouble("distanceM", 0.0),
                                  pointCount = o.optInt("pointCount", 0),
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                              )
                          }.getOrNull()?.let { add(it) }
                      }
                  }
              }

              private fun encode(list: List<TrackInfo>): String {
                  val arr = JSONArray()
                  for (t in list) {
                      arr.put(
                          JSONObject()
                              .put("id", t.id)
                              .put("name", t.name)
                              .put("startedAt", t.startedAt)
                              .put("endedAt", t.endedAt)
                              .put("distanceM", t.distanceM)
                              .put("pointCount", t.pointCount)
                              .put("folder", t.folder)
                      )
                  }
                  return arr.toString()
              }

              companion object {
                  fun pointsFile(context: Context, id: String): File =
                      File(File(context.filesDir, "tracks"), "$id.txt")

                  /** Append one point; called from the recorder service's worker thread. */
                  fun appendPoint(context: Context, id: String, lat: Double, lon: Double, time: Long, alt: Double) {
                      runCatching {
                          val f = pointsFile(context, id)
                          f.parentFile?.mkdirs()
                          f.appendText(
                              String.format(Locale.US, "%.7f %.7f %d %.1f\n", lat, lon, time, alt)
                          )
                      }
                  }

                  suspend fun readPoints(context: Context, id: String): List<TrackPoint> =
                      withContext(Dispatchers.IO) {
                          val f = pointsFile(context, id)
                          if (!f.exists()) return@withContext emptyList()
                          f.readLines().mapNotNull { line ->
                              val parts = line.trim().split(" ")
                              if (parts.size < 3) return@mapNotNull null
                              runCatching {
                                  TrackPoint(
                                      lat = parts[0].toDouble(),
                                      lon = parts[1].toDouble(),
                                      time = parts[2].toLong(),
                                      alt = parts.getOrNull(3)?.toDouble() ?: 0.0,
                                  )
                              }.getOrNull()
                          }
                      }

                  /** Minimal GPX 1.1 document for one track. */
                  fun buildGpx(name: String, points: List<TrackPoint>): String {
                      val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US)
                      sdf.timeZone = TimeZone.getTimeZone("UTC")
                      val sb = StringBuilder()
                      sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                      sb.append("<gpx version=\"1.1\" creator=\"MGRS GPS\" xmlns=\"http://www.topografix.com/GPX/1/1\">\n")
                      sb.append("  <trk>\n    <name>").append(escapeXml(name)).append("</name>\n    <trkseg>\n")
                      for (p in points) {
                          sb.append(
                              String.format(
                                  Locale.US,
                                  "      <trkpt lat=\"%.7f\" lon=\"%.7f\"><ele>%.1f</ele><time>%s</time></trkpt>\n",
                                  p.lat, p.lon, p.alt, sdf.format(Date(p.time)),
                              )
                          )
                      }
                      sb.append("    </trkseg>\n  </trk>\n</gpx>\n")
                      return sb.toString()
                  }

                  private fun escapeXml(s: String): String = s
                      .replace("&", "&amp;")
                      .replace("<", "&lt;")
                      .replace(">", "&gt;")
                      .replace("\"", "&quot;")

                  private fun dtgShort(timeMillis: Long): String {
                      val sdf = SimpleDateFormat("ddHHmm'Z'", Locale.US)
                      sdf.timeZone = TimeZone.getTimeZone("UTC")
                      return sdf.format(Date(timeMillis))
                  }
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/WaypointRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import androidx.datastore.core.handlers.ReplaceFileCorruptionHandler
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Locale
          import java.util.UUID

          private val Context.wpStore by preferencesDataStore(
              name = "waypoints",
              corruptionHandler = ReplaceFileCorruptionHandler { emptyPreferences() },
          )

          const val DEFAULT_FOLDER = "Base"

          /**
           * Folder names as stored. Before 0.9.9 waypoints defaulted to "Waypoints" and drawn
           * graphics to "Graphics"; both collapse into the one base folder that now holds
           * waypoints, graphics and tracks together, so one eye switch clears the map.
           */
          fun canonicalFolder(raw: String?): String = when (raw?.trim().orEmpty()) {
              "", "Waypoints", "Graphics" -> DEFAULT_FOLDER
              else -> raw!!.trim()
          }
          const val DEFAULT_SYMBOL = "flag"

          data class Waypoint(
              val id: String,
              val name: String,
              val lat: Double,
              val lon: Double,
              val createdAt: Long,
              val folder: String = DEFAULT_FOLDER,
              val symbol: String = DEFAULT_SYMBOL,
              val affiliation: String = "none",
              val echelon: String = "",       // "", tm, sqd, sec, plt, co, bn, rgt, bde
              val designation: String = "",   // free-text unit designation amplifier
              val kind: String = KIND_WP,     // KIND_WP (navigation point) or KIND_UNIT (plotted unit)
              val rotation: Float = 0f,       // degrees clockwise from north; direction of fire for task symbols
          )

          const val KIND_WP = "wp"
          const val KIND_UNIT = "unit"

          /** Everything needed to create or update a waypoint. */
          data class WaypointDraft(
              val name: String,
              val lat: Double,
              val lon: Double,
              val folder: String,
              val symbol: String,
              val affiliation: String,
              val echelon: String = "",
              val designation: String = "",
              val kind: String = KIND_WP,
              val rotation: Float = 0f,
          )

          /** A waypoint folder ("overlay"): can exist empty, and can be toggled visible/hidden. */
          data class FolderInfo(val name: String, val visible: Boolean = true)

          class WaypointRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")
              private val selectedKey = stringPreferencesKey("selected")
              private val foldersKey = stringPreferencesKey("folders")

              val waypoints: Flow<List<Waypoint>> = context.wpStore.data.map { p ->
                  decode(p[listKey] ?: "[]")
              }

              val selectedId: Flow<String?> = context.wpStore.data.map { p -> p[selectedKey] }

              /** Stored folders unioned with any folder referenced by a waypoint, sorted by name. */
              val folders: Flow<List<FolderInfo>> = context.wpStore.data.map { p ->
                  val stored = decodeFolders(p[foldersKey] ?: "[]")
                  val referenced = decode(p[listKey] ?: "[]").map { it.folder }
                  val names = (stored.map { it.name } + referenced + DEFAULT_FOLDER).distinct()
                  names.map { n -> stored.firstOrNull { it.name == n } ?: FolderInfo(n) }
                      .sortedBy { it.name.lowercase(Locale.US) }
              }

              suspend fun addFolder(name: String) {
                  val clean = canonicalFolder(name)
                  if (name.isBlank()) return
                  context.wpStore.edit { p ->
                      p[foldersKey] = encodeFolders(
                          upsertFolder(decodeFolders(p[foldersKey] ?: "[]"), clean, null)
                      )
                  }
              }

              suspend fun setFolderVisible(name: String, visible: Boolean) {
                  context.wpStore.edit { p ->
                      p[foldersKey] = encodeFolders(
                          upsertFolder(decodeFolders(p[foldersKey] ?: "[]"), name, visible)
                      )
                  }
              }

              suspend fun add(draft: WaypointDraft, nowMillis: Long): String {
                  val newId = UUID.randomUUID().toString()
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      val wp = Waypoint(
                          id = newId,
                          name = draft.name,
                          lat = draft.lat,
                          lon = draft.lon,
                          createdAt = nowMillis,
                          folder = canonicalFolder(draft.folder),
                          symbol = draft.symbol.ifBlank { DEFAULT_SYMBOL },
                          affiliation = draft.affiliation,
                          echelon = draft.echelon,
                          designation = draft.designation,
                          kind = draft.kind,
                          rotation = draft.rotation,
                      )
                      p[listKey] = encode(current + wp)
                      p[foldersKey] = encodeFolders(
                          upsertFolder(decodeFolders(p[foldersKey] ?: "[]"), wp.folder, null)
                      )
                      if (p[selectedKey] == null) {
                          p[selectedKey] = wp.id
                      }
                  }
                  return newId
              }

              /** Bulk add (imports): one datastore write however many points arrive. */
              suspend fun addAll(drafts: List<WaypointDraft>, nowMillis: Long) {
                  if (drafts.isEmpty()) return
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      var folders = decodeFolders(p[foldersKey] ?: "[]")
                      val added = drafts.map { draft ->
                          folders = upsertFolder(folders, canonicalFolder(draft.folder), null)
                          Waypoint(
                              id = UUID.randomUUID().toString(),
                              name = draft.name,
                              lat = draft.lat,
                              lon = draft.lon,
                              createdAt = nowMillis,
                              folder = canonicalFolder(draft.folder),
                              symbol = draft.symbol.ifBlank { DEFAULT_SYMBOL },
                              affiliation = draft.affiliation,
                              echelon = draft.echelon,
                              designation = draft.designation,
                              kind = draft.kind,
                              rotation = draft.rotation,
                          )
                      }
                      p[listKey] = encode(current + added)
                      p[foldersKey] = encodeFolders(folders)
                  }
              }

              /**
               * Merge a backup: waypoints keep their original ids and ids already on the
               * device are skipped, so restoring twice never duplicates. Folder entries
               * merge by name (existing visibility wins). Returns how many were added.
               */
              suspend fun restore(imported: List<Waypoint>, importedFolders: List<FolderInfo>): Int {
                  var added = 0
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      val ids = current.map { it.id }.toSet()
                      val fresh = imported.filter { it.id !in ids }
                      added = fresh.size
                      p[listKey] = encode(current + fresh)
                      var folders = decodeFolders(p[foldersKey] ?: "[]")
                      val names = folders.map { it.name }.toSet()
                      folders = folders + importedFolders.filter { it.name !in names }
                      for (w in fresh) folders = upsertFolder(folders, w.folder, null)
                      p[foldersKey] = encodeFolders(folders)
                  }
                  return added
              }

              suspend fun update(id: String, draft: WaypointDraft) {
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      p[listKey] = encode(
                          current.map {
                              if (it.id == id) it.copy(
                                  name = draft.name,
                                  lat = draft.lat,
                                  lon = draft.lon,
                                  folder = canonicalFolder(draft.folder),
                                  symbol = draft.symbol.ifBlank { DEFAULT_SYMBOL },
                                  affiliation = draft.affiliation,
                                  echelon = draft.echelon,
                                  designation = draft.designation,
                                  kind = draft.kind,
                                  rotation = draft.rotation,
                              ) else it
                          }
                      )
                      p[foldersKey] = encodeFolders(
                          upsertFolder(
                              decodeFolders(p[foldersKey] ?: "[]"),
                              canonicalFolder(draft.folder),
                              null,
                          )
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      p[listKey] = encode(current.filterNot { it.id == id })
                      if (p[selectedKey] == id) {
                          p.remove(selectedKey)
                      }
                  }
              }

              suspend fun select(id: String) {
                  context.wpStore.edit { p -> p[selectedKey] = id }
              }

              // One damaged record must not take the whole list with it: skip it, keep the rest.
              private fun decode(json: String): List<Waypoint> {
                  val arr = runCatching { JSONArray(json) }.getOrNull() ?: return emptyList()
                  return buildList {
                      for (i in 0 until arr.length()) {
                          val o = runCatching { arr.getJSONObject(i) }.getOrNull() ?: continue
                          runCatching {
                              Waypoint(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  lat = o.getDouble("lat"),
                                  lon = o.getDouble("lon"),
                                  createdAt = o.optLong("createdAt"),
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                                  symbol = o.optString("symbol", DEFAULT_SYMBOL),
                                  affiliation = o.optString("affiliation", "none"),
                                  echelon = o.optString("echelon", ""),
                                  designation = o.optString("designation", ""),
                                  kind = o.optString(
                                      "kind",
                                      // migrate pre-0.5 data: NATO symbols were always units
                                      if (o.optString("symbol", "").startsWith("nato_")) KIND_UNIT else KIND_WP,
                                  ),
                                  rotation = o.optDouble("rotation", 0.0).toFloat(),
                              )
                          }.getOrNull()?.let { add(it) }
                      }
                  }
              }

              /** Add or update a folder entry; visible == null keeps the existing visibility. */
              private fun upsertFolder(list: List<FolderInfo>, name: String, visible: Boolean?): List<FolderInfo> {
                  val existing = list.firstOrNull { it.name == name }
                  return when {
                      existing == null -> list + FolderInfo(name, visible ?: true)
                      visible == null -> list
                      else -> list.map { if (it.name == name) it.copy(visible = visible) else it }
                  }
              }

              private fun decodeFolders(json: String): List<FolderInfo> = runCatching {
                  val arr = JSONArray(json)
                  buildList<FolderInfo> {
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val name = canonicalFolder(o.getString("name"))
                          // legacy "Waypoints" + "Graphics" both map to the base folder: keep one entry
                          if (none { it.name == name }) add(FolderInfo(name, o.optBoolean("visible", true)))
                      }
                  }
              }.getOrDefault(emptyList())

              private fun encodeFolders(list: List<FolderInfo>): String {
                  val arr = JSONArray()
                  for (f in list) {
                      arr.put(JSONObject().put("name", f.name).put("visible", f.visible))
                  }
                  return arr.toString()
              }

              private fun encode(list: List<Waypoint>): String {
                  val arr = JSONArray()
                  for (w in list) {
                      arr.put(
                          JSONObject()
                              .put("id", w.id)
                              .put("name", w.name)
                              .put("lat", w.lat)
                              .put("lon", w.lon)
                              .put("createdAt", w.createdAt)
                              .put("folder", w.folder)
                              .put("symbol", w.symbol)
                              .put("affiliation", w.affiliation)
                              .put("echelon", w.echelon)
                              .put("designation", w.designation)
                              .put("kind", w.kind)
                              .put("rotation", w.rotation.toDouble())
                      )
                  }
                  return arr.toString()
              }
          }
          EOF_GRIDFIX
