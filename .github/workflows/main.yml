          package app.gridfix.android.map

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Point
          import android.graphics.Typeface
          import android.os.SystemClock
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import org.osmdroid.util.GeoPoint
          import org.osmdroid.views.Projection
          import org.osmdroid.views.overlay.Overlay
          import kotlin.math.asinh
          import kotlin.math.atan
          import kotlin.math.ceil
          import kotlin.math.cos
          import kotlin.math.floor
          import kotlin.math.hypot
          import kotlin.math.sinh
          import kotlin.math.tan

          /**
           * Contour lines generated on-device from the same Terrarium elevation tiles the
           * crosshair readout uses (marching squares over each z13 DEM tile). This gives a
           * worldwide, license-free contour layer that works over any base map — including
           * satellite — and works offline for any area whose elevation has been cached.
           *
           * Interval follows the view scale (10/20/50/100 m); every 5th line is drawn
           * heavier and labeled with its elevation. Computation runs off the UI thread and
           * results are cached per tile, so panning back over terrain is instant.
           */
          class ContourOverlay(
              private val context: Context,
              private val density: Float,
              private val scope: CoroutineScope,
              private val requestRedraw: () -> Unit,
          ) : Overlay() {

              var nightMode = false
              var mapOrientation = 0f
              var bottomInsetPx = 0f

              private class TileContours(
                  val minor: Path,
                  val major: Path,
                  val labels: List<FloatArray>,   // [x, y, elevation] in SCALE units
              )

              private val ready = object : LinkedHashMap<String, TileContours>(32, 0.75f, true) {
                  override fun removeEldestEntry(eldest: MutableMap.MutableEntry<String, TileContours>?): Boolean =
                      size > 110
              }
              private val inFlight = HashSet<String>()
              private val failedAt = HashMap<String, Long>()

              private val minorPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeJoin = Paint.Join.ROUND
              }
              private val majorPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeJoin = Paint.Join.ROUND
              }
              private val textFill = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
              }
              private val textHalo = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                  style = Paint.Style.STROKE
                  strokeWidth = 2.6f * density
              }

              private val gp = GeoPoint(0.0, 0.0)
              private val p00 = Point()
              private val p10 = Point()
              private val p01 = Point()
              private val matrix = Matrix()
              private val matrixValues = FloatArray(9)
              private val labelPt = FloatArray(2)

              @Synchronized
              private fun cached(key: String): TileContours? = ready[key]

              @Synchronized
              private fun store(key: String, tc: TileContours) {
                  ready[key] = tc
              }

              @Synchronized
              private fun shouldStart(key: String): Boolean {
                  if (key in inFlight) return false
                  val failed = failedAt[key]
                  if (failed != null && SystemClock.elapsedRealtime() - failed < 30_000L) return false
                  inFlight.add(key)
                  return true
              }

              @Synchronized
              private fun finished(key: String, ok: Boolean) {
                  inFlight.remove(key)
                  if (ok) failedAt.remove(key) else failedAt[key] = SystemClock.elapsedRealtime()
              }

              private fun tileX(lon: Double): Double = (lon + 180.0) / 360.0 * (1 shl Elevation.ZOOM)

              private fun tileY(lat: Double): Double {
                  val latRad = Math.toRadians(lat)
                  return (1.0 - asinh(tan(latRad)) / Math.PI) / 2.0 * (1 shl Elevation.ZOOM)
              }

              private fun tileLat(y: Double): Double =
                  Math.toDegrees(atan(sinh(Math.PI * (1.0 - 2.0 * y / (1 shl Elevation.ZOOM)))))

              private fun tileLon(x: Double): Double = x / (1 shl Elevation.ZOOM) * 360.0 - 180.0

              override fun draw(canvas: Canvas, projection: Projection) {
                  val bbox = projection.boundingBox
                  val latN = bbox.latNorth.coerceAtMost(84.0)
                  val latS = bbox.latSouth.coerceAtLeast(-84.0)
                  if (latN <= latS || canvas.width <= 0) return
                  val centerLat = (latN + latS) / 2.0
                  var lonSpan = bbox.lonEast - bbox.lonWest
                  if (lonSpan <= 0.0) lonSpan += 360.0
                  val mpp = lonSpan * 111319.49 * cos(Math.toRadians(centerLat)) / canvas.width
                  if (mpp > 20.0) return   // zoomed out too far — contours appear as you zoom in
                  val interval = when {
                      mpp <= 4.0 -> 10
                      mpp <= 10.0 -> 20
                      else -> 50
                  }

                  val x0 = floor(tileX(bbox.lonWest)).toInt()
                  val x1 = floor(tileX(bbox.lonEast)).toInt()
                  val y0 = floor(tileY(latN)).toInt()
                  val y1 = floor(tileY(latS)).toInt()
                  if ((x1 - x0 + 1).toLong() * (y1 - y0 + 1).toLong() > 72L) return

                  val lineColor = if (nightMode) Color.rgb(196, 45, 36) else Color.rgb(148, 94, 42)
                  minorPaint.color = lineColor
                  minorPaint.alpha = if (nightMode) 130 else 150
                  majorPaint.color = lineColor
                  majorPaint.alpha = if (nightMode) 190 else 215

                  var anyReady = false
                  for (ty in y0..y1) {
                      for (tx in x0..x1) {
                          if (ty < 0 || ty >= (1 shl Elevation.ZOOM)) continue
                          val key = "$tx/$ty/$interval"
                          val tc = cached(key)
                          if (tc == null) {
                              if (shouldStart(key)) {
                                  scope.launch(Dispatchers.Default) { compute(tx, ty, interval, key) }
                              }
                              continue
                          }
                          anyReady = true
                          drawTile(canvas, projection, tx, ty, tc)
                      }
                  }

                  if (anyReady) drawLegend(canvas, interval, lineColor)
              }

              private fun drawTile(canvas: Canvas, projection: Projection, tx: Int, ty: Int, tc: TileContours) {
                  val lonW = tileLon(tx.toDouble())
                  val lonE = tileLon(tx + 1.0)
                  val latN = tileLat(ty.toDouble())
                  val latS = tileLat(ty + 1.0)
                  gp.setCoords(latN, lonW)
                  projection.toPixels(gp, p00)
                  gp.setCoords(latN, lonE)
                  projection.toPixels(gp, p10)
                  gp.setCoords(latS, lonW)
                  projection.toPixels(gp, p01)

                  // Web-mercator screen position is linear in tile-fraction coordinates, so a
                  // single affine matrix places the whole precomputed tile path exactly.
                  matrixValues[0] = (p10.x - p00.x) / SCALE
                  matrixValues[1] = (p01.x - p00.x) / SCALE
                  matrixValues[2] = p00.x.toFloat()
                  matrixValues[3] = (p10.y - p00.y) / SCALE
                  matrixValues[4] = (p01.y - p00.y) / SCALE
                  matrixValues[5] = p00.y.toFloat()
                  matrixValues[6] = 0f
                  matrixValues[7] = 0f
                  matrixValues[8] = 1f
                  matrix.setValues(matrixValues)

                  // Stroke widths are specified in screen px; the canvas transform scales
                  // them, so pre-divide by the matrix scale to keep line weight constant.
                  val scale = hypot(matrixValues[0], matrixValues[3]).coerceAtLeast(1e-6f)
                  minorPaint.strokeWidth = 1.1f * density / scale
                  majorPaint.strokeWidth = 1.9f * density / scale

                  canvas.save()
                  canvas.concat(matrix)
                  canvas.drawPath(tc.minor, minorPaint)
                  canvas.drawPath(tc.major, majorPaint)
                  canvas.restore()

                  if (tc.labels.isNotEmpty()) {
                      val size = 10.5f * density
                      textFill.textSize = size
                      textHalo.textSize = size
                      textFill.color = majorPaint.color
                      textFill.alpha = 235
                      textHalo.color = if (nightMode) Color.BLACK else Color.WHITE
                      textHalo.alpha = 200
                      for (l in tc.labels) {
                          labelPt[0] = l[0]
                          labelPt[1] = l[1]
                          matrix.mapPoints(labelPt)
                          val text = "${l[2].toInt()}"
                          val tw = textFill.measureText(text)
                          canvas.save()
                          canvas.rotate(-mapOrientation, labelPt[0], labelPt[1])
                          canvas.drawText(text, labelPt[0] - tw / 2f, labelPt[1] + size / 3f, textHalo)
                          canvas.drawText(text, labelPt[0] - tw / 2f, labelPt[1] + size / 3f, textFill)
                          canvas.restore()
                      }
                  }
              }

              /** Small "CI 20 m" note so the interval is never a mystery; mirrors the attribution row. */
              private fun drawLegend(canvas: Canvas, interval: Int, color: Int) {
                  val size = 9.5f * density
                  textFill.textSize = size
                  textHalo.textSize = size
                  textFill.color = color
                  textFill.alpha = 220
                  textHalo.color = if (nightMode) Color.BLACK else Color.WHITE
                  textHalo.alpha = 200
                  val text = "CI $interval m"
                  val tw = textFill.measureText(text)
                  val x = canvas.width - tw - 6f * density
                  val y = canvas.height - bottomInsetPx - 5f * density
                  canvas.save()
                  if (mapOrientation != 0f) {
                      canvas.rotate(-mapOrientation, canvas.width / 2f, canvas.height / 2f)
                  }
                  canvas.drawText(text, x, y, textHalo)
                  canvas.drawText(text, x, y, textFill)
                  canvas.restore()
              }

              private suspend fun compute(tx: Int, ty: Int, interval: Int, key: String) {
                  val bmp = Elevation.tile(context, Elevation.ZOOM, tx, ty)
                  if (bmp == null) {
                      finished(key, ok = false)
                      return
                  }
                  val tc = marchingSquares(bmp, interval)
                  store(key, tc)
                  finished(key, ok = true)
                  requestRedraw()
              }

              private fun marchingSquares(bmp: Bitmap, baseInterval: Int): TileContours {
                  val n = bmp.width
                  val px = IntArray(n * n)
                  bmp.getPixels(px, 0, n, 0, 0, n, n)
                  val e = FloatArray(n * n)
                  var mn = Float.MAX_VALUE
                  var mx = -Float.MAX_VALUE
                  for (i in 0 until n * n) {
                      val c = px[i]
                      val v = ((c shr 16 and 0xFF) * 256 + (c shr 8 and 0xFF) + (c and 0xFF) / 256f) - 32768f
                      e[i] = v
                      if (v < mn) mn = v
                      if (v > mx) mx = v
                  }
                  if (mx - mn < 0.75f) return TileContours(Path(), Path(), emptyList())

                  var iv = baseInterval
                  while ((mx - mn) / iv > 90f) iv *= 2   // extreme-relief guard keeps tiles readable

                  val minor = Path()
                  val major = Path()
                  val labels = ArrayList<FloatArray>()
                  val s = SCALE / n
                  val half = 0.5f
                  val cx = n / 2f
                  val cy = n / 2f

                  var level = ceil(mn / iv).toInt() * iv
                  while (level <= mx) {
                      val lv = level.toFloat()
                      val isMajor = level % (iv * 5) == 0
                      val p = if (isMajor) major else minor
                      var bestD = Float.MAX_VALUE
                      var bestX = 0f
                      var bestY = 0f

                      fun seg(x1: Float, y1: Float, x2: Float, y2: Float) {
                          p.moveTo((x1 + half) * s, (y1 + half) * s)
                          p.lineTo((x2 + half) * s, (y2 + half) * s)
                          if (isMajor) {
                              val mxp = (x1 + x2) / 2f
                              val myp = (y1 + y2) / 2f
                              val dd = (mxp - cx) * (mxp - cx) + (myp - cy) * (myp - cy)
                              if (dd < bestD) {
                                  bestD = dd
                                  bestX = (mxp + half) * s
                                  bestY = (myp + half) * s
                              }
                          }
                      }

                      for (j in 0 until n - 1) {
                          val row = j * n
                          for (i in 0 until n - 1) {
                              val a = e[row + i]
                              val b = e[row + i + 1]
                              val c = e[row + n + i + 1]
                              val d = e[row + n + i]
                              var idx = 0
                              if (a >= lv) idx = idx or 1
                              if (b >= lv) idx = idx or 2
                              if (c >= lv) idx = idx or 4
                              if (d >= lv) idx = idx or 8
                              if (idx == 0 || idx == 15) continue

                              val fi = i.toFloat()
                              val fj = j.toFloat()
                              // Crossing points on each cell edge (pixel-index coordinates)
                              val topX = fi + frac(a, b, lv)
                              val rightY = fj + frac(b, c, lv)
                              val botX = fi + frac(d, c, lv)
                              val leftY = fj + frac(a, d, lv)

                              when (idx) {
                                  1 -> seg(fi, leftY, topX, fj)
                                  2 -> seg(topX, fj, fi + 1f, rightY)
                                  3 -> seg(fi, leftY, fi + 1f, rightY)
                                  4 -> seg(fi + 1f, rightY, botX, fj + 1f)
                                  5 -> if ((a + b + c + d) / 4f >= lv) {
                                      seg(topX, fj, fi + 1f, rightY)
                                      seg(fi, leftY, botX, fj + 1f)
                                  } else {
                                      seg(fi, leftY, topX, fj)
                                      seg(fi + 1f, rightY, botX, fj + 1f)
                                  }
                                  6 -> seg(topX, fj, botX, fj + 1f)
                                  7 -> seg(fi, leftY, botX, fj + 1f)
                                  8 -> seg(fi, leftY, botX, fj + 1f)
                                  9 -> seg(topX, fj, botX, fj + 1f)
                                  10 -> if ((a + b + c + d) / 4f >= lv) {
                                      seg(fi, leftY, topX, fj)
                                      seg(fi + 1f, rightY, botX, fj + 1f)
                                  } else {
                                      seg(topX, fj, fi + 1f, rightY)
                                      seg(fi, leftY, botX, fj + 1f)
                                  }
                                  11 -> seg(fi + 1f, rightY, botX, fj + 1f)
                                  12 -> seg(fi, leftY, fi + 1f, rightY)
                                  13 -> seg(topX, fj, fi + 1f, rightY)
                                  14 -> seg(fi, leftY, topX, fj)
                              }
                          }
                      }

                      if (isMajor && bestD < Float.MAX_VALUE) {
                          labels.add(floatArrayOf(bestX, bestY, level.toFloat()))
                      }
                      level += iv
                  }
                  return TileContours(minor, major, labels)
              }

              private fun frac(p: Float, q: Float, lv: Float): Float {
                  val d = q - p
                  if (d == 0f) return 0.5f
                  val t = (lv - p) / d
                  return if (t < 0f) 0f else if (t > 1f) 1f else t
              }

              companion object {
                  private const val SCALE = 1024f
              }

              init {
                  isEnabled = false
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/map'
          cat > 'app/src/main/java/app/gridfix/android/map/ControlMeasuresOverlay.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.map

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Point
          import android.graphics.RectF
          import android.graphics.Typeface
          import app.gridfix.android.data.GeoVertex
          import app.gridfix.android.data.GraphicTypes
          import app.gridfix.android.data.TacGraphic
          import org.osmdroid.util.GeoPoint
          import org.osmdroid.views.Projection
          import org.osmdroid.views.overlay.Overlay
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt

          /**
           * Draws tactical control-measure graphics: phase lines, boundaries, axes of advance,
           * directions of attack, objectives, assembly areas, and routes — in doctrine-style
           * presentation (MIL-STD-2525 / APP-6 line graphics, simplified for a phone screen).
           *
           * The overlay renders whatever is in [graphics] (already filtered to visible folders
           * by the caller) plus an in-progress [draftPoints] polyline while draw mode is active.
           * Colors follow the waypoint affiliation palette; night mode forces the red-on-black
           * scheme like the rest of the app.
           */
          class ControlMeasuresOverlay(private val density: Float) : Overlay() {

              var graphics: List<TacGraphic> = emptyList()
              var selectedId: String? = null
              var nightMode = false
              var lightLines = false

              // In-progress drawing (draw mode)
              var draftActive = false
              var draftType: String = "phase_line"
              var draftAffiliation: String = "none"
              var draftPoints: List<GeoVertex> = emptyList()

              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 2.6f * density
                  strokeJoin = Paint.Join.ROUND
                  strokeCap = Paint.Cap.ROUND
              }
              private val glowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 6.5f * density
                  strokeJoin = Paint.Join.ROUND
                  strokeCap = Paint.Cap.ROUND
              }
              private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }
              private val handlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }
              private val textFill = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
              }
              private val textHalo = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                  style = Paint.Style.STROKE
                  strokeWidth = 3f * density
              }
              private val dash = DashPathEffect(floatArrayOf(9f * density, 6f * density), 0f)

              private val gp = GeoPoint(0.0, 0.0)
              private val pt = Point()
              private val path = Path()
              private val xs = FloatArray(MAX_PTS)
              private val ys = FloatArray(MAX_PTS)

              override fun draw(canvas: Canvas, projection: Projection) {
                  val haloColor = if (nightMode || lightLines) Color.BLACK else Color.WHITE
                  for (g in graphics) {
                      val n = project(projection, g.points)
                      if (n == 0) continue
                      drawGraphic(
                          canvas, g.type, colorFor(g.affiliation), haloColor, n,
                          nightName(g.name, g.affiliation), g.id == selectedId, dashed = false,
                          radiusM = ringRadiusM(g.type, g.points),
                      )
                  }
                  if (draftActive && draftPoints.isNotEmpty()) {
                      val n = project(projection, draftPoints)
                      drawGraphic(
                          canvas, draftType, colorFor(draftAffiliation), haloColor, n, "",
                          selected = false, dashed = true,
                          radiusM = ringRadiusM(draftType, draftPoints),
                      )
                      // vertex handles so each placed point is visible while drawing
                      handlePaint.color = haloColor
                      for (i in 0 until n) {
                          canvas.drawCircle(xs[i], ys[i], 4.5f * density, handlePaint)
                      }
                      handlePaint.color = colorFor(draftAffiliation)
                      for (i in 0 until n) {
                          canvas.drawCircle(xs[i], ys[i], 3f * density, handlePaint)
                      }
                  }
              }

              /** Screen-space distance from (x,y) to the nearest segment of [g], in pixels. */
              fun distanceToGraphic(projection: Projection, g: TacGraphic, x: Float, y: Float): Float {
                  val n = project(projection, g.points)
                  if (n == 0) return Float.MAX_VALUE
                  if (n == 1) return hypot(x - xs[0], y - ys[0])
                  if (g.type == "ring" && n >= 2) {
                      val r = hypot(xs[1] - xs[0], ys[1] - ys[0])
                      val d = hypot(x - xs[0], y - ys[0])
                      return min(abs(d - r), d)
                  }
                  if (g.type == "sector" && n >= 3) {
                      return min(
                          segmentDistance(x, y, xs[0], ys[0], xs[1], ys[1]),
                          segmentDistance(x, y, xs[0], ys[0], xs[2], ys[2]),
                      )
                  }
                  var best = Float.MAX_VALUE
                  val closed = GraphicTypes.isArea(g.type) && n >= 3
                  val last = if (closed) n else n - 1
                  for (i in 0 until last) {
                      val j = (i + 1) % n
                      best = min(best, segmentDistance(x, y, xs[i], ys[i], xs[j], ys[j]))
                  }
                  return best
              }

              /** Geodesic radius in metres for a range ring (center + edge point), else -1. */
              private fun ringRadiusM(type: String, points: List<GeoVertex>): Double {
                  if (type != "ring" || points.size < 2) return -1.0
                  return haversineM(points[0], points[1])
              }

              private fun haversineM(a: GeoVertex, b: GeoVertex): Double {
                  val r = 6371008.8
                  val dLat = Math.toRadians(b.lat - a.lat)
                  val dLon = Math.toRadians(b.lon - a.lon)
                  val h = sin(dLat / 2) * sin(dLat / 2) +
                      cos(Math.toRadians(a.lat)) * cos(Math.toRadians(b.lat)) *
                      sin(dLon / 2) * sin(dLon / 2)
                  return 2 * r * atan2(sqrt(h), sqrt(1 - h))
              }

              /**
               * On a single-color (night) display, enemy graphics are marked "ENY" per
               * FM 1-02.2 / MIL-STD-2525 practice, since color no longer distinguishes them.
               */
              private fun nightName(name: String, affiliation: String): String =
                  if (nightMode && affiliation == "hostile") "$name ENY" else name

              private fun colorFor(affiliation: String): Int {
                  if (nightMode) {
                      // Two-tone red: hostile stays at full intensity, everything else dimmer
                      return if (affiliation == "hostile") Color.rgb(255, 59, 48) else Color.rgb(196, 45, 36)
                  }
                  return when (affiliation) {
                      "friendly" -> Color.rgb(45, 120, 200)
                      "hostile" -> Color.rgb(210, 50, 40)
                      "neutral" -> Color.rgb(60, 150, 60)
                      "unknown" -> Color.rgb(200, 170, 40)
                      else -> if (lightLines) Color.WHITE else Color.rgb(20, 22, 26)
                  }
              }

              private fun project(projection: Projection, points: List<GeoVertex>, ): Int {
                  val n = min(points.size, MAX_PTS)
                  for (i in 0 until n) {
                      gp.setCoords(points[i].lat, points[i].lon)
                      projection.toPixels(gp, pt)
                      xs[i] = pt.x.toFloat()
                      ys[i] = pt.y.toFloat()
                  }
                  return n
              }

              private fun drawGraphic(
                  canvas: Canvas,
                  type: String,
                  color: Int,
                  haloColor: Int,
                  n: Int,
                  name: String,
                  selected: Boolean,
                  dashed: Boolean,
                  radiusM: Double = -1.0,
              ) {
                  linePaint.color = color
                  linePaint.alpha = 235
                  linePaint.pathEffect = if (dashed) dash else null
                  glowPaint.color = haloColor
                  glowPaint.alpha = 120

                  when (type) {
                      "axis" -> if (n >= 2) {
                          buildAxisPath(n)
                          if (selected) canvas.drawPath(path, glowPaint)
                          canvas.drawPath(path, linePaint)
                          label(canvas, name, xs[0], ys[0], color, haloColor, above = true)
                      }
                      "doa" -> if (n >= 2) {
                          buildPolyline(n, closed = false)
                          if (selected) canvas.drawPath(path, glowPaint)
                          canvas.drawPath(path, linePaint)
                          drawSolidArrowHead(canvas, n, color)
                          label(canvas, name, xs[0], ys[0], color, haloColor, above = true)
                      }
                      "ring" -> if (n >= 2) {
                          val r = hypot(xs[1] - xs[0], ys[1] - ys[0])
                          if (selected) canvas.drawCircle(xs[0], ys[0], r, glowPaint)
                          canvas.drawCircle(xs[0], ys[0], r, linePaint)
                          // small center cross so the ring stays readable when zoomed out
                          val c = 5f * density
                          canvas.drawLine(xs[0] - c, ys[0], xs[0] + c, ys[0], linePaint)
                          canvas.drawLine(xs[0], ys[0] - c, xs[0], ys[0] + c, linePaint)
                          val rangeText = if (radiusM < 0) "" else formatRange(radiusM)
                          val text = listOf(name, rangeText).filter { it.isNotBlank() }.joinToString(" · ")
                          label(canvas, text, xs[0], ys[0] - r - 3f * density, color, haloColor, above = true, centered = true)
                      }
                      "sector" -> if (n >= 3) {
                          val r = max(
                              hypot(xs[1] - xs[0], ys[1] - ys[0]),
                              hypot(xs[2] - xs[0], ys[2] - ys[0]),
                          )
                          val aL = Math.toDegrees(atan2((ys[1] - ys[0]).toDouble(), (xs[1] - xs[0]).toDouble())).toFloat()
                          val aR = Math.toDegrees(atan2((ys[2] - ys[0]).toDouble(), (xs[2] - xs[0]).toDouble())).toFloat()
                          var sweep = aR - aL
                          while (sweep <= 0f) sweep += 360f
                          while (sweep > 360f) sweep -= 360f
                          val oval = RectF(xs[0] - r, ys[0] - r, xs[0] + r, ys[0] + r)
                          path.reset()
                          path.moveTo(xs[0], ys[0])
                          path.arcTo(oval, aL, sweep)
                          path.close()
                          fillPaint.color = color
                          fillPaint.alpha = 22
                          canvas.drawPath(path, fillPaint)
                          if (selected) canvas.drawPath(path, glowPaint)
                          canvas.drawPath(path, linePaint)
                          // label along the sector bisector, half way out
                          val mid = Math.toRadians((aL + sweep / 2f).toDouble())
                          label(
                              canvas, name,
                              xs[0] + (r * 0.55f) * cos(mid).toFloat(),
                              ys[0] + (r * 0.55f) * sin(mid).toFloat(),
                              color, haloColor, above = false, centered = true,
                          )
                      }
                      "trp" -> {
                          // Target reference point: doctrinal cross with the TRP number
                          val arm = 9f * density
                          if (selected) {
                              canvas.drawLine(xs[0] - arm, ys[0], xs[0] + arm, ys[0], glowPaint)
                              canvas.drawLine(xs[0], ys[0] - arm, xs[0], ys[0] + arm, glowPaint)
                          }
                          canvas.drawLine(xs[0] - arm, ys[0], xs[0] + arm, ys[0], linePaint)
                          canvas.drawLine(xs[0], ys[0] - arm, xs[0], ys[0] + arm, linePaint)
                          handlePaint.color = color
                          canvas.drawCircle(xs[0], ys[0], 2.2f * density, handlePaint)
                          label(canvas, GraphicTypes.labelPrefix(type) + name.uppercase(Locale.US), xs[0] + arm, ys[0] - 4f * density, color, haloColor, above = true)
                      }
                      "checkpoint" -> {
                          val r = 8f * density
                          if (selected) canvas.drawCircle(xs[0], ys[0], r, glowPaint)
                          canvas.drawCircle(xs[0], ys[0], r, linePaint)
                          handlePaint.color = color
                          canvas.drawCircle(xs[0], ys[0], 2.2f * density, handlePaint)
                          label(canvas, GraphicTypes.labelPrefix(type) + name.uppercase(Locale.US), xs[0] + r, ys[0] - r, color, haloColor, above = true)
                      }
                      "text" -> {
                          val size = 13.5f * density
                          textFill.textSize = size
                          textHalo.textSize = size
                          textFill.color = color
                          textFill.alpha = 245
                          textHalo.color = haloColor
                          textHalo.alpha = 200
                          val tw = textFill.measureText(name)
                          if (selected) {
                              fillPaint.color = haloColor
                              fillPaint.alpha = 90
                              canvas.drawRect(
                                  xs[0] - tw / 2f - 3f * density, ys[0] - size,
                                  xs[0] + tw / 2f + 3f * density, ys[0] + size * 0.45f,
                                  fillPaint,
                              )
                          }
                          canvas.drawText(name, xs[0] - tw / 2f, ys[0] + size / 3f, textHalo)
                          canvas.drawText(name, xs[0] - tw / 2f, ys[0] + size / 3f, textFill)
                      }
                      "objective", "aa", "lz", "pz", "area" -> if (n >= 2) {
                          buildPolyline(n, closed = n >= 3)
                          fillPaint.color = color
                          fillPaint.alpha = 26
                          if (n >= 3) canvas.drawPath(path, fillPaint)
                          if (selected) canvas.drawPath(path, glowPaint)
                          canvas.drawPath(path, linePaint)
                          var cx = 0f
                          var cy = 0f
                          for (i in 0 until n) {
                              cx += xs[i]; cy += ys[i]
                          }
                          label(
                              canvas,
                              GraphicTypes.labelPrefix(type) + name.uppercase(Locale.US),
                              cx / n,
                              cy / n,
                              color,
                              haloColor,
                              above = false,
                              centered = true,
                          )
                      }
                      "route" -> if (n >= 2) {
                          buildPolyline(n, closed = false)
                          if (selected) canvas.drawPath(path, glowPaint)
                          canvas.drawPath(path, linePaint)
                          handlePaint.color = color
                          for (i in 0 until n) {
                              canvas.drawCircle(xs[i], ys[i], 3f * density, handlePaint)
                          }
                          // leg numbers at each leg midpoint, matching the route card
                          for (i in 0 until n - 1) {
                              label(
                                  canvas, "${i + 1}",
                                  (xs[i] + xs[i + 1]) / 2f, (ys[i] + ys[i + 1]) / 2f,
                                  color, haloColor, above = true,
                              )
                          }
                          label(canvas, name, xs[0], ys[0], color, haloColor, above = true)
                      }
                      else -> if (n >= 2) {          // phase_line, boundary
                          buildPolyline(n, closed = false)
                          if (selected) canvas.drawPath(path, glowPaint)
                          canvas.drawPath(path, linePaint)
                          val text = GraphicTypes.labelPrefix(type) + name.uppercase(Locale.US)
                          if (type == "phase_line") {
                              label(canvas, text, xs[0], ys[0], color, haloColor, above = true)
                              label(canvas, text, xs[n - 1], ys[n - 1], color, haloColor, above = true)
                          } else {
                              val mid = n / 2
                              label(canvas, text, xs[mid], ys[mid], color, haloColor, above = true)
                          }
                      }
                  }
              }

              private fun buildPolyline(n: Int, closed: Boolean) {
                  path.reset()
                  path.moveTo(xs[0], ys[0])
                  for (i in 1 until n) path.lineTo(xs[i], ys[i])
                  if (closed) path.close()
              }

              /**
               * Doctrine-style axis-of-advance: an outlined broad arrow along the centerline,
               * open at the rear. Shaft edges are the centerline offset by ± half width with
               * miter directions at interior vertices; the head is twice the shaft width.
               */
              private fun buildAxisPath(n: Int) {
                  var total = 0f
                  for (i in 0 until n - 1) total += hypot(xs[i + 1] - xs[i], ys[i + 1] - ys[i])
                  val w = (total * 0.13f).coerceIn(14f * density, 64f * density)
                  val half = w / 2f
                  val headLen = min(w * 1.25f, total * 0.45f)

                  // Tip is the last vertex; neck sits headLen back along the centerline.
                  var remaining = headLen
                  var neckSeg = n - 2
                  var neckX = xs[n - 2]
                  var neckY = ys[n - 2]
                  for (i in n - 2 downTo 0) {
                      val segLen = hypot(xs[i + 1] - xs[i], ys[i + 1] - ys[i])
                      if (segLen >= remaining || i == 0) {
                          val t = if (segLen == 0f) 0f else (1f - remaining / segLen).coerceIn(0f, 1f)
                          neckX = xs[i] + (xs[i + 1] - xs[i]) * t
                          neckY = ys[i] + (ys[i + 1] - ys[i]) * t
                          neckSeg = i
                          break
                      }
                      remaining -= segLen
                  }

                  // Shaft vertices: rear .. neck
                  val sx = FloatArray(neckSeg + 2)
                  val sy = FloatArray(neckSeg + 2)
                  for (i in 0..neckSeg) {
                      sx[i] = xs[i]; sy[i] = ys[i]
                  }
                  sx[neckSeg + 1] = neckX
                  sy[neckSeg + 1] = neckY
                  val m = neckSeg + 2

                  val lx = FloatArray(m)
                  val ly = FloatArray(m)
                  val rx = FloatArray(m)
                  val ry = FloatArray(m)
                  for (i in 0 until m) {
                      val (nxv, nyv) = miterNormal(sx, sy, m, i)
                      lx[i] = sx[i] + nxv * half
                      ly[i] = sy[i] + nyv * half
                      rx[i] = sx[i] - nxv * half
                      ry[i] = sy[i] - nyv * half
                  }

                  val ang = atan2((ys[n - 1] - neckY).toDouble(), (xs[n - 1] - neckX).toDouble())
                  val nx = -sin(ang).toFloat()
                  val ny = cos(ang).toFloat()

                  path.reset()
                  path.moveTo(lx[0], ly[0])
                  for (i in 1 until m) path.lineTo(lx[i], ly[i])
                  path.lineTo(neckX + nx * w, neckY + ny * w)          // head left barb
                  path.lineTo(xs[n - 1], ys[n - 1])                    // tip
                  path.lineTo(neckX - nx * w, neckY - ny * w)          // head right barb
                  for (i in m - 1 downTo 0) path.lineTo(rx[i], ry[i])  // back along right edge; rear stays open
              }

              /** Unit normal at vertex [i] of the polyline, averaging adjacent segment normals. */
              private fun miterNormal(px: FloatArray, py: FloatArray, m: Int, i: Int): Pair<Float, Float> {
                  var dx = 0f
                  var dy = 0f
                  if (i > 0) {
                      dx += px[i] - px[i - 1]
                      dy += py[i] - py[i - 1]
                  }
                  if (i < m - 1) {
                      dx += px[i + 1] - px[i]
                      dy += py[i + 1] - py[i]
                  }
                  val len = hypot(dx, dy)
                  if (len == 0f) return 0f to 0f
                  return (-dy / len) to (dx / len)
              }

              private fun drawSolidArrowHead(canvas: Canvas, n: Int, color: Int) {
                  val ang = atan2((ys[n - 1] - ys[n - 2]).toDouble(), (xs[n - 1] - xs[n - 2]).toDouble())
                  val len = 11f * density
                  val spread = Math.toRadians(150.0)
                  path.reset()
                  path.moveTo(xs[n - 1], ys[n - 1])
                  path.lineTo(
                      xs[n - 1] + len * cos(ang + spread).toFloat(),
                      ys[n - 1] + len * sin(ang + spread).toFloat(),
                  )
                  path.lineTo(
                      xs[n - 1] + len * cos(ang - spread).toFloat(),
                      ys[n - 1] + len * sin(ang - spread).toFloat(),
                  )
                  path.close()
                  fillPaint.color = color
                  fillPaint.alpha = 235
                  canvas.drawPath(path, fillPaint)
              }

              private fun label(
                  canvas: Canvas,
                  text: String,
                  x: Float,
                  y: Float,
                  color: Int,
                  haloColor: Int,
                  above: Boolean,
                  centered: Boolean = false,
              ) {
                  if (text.isBlank()) return
                  val size = 11.5f * density
                  textFill.textSize = size
                  textHalo.textSize = size
                  textFill.color = color
                  textFill.alpha = 245
                  textHalo.color = haloColor
                  textHalo.alpha = 200
                  val tw = textFill.measureText(text)
                  val tx = if (centered) x - tw / 2f else x + 6f * density
                  val ty = if (above) y - 7f * density else y + size / 3f
                  canvas.drawText(text, tx, ty, textHalo)
                  canvas.drawText(text, tx, ty, textFill)
              }

              private fun formatRange(m: Double): String =
                  if (m < 995) String.format(Locale.US, "%.0f m", m)
                  else String.format(Locale.US, "%.2f km", m / 1000.0)

              private fun segmentDistance(px: Float, py: Float, ax: Float, ay: Float, bx: Float, by: Float): Float {
                  val dx = bx - ax
                  val dy = by - ay
                  val len2 = dx * dx + dy * dy
                  val t = if (len2 == 0f) 0f else ((px - ax) * dx + (py - ay) * dy) / len2
                  val tc = max(0f, min(1f, t))
                  return hypot(px - (ax + tc * dx), py - (ay + tc * dy))
              }

              companion object {
                  const val MAX_PTS = 64
              }
          }
          EOF_GRIDFIX
