                          text.toIntOrNull()?.let { n -> if (n in 30..200) onChange(n) }
                      },
                      singleLine = true,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                      suffix = { Text("paces") },
