name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.5 (MapTiler tiles) delta, plain text, auditable below)
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 33
                  versionName = "0.9.5"
                  // MapTiler API key from the CI secret; empty in builds without it (community-tile fallback)
                  buildConfigField("String", "MAPTILER_KEY", "\"" + (System.getenv("MAPTILER_KEY") ?: "") + "\"")
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")

              // Transitive androidx.fragment 1.1.0 is flagged outdated by Play; pin a current one
              implementation("androidx.fragment:fragment:1.8.5")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/map'
          cat > 'app/src/main/java/app/gridfix/android/map/MapSetup.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.map

          import android.content.Context
          import app.gridfix.android.BuildConfig
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import org.osmdroid.config.Configuration
          import org.osmdroid.tileprovider.tilesource.ITileSource
          import org.osmdroid.tileprovider.tilesource.OnlineTileSourceBase
          import org.osmdroid.tileprovider.tilesource.TileSourceFactory
          import org.osmdroid.util.MapTileIndex
          import java.io.File

          /** One selectable online base layer. */
          data class BaseLayer(
              val key: String,
              val label: String,
              val source: ITileSource,
              val attribution: String,
              /** Highest zoom worth bulk-downloading from this provider. */
              val maxDownloadZoom: Int,
              /**
               * Whether the provider's usage terms permit pre-downloading an area. Only
               * public-domain USGS does; the others allow the ordinary browse cache only.
               */
              val bulkDownload: Boolean = false,
          )

          object MapSetup {

              private var initialized = false

              /** One-time osmdroid configuration: cache location, size, and the required user agent. */
              fun init(context: Context) {
                  if (initialized) return
                  initialized = true
                  val base = File(context.filesDir, "osmdroid")
                  base.mkdirs()
                  val tiles = File(base, "tiles")
                  tiles.mkdirs()
                  Configuration.getInstance().apply {
                      osmdroidBasePath = base
                      osmdroidTileCache = tiles
                      userAgentValue = "MGRS GPS/" + BuildConfig.VERSION_NAME + " (rafaelm2002@gmail.com)"
                      tileFileSystemCacheMaxBytes = 600L * 1024 * 1024
                      tileFileSystemCacheTrimBytes = 500L * 1024 * 1024
                      // Keep serving cached tiles long after their nominal expiry — offline-first.
                      expirationExtendedDuration = 30L * 24 * 60 * 60 * 1000
                  }
              }

              private val esriWorldImagery = object : OnlineTileSourceBase(
                  "EsriWorldImagery",
                  0,
                  19,
                  256,
                  "",
                  arrayOf("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/"),
                  "Esri, Maxar, Earthstar Geographics",
              ) {
                  override fun getTileURLString(pMapTileIndex: Long): String =
                      baseUrl +
                          MapTileIndex.getZoom(pMapTileIndex) + "/" +
                          MapTileIndex.getY(pMapTileIndex) + "/" +
                          MapTileIndex.getX(pMapTileIndex)
              }

              private val usgsTopo = object : OnlineTileSourceBase(
                  "USGSTopo",
                  0,
                  16,
                  256,
                  "",
                  arrayOf("https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/"),
                  "USGS The National Map",
              ) {
                  override fun getTileURLString(pMapTileIndex: Long): String =
                      baseUrl +
                          MapTileIndex.getZoom(pMapTileIndex) + "/" +
                          MapTileIndex.getY(pMapTileIndex) + "/" +
                          MapTileIndex.getX(pMapTileIndex)
              }

              private val esriHillshade = object : OnlineTileSourceBase(
                  "EsriHillshade",
                  0,
                  16,
                  256,
                  "",
                  arrayOf("https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/"),
                  "Esri, USGS, NASA",
              ) {
                  override fun getTileURLString(pMapTileIndex: Long): String =
                      baseUrl +
                          MapTileIndex.getZoom(pMapTileIndex) + "/" +
                          MapTileIndex.getY(pMapTileIndex) + "/" +
                          MapTileIndex.getX(pMapTileIndex)
              }

              // ---- MapTiler (keyed provider; the key is injected at build time from a CI secret) ----

              private const val MT_ATTR = "© MapTiler © OpenStreetMap contributors"

              /** True on builds made with the MAPTILER_KEY secret present. */
              val hasMapTiler: Boolean get() = BuildConfig.MAPTILER_KEY.isNotBlank()

              private fun mapTilerStyle(name: String, styleId: String, maxZoom: Int) = object : OnlineTileSourceBase(
                  name,
                  0,
                  maxZoom,
                  256,
                  ".png",
                  arrayOf("https://api.maptiler.com/maps/" + styleId + "/256/"),
                  MT_ATTR,
              ) {
                  override fun getTileURLString(pMapTileIndex: Long): String =
                      baseUrl +
                          MapTileIndex.getZoom(pMapTileIndex) + "/" +
                          MapTileIndex.getX(pMapTileIndex) + "/" +
                          MapTileIndex.getY(pMapTileIndex) + ".png?key=" + BuildConfig.MAPTILER_KEY
              }

              private val mapTilerStreets by lazy { mapTilerStyle("MapTilerStreets", "streets-v2", 20) }
              private val mapTilerTopo by lazy { mapTilerStyle("MapTilerTopo", "topo-v2", 20) }

              private val mapTilerSatellite = object : OnlineTileSourceBase(
                  "MapTilerSatellite",
                  0,
                  20,
                  256,
                  ".jpg",
                  arrayOf("https://api.maptiler.com/tiles/satellite-v2/"),
                  "© MapTiler",
              ) {
                  override fun getTileURLString(pMapTileIndex: Long): String =
                      baseUrl +
                          MapTileIndex.getZoom(pMapTileIndex) + "/" +
                          MapTileIndex.getX(pMapTileIndex) + "/" +
                          MapTileIndex.getY(pMapTileIndex) + ".jpg?key=" + BuildConfig.MAPTILER_KEY
              }

              /**
               * Base layers. With a MapTiler key (every store build) the Streets, Topo and
               * Satellite layers come from MapTiler under its commercial terms; without one
               * (a developer build missing the secret) the app falls back to the public
               * community servers so the map still works.
               */
              val baseLayers: List<BaseLayer> = if (hasMapTiler) listOf(
                  BaseLayer(
                      key = "streets",
                      label = "Streets",
                      source = mapTilerStreets,
                      attribution = MT_ATTR,
                      maxDownloadZoom = 16,
                  ),
                  BaseLayer(
                      key = "topo",
                      label = "Topographic",
                      source = mapTilerTopo,
                      attribution = MT_ATTR,
                      maxDownloadZoom = 15,
                  ),
                  BaseLayer(
                      key = "sat",
                      label = "Satellite",
                      source = mapTilerSatellite,
                      attribution = "© MapTiler",
                      maxDownloadZoom = 17,
                  ),
                  BaseLayer(
                      key = "usgs",
                      label = "USGS Topo (US only)",
                      source = usgsTopo,
                      attribution = "USGS The National Map",
                      maxDownloadZoom = 15,
                      bulkDownload = true,
                  ),
                  BaseLayer(
                      key = "hillshade",
                      label = "Hillshade",
                      source = esriHillshade,
                      attribution = "Esri, USGS, NASA",
                      maxDownloadZoom = 14,
                  ),
              ) else listOf(
                  BaseLayer(
                      key = "streets",
                      label = "Streets",
                      source = TileSourceFactory.MAPNIK,
                      attribution = "© OpenStreetMap contributors",
                      maxDownloadZoom = 16,
                  ),
                  BaseLayer(
                      key = "topo",
                      label = "Topographic",
                      source = TileSourceFactory.OpenTopo,
                      attribution = "© OpenStreetMap contributors, SRTM — style © OpenTopoMap (CC-BY-SA)",
                      maxDownloadZoom = 15,
                  ),
                  BaseLayer(
                      key = "sat",
                      label = "Satellite",
                      source = esriWorldImagery,
                      attribution = "Esri, Maxar, Earthstar Geographics",
                      maxDownloadZoom = 17,
                  ),
                  BaseLayer(
                      key = "usgs",
                      label = "USGS Topo (US only)",
                      source = usgsTopo,
                      attribution = "USGS The National Map",
                      maxDownloadZoom = 15,
                      bulkDownload = true,
                  ),
                  BaseLayer(
                      key = "hillshade",
                      label = "Hillshade",
                      source = esriHillshade,
                      attribution = "Esri, USGS, NASA",
                      maxDownloadZoom = 14,
                  ),
              )

              fun layerFor(key: String): BaseLayer = baseLayers.firstOrNull { it.key == key } ?: baseLayers[1]

              /** Folder where imported MBTiles files live. */
              fun mbtilesDir(context: Context): File =
                  File(context.filesDir, "mbtiles").apply { mkdirs() }

              /** The hillshade tile source, reused by the hybrid shadow overlay. */
              val hillshadeSource: ITileSource get() = esriHillshade

              /**
               * Hybrid-terrain blend: hillshade tiles become shadow-only — white turns
               * transparent, dark slopes darken whatever base layer sits beneath.
               */
              val hillshadeShadowFilter = ColorMatrixColorFilter(
                  ColorMatrix(
                      floatArrayOf(
                          0f, 0f, 0f, 0f, 0f,
                          0f, 0f, 0f, 0f, 0f,
                          0f, 0f, 0f, 0f, 0f,
                          -0.235f, -0.235f, -0.235f, 0f, 180f,
                      )
                  )
              )

              /**
               * Night-vision tile filter: collapses the basemap to shades of red on black,
               * matching the app's red-on-black night theme.
               */
              val nightTileFilter = ColorMatrixColorFilter(
                  ColorMatrix(
                      floatArrayOf(
                          0.42f, 0.34f, 0.14f, 0f, 0f,
                          0f, 0f, 0f, 0f, 0f,
                          0f, 0f, 0f, 0f, 0f,
                          0f, 0f, 0f, 1f, 0f,
                      )
                  )
              )
          }
          EOF_GRIDFIX
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Sync v0.9.5 (MapTiler tiles) source from bootstrap workflow'
            git push origin HEAD:main
          fi

      - name: Materialize symbol tree from icon pack
        run: |
          if [ ! -f 'Nato Icons.zip' ]; then
            echo 'ERROR: Nato Icons.zip is not in the repo root.'
            echo 'Upload it once on GitHub: Add file -> Upload files -> drop the zip -> Commit.'
            exit 1
          fi
          python3 - <<'PYEOF'
          import sys, zipfile, pathlib
          dirs = {"f": ("Friend Land", "1"), "h": ("Hostile Land", "3"),
                  "n": ("Neutral Land", "2"), "u": ("Unknown Land", "0")}
          out = pathlib.Path("app/src/main/res/drawable-nodpi")
          z = zipfile.ZipFile("Nato Icons.zip")
          names = set(z.namelist())
          rows = []
          for line in open("app/symbol-manifest.tsv"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              key, dim, func = line.split("\t")
              rows.append((key, dim, func))
          missing = []
          count = 0
          for key, dim, func in rows:
              for aff, (d, p) in dirs.items():
                  entry = d + "/" + p + "." + ("s" + aff + dim + "p" + func).ljust(15, "-") + ".png"
                  if entry not in names:
                      missing.append(entry)
                      continue
                  (out / ("nato_" + aff + "_" + key + ".png")).write_bytes(z.read(entry))
                  count += 1
          if missing:
              print("MISSING ICONS:", missing)
              sys.exit(1)
          print("materialized", count, "symbol PNGs from the icon pack")
          PYEOF

      - name: Guard NATO symbol assets
        run: |
          COUNT=$(ls app/src/main/res/drawable-nodpi 2>/dev/null | grep -c '^nato_' || true)
          if [ "$COUNT" -lt 112 ]; then
            echo "ERROR: expected 112 curated NATO symbol PNGs in the repo, found $COUNT."
            echo "52 committed by the v0.2.2 bootstrap + 60 by the v0.7.8 doctrine pack; do not delete them."
            exit 1
          fi
          echo "$COUNT NATO symbols present"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        id: gradle
        continue-on-error: true
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build signed release AAB for Play (needs keystore secrets)
        id: aab
        if: steps.gradle.outcome == 'success'
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GRIDFIX_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_B64 secret set - skipping release AAB"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/gridfix-upload.p12
          export GRIDFIX_KS=/tmp/gridfix-upload.p12
          set -o pipefail
          gradle bundleRelease --no-daemon 2>&1 | tail -n 80
          cp app/build/outputs/bundle/release/app-release.aab gridfix-release.aab
          echo "signed release AAB ready: gridfix-release.aab"

      - name: Publish build status branch
        if: always()
        env:
          OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          mkdir -p /tmp/ci-status
          cd /tmp/ci-status
          git init -q -b ci-status
          {
            echo "outcome=$OUTCOME"
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > outcome.txt
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > buildlog.txt 2>/dev/null || echo "no log" > buildlog.txt
          if [ "$OUTCOME" = "success" ]; then
            cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" gridfix-debug.apk
          fi
          git add -A
          git -c user.email='ci@gridfix.local' -c user.name='GridFix CI' commit -qm "build ${{ github.run_number }}: $OUTCOME"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-status

      - name: Upload APK artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gridfix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest release for phone install
        if: steps.gradle.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gridfix-debug.apk
          EXTRA=""
          if [ -f gridfix-release.aab ]; then EXTRA="gridfix-release.aab"; fi
          gh release delete latest --yes || true
          git push --delete origin refs/tags/latest || true
          gh release create latest gridfix-debug.apk $EXTRA \
            --title "MGRS GPS build ${{ github.run_number }}" \
            --notes 'Phone install: tap gridfix-debug.apk below, allow the install, open MGRS GPS. gridfix-release.aab (when present) is the signed bundle to upload to Play Console - do not install it on a phone.'

      - name: Fail the job if the build failed
        if: steps.gradle.outcome != 'success'
        run: exit 1
