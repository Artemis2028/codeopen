name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.2 (MGRS GPS rename) delta, plain text, auditable below)
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 30
                  versionName = "0.9.2"
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/Backup.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.InputStream
          import java.io.OutputStream
          import java.util.Locale
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream

          /**
           * Whole-app backup as one zip: a JSON snapshot of waypoints, folders,
           * graphics, settings, and the practice log, plus each track's point file.
           * Restore is idempotent — everything keeps its original id and anything
           * already on the device is skipped, so restoring twice never duplicates.
           */
          object Backup {

              const val VERSION = 1

              suspend fun export(
                  context: Context,
                  out: OutputStream,
                  waypoints: List<Waypoint>,
                  folders: List<FolderInfo>,
                  graphics: List<TacGraphic>,
                  settings: AppSettings,
                  tracks: List<TrackInfo>,
                  courseHistory: List<CourseResult>,
                  nowMillis: Long,
              ) = withContext(Dispatchers.IO) {
                  val root = JSONObject()
                      .put("app", "GridFix")
                      .put("version", VERSION)
                      .put("exportedAt", nowMillis)
                  root.put("waypoints", JSONArray().also { a ->
                      for (w in waypoints) a.put(
                          JSONObject()
                              .put("id", w.id).put("name", w.name)
                              .put("lat", w.lat).put("lon", w.lon)
                              .put("createdAt", w.createdAt).put("folder", w.folder)
                              .put("symbol", w.symbol).put("affiliation", w.affiliation)
                              .put("echelon", w.echelon).put("designation", w.designation)
                              .put("kind", w.kind).put("rotation", w.rotation.toDouble())
                      )
                  })
                  root.put("folders", JSONArray().also { a ->
                      for (f in folders) a.put(JSONObject().put("name", f.name).put("visible", f.visible))
                  })
                  root.put("graphics", JSONArray().also { a ->
                      for (g in graphics) {
                          val pts = JSONArray()
                          for (v in g.points) pts.put(JSONArray().put(v.lat).put(v.lon))
                          a.put(
                              JSONObject()
                                  .put("id", g.id).put("name", g.name).put("type", g.type)
                                  .put("points", pts).put("folder", g.folder)
                                  .put("affiliation", g.affiliation).put("createdAt", g.createdAt)
                                  .put("echelon", g.echelon)
                          )
                      }
                  })
                  root.put("settings", JSONObject()
                      .put("nightMode", settings.nightMode)
                      .put("keepScreenOn", settings.keepScreenOn)
                      .put("mgrsDigits", settings.mgrsDigits)
                      .put("latLonFormat", settings.latLonFormat)
                      .put("units", settings.units)
                      .put("angleUnit", settings.angleUnit)
                      .put("northRef", settings.northRef)
                      .put("pacePer100m", settings.pacePer100m)
                  )
                  root.put("tracks", JSONArray().also { a ->
                      for (t in tracks) a.put(
                          JSONObject()
                              .put("id", t.id).put("name", t.name)
                              .put("startedAt", t.startedAt).put("endedAt", t.endedAt)
                              .put("distanceM", t.distanceM).put("pointCount", t.pointCount)
                      )
                  })
                  root.put("courseHistory", JSONArray().also { a ->
                      for (r in courseHistory) a.put(
                          JSONObject()
                              .put("name", r.name).put("points", r.points)
                              .put("started", r.startedAt).put("total", r.totalMillis)
                              .put("splits", JSONArray(r.splitsMillis))
                      )
                  })

                  val zip = ZipOutputStream(out)
                  zip.putNextEntry(ZipEntry("gridfix-backup.json"))
                  zip.write(root.toString(2).toByteArray())
                  zip.closeEntry()
                  for (t in tracks) {
                      val pts = TrackRepository.readPoints(context, t.id)
                      if (pts.isEmpty()) continue
                      zip.putNextEntry(ZipEntry("tracks/${t.id}.txt"))
                      zip.write(
                          pts.joinToString("") {
                              String.format(Locale.US, "%.7f %.7f %d %.1f\n", it.lat, it.lon, it.time, it.alt)
                          }.toByteArray()
                      )
                      zip.closeEntry()
                  }
                  zip.finish()
              }

              data class RestoreResult(
                  val waypoints: Int,
                  val graphics: Int,
                  val tracks: Int,
                  val course: Int,
                  val settingsApplied: Boolean,
              ) {
                  fun summary(): String {
                      val parts = mutableListOf<String>()
                      if (waypoints > 0) parts.add("$waypoints waypoints")
                      if (graphics > 0) parts.add("$graphics graphics")
                      if (tracks > 0) parts.add("$tracks tracks")
                      if (course > 0) parts.add("$course course results")
                      if (settingsApplied) parts.add("settings")
                      return if (parts.isEmpty()) "Nothing new to restore — everything was already here"
                      else "Restored " + parts.joinToString(", ")
                  }
              }

              suspend fun restore(
                  input: InputStream,
                  waypointRepo: WaypointRepository,
                  graphicsRepo: GraphicsRepository,
                  trackRepo: TrackRepository,
                  settingsRepo: SettingsRepository,
                  courseRepo: CourseRepository,
              ): RestoreResult = withContext(Dispatchers.IO) {
                  val entries = HashMap<String, ByteArray>()
                  val zin = ZipInputStream(input)
                  var e: ZipEntry? = zin.nextEntry
                  while (e != null) {
                      if (!e.isDirectory) entries[e.name] = zin.readBytes()
                      zin.closeEntry()
                      e = zin.nextEntry
                  }
                  val rootBytes = entries["gridfix-backup.json"]
                      ?: throw IllegalArgumentException("not an MGRS GPS backup")
                  val root = JSONObject(String(rootBytes))

                  val wps = ArrayList<Waypoint>()
                  root.optJSONArray("waypoints")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          wps.add(
                              Waypoint(
                                  id = o.getString("id"), name = o.getString("name"),
                                  lat = o.getDouble("lat"), lon = o.getDouble("lon"),
                                  createdAt = o.optLong("createdAt"),
                                  folder = o.optString("folder", DEFAULT_FOLDER),
                                  symbol = o.optString("symbol", DEFAULT_SYMBOL),
                                  affiliation = o.optString("affiliation", "none"),
                                  echelon = o.optString("echelon", ""),
                                  designation = o.optString("designation", ""),
                                  kind = o.optString("kind", KIND_WP),
                                  rotation = o.optDouble("rotation", 0.0).toFloat(),
                              )
                          )
                      }
                  }
                  val folderInfos = ArrayList<FolderInfo>()
                  root.optJSONArray("folders")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          folderInfos.add(FolderInfo(o.getString("name"), o.optBoolean("visible", true)))
                      }
                  }
                  val addedWp = waypointRepo.restore(wps, folderInfos)

                  val gfx = ArrayList<TacGraphic>()
                  root.optJSONArray("graphics")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val ptsArr = o.getJSONArray("points")
                          val pts = ArrayList<GeoVertex>()
                          for (j in 0 until ptsArr.length()) {
                              val v = ptsArr.getJSONArray(j)
                              pts.add(GeoVertex(v.getDouble(0), v.getDouble(1)))
                          }
                          gfx.add(
                              TacGraphic(
                                  id = o.getString("id"), name = o.getString("name"),
                                  type = o.getString("type"), points = pts,
                                  folder = o.optString("folder", DEFAULT_FOLDER),
                                  affiliation = o.optString("affiliation", "none"),
                                  createdAt = o.optLong("createdAt"),
                                  echelon = o.optString("echelon", ""),
                              )
                          )
                      }
                  }
                  val addedG = graphicsRepo.restore(gfx)

                  var addedT = 0
                  root.optJSONArray("tracks")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val info = TrackInfo(
                              id = o.getString("id"), name = o.getString("name"),
                              startedAt = o.optLong("startedAt"), endedAt = o.optLong("endedAt"),
                              distanceM = o.optDouble("distanceM", 0.0),
                              pointCount = o.optInt("pointCount", 0),
                          )
                          val ptBytes = entries["tracks/${info.id}.txt"] ?: continue
                          val pts = String(ptBytes).lines().mapNotNull { line ->
                              val parts = line.trim().split(" ")
                              if (parts.size < 3) return@mapNotNull null
                              runCatching {
                                  TrackPoint(
                                      lat = parts[0].toDouble(), lon = parts[1].toDouble(),
                                      time = parts[2].toLong(),
                                      alt = parts.getOrNull(3)?.toDouble() ?: 0.0,
                                  )
                              }.getOrNull()
                          }
                          if (trackRepo.restore(info, pts)) addedT++
                      }
                  }

                  var settingsApplied = false
                  root.optJSONObject("settings")?.let { s ->
                      settingsRepo.applyAll(
                          AppSettings(
                              nightMode = s.optBoolean("nightMode", false),
                              keepScreenOn = s.optBoolean("keepScreenOn", true),
                              mgrsDigits = s.optInt("mgrsDigits", 10),
                              latLonFormat = s.optInt("latLonFormat", 1),
                              units = s.optInt("units", 0),
                              angleUnit = s.optInt("angleUnit", 0),
                              northRef = s.optInt("northRef", 0),
                              pacePer100m = s.optInt("pacePer100m", 65),
                          )
                      )
                      settingsApplied = true
                  }

                  val results = ArrayList<CourseResult>()
                  root.optJSONArray("courseHistory")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val splits = o.getJSONArray("splits")
                          results.add(
                              CourseResult(
                                  name = o.getString("name"), points = o.getInt("points"),
                                  startedAt = o.getLong("started"), totalMillis = o.getLong("total"),
                                  splitsMillis = buildList {
                                      for (j in 0 until splits.length()) add(splits.getLong(j))
                                  },
                              )
                          )
                      }
                  }
                  val addedC = courseRepo.restoreHistory(results)

                  RestoreResult(addedWp, addedG, addedT, addedC, settingsApplied)
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/DataPackage.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.util.Xml
          import org.xmlpull.v1.XmlPullParser
          import java.io.ByteArrayInputStream
          import java.io.ByteArrayOutputStream
          import java.io.InputStream
          import java.io.OutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream

          /**
           * ATAK mission data packages (tier 1-2 interop): a zip carrying a
           * MissionPackageManifest plus content files. Import reads Cursor-on-Target
           * (.cot) point events into waypoints (affiliation from the CoT type) and
           * hands any bundled GPX/KML/KMZ to the normal importers. Export writes one
           * CoT event per waypoint, routes as a GPX entry, and the manifest — a
           * package ATAK ingests directly.
           */
          object DataPackage {

              // ---------------- Import ----------------

              fun parse(stream: InputStream): InterchangeFiles.ImportedData {
                  val wps = ArrayList<WaypointDraft>()
                  var lines = listOf<InterchangeFiles.ImportedLine>()
                  var areas = listOf<InterchangeFiles.ImportedLine>()
                  var tracks = listOf<InterchangeFiles.ImportedTrack>()

                  val zin = ZipInputStream(stream)
                  var entry: ZipEntry? = zin.nextEntry
                  while (entry != null) {
                      val name = entry.name
                      val lower = name.lowercase(Locale.US)
                      if (!entry.isDirectory) {
                          val bytes = zin.readBytes()
                          when {
                              lower.endsWith(".cot") ->
                                  parseCot(ByteArrayInputStream(bytes))?.let { wps.add(it) }
                              lower.endsWith(".gpx") || lower.endsWith(".kml") || lower.endsWith(".kmz") -> {
                                  InterchangeFiles.parse(name, ByteArrayInputStream(bytes))?.let { d ->
                                      wps.addAll(d.waypoints)
                                      lines = lines + d.lines
                                      areas = areas + d.areas
                                      tracks = tracks + d.tracks
                                  }
                              }
                          }
                      }
                      zin.closeEntry()
                      entry = zin.nextEntry
                  }
                  return InterchangeFiles.ImportedData(
                      waypoints = wps,
                      lines = lines,
                      areas = areas,
                      tracks = tracks,
                  )
              }

              /** One CoT event file -> a waypoint draft (null when it has no position). */
              private fun parseCot(stream: InputStream): WaypointDraft? = runCatching {
                  val parser = Xml.newPullParser()
                  parser.setInput(stream, null)
                  var lat: Double? = null
                  var lon: Double? = null
                  var type = ""
                  var callsign = ""
                  var uid = ""
                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      if (event == XmlPullParser.START_TAG) {
                          when (parser.name) {
                              "event" -> {
                                  type = parser.getAttributeValue(null, "type") ?: ""
                                  uid = parser.getAttributeValue(null, "uid") ?: ""
                              }
                              "point" -> {
                                  lat = parser.getAttributeValue(null, "lat")?.toDoubleOrNull()
                                  lon = parser.getAttributeValue(null, "lon")?.toDoubleOrNull()
                              }
                              "contact" -> {
                                  callsign = parser.getAttributeValue(null, "callsign") ?: callsign
                              }
                          }
                      }
                      event = parser.next()
                  }
                  val la = lat ?: return null
                  val lo = lon ?: return null
                  if (la == 0.0 && lo == 0.0) return null
                  WaypointDraft(
                      name = callsign.ifBlank { uid.ifBlank { "ATAK point" } }.take(30),
                      lat = la,
                      lon = lo,
                      folder = InterchangeFiles.IMPORT_FOLDER,
                      symbol = "target",
                      affiliation = affiliationFromCotType(type),
                  )
              }.getOrNull()

              /** CoT type "a-f-G-U-C" -> affiliation from the second field. */
              private fun affiliationFromCotType(type: String): String {
                  val parts = type.split("-")
                  if (parts.size < 2 || parts[0] != "a") return "none"
                  return when (parts[1].lowercase(Locale.US)) {
                      "f", "a" -> "friendly"    // friend / assumed friend
                      "h", "j", "k" -> "hostile" // hostile / joker / faker
                      "n" -> "neutral"
                      "u", "p", "s" -> "unknown" // unknown / pending / suspect
                      else -> "none"
                  }
              }

              // ---------------- Export ----------------

              private fun cotType(affiliation: String): String = when (affiliation) {
                  "friendly" -> "a-f-G"
                  "hostile" -> "a-h-G"
                  "neutral" -> "a-n-G"
                  else -> "a-u-G"
              }

              private fun esc(s: String): String = s
                  .replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;")

              /**
               * Write a complete mission package. Waypoints become individual CoT
               * events; routes ride along as one GPX entry ATAK can also read.
               */
              fun build(
                  out: OutputStream,
                  waypoints: List<Waypoint>,
                  routes: List<TacGraphic>,
                  nowMillis: Long,
              ) {
                  val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US)
                  sdf.timeZone = TimeZone.getTimeZone("UTC")
                  val time = sdf.format(Date(nowMillis))
                  val stale = sdf.format(Date(nowMillis + 365L * 24 * 3600 * 1000))
                  val pkgUid = "gridfix-$nowMillis"

                  val zip = ZipOutputStream(out)
                  val entries = ArrayList<String>()

                  waypoints.forEachIndexed { i, w ->
                      val entryName = "cot/gridfix-$i.cot"
                      entries.add(entryName)
                      val uid = "GRIDFIX-${w.id.take(12)}-$i"
                      val cot = buildString {
                          append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                          append("<event version=\"2.0\" uid=\"").append(esc(uid))
                          append("\" type=\"").append(cotType(w.affiliation))
                          append("\" time=\"").append(time)
                          append("\" start=\"").append(time)
                          append("\" stale=\"").append(stale)
                          append("\" how=\"h-g-i-g-o\">\n")
                          append(
                              String.format(
                                  Locale.US,
                                  "  <point lat=\"%.7f\" lon=\"%.7f\" hae=\"9999999.0\" ce=\"9999999.0\" le=\"9999999.0\"/>\n",
                                  w.lat, w.lon,
                              )
                          )
                          append("  <detail>\n")
                          append("    <contact callsign=\"").append(esc(w.name)).append("\"/>\n")
                          if (w.folder.isNotBlank()) {
                              append("    <remarks>").append(esc(w.folder)).append("</remarks>\n")
                          }
                          append("  </detail>\n")
                          append("</event>\n")
                      }
                      zip.putNextEntry(ZipEntry(entryName))
                      zip.write(cot.toByteArray())
                      zip.closeEntry()
                  }

                  if (routes.isNotEmpty()) {
                      entries.add("routes.gpx")
                      val gpx = InterchangeFiles.buildGpx(emptyList(), routes, emptyList())
                      zip.putNextEntry(ZipEntry("routes.gpx"))
                      zip.write(gpx.toByteArray())
                      zip.closeEntry()
                  }

                  val manifest = buildString {
                      append("<MissionPackageManifest version=\"2\">\n")
                      append("  <Configuration>\n")
                      append("    <Parameter name=\"uid\" value=\"").append(esc(pkgUid)).append("\"/>\n")
                      append("    <Parameter name=\"name\" value=\"MGRS GPS export\"/>\n")
                      append("  </Configuration>\n")
                      append("  <Contents>\n")
                      for (e in entries) {
                          append("    <Content ignore=\"false\" zipEntry=\"").append(esc(e)).append("\"/>\n")
                      }
                      append("  </Contents>\n")
                      append("</MissionPackageManifest>\n")
                  }
                  zip.putNextEntry(ZipEntry("MANIFEST/manifest.xml"))
                  zip.write(manifest.toByteArray())
                  zip.closeEntry()
                  zip.finish()
              }

              fun buildBytes(
                  waypoints: List<Waypoint>,
                  routes: List<TacGraphic>,
                  nowMillis: Long,
              ): ByteArray {
                  val bos = ByteArrayOutputStream()
                  build(bos, waypoints, routes, nowMillis)
                  return bos.toByteArray()
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/InterchangeFiles.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.util.Xml
          import org.xmlpull.v1.XmlPullParser
          import java.io.InputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.zip.ZipInputStream

          /**
           * GPX 1.1 and KML/KMZ interchange: the file formats land-nav and TAK users
           * actually trade. Import is tolerant (skips what it can't read); export writes
           * plain, widely-accepted documents. Everything is streamed with XmlPullParser —
           * no external dependencies.
           */
          object InterchangeFiles {

              data class ImportedLine(val name: String, val folder: String, val points: List<GeoVertex>)
              data class ImportedTrack(val name: String, val points: List<TrackPoint>)

              data class ImportedData(
                  val waypoints: List<WaypointDraft> = emptyList(),
                  val lines: List<ImportedLine> = emptyList(),      // become route graphics
                  val areas: List<ImportedLine> = emptyList(),      // become assembly-area graphics
                  val tracks: List<ImportedTrack> = emptyList(),
              ) {
                  val isEmpty: Boolean
                      get() = waypoints.isEmpty() && lines.isEmpty() && areas.isEmpty() && tracks.isEmpty()

                  fun summary(): String {
                      val parts = mutableListOf<String>()
                      if (waypoints.isNotEmpty()) parts.add("${waypoints.size} waypoints")
                      if (lines.isNotEmpty()) parts.add("${lines.size} lines")
                      if (areas.isNotEmpty()) parts.add("${areas.size} areas")
                      if (tracks.isNotEmpty()) parts.add("${tracks.size} tracks")
                      return if (parts.isEmpty()) "nothing importable found" else "Imported " + parts.joinToString(", ")
                  }
              }

              const val IMPORT_FOLDER = "Imported"

              /** Route by file name; returns null when the format isn't recognized. */
              fun parse(fileName: String, stream: InputStream): ImportedData? {
                  val lower = fileName.lowercase(Locale.US)
                  return when {
                      lower.endsWith(".gpx") -> parseGpx(stream)
                      lower.endsWith(".kml") -> parseKml(stream)
                      lower.endsWith(".kmz") -> parseKmz(stream)
                      // ATAK mission data packages (and generic zips of the above)
                      lower.endsWith(".zip") || lower.endsWith(".dpk") -> DataPackage.parse(stream)
                      else -> null
                  }
              }

              // ---------------- GPX ----------------

              fun parseGpx(stream: InputStream): ImportedData {
                  val wps = ArrayList<WaypointDraft>()
                  val tracks = ArrayList<ImportedTrack>()
                  val lines = ArrayList<ImportedLine>()

                  val parser = Xml.newPullParser()
                  parser.setInput(stream, null)

                  var wptLat = 0.0
                  var wptLon = 0.0
                  var inWpt = false
                  var name = ""
                  var trkName = ""
                  var trkPts = ArrayList<TrackPoint>()
                  var inTrk = false
                  var rteName = ""
                  var rtePts = ArrayList<GeoVertex>()
                  var inRte = false
                  var pendingTime = 0L
                  var pendingEle = 0.0
                  var textBuf = ""

                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              textBuf = ""
                              when (parser.name) {
                                  "wpt" -> {
                                      inWpt = true
                                      name = ""
                                      wptLat = parser.getAttributeValue(null, "lat")?.toDoubleOrNull() ?: Double.NaN
                                      wptLon = parser.getAttributeValue(null, "lon")?.toDoubleOrNull() ?: Double.NaN
                                  }
                                  "trk" -> {
                                      inTrk = true
                                      trkName = ""
                                      trkPts = ArrayList()
                                  }
                                  "rte" -> {
                                      inRte = true
                                      rteName = ""
                                      rtePts = ArrayList()
                                  }
                                  "trkpt" -> {
                                      val lat = parser.getAttributeValue(null, "lat")?.toDoubleOrNull()
                                      val lon = parser.getAttributeValue(null, "lon")?.toDoubleOrNull()
                                      pendingTime = 0L
                                      pendingEle = 0.0
                                      if (lat != null && lon != null && inTrk) {
                                          trkPts.add(TrackPoint(lat, lon, 0L, 0.0))
                                      }
                                  }
                                  "rtept" -> {
                                      val lat = parser.getAttributeValue(null, "lat")?.toDoubleOrNull()
                                      val lon = parser.getAttributeValue(null, "lon")?.toDoubleOrNull()
                                      if (lat != null && lon != null && inRte) {
                                          rtePts.add(GeoVertex(lat, lon))
                                      }
                                  }
                              }
                          }
                          XmlPullParser.TEXT -> textBuf += parser.text ?: ""
                          XmlPullParser.END_TAG -> {
                              when (parser.name) {
                                  "name" -> {
                                      val t = textBuf.trim()
                                      if (inWpt && name.isEmpty()) name = t
                                      else if (inTrk && trkName.isEmpty()) trkName = t
                                      else if (inRte && rteName.isEmpty()) rteName = t
                                  }
                                  "ele" -> pendingEle = textBuf.trim().toDoubleOrNull() ?: 0.0
                                  "time" -> pendingTime = parseIsoTime(textBuf.trim())
                                  "trkpt" -> {
                                      if (inTrk && trkPts.isNotEmpty()) {
                                          val last = trkPts.removeAt(trkPts.size - 1)
                                          trkPts.add(last.copy(time = pendingTime, alt = pendingEle))
                                      }
                                  }
                                  "wpt" -> {
                                      if (inWpt && !wptLat.isNaN() && !wptLon.isNaN()) {
                                          wps.add(
                                              WaypointDraft(
                                                  name = name.ifBlank { "WP ${wps.size + 1}" },
                                                  lat = wptLat,
                                                  lon = wptLon,
                                                  folder = IMPORT_FOLDER,
                                                  symbol = "flag",
                                                  affiliation = "none",
                                              )
                                          )
                                      }
                                      inWpt = false
                                  }
                                  "trk" -> {
                                      if (inTrk && trkPts.size >= 2) {
                                          tracks.add(
                                              ImportedTrack(trkName.ifBlank { "Imported track" }, trkPts)
                                          )
                                      }
                                      inTrk = false
                                  }
                                  "rte" -> {
                                      if (inRte && rtePts.size >= 2) {
                                          lines.add(
                                              ImportedLine(rteName.ifBlank { "Imported route" }, IMPORT_FOLDER, rtePts)
                                          )
                                      }
                                      inRte = false
                                  }
                              }
                          }
                      }
                      event = parser.next()
                  }
                  return ImportedData(waypoints = wps, lines = lines, tracks = tracks)
              }

              fun buildGpx(
                  waypoints: List<Waypoint>,
                  routes: List<TacGraphic>,
                  tracks: List<Pair<TrackInfo, List<TrackPoint>>>,
              ): String {
                  val sb = StringBuilder()
                  sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                  sb.append("<gpx version=\"1.1\" creator=\"MGRS GPS\" xmlns=\"http://www.topografix.com/GPX/1/1\">\n")
                  for (w in waypoints) {
                      sb.append(
                          String.format(
                              Locale.US, "  <wpt lat=\"%.7f\" lon=\"%.7f\"><name>%s</name></wpt>\n",
                              w.lat, w.lon, escapeXml(w.name),
                          )
                      )
                  }
                  for (r in routes) {
                      sb.append("  <rte><name>").append(escapeXml(r.name)).append("</name>\n")
                      for (p in r.points) {
                          sb.append(
                              String.format(Locale.US, "    <rtept lat=\"%.7f\" lon=\"%.7f\"/>\n", p.lat, p.lon)
                          )
                      }
                      sb.append("  </rte>\n")
                  }
                  val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US)
                  sdf.timeZone = TimeZone.getTimeZone("UTC")
                  for ((info, pts) in tracks) {
                      sb.append("  <trk><name>").append(escapeXml(info.name)).append("</name><trkseg>\n")
                      for (p in pts) {
                          sb.append(
                              String.format(
                                  Locale.US,
                                  "    <trkpt lat=\"%.7f\" lon=\"%.7f\"><ele>%.1f</ele><time>%s</time></trkpt>\n",
                                  p.lat, p.lon, p.alt, sdf.format(Date(p.time)),
                              )
                          )
                      }
                      sb.append("  </trkseg></trk>\n")
                  }
                  sb.append("</gpx>\n")
                  return sb.toString()
              }

              // ---------------- KML / KMZ ----------------

              fun parseKmz(stream: InputStream): ImportedData {
                  ZipInputStream(stream).use { zip ->
                      var entry = zip.nextEntry
                      while (entry != null) {
                          if (!entry.isDirectory && entry.name.lowercase(Locale.US).endsWith(".kml")) {
                              return parseKml(zip)
                          }
                          entry = zip.nextEntry
                      }
                  }
                  return ImportedData()
              }

              fun parseKml(stream: InputStream): ImportedData {
                  val wps = ArrayList<WaypointDraft>()
                  val lines = ArrayList<ImportedLine>()
                  val areas = ArrayList<ImportedLine>()

                  val parser = Xml.newPullParser()
                  parser.setInput(stream, null)

                  val folderStack = ArrayDeque<String>()
                  var awaitingFolderName = false
                  var inPlacemark = false
                  var pmName = ""
                  var geomType = ""        // point / line / polygon
                  var coordText = ""
                  var inCoordinates = false
                  var textBuf = ""

                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              textBuf = ""
                              when (parser.name) {
                                  "Folder" -> {
                                      folderStack.addLast("")
                                      awaitingFolderName = true
                                  }
                                  "Placemark" -> {
                                      inPlacemark = true
                                      pmName = ""
                                      geomType = ""
                                      coordText = ""
                                  }
                                  "Point" -> if (inPlacemark) geomType = "point"
                                  "LineString" -> if (inPlacemark) geomType = "line"
                                  "Polygon" -> if (inPlacemark) geomType = "polygon"
                                  "coordinates" -> inCoordinates = true
                              }
                          }
                          XmlPullParser.TEXT -> textBuf += parser.text ?: ""
                          XmlPullParser.END_TAG -> {
                              when (parser.name) {
                                  "name" -> {
                                      val t = textBuf.trim()
                                      if (inPlacemark) {
                                          if (pmName.isEmpty()) pmName = t
                                      } else if (awaitingFolderName && folderStack.isNotEmpty()) {
                                          folderStack.removeLast()
                                          folderStack.addLast(t)
                                          awaitingFolderName = false
                                      }
                                  }
                                  "coordinates" -> {
                                      inCoordinates = false
                                      if (inPlacemark && coordText.isEmpty()) coordText = textBuf
                                  }
                                  "Folder" -> {
                                      if (folderStack.isNotEmpty()) folderStack.removeLast()
                                      awaitingFolderName = false
                                  }
                                  "Placemark" -> {
                                      if (inPlacemark) {
                                          val folder = folderStack.lastOrNull { it.isNotBlank() } ?: IMPORT_FOLDER
                                          val pts = parseKmlCoordinates(coordText)
                                          when {
                                              geomType == "point" && pts.isNotEmpty() -> wps.add(
                                                  WaypointDraft(
                                                      name = pmName.ifBlank { "WP ${wps.size + 1}" },
                                                      lat = pts[0].lat,
                                                      lon = pts[0].lon,
                                                      folder = folder,
                                                      symbol = "flag",
                                                      affiliation = "none",
                                                  )
                                              )
                                              geomType == "line" && pts.size >= 2 -> lines.add(
                                                  ImportedLine(pmName.ifBlank { "Imported line" }, folder, pts)
                                              )
                                              geomType == "polygon" && pts.size >= 3 -> areas.add(
                                                  ImportedLine(pmName.ifBlank { "Imported area" }, folder, pts)
                                              )
                                          }
                                      }
                                      inPlacemark = false
                                  }
                              }
                          }
                      }
                      event = parser.next()
                  }
                  return ImportedData(waypoints = wps, lines = lines, areas = areas)
              }

              /** KML coordinate lists are "lon,lat[,alt]" tuples separated by whitespace. */
              private fun parseKmlCoordinates(text: String): List<GeoVertex> =
                  text.trim().split(Regex("\\s+")).mapNotNull { tuple ->
                      val parts = tuple.split(",")
                      if (parts.size < 2) return@mapNotNull null
                      val lon = parts[0].toDoubleOrNull() ?: return@mapNotNull null
                      val lat = parts[1].toDoubleOrNull() ?: return@mapNotNull null
                      if (lat in -90.0..90.0 && lon in -180.0..180.0) GeoVertex(lat, lon) else null
                  }.let { pts ->
                      // drop the duplicated closing vertex polygons carry
                      if (pts.size >= 2 && pts.first() == pts.last()) pts.dropLast(1) else pts
                  }

              fun buildKml(
                  waypoints: List<Waypoint>,
                  graphics: List<TacGraphic>,
                  tracks: List<Pair<TrackInfo, List<TrackPoint>>>,
              ): String {
                  val sb = StringBuilder()
                  sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                  sb.append("<kml xmlns=\"http://www.opengis.net/kml/2.2\"><Document>\n")
                  sb.append("<name>MGRS GPS export</name>\n")

                  for ((folder, list) in waypoints.groupBy { it.folder }) {
                      sb.append("<Folder><name>").append(escapeXml(folder)).append("</name>\n")
                      for (w in list) {
                          sb.append("<Placemark><name>").append(escapeXml(w.name)).append("</name>")
                          sb.append(
                              String.format(
                                  Locale.US, "<Point><coordinates>%.7f,%.7f,0</coordinates></Point>",
                                  w.lon, w.lat,
                              )
                          )
                          sb.append("</Placemark>\n")
                      }
                      sb.append("</Folder>\n")
                  }

                  if (graphics.isNotEmpty()) {
                      sb.append("<Folder><name>Graphics</name>\n")
                      for (g in graphics) {
                          val closed = GraphicTypes.isArea(g.type) && g.points.size >= 3
                          sb.append("<Placemark><name>")
                              .append(escapeXml(GraphicTypes.labelPrefix(g.type) + g.name))
                              .append("</name>")
                          val coords = StringBuilder()
                          for (p in g.points) {
                              coords.append(String.format(Locale.US, "%.7f,%.7f,0 ", p.lon, p.lat))
                          }
                          if (closed && g.points.isNotEmpty()) {
                              coords.append(
                                  String.format(Locale.US, "%.7f,%.7f,0", g.points[0].lon, g.points[0].lat)
                              )
                          }
                          if (g.points.size == 1) {
                              // Point graphics (TRP, checkpoint, text) export as placemarks
                              sb.append(
                                  String.format(
                                      Locale.US, "<Point><coordinates>%.7f,%.7f,0</coordinates></Point>",
                                      g.points[0].lon, g.points[0].lat,
                                  )
                              )
                          } else if (closed) {
                              sb.append("<Polygon><outerBoundaryIs><LinearRing><coordinates>")
                                  .append(coords.toString().trim())
                                  .append("</coordinates></LinearRing></outerBoundaryIs></Polygon>")
                          } else {
                              sb.append("<LineString><tessellate>1</tessellate><coordinates>")
                                  .append(coords.toString().trim())
                                  .append("</coordinates></LineString>")
                          }
                          sb.append("</Placemark>\n")
                      }
                      sb.append("</Folder>\n")
                  }

                  if (tracks.isNotEmpty()) {
                      sb.append("<Folder><name>Tracks</name>\n")
                      for ((info, pts) in tracks) {
                          sb.append("<Placemark><name>").append(escapeXml(info.name)).append("</name>")
                          sb.append("<LineString><tessellate>1</tessellate><coordinates>")
                          for (p in pts) {
                              sb.append(String.format(Locale.US, "%.7f,%.7f,0 ", p.lon, p.lat))
                          }
                          sb.append("</coordinates></LineString></Placemark>\n")
                      }
                      sb.append("</Folder>\n")
                  }

                  sb.append("</Document></kml>\n")
                  return sb.toString()
              }

              // ---------------- helpers ----------------

              private fun parseIsoTime(text: String): Long = runCatching {
                  val cleaned = text.replace(Regex("\\.\\d+"), "").removeSuffix("Z")
                  val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss", Locale.US)
                  sdf.timeZone = TimeZone.getTimeZone("UTC")
                  sdf.parse(cleaned)?.time ?: 0L
              }.getOrDefault(0L)

              private fun escapeXml(s: String): String = s
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace("\"", "&quot;")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/TrackRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import android.location.Location
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.UUID

          private val Context.trackStore by preferencesDataStore(name = "tracks")

          /** Track metadata; the point log lives in files/tracks/<id>.txt (one point per line). */
          data class TrackInfo(
              val id: String,
              val name: String,
              val startedAt: Long,
              val endedAt: Long,        // 0 while recording
              val distanceM: Double,
              val pointCount: Int,
          )

          data class TrackPoint(val lat: Double, val lon: Double, val time: Long, val alt: Double)

          class TrackRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")

              val tracks: Flow<List<TrackInfo>> = context.trackStore.data.map { p ->
                  decode(p[listKey] ?: "[]").sortedByDescending { it.startedAt }
              }

              suspend fun startTrack(nowMillis: Long): String {
                  val id = UUID.randomUUID().toString()
                  val info = TrackInfo(
                      id = id,
                      name = "Track " + dtgShort(nowMillis),
                      startedAt = nowMillis,
                      endedAt = 0L,
                      distanceM = 0.0,
                      pointCount = 0,
                  )
                  withContext(Dispatchers.IO) { pointsFile(context, id).parentFile?.mkdirs() }
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + info)
                  }
                  return id
              }

              /** Close out a finished recording: compute stats from the point log. */
              suspend fun finishTrack(id: String, name: String?, nowMillis: Long) {
                  val pts = readPoints(context, id)
                  var dist = 0.0
                  for (i in 1 until pts.size) {
                      val out = FloatArray(1)
                      Location.distanceBetween(
                          pts[i - 1].lat, pts[i - 1].lon, pts[i].lat, pts[i].lon, out
                      )
                      dist += out[0]
                  }
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(
                                  name = name?.trim()?.ifBlank { it.name } ?: it.name,
                                  endedAt = nowMillis,
                                  distanceM = dist,
                                  pointCount = pts.size,
                              ) else it
                          }
                      )
                  }
              }

              /** Create a finished track from imported points (GPX trk import). */
              suspend fun importTrack(name: String, points: List<TrackPoint>, nowMillis: Long): String {
                  val id = UUID.randomUUID().toString()
                  withContext(Dispatchers.IO) {
                      val f = pointsFile(context, id)
                      f.parentFile?.mkdirs()
                      f.bufferedWriter().use { out ->
                          for (p in points) {
                              out.write(
                                  String.format(Locale.US, "%.7f %.7f %d %.1f\n", p.lat, p.lon, p.time, p.alt)
                              )
                          }
                      }
                  }
                  var dist = 0.0
                  for (i in 1 until points.size) {
                      val out = FloatArray(1)
                      Location.distanceBetween(
                          points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon, out
                      )
                      dist += out[0]
                  }
                  val start = points.firstOrNull()?.time?.takeIf { it > 0 } ?: nowMillis
                  val end = points.lastOrNull()?.time?.takeIf { it > 0 } ?: nowMillis
                  val info = TrackInfo(
                      id = id,
                      name = name.trim().ifBlank { "Imported track" },
                      startedAt = start,
                      endedAt = end,
                      distanceM = dist,
                      pointCount = points.size,
                  )
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + info)
                  }
                  return id
              }

              /** Restore one track from a backup, keeping its id; skipped when already present. */
              suspend fun restore(info: TrackInfo, points: List<TrackPoint>): Boolean {
                  var added = false
                  context.trackStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      if (current.none { it.id == info.id }) {
                          val f = pointsFile(context, info.id)
                          f.parentFile?.mkdirs()
                          f.writeText(
                              points.joinToString("") {
                                  String.format(Locale.US, "%.7f %.7f %d %.1f\n", it.lat, it.lon, it.time, it.alt)
                              }
                          )
                          p[listKey] = encode(current + info)
                          added = true
                      }
                  }
                  return added
              }

              suspend fun rename(id: String, name: String) {
                  if (name.isBlank()) return
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(name = name.trim()) else it
                          }
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.id == id })
                  }
                  withContext(Dispatchers.IO) { pointsFile(context, id).delete() }
              }

              /** Remove a recording that was discarded before saving. */
              suspend fun discard(id: String) = delete(id)

              private fun decode(json: String): List<TrackInfo> = runCatching {
                  val arr = JSONArray(json)
                  buildList {
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          add(
                              TrackInfo(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  startedAt = o.optLong("startedAt"),
                                  endedAt = o.optLong("endedAt"),
                                  distanceM = o.optDouble("distanceM", 0.0),
                                  pointCount = o.optInt("pointCount", 0),
                              )
                          )
                      }
                  }
              }.getOrDefault(emptyList())

              private fun encode(list: List<TrackInfo>): String {
                  val arr = JSONArray()
                  for (t in list) {
                      arr.put(
                          JSONObject()
                              .put("id", t.id)
                              .put("name", t.name)
                              .put("startedAt", t.startedAt)
                              .put("endedAt", t.endedAt)
                              .put("distanceM", t.distanceM)
                              .put("pointCount", t.pointCount)
                      )
                  }
                  return arr.toString()
              }

              companion object {
                  fun pointsFile(context: Context, id: String): File =
                      File(File(context.filesDir, "tracks"), "$id.txt")

                  /** Append one point; called from the recorder service's worker thread. */
                  fun appendPoint(context: Context, id: String, lat: Double, lon: Double, time: Long, alt: Double) {
                      runCatching {
                          val f = pointsFile(context, id)
                          f.parentFile?.mkdirs()
                          f.appendText(
                              String.format(Locale.US, "%.7f %.7f %d %.1f\n", lat, lon, time, alt)
                          )
                      }
                  }

                  suspend fun readPoints(context: Context, id: String): List<TrackPoint> =
                      withContext(Dispatchers.IO) {
                          val f = pointsFile(context, id)
                          if (!f.exists()) return@withContext emptyList()
                          f.readLines().mapNotNull { line ->
                              val parts = line.trim().split(" ")
                              if (parts.size < 3) return@mapNotNull null
                              runCatching {
                                  TrackPoint(
                                      lat = parts[0].toDouble(),
                                      lon = parts[1].toDouble(),
                                      time = parts[2].toLong(),
                                      alt = parts.getOrNull(3)?.toDouble() ?: 0.0,
                                  )
                              }.getOrNull()
                          }
                      }

                  /** Minimal GPX 1.1 document for one track. */
                  fun buildGpx(name: String, points: List<TrackPoint>): String {
                      val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US)
                      sdf.timeZone = TimeZone.getTimeZone("UTC")
                      val sb = StringBuilder()
                      sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                      sb.append("<gpx version=\"1.1\" creator=\"MGRS GPS\" xmlns=\"http://www.topografix.com/GPX/1/1\">\n")
                      sb.append("  <trk>\n    <name>").append(escapeXml(name)).append("</name>\n    <trkseg>\n")
                      for (p in points) {
                          sb.append(
                              String.format(
                                  Locale.US,
                                  "      <trkpt lat=\"%.7f\" lon=\"%.7f\"><ele>%.1f</ele><time>%s</time></trkpt>\n",
                                  p.lat, p.lon, p.alt, sdf.format(Date(p.time)),
                              )
                          )
                      }
                      sb.append("    </trkseg>\n  </trk>\n</gpx>\n")
                      return sb.toString()
                  }

                  private fun escapeXml(s: String): String = s
                      .replace("&", "&amp;")
                      .replace("<", "&lt;")
                      .replace(">", "&gt;")
                      .replace("\"", "&quot;")

                  private fun dtgShort(timeMillis: Long): String {
                      val sdf = SimpleDateFormat("ddHHmm'Z'", Locale.US)
                      sdf.timeZone = TimeZone.getTimeZone("UTC")
                      return sdf.format(Date(timeMillis))
                  }
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/location'
          cat > 'app/src/main/java/app/gridfix/android/location/TrackRecorderService.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.location

          import android.annotation.SuppressLint
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat
          import app.gridfix.android.MainActivity
          import app.gridfix.android.R
          import app.gridfix.android.data.TrackRepository
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import java.util.Locale

          /** Live state of the current recording, observed by the map UI. */
          data class ActiveTrack(
              val trackId: String,
              val startedAt: Long,
              val points: List<Pair<Double, Double>>,
              val distanceM: Double,
          )

          /**
           * Foreground service that logs GPS points to the active track file while the
           * user moves — screen off included. Points are filtered to >= 5 m spacing.
           * Everything stays on-device; the notification is Android's required indicator
           * that location is in use.
           */
          class TrackRecorderService : Service() {

              private val locationManager by lazy {
                  getSystemService(Context.LOCATION_SERVICE) as LocationManager
              }
              private var worker: HandlerThread? = null
              private var trackId: String? = null
              private var lastPoint: Location? = null
              private var distance = 0.0
              private var points = ArrayList<Pair<Double, Double>>()
              private var startedAt = 0L

              private val listener = object : LocationListener {
                  override fun onLocationChanged(loc: Location) {
                      val id = trackId ?: return
                      val last = lastPoint
                      if (last != null) {
                          val d = loc.distanceTo(last)
                          if (d < 5f) return
                          distance += d
                      }
                      lastPoint = loc
                      points.add(loc.latitude to loc.longitude)
                      if (points.size > MAX_LIVE_POINTS) {
                          // keep the live polyline bounded; the file holds the full log
                          points = ArrayList(points.takeLast(MAX_LIVE_POINTS / 2))
                      }
                      TrackRepository.appendPoint(
                          this@TrackRecorderService, id,
                          loc.latitude, loc.longitude, loc.time,
                          if (loc.hasAltitude()) loc.altitude else 0.0,
                      )
                      _active.value = ActiveTrack(id, startedAt, ArrayList(points), distance)
                      updateNotification()
                  }

                  @Deprecated("Legacy callback, required for API 26-29 devices")
                  override fun onStatusChanged(provider: String?, status: Int, extras: android.os.Bundle?) {
                  }

                  override fun onProviderEnabled(provider: String) {}
                  override fun onProviderDisabled(provider: String) {}
              }

              override fun onBind(intent: Intent?): IBinder? = null

              @SuppressLint("MissingPermission")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_START -> {
                          val id = intent.getStringExtra(EXTRA_TRACK_ID) ?: return START_NOT_STICKY
                          if (trackId != null) return START_STICKY
                          trackId = id
                          startedAt = System.currentTimeMillis()
                          distance = 0.0
                          points = ArrayList()
                          lastPoint = null
                          _active.value = ActiveTrack(id, startedAt, emptyList(), 0.0)

                          createChannel()
                          val notif = buildNotification("Recording — 0 m")
                          if (Build.VERSION.SDK_INT >= 29) {
                              ServiceCompat.startForeground(
                                  this, NOTIF_ID, notif,
                                  ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION,
                              )
                          } else {
                              startForeground(NOTIF_ID, notif)
                          }

                          val thread = HandlerThread("track-recorder").also { it.start() }
                          worker = thread
                          try {
                              locationManager.requestLocationUpdates(
                                  LocationManager.GPS_PROVIDER, 2000L, 0f, listener, thread.looper
                              )
                          } catch (_: Exception) {
                              stopSelf()
                          }
                      }
                      ACTION_STOP -> {
                          stopRecording()
                          stopSelf()
                      }
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  stopRecording()
                  super.onDestroy()
              }

              private fun stopRecording() {
                  if (trackId == null) return
                  try {
                      locationManager.removeUpdates(listener)
                  } catch (_: SecurityException) {
                  }
                  worker?.quitSafely()
                  worker = null
                  trackId = null
                  _active.value = null
                  ServiceCompat.stopForeground(this, ServiceCompat.STOP_FOREGROUND_REMOVE)
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.createNotificationChannel(
                          NotificationChannel(
                              CHANNEL_ID, "Track recording", NotificationManager.IMPORTANCE_LOW
                          ).apply { description = "Shown while MGRS GPS records your track" }
                      )
                  }
              }

              private fun buildNotification(text: String): android.app.Notification {
                  val open = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,
                  )
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.mipmap.ic_launcher)
                      .setContentTitle("MGRS GPS — recording track")
                      .setContentText(text)
                      .setOngoing(true)
                      .setContentIntent(open)
                      .setForegroundServiceBehavior(NotificationCompat.FOREGROUND_SERVICE_IMMEDIATE)
                      .build()
              }

              private fun updateNotification() {
                  val text = if (distance < 1000) {
                      String.format(Locale.US, "Recording — %.0f m", distance)
                  } else {
                      String.format(Locale.US, "Recording — %.2f km", distance / 1000.0)
                  }
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  Handler(Looper.getMainLooper()).post {
                      runCatching { manager.notify(NOTIF_ID, buildNotification(text)) }
                  }
              }

              companion object {
                  private const val CHANNEL_ID = "gridfix_tracking"
                  private const val NOTIF_ID = 41
                  private const val ACTION_START = "app.gridfix.android.track.START"
                  private const val ACTION_STOP = "app.gridfix.android.track.STOP"
                  private const val EXTRA_TRACK_ID = "track_id"
                  private const val MAX_LIVE_POINTS = 4000

                  private val _active = MutableStateFlow<ActiveTrack?>(null)
                  val active: StateFlow<ActiveTrack?> = _active.asStateFlow()

                  fun start(context: Context, trackId: String) {
                      val i = Intent(context, TrackRecorderService::class.java)
                          .setAction(ACTION_START)
                          .putExtra(EXTRA_TRACK_ID, trackId)
                      if (Build.VERSION.SDK_INT >= 26) context.startForegroundService(i)
                      else context.startService(i)
                  }

                  fun stop(context: Context) {
                      context.startService(
                          Intent(context, TrackRecorderService::class.java).setAction(ACTION_STOP)
                      )
                  }
              }
          }
          EOF_GRIDFIX
