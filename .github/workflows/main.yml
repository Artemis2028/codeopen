                              // never detach or null that one.
                              view.onDetach()
                              if (holder.map === view) {
                                  holder.map = null
                                  holder.grid = null
                                  holder.cm = null
                                  holder.tracks = null
                                  holder.hillshade = null
                                  holder.contours = null
                                  holder.viewshed = null
                                  holder.appliedLayer = ""
                                  holder.appliedNight = null
                                  holder.appliedGrid = null
                              }
                          },
