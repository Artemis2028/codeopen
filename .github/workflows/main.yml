name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.8.5 (viewshed overlay) delta, plain text, auditable below)
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 34

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 26
                  versionName = "0.8.5"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/map'
          cat > 'app/src/main/java/app/gridfix/android/map/Terrain.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.map

          import android.content.Context
          import android.graphics.Bitmap
          import app.gridfix.android.data.GeoVertex
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import kotlin.math.atan2
          import kotlin.math.ceil
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.sin
          import kotlin.math.sqrt

          /**
           * Terrain analysis on the cached elevation data: line-of-sight between two
           * points and elevation profiles along routes. Uses the same Terrarium tiles
           * as the crosshair readout (~10-30 m source data), so anything works offline
           * once the area's elevation has been viewed or downloaded.
           *
           * Line of sight applies the standard earth-curvature + atmospheric-refraction
           * correction (effective earth radius x 4/3): terrain between the endpoints is
           * depressed by d1*d2 / (2 * Re), which is what makes ~1.7 m eyes see ~4.9 km
           * to a sea-level horizon.
           */
          object Terrain {

              private const val EARTH_R = 6371008.8
              private const val EFFECTIVE_R = EARTH_R * 4.0 / 3.0

              data class Profile(
                  val distancesM: FloatArray,   // cumulative along-path distance per sample
                  val elevations: FloatArray,   // metres MSL; Float.NaN where no data
                  val legEndIndex: IntArray,    // sample index where each leg ends (route profiles)
                  val missing: Int,             // samples with no elevation data
              ) {
                  val totalM: Float get() = if (distancesM.isEmpty()) 0f else distancesM.last()

                  /** Total climb and descent, ignoring jitter under [threshold] metres. */
                  fun gainLoss(threshold: Float = 1.5f): Pair<Float, Float> {
                      var gain = 0f
                      var loss = 0f
                      var anchor = Float.NaN
                      for (e in elevations) {
                          if (e.isNaN()) continue
                          if (anchor.isNaN()) {
                              anchor = e
                              continue
                          }
                          val d = e - anchor
                          if (d >= threshold) {
                              gain += d
                              anchor = e
                          } else if (d <= -threshold) {
                              loss -= d
                              anchor = e
                          }
                      }
                      return gain to loss
                  }
              }

              private fun haversineM(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
                  val dLat = Math.toRadians(lat2 - lat1)
                  val dLon = Math.toRadians(lon2 - lon1)
                  val h = sin(dLat / 2) * sin(dLat / 2) +
                      cos(Math.toRadians(lat1)) * cos(Math.toRadians(lat2)) *
                      sin(dLon / 2) * sin(dLon / 2)
                  return 2 * EARTH_R * atan2(sqrt(h), sqrt(1 - h))
              }

              /** Sample elevations along a multi-leg path, ~[stepM] apart, capped at [maxSamples]. */
              suspend fun profile(
                  context: Context,
                  points: List<GeoVertex>,
                  stepM: Double = 25.0,
                  maxSamples: Int = 600,
              ): Profile? {
                  if (points.size < 2) return null
                  val legLens = DoubleArray(points.size - 1)
                  var total = 0.0
                  for (i in 0 until points.size - 1) {
                      legLens[i] = haversineM(points[i].lat, points[i].lon, points[i + 1].lat, points[i + 1].lon)
                      total += legLens[i]
                  }
                  if (total <= 0.0) return null
                  val step = max(stepM, total / maxSamples)

                  val dists = ArrayList<Float>()
                  val elevs = ArrayList<Float>()
                  val legEnds = ArrayList<Int>()
                  var missing = 0
                  var walked = 0.0

                  suspend fun sampleAt(lat: Double, lon: Double, dist: Double) {
                      dists.add(dist.toFloat())
                      val e = Elevation.elevationAt(context, lat, lon)
                      if (e == null) {
                          missing++
                          elevs.add(Float.NaN)
                      } else {
                          elevs.add(e.toFloat())
                      }
                  }

                  sampleAt(points[0].lat, points[0].lon, 0.0)
                  for (i in 0 until points.size - 1) {
                      val len = legLens[i]
                      if (len > 0.0) {
                          var d = step
                          while (d < len) {
                              val t = d / len
                              sampleAt(
                                  points[i].lat + (points[i + 1].lat - points[i].lat) * t,
                                  points[i].lon + (points[i + 1].lon - points[i].lon) * t,
                                  walked + d,
                              )
                              d += step
                          }
                      }
                      walked += len
                      sampleAt(points[i + 1].lat, points[i + 1].lon, walked)
                      legEnds.add(dists.size - 1)
                  }
                  return Profile(
                      distancesM = dists.toFloatArray(),
                      elevations = elevs.toFloatArray(),
                      legEndIndex = legEnds.toIntArray(),
                      missing = missing,
                  )
              }

              data class LosResult(
                  val visible: Boolean,
                  val profile: Profile,
                  val observerElev: Float,      // ground MSL at observer
                  val targetElev: Float,        // ground MSL at target
                  val observerHeight: Float,    // metres above ground
                  val targetHeight: Float,
                  val blockIndex: Int,          // first blocking sample (-1 when visible)
                  val blockDistM: Float,
                  val blockLat: Double,
                  val blockLon: Double,
                  val clearObserverHeight: Float, // min observer height (m AGL) that would see the target
                  /** Sight-line height (curvature-corrected frame) per sample, for drawing. */
                  val sightLine: FloatArray,
                  /** Terrain in the same curvature-corrected frame, for drawing. */
                  val effectiveTerrain: FloatArray,
              )

              /**
               * A computed viewshed raster: what the observer can see out to [radiusM].
               * Pixel classes: VISIBLE (even a low target is seen), MARGINAL (only a
               * standing man / vehicle-height target is seen — partial defilade),
               * MASKED (full defilade for a 3 m target). Cells without elevation data
               * stay transparent.
               */
              data class Viewshed(
                  val bitmap: Bitmap,
                  val latN: Double,
                  val latS: Double,
                  val lonW: Double,
                  val lonE: Double,
                  val obsLat: Double,
                  val obsLon: Double,
                  val radiusM: Float,
                  val missing: Int,
              )

              private const val COLOR_VISIBLE = 0x4600C853   // translucent green
              private const val COLOR_MARGINAL = 0x55FFD600  // translucent amber
              private const val COLOR_MASKED = 0x50FF1744    // translucent red

              /**
               * Radial-sweep viewshed from one observer. Same curvature/refraction model
               * as [lineOfSight] (observer-centric drop d²/2Re). Low-target threshold
               * 0.5 m AGL, standing/vehicle threshold 3 m AGL.
               */
              suspend fun viewshed(
                  context: Context,
                  obsLat: Double,
                  obsLon: Double,
                  observerHeight: Float,
                  radiusM: Double,
                  gridN: Int = 192,
                  rays: Int = 768,
              ): Viewshed? = withContext(Dispatchers.Default) {
                  val obsGround = Elevation.elevationAt(context, obsLat, obsLon)
                      ?: return@withContext null
                  val eye = obsGround + observerHeight
                  val kx = cos(Math.toRadians(obsLat))
                  val dLat = radiusM / 111319.49
                  val dLon = radiusM / (111319.49 * kx)
                  val latN = obsLat + dLat
                  val latS = obsLat - dLat
                  val lonW = obsLon - dLon
                  val lonE = obsLon + dLon

                  val pixels = IntArray(gridN * gridN)
                  val cell = 2.0 * radiusM / gridN
                  val step = cell * 0.7
                  val samples = ceil(radiusM / step).toInt()
                  var missing = 0

                  for (r in 0 until rays) {
                      val az = 2.0 * Math.PI * r / rays
                      val sinA = sin(az)
                      val cosA = cos(az)
                      var maxSlope = -1e9
                      var d = step
                      for (s in 0 until samples) {
                          if (d > radiusM) break
                          val plat = obsLat + (d * cosA) / 111319.49
                          val plon = obsLon + (d * sinA) / (111319.49 * kx)
                          val px = (((plon - lonW) / (lonE - lonW)) * gridN).toInt()
                          val py = (((latN - plat) / (latN - latS)) * gridN).toInt()
                          val e = Elevation.elevationAt(context, plat, plon)
                          if (e == null) {
                              missing++
                          } else {
                              val te = e - d * d / (2.0 * EFFECTIVE_R)
                              val slopeLow = (te + 0.5 - eye) / d
                              val slopeStanding = (te + 3.0 - eye) / d
                              val cls = when {
                                  slopeLow >= maxSlope -> COLOR_VISIBLE
                                  slopeStanding >= maxSlope -> COLOR_MARGINAL
                                  else -> COLOR_MASKED
                              }
                              if (px in 0 until gridN && py in 0 until gridN) {
                                  pixels[py * gridN + px] = cls
                              }
                              val slopeGround = (te - eye) / d
                              if (slopeGround > maxSlope) maxSlope = slopeGround
                          }
                          d += step
                      }
                  }
                  // observer's own cell reads visible
                  pixels[(gridN / 2) * gridN + gridN / 2] = COLOR_VISIBLE

                  val bmp = Bitmap.createBitmap(pixels, gridN, gridN, Bitmap.Config.ARGB_8888)
                  Viewshed(
                      bitmap = bmp,
                      latN = latN, latS = latS, lonW = lonW, lonE = lonE,
                      obsLat = obsLat, obsLon = obsLon,
                      radiusM = radiusM.toFloat(),
                      missing = missing,
                  )
              }

              /**
               * Line of sight observer -> target. Heights are metres above ground.
               * Returns null when elevation data is missing at either endpoint.
               */
              suspend fun lineOfSight(
                  context: Context,
                  obsLat: Double, obsLon: Double, observerHeight: Float,
                  tgtLat: Double, tgtLon: Double, targetHeight: Float,
              ): LosResult? {
                  val prof = profile(
                      context,
                      listOf(GeoVertex(obsLat, obsLon), GeoVertex(tgtLat, tgtLon)),
                      stepM = 20.0,
                      maxSamples = 500,
                  ) ?: return null
                  val n = prof.elevations.size
                  if (n < 2) return null
                  val obsGround = prof.elevations.first()
                  val tgtGround = prof.elevations.last()
                  if (obsGround.isNaN() || tgtGround.isNaN()) return null
                  val totalD = prof.totalM.toDouble()

                  // Curvature-corrected frame: depress terrain by d1*d2 / (2 Re)
                  val eff = FloatArray(n)
                  for (i in 0 until n) {
                      val d1 = prof.distancesM[i].toDouble()
                      val bulge = d1 * (totalD - d1) / (2.0 * EFFECTIVE_R)
                      eff[i] = if (prof.elevations[i].isNaN()) Float.NaN
                      else (prof.elevations[i] - bulge).toFloat()
                  }

                  val a = obsGround + observerHeight       // endpoints carry no bulge
                  val b = tgtGround + targetHeight
                  val sight = FloatArray(n)
                  val clearance = 0.5f
                  var blockIdx = -1
                  var required = 0f
                  for (i in 0 until n) {
                      val t = if (totalD == 0.0) 0f else (prof.distancesM[i] / prof.totalM)
                      sight[i] = a + (b - a) * t
                      if (i in 1 until n - 1 && !eff[i].isNaN()) {
                          if (eff[i] + clearance > sight[i] && blockIdx == -1) {
                              blockIdx = i
                          }
                          // observer height that would clear this sample (target end fixed)
                          if (t < 1f) {
                              val need = ((eff[i] + clearance - b * t) / (1f - t)) - obsGround
                              if (need > required) required = need
                          }
                      }
                  }

                  val blockT = if (blockIdx >= 0) prof.distancesM[blockIdx] / prof.totalM else 0f
                  return LosResult(
                      visible = blockIdx == -1,
                      profile = prof,
                      observerElev = obsGround,
                      targetElev = tgtGround,
                      observerHeight = observerHeight,
                      targetHeight = targetHeight,
                      blockIndex = blockIdx,
                      blockDistM = if (blockIdx >= 0) prof.distancesM[blockIdx] else 0f,
                      blockLat = obsLat + (tgtLat - obsLat) * blockT,
                      blockLon = obsLon + (tgtLon - obsLon) * blockT,
                      clearObserverHeight = max(required, 0f),
                      sightLine = sight,
                      effectiveTerrain = eff,
                  )
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/map'
          cat > 'app/src/main/java/app/gridfix/android/map/ViewshedOverlay.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.map

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.Point
          import org.osmdroid.util.GeoPoint
          import org.osmdroid.views.Projection
          import org.osmdroid.views.overlay.Overlay
          import kotlin.math.hypot

          /**
           * Draws a computed [Terrain.Viewshed] raster over the map: green where the
           * observer sees the ground, amber where only a standing target would show
           * (partial defilade), red where a 3 m target is hidden. The bitmap is placed
           * with an affine corner fit, so it stays glued under pan, zoom, and rotation.
           */
          class ViewshedOverlay : Overlay() {

              var data: Terrain.Viewshed? = null

              private val bmpPaint = Paint(Paint.FILTER_BITMAP_FLAG)
              private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 3f
                  color = Color.DKGRAY
                  alpha = 160
              }
              private val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
                  color = Color.DKGRAY
                  alpha = 220
              }
              private val matrix = Matrix()
              private val gp = GeoPoint(0.0, 0.0)
              private val pt = Point()
              private val srcPts = FloatArray(6)
              private val dstPts = FloatArray(6)

              override fun draw(canvas: Canvas, projection: Projection) {
                  val d = data ?: return
                  val w = d.bitmap.width.toFloat()
                  val h = d.bitmap.height.toFloat()

                  gp.setCoords(d.latN, d.lonW)
                  projection.toPixels(gp, pt)
                  dstPts[0] = pt.x.toFloat(); dstPts[1] = pt.y.toFloat()
                  gp.setCoords(d.latN, d.lonE)
                  projection.toPixels(gp, pt)
                  dstPts[2] = pt.x.toFloat(); dstPts[3] = pt.y.toFloat()
                  gp.setCoords(d.latS, d.lonW)
                  projection.toPixels(gp, pt)
                  dstPts[4] = pt.x.toFloat(); dstPts[5] = pt.y.toFloat()

                  srcPts[0] = 0f; srcPts[1] = 0f
                  srcPts[2] = w; srcPts[3] = 0f
                  srcPts[4] = 0f; srcPts[5] = h
                  matrix.setPolyToPoly(srcPts, 0, dstPts, 0, 3)
                  canvas.drawBitmap(d.bitmap, matrix, bmpPaint)

                  // observer dot + radius ring
                  gp.setCoords(d.obsLat, d.obsLon)
                  projection.toPixels(gp, pt)
                  val ox = pt.x.toFloat()
                  val oy = pt.y.toFloat()
                  gp.setCoords(d.obsLat, d.lonE)
                  projection.toPixels(gp, pt)
                  val rPx = hypot(pt.x - ox, pt.y - oy)
                  canvas.drawCircle(ox, oy, rPx, ringPaint)
                  canvas.drawCircle(ox, oy, 6f, dotPaint)
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/ui'
          cat > 'app/src/main/java/app/gridfix/android/ui/LosDialog.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.ui

          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.height
          import androidx.compose.foundation.layout.width
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.AlertDialog
          import androidx.compose.material3.DropdownMenu
          import androidx.compose.material3.DropdownMenuItem
          import androidx.compose.material3.FilterChip
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.OutlinedTextField
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.rememberCoroutineScope
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import app.gridfix.android.coords.Coordinates
          import app.gridfix.android.data.AppSettings
          import app.gridfix.android.data.Waypoint
          import app.gridfix.android.map.Terrain
          import kotlinx.coroutines.launch
          import java.util.Locale

          /**
           * Terrain profile chart shared by the LOS tool and the route card: filled
           * terrain, optional sight line, optional blocking-point marker, leg ticks.
           */
          @Composable
          fun ProfileChart(
              distances: FloatArray,
              elevations: FloatArray,
              modifier: Modifier = Modifier,
              sightLine: FloatArray? = null,
              blockIndex: Int = -1,
              legEnds: IntArray = intArrayOf(),
          ) {
              val primary = MaterialTheme.colorScheme.primary
              val fillColor = primary.copy(alpha = 0.18f)
              val gridColor = MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.4f)
              val blockColor = MaterialTheme.colorScheme.error
              Canvas(modifier) {
                  val n = distances.size
                  if (n < 2) return@Canvas
                  val total = distances.last().takeIf { it > 0f } ?: return@Canvas
                  var lo = Float.MAX_VALUE
                  var hi = -Float.MAX_VALUE
                  for (e in elevations) if (!e.isNaN()) {
                      if (e < lo) lo = e
                      if (e > hi) hi = e
                  }
                  sightLine?.forEach { s ->
                      if (s < lo) lo = s
                      if (s > hi) hi = s
                  }
                  if (lo > hi) return@Canvas
                  if (hi - lo < 10f) {
                      val mid = (hi + lo) / 2f
                      lo = mid - 5f
                      hi = mid + 5f
                  }
                  val pad = (hi - lo) * 0.08f
                  lo -= pad
                  hi += pad
                  fun x(i: Int) = distances[i] / total * size.width
                  fun y(v: Float) = size.height - (v - lo) / (hi - lo) * size.height

                  // filled terrain (skip NaN gaps)
                  var i = 0
                  while (i < n) {
                      while (i < n && elevations[i].isNaN()) i++
                      if (i >= n) break
                      val start = i
                      val p = Path()
                      p.moveTo(x(start), y(elevations[start]))
                      var j = start + 1
                      while (j < n && !elevations[j].isNaN()) {
                          p.lineTo(x(j), y(elevations[j]))
                          j++
                      }
                      val outline = Path().apply { addPath(p) }
                      p.lineTo(x(j - 1), size.height)
                      p.lineTo(x(start), size.height)
                      p.close()
                      drawPath(p, fillColor)
                      drawPath(outline, primary, style = Stroke(width = 2.dp.toPx()))
                      i = j
                  }
                  // leg boundaries
                  for (le in legEnds) {
                      if (le in 1 until n - 1) {
                          drawLine(
                              gridColor,
                              Offset(x(le), 0f),
                              Offset(x(le), size.height),
                              strokeWidth = 1.dp.toPx(),
                          )
                      }
                  }
                  // sight line + block marker
                  sightLine?.let { s ->
                      drawLine(
                          primary,
                          Offset(x(0), y(s.first())),
                          Offset(x(n - 1), y(s.last())),
                          strokeWidth = 2.dp.toPx(),
                      )
                      if (blockIndex in 0 until n && !elevations[blockIndex].isNaN()) {
                          drawCircle(
                              blockColor,
                              radius = 4.dp.toPx(),
                              center = Offset(x(blockIndex), y(elevations[blockIndex])),
                          )
                      }
                  }
              }
          }

          /**
           * Line-of-sight check across the cached terrain: pick an observer and a
           * target, get VISIBLE or MASKED with the blocking crest, a profile sketch,
           * and the observer height that would clear the mask. Curvature and standard
           * refraction included.
           */
          @Composable
          fun LosDialog(
              settings: AppSettings,
              waypoints: List<Waypoint>,
              myPosition: Pair<Double, Double>?,
              crosshair: Pair<Double, Double>,
              onViewshed: (Terrain.Viewshed) -> Unit,
              onDismiss: () -> Unit,
          ) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              var obsMode by remember { mutableIntStateOf(if (myPosition != null) 0 else 1) }
              var tgtMode by remember { mutableIntStateOf(0) }
              var obsWp by remember { mutableStateOf<Waypoint?>(null) }
              var tgtWp by remember { mutableStateOf<Waypoint?>(null) }
              var obsMenu by remember { mutableStateOf(false) }
              var tgtMenu by remember { mutableStateOf(false) }
              var obsH by remember { mutableStateOf("2") }
              var tgtH by remember { mutableStateOf("2") }
              var computing by remember { mutableStateOf(false) }
              var radiusM by remember { mutableIntStateOf(2000) }
              var error by remember { mutableStateOf<String?>(null) }
              var result by remember { mutableStateOf<Terrain.LosResult?>(null) }

              fun observerPoint(): Pair<Double, Double>? = when (obsMode) {
                  0 -> myPosition
                  1 -> crosshair
                  else -> obsWp?.let { it.lat to it.lon }
              }

              fun targetPoint(): Pair<Double, Double>? = when (tgtMode) {
                  0 -> crosshair
                  else -> tgtWp?.let { it.lat to it.lon }
              }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("Line of sight") },
                  text = {
                      Column(
