              private class TileContours(
                  val minor: Path,
                  val major: Path,
                  val labels: List<FloatArray>,   // [x, y, elevation] in SCALE units
              )

              private val ready = object : LinkedHashMap<String, TileContours>(32, 0.75f, true) {
                  override fun removeEldestEntry(eldest: MutableMap.MutableEntry<String, TileContours>?): Boolean =
                      size > 110
              }
              private val inFlight = HashSet<String>()
              private val failedAt = HashMap<String, Long>()

              private val minorPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeJoin = Paint.Join.ROUND
              }
              private val majorPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeJoin = Paint.Join.ROUND
              }
              private val textFill = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
              }
              private val textHalo = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                  style = Paint.Style.STROKE
                  strokeWidth = 2.6f * density
              }

              private val gp = GeoPoint(0.0, 0.0)
              private val p00 = Point()
              private val p10 = Point()
              private val p01 = Point()
              private val matrix = Matrix()
              private val matrixValues = FloatArray(9)
              private val labelPt = FloatArray(2)

              @Synchronized
              private fun cached(key: String): TileContours? = ready[key]

              @Synchronized
              private fun store(key: String, tc: TileContours) {
                  ready[key] = tc
              }

              @Synchronized
              private fun shouldStart(key: String): Boolean {
                  if (key in inFlight) return false
                  val failed = failedAt[key]
                  if (failed != null && SystemClock.elapsedRealtime() - failed < 30_000L) return false
                  inFlight.add(key)
                  return true
              }

              @Synchronized
              private fun finished(key: String, ok: Boolean) {
                  inFlight.remove(key)
                  if (ok) failedAt.remove(key) else failedAt[key] = SystemClock.elapsedRealtime()
              }

              private fun tileX(lon: Double): Double = (lon + 180.0) / 360.0 * (1 shl Elevation.ZOOM)

              private fun tileY(lat: Double): Double {
                  val latRad = Math.toRadians(lat)
                  return (1.0 - asinh(tan(latRad)) / Math.PI) / 2.0 * (1 shl Elevation.ZOOM)
              }

              private fun tileLat(y: Double): Double =
                  Math.toDegrees(atan(sinh(Math.PI * (1.0 - 2.0 * y / (1 shl Elevation.ZOOM)))))

              private fun tileLon(x: Double): Double = x / (1 shl Elevation.ZOOM) * 360.0 - 180.0

              override fun draw(canvas: Canvas, projection: Projection) {
                  val bbox = projection.boundingBox
                  val latN = bbox.latNorth.coerceAtMost(84.0)
                  val latS = bbox.latSouth.coerceAtLeast(-84.0)
                  if (latN <= latS || canvas.width <= 0) return
                  val centerLat = (latN + latS) / 2.0
                  var lonSpan = bbox.lonEast - bbox.lonWest
                  if (lonSpan <= 0.0) lonSpan += 360.0
                  val mpp = lonSpan * 111319.49 * cos(Math.toRadians(centerLat)) / canvas.width
                  if (mpp > 20.0) return   // zoomed out too far — contours appear as you zoom in
                  val interval = when {
                      mpp <= 4.0 -> 10
                      mpp <= 10.0 -> 20
                      else -> 50
                  }

                  val x0 = floor(tileX(bbox.lonWest)).toInt()
                  val x1 = floor(tileX(bbox.lonEast)).toInt()
                  val y0 = floor(tileY(latN)).toInt()
                  val y1 = floor(tileY(latS)).toInt()
                  if ((x1 - x0 + 1).toLong() * (y1 - y0 + 1).toLong() > 72L) return

                  val lineColor = if (nightMode) Color.rgb(196, 45, 36) else Color.rgb(148, 94, 42)
                  minorPaint.color = lineColor
                  minorPaint.alpha = if (nightMode) 130 else 150
                  majorPaint.color = lineColor
                  majorPaint.alpha = if (nightMode) 190 else 215

                  var anyReady = false
                  for (ty in y0..y1) {
                      for (tx in x0..x1) {
                          if (ty < 0 || ty >= (1 shl Elevation.ZOOM)) continue
                          val key = "$tx/$ty/$interval"
                          val tc = cached(key)
                          if (tc == null) {
                              if (shouldStart(key)) {
                                  scope.launch(Dispatchers.Default) {
                                      // A throwing compute must never kill the app or leave the
                                      // key stuck in flight; treat it as a failed tile and move on.
                                      try {
                                          compute(tx, ty, interval, key)
                                      } catch (e: Exception) {
                                          finished(key, ok = false)
                                      }
                                  }
                              }
                              continue
                          }
                          anyReady = true
                          drawTile(canvas, projection, tx, ty, tc)
                      }
                  }

                  if (anyReady) drawLegend(canvas, interval, lineColor)
              }

              private fun drawTile(canvas: Canvas, projection: Projection, tx: Int, ty: Int, tc: TileContours) {
                  val lonW = tileLon(tx.toDouble())
                  val lonE = tileLon(tx + 1.0)
                  val latN = tileLat(ty.toDouble())
                  val latS = tileLat(ty + 1.0)
                  gp.setCoords(latN, lonW)
                  projection.toPixels(gp, p00)
                  gp.setCoords(latN, lonE)
                  projection.toPixels(gp, p10)
                  gp.setCoords(latS, lonW)
                  projection.toPixels(gp, p01)

                  // Web-mercator screen position is linear in tile-fraction coordinates, so a
                  // single affine matrix places the whole precomputed tile path exactly.
                  matrixValues[0] = (p10.x - p00.x) / SCALE
                  matrixValues[1] = (p01.x - p00.x) / SCALE
                  matrixValues[2] = p00.x.toFloat()
                  matrixValues[3] = (p10.y - p00.y) / SCALE
                  matrixValues[4] = (p01.y - p00.y) / SCALE
                  matrixValues[5] = p00.y.toFloat()
                  matrixValues[6] = 0f
                  matrixValues[7] = 0f
                  matrixValues[8] = 1f
                  matrix.setValues(matrixValues)

                  // Stroke widths are specified in screen px; the canvas transform scales
                  // them, so pre-divide by the matrix scale to keep line weight constant.
                  val scale = hypot(matrixValues[0], matrixValues[3]).coerceAtLeast(1e-6f)
                  minorPaint.strokeWidth = 1.1f * density / scale
                  majorPaint.strokeWidth = 1.9f * density / scale

                  canvas.save()
                  canvas.concat(matrix)
                  canvas.drawPath(tc.minor, minorPaint)
                  canvas.drawPath(tc.major, majorPaint)
                  canvas.restore()

                  if (tc.labels.isNotEmpty()) {
                      val size = 10.5f * density
                      textFill.textSize = size
                      textHalo.textSize = size
                      textFill.color = majorPaint.color
                      textFill.alpha = 235
                      textHalo.color = if (nightMode) Color.BLACK else Color.WHITE
                      textHalo.alpha = 200
                      for (l in tc.labels) {
                          labelPt[0] = l[0]
                          labelPt[1] = l[1]
                          matrix.mapPoints(labelPt)
                          val text = "${l[2].toInt()}"
                          val tw = textFill.measureText(text)
                          canvas.save()
                          canvas.rotate(-mapOrientation, labelPt[0], labelPt[1])
                          canvas.drawText(text, labelPt[0] - tw / 2f, labelPt[1] + size / 3f, textHalo)
                          canvas.drawText(text, labelPt[0] - tw / 2f, labelPt[1] + size / 3f, textFill)
                          canvas.restore()
                      }
                  }
              }

              /** Small "CI 20 m" note so the interval is never a mystery; mirrors the attribution row. */
              private fun drawLegend(canvas: Canvas, interval: Int, color: Int) {
                  val size = 9.5f * density
                  textFill.textSize = size
                  textHalo.textSize = size
                  textFill.color = color
                  textFill.alpha = 220
                  textHalo.color = if (nightMode) Color.BLACK else Color.WHITE
                  textHalo.alpha = 200
                  val text = "CI $interval m"
                  val tw = textFill.measureText(text)
                  val x = canvas.width - tw - 6f * density
                  val y = canvas.height - bottomInsetPx - 5f * density
                  canvas.save()
                  if (mapOrientation != 0f) {
                      canvas.rotate(-mapOrientation, canvas.width / 2f, canvas.height / 2f)
                  }
                  canvas.drawText(text, x, y, textHalo)
                  canvas.drawText(text, x, y, textFill)
                  canvas.restore()
              }

              private suspend fun compute(tx: Int, ty: Int, interval: Int, key: String) {
                  val bmp = Elevation.tile(context, Elevation.ZOOM, tx, ty)
                  if (bmp == null) {
                      finished(key, ok = false)
                      return
                  }
                  val tc = marchingSquares(bmp, interval)
                  store(key, tc)
                  finished(key, ok = true)
                  requestRedraw()
              }

              private fun marchingSquares(bmp: Bitmap, baseInterval: Int): TileContours {
                  val n = bmp.width
                  val px = IntArray(n * n)
                  bmp.getPixels(px, 0, n, 0, 0, n, n)
                  val e = FloatArray(n * n)
                  var mn = Float.MAX_VALUE
                  var mx = -Float.MAX_VALUE
                  for (i in 0 until n * n) {
                      val c = px[i]
                      val v = ((c shr 16 and 0xFF) * 256 + (c shr 8 and 0xFF) + (c and 0xFF) / 256f) - 32768f
                      e[i] = v
                      if (v < mn) mn = v
                      if (v > mx) mx = v
                  }
                  if (mx - mn < 0.75f) return TileContours(Path(), Path(), emptyList())

                  var iv = baseInterval
                  while ((mx - mn) / iv > 90f) iv *= 2   // extreme-relief guard keeps tiles readable

                  val minor = Path()
                  val major = Path()
                  val labels = ArrayList<FloatArray>()
                  val s = SCALE / n
                  val half = 0.5f
                  val cx = n / 2f
                  val cy = n / 2f

                  var level = ceil(mn / iv).toInt() * iv
                  while (level <= mx) {
                      val lv = level.toFloat()
                      val isMajor = level % (iv * 5) == 0
                      val p = if (isMajor) major else minor
                      var bestD = Float.MAX_VALUE
                      var bestX = 0f
                      var bestY = 0f

                      fun seg(x1: Float, y1: Float, x2: Float, y2: Float) {
                          p.moveTo((x1 + half) * s, (y1 + half) * s)
                          p.lineTo((x2 + half) * s, (y2 + half) * s)
                          if (isMajor) {
                              val mxp = (x1 + x2) / 2f
                              val myp = (y1 + y2) / 2f
                              val dd = (mxp - cx) * (mxp - cx) + (myp - cy) * (myp - cy)
                              if (dd < bestD) {
                                  bestD = dd
                                  bestX = (mxp + half) * s
                                  bestY = (myp + half) * s
                              }
                          }
                      }

                      for (j in 0 until n - 1) {
                          val row = j * n
                          for (i in 0 until n - 1) {
                              val a = e[row + i]
                              val b = e[row + i + 1]
                              val c = e[row + n + i + 1]
                              val d = e[row + n + i]
                              var idx = 0
                              if (a >= lv) idx = idx or 1
                              if (b >= lv) idx = idx or 2
                              if (c >= lv) idx = idx or 4
                              if (d >= lv) idx = idx or 8
                              if (idx == 0 || idx == 15) continue

                              val fi = i.toFloat()
                              val fj = j.toFloat()
                              // Crossing points on each cell edge (pixel-index coordinates)
                              val topX = fi + frac(a, b, lv)
                              val rightY = fj + frac(b, c, lv)
                              val botX = fi + frac(d, c, lv)
                              val leftY = fj + frac(a, d, lv)

                              when (idx) {
                                  1 -> seg(fi, leftY, topX, fj)
                                  2 -> seg(topX, fj, fi + 1f, rightY)
                                  3 -> seg(fi, leftY, fi + 1f, rightY)
                                  4 -> seg(fi + 1f, rightY, botX, fj + 1f)
                                  5 -> if ((a + b + c + d) / 4f >= lv) {
                                      seg(topX, fj, fi + 1f, rightY)
                                      seg(fi, leftY, botX, fj + 1f)
                                  } else {
                                      seg(fi, leftY, topX, fj)
                                      seg(fi + 1f, rightY, botX, fj + 1f)
                                  }
                                  6 -> seg(topX, fj, botX, fj + 1f)
                                  7 -> seg(fi, leftY, botX, fj + 1f)
                                  8 -> seg(fi, leftY, botX, fj + 1f)
                                  9 -> seg(topX, fj, botX, fj + 1f)
                                  10 -> if ((a + b + c + d) / 4f >= lv) {
                                      seg(fi, leftY, topX, fj)
                                      seg(fi + 1f, rightY, botX, fj + 1f)
                                  } else {
                                      seg(topX, fj, fi + 1f, rightY)
                                      seg(fi, leftY, botX, fj + 1f)
                                  }
                                  11 -> seg(fi + 1f, rightY, botX, fj + 1f)
                                  12 -> seg(fi, leftY, fi + 1f, rightY)
                                  13 -> seg(topX, fj, fi + 1f, rightY)
                                  14 -> seg(fi, leftY, topX, fj)
                              }
                          }
                      }

                      if (isMajor && bestD < Float.MAX_VALUE) {
                          labels.add(floatArrayOf(bestX, bestY, level.toFloat()))
                      }
                      level += iv
                  }
                  return TileContours(minor, major, labels)
              }

              private fun frac(p: Float, q: Float, lv: Float): Float {
                  val d = q - p
                  if (d == 0f) return 0.5f
                  val t = (lv - p) / d
                  return if (t < 0f) 0f else if (t > 1f) 1f else t
              }

              companion object {
                  private const val SCALE = 1024f
              }

              init {
                  isEnabled = false
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/map'
          cat > 'app/src/main/java/app/gridfix/android/map/Elevation.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.map

          import android.content.Context
          import app.gridfix.android.BuildConfig
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.math.asinh
          import kotlin.math.floor
          import kotlin.math.tan

          /**
           * Elevation from the open Mapzen/AWS Terrarium terrain tiles
           * (s3.amazonaws.com/elevation-tiles-prod). Elevation is encoded per pixel as
           * (R*256 + G + B/256) - 32768 metres. Tiles are cached on disk, so any terrain
           * looked at once keeps its elevation offline; prefetchArea pulls a whole
           * visible box deliberately.
           */
          object Elevation {

              const val ZOOM = 13   // ~19 m sample grid; source data ~10-30 m (DTED2-class)
              private val memory = object : LinkedHashMap<String, Bitmap>(16, 0.75f, true) {
                  override fun removeEldestEntry(eldest: MutableMap.MutableEntry<String, Bitmap>?): Boolean =
                      size > 12
              }

              private fun cacheDir(context: Context): File =
                  File(context.filesDir, "dem").apply { mkdirs() }

              private fun tileX(lon: Double, z: Int): Double = (lon + 180.0) / 360.0 * (1 shl z)

              private fun tileY(lat: Double, z: Int): Double {
                  val latRad = Math.toRadians(lat)
                  return (1.0 - asinh(tan(latRad)) / Math.PI) / 2.0 * (1 shl z)
              }

              /** Elevation in metres, or null when unavailable (no data yet / ocean tile miss). */
              suspend fun elevationAt(context: Context, lat: Double, lon: Double): Double? =
                  withContext(Dispatchers.IO) {
                      if (lat > 85.0 || lat < -85.0) return@withContext null
                      val xF = tileX(lon, ZOOM)
                      val yF = tileY(lat, ZOOM)
                      val x = floor(xF).toInt()
                      val y = floor(yF).toInt()
                      val bmp = tileBitmap(context, ZOOM, x, y) ?: return@withContext null
                      val px = ((xF - x) * bmp.width).toInt().coerceIn(0, bmp.width - 1)
                      val py = ((yF - y) * bmp.height).toInt().coerceIn(0, bmp.height - 1)
                      val c = bmp.getPixel(px, py)
                      val r = (c shr 16) and 0xFF
                      val g = (c shr 8) and 0xFF
                      val b = c and 0xFF
                      val elev = (r * 256 + g + b / 256.0) - 32768.0
                      if (elev < -11000 || elev > 9000) null else elev
                  }

              /** A whole Terrarium tile bitmap (from cache or network) — the contour overlay samples these. */
              suspend fun tile(context: Context, z: Int, x: Int, y: Int): Bitmap? =
                  withContext(Dispatchers.IO) { tileBitmap(context, z, x, y) }

              /** Fetch every elevation tile covering the box; returns tiles now cached. */
              suspend fun prefetchArea(
                  context: Context,
                  latNorth: Double, latSouth: Double, lonWest: Double, lonEast: Double,
              ): Int = withContext(Dispatchers.IO) {
                  val x0 = floor(tileX(lonWest, ZOOM)).toInt()
                  val x1 = floor(tileX(lonEast, ZOOM)).toInt()
                  val y0 = floor(tileY(latNorth, ZOOM)).toInt()
                  val y1 = floor(tileY(latSouth, ZOOM)).toInt()
                  var ok = 0
                  var count = 0
                  for (x in minOf(x0, x1)..maxOf(x0, x1)) {
                      for (y in minOf(y0, y1)..maxOf(y0, y1)) {
                          count++
                          if (count > 400) return@withContext ok   // sanity cap ~ a division sector
                          if (tileBitmap(context, ZOOM, x, y) != null) ok++
                      }
                  }
                  ok
              }

              @Synchronized
              private fun cached(key: String): Bitmap? = memory[key]

              @Synchronized
              private fun remember(key: String, bmp: Bitmap) {
                  memory[key] = bmp
              }

              // Tiles that failed to download recently: skip them for a while instead of
              // re-opening a connection per sample (a viewshed offline is ~100k samples).
              private val failedAt = java.util.concurrent.ConcurrentHashMap<String, Long>()
              private const val RETRY_AFTER_MS = 60_000L

              private fun tileBitmap(context: Context, z: Int, x: Int, y: Int): Bitmap? {
                  if (x < 0 || y < 0 || x >= (1 shl z) || y >= (1 shl z)) return null
                  val key = "$z/$x/$y"
                  cached(key)?.let { return it }
                  val file = File(cacheDir(context), "${z}_${x}_$y.png")
                  if (!file.exists()) {
                      val lastFail = failedAt[key]
                      if (lastFail != null && System.currentTimeMillis() - lastFail < RETRY_AFTER_MS) return null
                      val ok = runCatching {
                          val url = URL("https://s3.amazonaws.com/elevation-tiles-prod/terrarium/$z/$x/$y.png")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.connectTimeout = 8000
                          conn.readTimeout = 8000
                          conn.setRequestProperty("User-Agent", "MGRS GPS/" + BuildConfig.VERSION_NAME + " (rafaelm2002@gmail.com)")
                          try {
                              // Only a real PNG tile gets cached: a captive-portal page or an
                              // error body must never be stored as elevation data.
                              if (conn.responseCode != 200) return@runCatching false
                              val type = conn.contentType ?: ""
                              if (!type.startsWith("image/png")) return@runCatching false
                              // Unique temp name: concurrent callers (crosshair, contours, viewshed)
                              // must not publish each other's half-written files.
                              val tmp = File.createTempFile("dem", ".part", file.parentFile)
                              conn.inputStream.use { input ->
                                  tmp.outputStream().use { out -> input.copyTo(out) }
                              }
                              val probe = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                              BitmapFactory.decodeFile(tmp.absolutePath, probe)
                              if (probe.outWidth != 256 || probe.outHeight != 256) {
                                  tmp.delete()
                                  return@runCatching false
                              }
                              if (!tmp.renameTo(file)) {
                                  tmp.delete()
                                  // another caller won the race; use whatever it published
                                  return@runCatching file.exists()
                              }
                              true
                          } finally {
                              conn.disconnect()
                          }
                      }.getOrDefault(false)
                      if (!ok) {
                          failedAt[key] = System.currentTimeMillis()
                          return null
                      }
                      failedAt.remove(key)
                  }
                  val bmp = runCatching { BitmapFactory.decodeFile(file.absolutePath) }.getOrNull()
                      ?: run {
                          file.delete()
                          return null
                      }
                  remember(key, bmp)
                  return bmp
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/map'
          cat > 'app/src/main/java/app/gridfix/android/map/Terrain.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.map

          import android.content.Context
          import android.graphics.Bitmap
          import app.gridfix.android.data.GeoVertex
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import kotlin.math.atan2
          import kotlin.math.ceil
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.sin
          import kotlin.math.sqrt

          /**
           * Terrain analysis on the cached elevation data: line-of-sight between two
           * points and elevation profiles along routes. Uses the same Terrarium tiles
           * as the crosshair readout (~10-30 m source data), so anything works offline
           * once the area's elevation has been viewed or downloaded.
           *
           * Line of sight applies the standard earth-curvature + atmospheric-refraction
           * correction (effective earth radius x 4/3): terrain between the endpoints is
           * depressed by d1*d2 / (2 * Re), which is what makes ~1.7 m eyes see ~4.9 km
           * to a sea-level horizon.
           */
          object Terrain {

              private const val EARTH_R = 6371008.8
              private const val EFFECTIVE_R = EARTH_R * 4.0 / 3.0

              data class Profile(
                  val distancesM: FloatArray,   // cumulative along-path distance per sample
                  val elevations: FloatArray,   // metres MSL; Float.NaN where no data
                  val legEndIndex: IntArray,    // sample index where each leg ends (route profiles)
                  val missing: Int,             // samples with no elevation data
              ) {
                  val totalM: Float get() = if (distancesM.isEmpty()) 0f else distancesM.last()

                  /** Total climb and descent, ignoring jitter under [threshold] metres. */
                  fun gainLoss(threshold: Float = 1.5f): Pair<Float, Float> {
                      var gain = 0f
                      var loss = 0f
                      var anchor = Float.NaN
                      for (e in elevations) {
                          if (e.isNaN()) continue
                          if (anchor.isNaN()) {
                              anchor = e
                              continue
                          }
                          val d = e - anchor
                          if (d >= threshold) {
                              gain += d
                              anchor = e
                          } else if (d <= -threshold) {
                              loss -= d
                              anchor = e
                          }
                      }
                      return gain to loss
                  }
              }

              private fun haversineM(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
                  val dLat = Math.toRadians(lat2 - lat1)
                  val dLon = Math.toRadians(lon2 - lon1)
                  val h = sin(dLat / 2) * sin(dLat / 2) +
                      cos(Math.toRadians(lat1)) * cos(Math.toRadians(lat2)) *
                      sin(dLon / 2) * sin(dLon / 2)
                  return 2 * EARTH_R * atan2(sqrt(h), sqrt(1 - h))
              }

              /** Sample elevations along a multi-leg path, ~[stepM] apart, capped at [maxSamples]. */
              suspend fun profile(
                  context: Context,
                  points: List<GeoVertex>,
                  stepM: Double = 25.0,
                  maxSamples: Int = 600,
              ): Profile? {
                  if (points.size < 2) return null
                  val legLens = DoubleArray(points.size - 1)
                  var total = 0.0
                  for (i in 0 until points.size - 1) {
                      legLens[i] = haversineM(points[i].lat, points[i].lon, points[i + 1].lat, points[i + 1].lon)
                      total += legLens[i]
                  }
                  if (total <= 0.0) return null
                  val step = max(stepM, total / maxSamples)

                  val dists = ArrayList<Float>()
                  val elevs = ArrayList<Float>()
                  val legEnds = ArrayList<Int>()
                  var missing = 0
                  var walked = 0.0

                  suspend fun sampleAt(lat: Double, lon: Double, dist: Double) {
                      dists.add(dist.toFloat())
                      val e = Elevation.elevationAt(context, lat, lon)
                      if (e == null) {
                          missing++
                          elevs.add(Float.NaN)
                      } else {
                          elevs.add(e.toFloat())
                      }
                  }

                  sampleAt(points[0].lat, points[0].lon, 0.0)
                  for (i in 0 until points.size - 1) {
                      val len = legLens[i]
                      if (len > 0.0) {
                          var d = step
                          while (d < len) {
                              val t = d / len
                              sampleAt(
                                  points[i].lat + (points[i + 1].lat - points[i].lat) * t,
                                  points[i].lon + (points[i + 1].lon - points[i].lon) * t,
                                  walked + d,
                              )
                              d += step
                          }
                      }
                      walked += len
                      sampleAt(points[i + 1].lat, points[i + 1].lon, walked)
                      legEnds.add(dists.size - 1)
                  }
                  return Profile(
                      distancesM = dists.toFloatArray(),
                      elevations = elevs.toFloatArray(),
                      legEndIndex = legEnds.toIntArray(),
                      missing = missing,
                  )
              }

              data class LosResult(
                  val visible: Boolean,
                  val profile: Profile,
                  val observerElev: Float,      // ground MSL at observer
                  val targetElev: Float,        // ground MSL at target
                  val observerHeight: Float,    // metres above ground
                  val targetHeight: Float,
                  val blockIndex: Int,          // first blocking sample (-1 when visible)
                  val blockDistM: Float,
                  val blockLat: Double,
                  val blockLon: Double,
                  val clearObserverHeight: Float, // min observer height (m AGL) that would see the target
                  /** Smallest gap between the sight line and terrain (m); the margin of a VISIBLE result. */
                  val minClearanceM: Float,
                  /** Along-path distance (m) of that tightest point. */
                  val minClearanceDistM: Float,
                  /** Sight-line height (curvature-corrected frame) per sample, for drawing. */
                  val sightLine: FloatArray,
                  /** Terrain in the same curvature-corrected frame, for drawing. */
                  val effectiveTerrain: FloatArray,
              )

              const val CLS_NONE = 0
              const val CLS_VISIBLE = 1
              const val CLS_MARGINAL = 2
              const val CLS_MASKED = 3

              // Day palette: traffic-light. Night palette: red-family intensity ramp
              // (faint dark red = seen, mid = standing only, bright red = masked), so
              // the shade stays inside the night mode's red-light discipline instead of
              // washing dark adaptation with green and amber.
              private val DAY_PALETTE = intArrayOf(0, 0x4600C853, 0x55FFD600, 0x50FF1744)
              private val NIGHT_PALETTE = intArrayOf(0, 0x307F231D, 0x48C42D24, 0x60FF3B30)

              /**
               * A computed viewshed raster: what the observer can see out to [radiusM].
               * Cell classes: VISIBLE (even a low target is seen), MARGINAL (only a
               * standing man / vehicle-height target is seen — partial defilade),
               * MASKED (full defilade for a 3 m target). Cells without elevation data
               * stay transparent. Colors are applied at draw time via [bitmapFor], so
               * the same computed shade renders with the day or night palette.
               */
              data class Viewshed(
                  val classes: IntArray,
                  val gridN: Int,
                  val latN: Double,
                  val latS: Double,
                  val lonW: Double,
                  val lonE: Double,
                  val obsLat: Double,
                  val obsLon: Double,
                  val radiusM: Float,
                  val missing: Int,
              ) {
                  private var cached: Bitmap? = null
                  private var cachedNight = false

                  fun bitmapFor(night: Boolean): Bitmap {
                      val c = cached
                      if (c != null && cachedNight == night) return c
                      val palette = if (night) NIGHT_PALETTE else DAY_PALETTE
                      val px = IntArray(classes.size) { palette[classes[it]] }
                      val bmp = Bitmap.createBitmap(px, gridN, gridN, Bitmap.Config.ARGB_8888)
                      cached = bmp
                      cachedNight = night
                      return bmp
                  }
              }

              /**
               * Radial-sweep viewshed from one observer. Same curvature/refraction model
               * as [lineOfSight] (observer-centric drop d²/2Re). Low-target threshold
               * 0.5 m AGL, standing/vehicle threshold 3 m AGL.
               */
              suspend fun viewshed(
                  context: Context,
                  obsLat: Double,
                  obsLon: Double,
                  observerHeight: Float,
                  radiusM: Double,
                  gridN: Int = 192,
                  rays: Int = 768,
              ): Viewshed? = withContext(Dispatchers.Default) {
                  val obsGround = Elevation.elevationAt(context, obsLat, obsLon)
                      ?: return@withContext null
                  val eye = obsGround + observerHeight
                  val kx = cos(Math.toRadians(obsLat))
                  val dLat = radiusM / 111319.49
                  val dLon = radiusM / (111319.49 * kx)
                  val latN = obsLat + dLat
                  val latS = obsLat - dLat
                  val lonW = obsLon - dLon
                  val lonE = obsLon + dLon

                  val classes = IntArray(gridN * gridN)
                  val cell = 2.0 * radiusM / gridN
                  val step = cell * 0.7
                  val samples = ceil(radiusM / step).toInt()
                  var missing = 0

                  for (r in 0 until rays) {
                      val az = 2.0 * Math.PI * r / rays
                      val sinA = sin(az)
                      val cosA = cos(az)
                      var maxSlope = -1e9
                      var d = step
                      for (s in 0 until samples) {
                          if (d > radiusM) break
                          val plat = obsLat + (d * cosA) / 111319.49
                          val plon = obsLon + (d * sinA) / (111319.49 * kx)
                          val px = (((plon - lonW) / (lonE - lonW)) * gridN).toInt()
                          val py = (((latN - plat) / (latN - latS)) * gridN).toInt()
                          val e = Elevation.elevationAt(context, plat, plon)
                          if (e == null) {
                              missing++
                          } else {
                              val te = e - d * d / (2.0 * EFFECTIVE_R)
                              val slopeLow = (te + 0.5 - eye) / d
                              val slopeStanding = (te + 3.0 - eye) / d
                              val cls = when {
                                  slopeLow >= maxSlope -> CLS_VISIBLE
                                  slopeStanding >= maxSlope -> CLS_MARGINAL
                                  else -> CLS_MASKED
                              }
                              if (px in 0 until gridN && py in 0 until gridN) {
                                  classes[py * gridN + px] = cls
                              }
                              val slopeGround = (te - eye) / d
                              if (slopeGround > maxSlope) maxSlope = slopeGround
                          }
                          d += step
                      }
                  }
                  // observer's own cell reads visible
                  classes[(gridN / 2) * gridN + gridN / 2] = CLS_VISIBLE

                  Viewshed(
                      classes = classes,
                      gridN = gridN,
                      latN = latN, latS = latS, lonW = lonW, lonE = lonE,
                      obsLat = obsLat, obsLon = obsLon,
                      radiusM = radiusM.toFloat(),
                      missing = missing,
                  )
              }

              /**
               * Line of sight observer -> target. Heights are metres above ground.
               * Returns null when elevation data is missing at either endpoint.
               */
              suspend fun lineOfSight(
                  context: Context,
                  obsLat: Double, obsLon: Double, observerHeight: Float,
                  tgtLat: Double, tgtLon: Double, targetHeight: Float,
              ): LosResult? {
                  val prof = profile(
                      context,
                      listOf(GeoVertex(obsLat, obsLon), GeoVertex(tgtLat, tgtLon)),
                      stepM = 20.0,
                      maxSamples = 500,
                  ) ?: return null
                  val n = prof.elevations.size
                  if (n < 2) return null
                  val obsGround = prof.elevations.first()
                  val tgtGround = prof.elevations.last()
                  if (obsGround.isNaN() || tgtGround.isNaN()) return null
                  val totalD = prof.totalM.toDouble()

                  // Curvature-corrected frame: depress terrain by d1*d2 / (2 Re)
                  val eff = FloatArray(n)
                  for (i in 0 until n) {
                      val d1 = prof.distancesM[i].toDouble()
                      val bulge = d1 * (totalD - d1) / (2.0 * EFFECTIVE_R)
                      eff[i] = if (prof.elevations[i].isNaN()) Float.NaN
                      else (prof.elevations[i] - bulge).toFloat()
                  }

                  val a = obsGround + observerHeight       // endpoints carry no bulge
                  val b = tgtGround + targetHeight
                  val sight = FloatArray(n)
                  val clearance = 0.5f
                  var blockIdx = -1
                  var required = 0f
                  var minGap = Float.POSITIVE_INFINITY
                  var minGapDist = 0f
                  for (i in 0 until n) {
                      val t = if (totalD == 0.0) 0f else (prof.distancesM[i] / prof.totalM)
                      sight[i] = a + (b - a) * t
                      if (i in 1 until n - 1 && !eff[i].isNaN()) {
                          val gap = sight[i] - eff[i]
                          if (gap < minGap) {
                              minGap = gap
                              minGapDist = prof.distancesM[i]
                          }
                          if (eff[i] + clearance > sight[i] && blockIdx == -1) {
                              blockIdx = i
                          }
                          // observer height that would clear this sample (target end fixed)
                          if (t < 1f) {
                              val need = ((eff[i] + clearance - b * t) / (1f - t)) - obsGround
                              if (need > required) required = need
                          }
                      }
                  }

                  val blockT = if (blockIdx >= 0) prof.distancesM[blockIdx] / prof.totalM else 0f
                  return LosResult(
                      visible = blockIdx == -1,
                      profile = prof,
                      observerElev = obsGround,
                      targetElev = tgtGround,
                      observerHeight = observerHeight,
                      targetHeight = targetHeight,
                      blockIndex = blockIdx,
                      blockDistM = if (blockIdx >= 0) prof.distancesM[blockIdx] else 0f,
                      blockLat = obsLat + (tgtLat - obsLat) * blockT,
                      blockLon = obsLon + (tgtLon - obsLon) * blockT,
                      clearObserverHeight = max(required, 0f),
                      minClearanceM = if (minGap.isFinite()) minGap else Float.NaN,
                      minClearanceDistM = minGapDist,
                      sightLine = sight,
                      effectiveTerrain = eff,
                  )
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/ui'
          cat > 'app/src/main/java/app/gridfix/android/ui/FieldTools.kt' <<'EOF_GRIDFIX'
