                              )
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  FilterChip(
                                      selected = useCurrent,
                                      onClick = { useCurrent = true },
                                      label = { Text("Current position") },
                                      enabled = loc != null,
                                  )
                                  FilterChip(
                                      selected = !useCurrent,
                                      onClick = { useCurrent = false },
                                      label = { Text("Enter MGRS") },
                                  )
                              }
                              if (!useCurrent) {
                                  OutlinedTextField(
                                      value = coord,
                                      onValueChange = { coord = it.uppercase(Locale.US); error = null },
                                      label = { Text("MGRS grid") },
                                      placeholder = { Text("40R CN 12345 67890") },
                                      singleLine = true,
                                  )
                              } else if (loc != null) {
                                  Text(
                                      "Position: " + (Coordinates.mgrs(loc.latitude, loc.longitude, 8)?.full ?: "—"),
                                      style = MaterialTheme.typography.bodySmall,
                                      fontFamily = FontFamily.Monospace,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                              error?.let {
                                  Text(
                                      it,
                                      style = MaterialTheme.typography.bodySmall,
                                      color = MaterialTheme.colorScheme.error,
                                  )
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = {
                              val fallbackName = "WP " + (waypoints.size + 1)
                              if (useCurrent && loc != null) {
                                  onAdd(name.ifBlank { fallbackName }, loc.latitude, loc.longitude)
                                  showAdd = false
                              } else {
                                  val parsed = Coordinates.parseMgrs(coord)
                                  if (parsed == null) {
                                      error = "Couldn't read that grid — check it and try again."
                                  } else {
                                      onAdd(name.ifBlank { fallbackName }, parsed.first, parsed.second)
                                      showAdd = false
                                  }
                              }
                          }) { Text("Add") }
                      },
                      dismissButton = {
                          TextButton(onClick = { showAdd = false }) { Text("Cancel") }
                      },
                  )
              }

              deleteCandidate?.let { w ->
                  AlertDialog(
                      onDismissRequest = { deleteCandidate = null },
                      title = { Text("Delete ${w.name}?") },
                      text = { Text("This waypoint will be removed permanently.") },
                      confirmButton = {
                          TextButton(onClick = {
                              onDelete(w.id)
                              deleteCandidate = null
                          }) { Text("Delete") }
                      },
                      dismissButton = {
                          TextButton(onClick = { deleteCandidate = null }) { Text("Cancel") }
                      },
                  )
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/ui/theme'
          cat > 'app/src/main/java/app/gridfix/android/ui/theme/Theme.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          // Tactical dark palette (default)
          private val TacticalColors = darkColorScheme(
              primary = Color(0xFF7BC67E),
              onPrimary = Color(0xFF0B0E13),
              secondary = Color(0xFFE0B458),
              onSecondary = Color(0xFF0B0E13),
              background = Color(0xFF0B0E13),
              onBackground = Color(0xFFE8EDF2),
              surface = Color(0xFF151B24),
              onSurface = Color(0xFFE8EDF2),
              surfaceVariant = Color(0xFF1D2530),
              onSurfaceVariant = Color(0xFF9AA7B5),
              outline = Color(0xFF3A4654),
              error = Color(0xFFE57373),
              onError = Color(0xFF0B0E13),
          )

          // Night-vision palette: red on black to preserve dark adaptation
          private val NightColors = darkColorScheme(
              primary = Color(0xFFFF3B30),
              onPrimary = Color(0xFF000000),
              secondary = Color(0xFFB3251C),
              onSecondary = Color(0xFF000000),
              background = Color(0xFF000000),
              onBackground = Color(0xFFFF3B30),
              surface = Color(0xFF120000),
              onSurface = Color(0xFFFF3B30),
              surfaceVariant = Color(0xFF1C0300),
              onSurfaceVariant = Color(0xFFB3251C),
              outline = Color(0xFF5A100A),
              error = Color(0xFFFF3B30),
              onError = Color(0xFF000000),
          )

          @Composable
          fun GridFixTheme(
              nightMode: Boolean,
              content: @Composable () -> Unit,
          ) {
              MaterialTheme(
                  colorScheme = if (nightMode) NightColors else TacticalColors,
                  content = content,
              )
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/res/drawable'
          cat > 'app/src/main/res/drawable/ic_launcher_foreground.xml' <<'EOF_GRIDFIX'
          <?xml version="1.0" encoding="utf-8"?>
