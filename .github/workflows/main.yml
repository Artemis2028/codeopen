name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.14 (folders, declination, MSL, paywall) delta, plain text, auditable below)
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 42
                  versionName = "0.9.14"
                  // MapTiler API key from the CI secret; empty in builds without it (community-tile fallback)
                  buildConfigField("String", "MAPTILER_KEY", "\"" + (System.getenv("MAPTILER_KEY") ?: "") + "\"")
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")

              // Transitive androidx.fragment 1.1.0 is flagged outdated by Play; pin a current one
              implementation("androidx.fragment:fragment:1.8.5")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/Backup.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.InputStream
          import java.io.OutputStream
          import java.util.Locale
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream

          /**
           * Whole-app backup as one zip: a JSON snapshot of waypoints, folders,
           * graphics, settings, and the practice log, plus each track's point file.
           * Restore is idempotent — everything keeps its original id and anything
           * already on the device is skipped, so restoring twice never duplicates.
           */
          object Backup {

              const val VERSION = 1

              suspend fun export(
                  context: Context,
                  out: OutputStream,
                  waypoints: List<Waypoint>,
                  folders: List<FolderInfo>,
                  graphics: List<TacGraphic>,
                  settings: AppSettings,
                  tracks: List<TrackInfo>,
                  courseHistory: List<CourseResult>,
                  nowMillis: Long,
              ) = withContext(Dispatchers.IO) {
                  val root = JSONObject()
                      .put("app", "GridFix")
                      .put("version", VERSION)
                      .put("exportedAt", nowMillis)
                  root.put("waypoints", JSONArray().also { a ->
                      for (w in waypoints) a.put(
                          JSONObject()
                              .put("id", w.id).put("name", w.name)
                              .put("lat", w.lat).put("lon", w.lon)
                              .put("createdAt", w.createdAt).put("folder", w.folder)
                              .put("symbol", w.symbol).put("affiliation", w.affiliation)
                              .put("echelon", w.echelon).put("designation", w.designation)
                              .put("kind", w.kind).put("rotation", w.rotation.toDouble())
                      )
                  })
                  root.put("folders", JSONArray().also { a ->
                      for (f in folders) a.put(JSONObject().put("name", f.name).put("visible", f.visible))
                  })
                  root.put("graphics", JSONArray().also { a ->
                      for (g in graphics) {
                          val pts = JSONArray()
                          for (v in g.points) pts.put(JSONArray().put(v.lat).put(v.lon))
                          a.put(
                              JSONObject()
                                  .put("id", g.id).put("name", g.name).put("type", g.type)
                                  .put("points", pts).put("folder", g.folder)
                                  .put("affiliation", g.affiliation).put("createdAt", g.createdAt)
                                  .put("echelon", g.echelon)
                          )
                      }
                  })
                  root.put("settings", JSONObject()
                      .put("nightMode", settings.nightMode)
                      .put("keepScreenOn", settings.keepScreenOn)
                      .put("mgrsDigits", settings.mgrsDigits)
                      .put("latLonFormat", settings.latLonFormat)
                      .put("units", settings.units)
                      .put("angleUnit", settings.angleUnit)
                      .put("northRef", settings.northRef)
                      .put("pacePer100m", settings.pacePer100m)
                      .put("face", settings.face)
                      .put("orientation", settings.orientation)
                      .put("declinationOverride", settings.declinationOverride?.toDouble() ?: JSONObject.NULL)
                  )
                  root.put("tracks", JSONArray().also { a ->
                      for (t in tracks) a.put(
                          JSONObject()
                              .put("id", t.id).put("name", t.name)
                              .put("startedAt", t.startedAt).put("endedAt", t.endedAt)
                              .put("distanceM", t.distanceM).put("pointCount", t.pointCount)
                              .put("folder", t.folder)
                      )
                  })
                  root.put("courseHistory", JSONArray().also { a ->
                      for (r in courseHistory) a.put(
                          JSONObject()
                              .put("name", r.name).put("points", r.points)
                              .put("started", r.startedAt).put("total", r.totalMillis)
                              .put("splits", JSONArray(r.splitsMillis))
                      )
                  })

                  val zip = ZipOutputStream(out)
                  zip.putNextEntry(ZipEntry("gridfix-backup.json"))
                  zip.write(root.toString(2).toByteArray())
                  zip.closeEntry()
                  for (t in tracks) {
                      val pts = TrackRepository.readPoints(context, t.id)
                      if (pts.isEmpty()) continue
                      zip.putNextEntry(ZipEntry("tracks/${t.id}.txt"))
                      zip.write(
                          pts.joinToString("") {
                              String.format(Locale.US, "%.7f %.7f %d %.1f\n", it.lat, it.lon, it.time, it.alt)
                          }.toByteArray()
                      )
                      zip.closeEntry()
                  }
                  zip.finish()
              }

              data class RestoreResult(
                  val waypoints: Int,
                  val graphics: Int,
                  val tracks: Int,
                  val course: Int,
                  val settingsApplied: Boolean,
              ) {
                  fun summary(): String {
                      val parts = mutableListOf<String>()
                      if (waypoints > 0) parts.add("$waypoints waypoints")
                      if (graphics > 0) parts.add("$graphics graphics")
                      if (tracks > 0) parts.add("$tracks tracks")
                      if (course > 0) parts.add("$course course results")
                      if (settingsApplied) parts.add("settings")
                      return if (parts.isEmpty()) "Nothing new to restore — everything was already here"
                      else "Restored " + parts.joinToString(", ")
                  }
              }

              suspend fun restore(
                  input: InputStream,
                  waypointRepo: WaypointRepository,
                  graphicsRepo: GraphicsRepository,
                  trackRepo: TrackRepository,
                  settingsRepo: SettingsRepository,
                  courseRepo: CourseRepository,
              ): RestoreResult = withContext(Dispatchers.IO) {
                  val entries = HashMap<String, ByteArray>()
                  val zin = ZipInputStream(input)
                  var e: ZipEntry? = zin.nextEntry
                  while (e != null) {
                      val wanted = e.name == "gridfix-backup.json" || e.name.startsWith("tracks/")
                      if (!e.isDirectory && wanted) {
                          val out = java.io.ByteArrayOutputStream()
                          val buf = ByteArray(16 * 1024)
                          var total = 0L
                          var tooBig = false
                          while (true) {
                              val n = zin.read(buf)
                              if (n < 0) break
                              total += n
                              if (total > 64L * 1024 * 1024) { tooBig = true; break }
                              out.write(buf, 0, n)
                          }
                          if (!tooBig) entries[e.name] = out.toByteArray()
                      }
                      zin.closeEntry()
                      e = zin.nextEntry
                  }
                  val rootBytes = entries["gridfix-backup.json"]
                      ?: throw IllegalArgumentException("not an MGRS GPS backup")
                  val root = JSONObject(String(rootBytes))

                  val wps = ArrayList<Waypoint>()
                  root.optJSONArray("waypoints")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          wps.add(
                              Waypoint(
                                  id = o.getString("id"), name = o.getString("name"),
                                  lat = o.getDouble("lat"), lon = o.getDouble("lon"),
                                  createdAt = o.optLong("createdAt"),
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                                  symbol = o.optString("symbol", DEFAULT_SYMBOL),
                                  affiliation = o.optString("affiliation", "none"),
                                  echelon = o.optString("echelon", ""),
                                  designation = o.optString("designation", ""),
                                  kind = o.optString("kind", KIND_WP),
                                  rotation = o.optDouble("rotation", 0.0).toFloat(),
                              )
                          )
                      }
                  }
                  val folderInfos = ArrayList<FolderInfo>()
                  root.optJSONArray("folders")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          folderInfos.add(FolderInfo(canonicalFolder(o.getString("name")), o.optBoolean("visible", true)))
                      }
                  }
                  val addedWp = waypointRepo.restore(wps, folderInfos)

                  val gfx = ArrayList<TacGraphic>()
                  root.optJSONArray("graphics")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val ptsArr = o.getJSONArray("points")
                          val pts = ArrayList<GeoVertex>()
                          for (j in 0 until ptsArr.length()) {
                              val v = ptsArr.getJSONArray(j)
                              pts.add(GeoVertex(v.getDouble(0), v.getDouble(1)))
                          }
                          gfx.add(
                              TacGraphic(
                                  id = o.getString("id"), name = o.getString("name"),
                                  type = o.getString("type"), points = pts,
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                                  affiliation = o.optString("affiliation", "none"),
                                  createdAt = o.optLong("createdAt"),
                                  echelon = o.optString("echelon", ""),
                              )
                          )
                      }
                  }
                  val addedG = graphicsRepo.restore(gfx)

                  var addedT = 0
                  root.optJSONArray("tracks")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val info = TrackInfo(
                              id = o.getString("id"), name = o.getString("name"),
                              startedAt = o.optLong("startedAt"), endedAt = o.optLong("endedAt"),
                              distanceM = o.optDouble("distanceM", 0.0),
                              pointCount = o.optInt("pointCount", 0),
                              folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                          )
                          val ptBytes = entries["tracks/${info.id}.txt"] ?: continue
                          val pts = String(ptBytes).lines().mapNotNull { line ->
                              val parts = line.trim().split(" ")
                              if (parts.size < 3) return@mapNotNull null
                              runCatching {
                                  TrackPoint(
                                      lat = parts[0].toDouble(), lon = parts[1].toDouble(),
                                      time = parts[2].toLong(),
                                      alt = parts.getOrNull(3)?.toDouble() ?: 0.0,
                                  )
                              }.getOrNull()
                          }
                          if (trackRepo.restore(info, pts)) addedT++
                      }
                  }

                  var settingsApplied = false
                  root.optJSONObject("settings")?.let { s ->
                      settingsRepo.applyAll(
                          AppSettings(
                              nightMode = s.optBoolean("nightMode", false),
                              keepScreenOn = s.optBoolean("keepScreenOn", true),
                              mgrsDigits = s.optInt("mgrsDigits", 10),
                              latLonFormat = s.optInt("latLonFormat", 1),
                              units = s.optInt("units", 0),
                              angleUnit = s.optInt("angleUnit", 0),
                              northRef = s.optInt("northRef", 0),
                              pacePer100m = s.optInt("pacePer100m", 65),
                              face = s.optInt("face", 1),
                              orientation = s.optInt("orientation", 0),
                              declinationOverride = if (s.isNull("declinationOverride")) null else s.optDouble("declinationOverride").toFloat(),
                          )
                      )
                      settingsApplied = true
                  }

                  val results = ArrayList<CourseResult>()
                  root.optJSONArray("courseHistory")?.let { a ->
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val splits = o.getJSONArray("splits")
                          results.add(
                              CourseResult(
                                  name = o.getString("name"), points = o.getInt("points"),
                                  startedAt = o.getLong("started"), totalMillis = o.getLong("total"),
                                  splitsMillis = buildList {
                                      for (j in 0 until splits.length()) add(splits.getLong(j))
                                  },
                              )
                          )
                      }
                  }
                  val addedC = courseRepo.restoreHistory(results)

                  RestoreResult(addedWp, addedG, addedT, addedC, settingsApplied)
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/GraphicsRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import androidx.datastore.core.handlers.ReplaceFileCorruptionHandler
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.UUID

          private val Context.graphicsStore by preferencesDataStore(
              name = "graphics",
              corruptionHandler = ReplaceFileCorruptionHandler { emptyPreferences() },
          )

          /** A simple lat/lon vertex for tactical graphics. */
          data class GeoVertex(val lat: Double, val lon: Double)

          /**
           * A tactical control-measure graphic drawn on the map.
           * Types: phase_line, boundary, axis, doa, objective, aa, route.
           * Area types (objective, aa) are closed automatically when rendered.
           */
          data class TacGraphic(
              val id: String,
              val name: String,
              val type: String,
              val points: List<GeoVertex>,
              val folder: String = DEFAULT_FOLDER,
              val affiliation: String = "none",
              val createdAt: Long = 0L,
              val echelon: String = "",   // boundary lines carry the echelon mark on the line
          )

          object GraphicTypes {
              /** type key -> (label, minimum vertices, isArea) */
              val all = listOf(
                  Triple("phase_line", "Phase line", 2),
                  Triple("boundary", "Boundary", 2),
                  Triple("axis", "Axis of advance", 2),
                  Triple("doa", "Direction of attack", 2),
                  Triple("objective", "Objective", 3),
                  Triple("aa", "Assembly area", 3),
                  Triple("route", "Route", 2),
                  Triple("lz", "Landing zone", 3),
                  Triple("pz", "Pickup zone", 3),
                  Triple("bp", "Battle position", 3),
                  Triple("ea", "Engagement area", 3),
                  Triple("nai", "NAI", 3),
                  Triple("tai", "TAI", 3),
                  Triple("area", "Area (sketch)", 3),
                  Triple("screen_l", "Screen line", 2),
                  Triple("guard_l", "Guard line", 2),
                  Triple("cover_l", "Cover line", 2),
                  Triple("flot", "FLOT", 2),
                  Triple("obstacle_line", "Obstacle line", 2),
                  Triple("wire", "Wire obstacle", 2),
                  Triple("lane", "Lane", 2),
                  Triple("minefield", "Minefield", 3),
                  Triple("strongpoint", "Strongpoint", 3),
                  Triple("roadblock", "Roadblock", 1),
                  Triple("ring", "Range ring", 2),
                  Triple("sector", "Sector of fire", 3),
                  Triple("trp", "Target ref point", 1),
                  Triple("checkpoint", "Checkpoint", 1),
                  Triple("dp", "Decision point", 1),
                  Triple("text", "Text label", 1),
              )

              fun label(type: String): String = all.firstOrNull { it.first == type }?.second ?: type

              fun minPoints(type: String): Int = all.firstOrNull { it.first == type }?.third ?: 2

              fun isArea(type: String): Boolean = type in setOf(
                  "objective", "aa", "lz", "pz", "area", "bp", "ea", "nai", "tai",
                  "minefield", "strongpoint",
              )

              /** Security line graphics: letter box mid-line, arrows outward both ends. */
              fun securityLetter(type: String): String? = when (type) {
                  "screen_l" -> "S"
                  "guard_l" -> "G"
                  "cover_l" -> "C"
                  else -> null
              }

              /**
               * Types placed with a fixed number of taps finish themselves — no Done press.
               * Ring: center then range edge. Sector: apex, left limit, right limit.
               */
              fun fixedPoints(type: String): Int? = when (type) {
                  "ring" -> 2
                  "sector" -> 3
                  "trp", "checkpoint", "dp", "text", "roadblock" -> 1
                  else -> null
              }

              /** Placement hint shown when the type is picked. */
              fun placeHint(type: String): String? = when (type) {
                  "ring" -> "Tap the center, then the range edge"
                  "sector" -> "Tap the apex, then left limit, then right limit"
                  "trp", "checkpoint", "dp", "roadblock" -> "Tap the map to place it"
                  "text" -> "Tap the map where the text goes"
                  "screen_l", "guard_l", "cover_l" -> "Tap along the security line, then Done"
                  "flot" -> "Trace your forward line — the scallops face left of your drawing direction (toward the enemy)"
                  "lane" -> "Trace the cleared lane's centerline"
                  "obstacle_line", "wire" -> "Trace along the obstacle"
                  else -> null
              }

              /** Display prefix used in the on-map label, per doctrine shorthand. */
              fun labelPrefix(type: String): String = when (type) {
                  "phase_line" -> "PL "
                  "objective" -> "OBJ "
                  "aa" -> "AA "
                  "lz" -> "LZ "
                  "pz" -> "PZ "
                  "bp" -> "BP "
                  "ea" -> "EA "
                  "nai" -> "NAI "
                  "tai" -> "TAI "
                  "trp" -> "TRP "
                  "checkpoint" -> "CP "
                  "dp" -> "DP "
                  else -> ""
              }
          }

          class GraphicsRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")

              val graphics: Flow<List<TacGraphic>> = context.graphicsStore.data.map { p ->
                  decode(p[listKey] ?: "[]")
              }

              suspend fun add(
                  name: String,
                  type: String,
                  points: List<GeoVertex>,
                  folder: String,
                  affiliation: String,
                  nowMillis: Long,
                  echelon: String = "",
              ): String {
                  val g = TacGraphic(
                      id = UUID.randomUUID().toString(),
                      name = name.trim(),
                      type = type,
                      points = points,
                      folder = canonicalFolder(folder),
                      affiliation = affiliation,
                      createdAt = nowMillis,
                      echelon = echelon,
                  )
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + g)
                  }
                  return g.id
              }

              suspend fun rename(
                  id: String,
                  name: String,
                  folder: String,
                  affiliation: String,
                  echelon: String = "",
              ) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(
                                  name = name.trim(),
                                  folder = canonicalFolder(folder),
                                  affiliation = affiliation,
                                  echelon = echelon,
                              ) else it
                          }
                      )
                  }
              }

              /** Merge a backup by id — already-present graphics are skipped. Returns added count. */
              suspend fun restore(imported: List<TacGraphic>): Int {
                  var added = 0
                  context.graphicsStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      val ids = current.map { it.id }.toSet()
                      val fresh = imported.filter { it.id !in ids }
                      added = fresh.size
                      p[listKey] = encode(current + fresh)
                  }
                  return added
              }

              /** Replace a graphic's vertices — the map's edit-points mode saves through this. */
              suspend fun updatePoints(id: String, points: List<GeoVertex>) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(points = points) else it
                          }
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.id == id })
                  }
              }

              /** Move every graphic in [from] to [to] (folder rename, or emptying a folder into Base). */
              suspend fun renameFolder(from: String, to: String) {
                  val target = canonicalFolder(to)
                  if (from == target) return
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").map { if (it.folder == from) it.copy(folder = target) else it })
                  }
              }

              /** Remove every graphic in [folder] — "clear the sketch" in one go. */
              suspend fun deleteFolder(folder: String) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.folder == folder })
                  }
              }

              // One damaged record must not take the whole list with it: skip it, keep the rest.
              private fun decode(json: String): List<TacGraphic> {
                  val arr = runCatching { JSONArray(json) }.getOrNull() ?: return emptyList()
                  return buildList {
                      for (i in 0 until arr.length()) {
                          runCatching {
                              val o = arr.getJSONObject(i)
                              val pts = o.getJSONArray("points")
                              val vertices = buildList {
                                  for (j in 0 until pts.length()) {
                                      val v = pts.getJSONArray(j)
                                      add(GeoVertex(v.getDouble(0), v.getDouble(1)))
                                  }
                              }
                              TacGraphic(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  type = o.getString("type"),
                                  points = vertices,
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                                  affiliation = o.optString("affiliation", "none"),
                                  createdAt = o.optLong("createdAt"),
                                  echelon = o.optString("echelon", ""),
                              )
                          }.getOrNull()?.let { add(it) }
                      }
                  }
              }

              private fun encode(list: List<TacGraphic>): String {
                  val arr = JSONArray()
                  for (g in list) {
                      val pts = JSONArray()
                      for (v in g.points) {
                          pts.put(JSONArray().put(v.lat).put(v.lon))
                      }
                      arr.put(
                          JSONObject()
                              .put("id", g.id)
                              .put("name", g.name)
                              .put("type", g.type)
                              .put("points", pts)
                              .put("folder", g.folder)
                              .put("affiliation", g.affiliation)
                              .put("createdAt", g.createdAt)
                              .put("echelon", g.echelon)
                      )
                  }
                  return arr.toString()
              }
          }
