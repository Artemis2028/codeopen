          mkdir -p 'app/src/main/java/app/gridfix/android/coords'
          cat > 'app/src/main/java/app/gridfix/android/coords/Coordinates.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.coords

          import mil.nga.grid.features.Point
          import mil.nga.mgrs.MGRS
          import mil.nga.mgrs.grid.GridType
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import kotlin.math.abs
          import kotlin.math.atan
          import kotlin.math.cos
          import kotlin.math.floor
          import kotlin.math.pow
          import kotlin.math.roundToLong
          import kotlin.math.sin
          import kotlin.math.sqrt
          import kotlin.math.tan

          object Coordinates {

              data class MgrsParts(
                  val gzd: String,
                  val square: String,
                  val easting: String,
                  val northing: String,
                  val full: String,
              )

              /** Lat/lon (WGS84) to MGRS at the requested precision (4/6/8/10 digits). */
              fun mgrs(lat: Double, lon: Double, digits: Int): MgrsParts? = runCatching {
                  val mgrs = MGRS.from(Point.point(lon, lat))
                  val gridType = when (digits) {
                      4 -> GridType.KILOMETER
                      6 -> GridType.HUNDRED_METER
                      8 -> GridType.TEN_METER
                      else -> GridType.METER
                  }
                  val full = mgrs.coordinate(gridType).uppercase(Locale.US)
                  val match = Regex("^(\\d{1,2}[A-Z])([A-Z]{2})(\\d*)$").find(full)
                  if (match != null) {
                      val (gzd, square, num) = match.destructured
                      val half = num.length / 2
                      MgrsParts(gzd, square, num.substring(0, half), num.substring(half), full)
                  } else {
                      // Polar regions (no zone number) or unexpected shape: show as-is
                      MgrsParts(full, "", "", "", full)
                  }
              }.getOrNull()

              data class UtmCoord(val zone: Int, val hemisphere: Char, val easting: Long, val northing: Long)

              /** Lat/lon (WGS84) to standard UTM. Valid for lat -80..84. */
              fun utm(lat: Double, lon: Double): UtmCoord? {
                  if (lat < -80.0 || lat > 84.0) return null

                  val zone = utmZone(lat, lon)

                  val a = 6378137.0
                  val f = 1.0 / 298.257223563
                  val k0 = 0.9996
                  val e2 = f * (2.0 - f)
                  val ep2 = e2 / (1.0 - e2)

                  val latRad = Math.toRadians(lat)
                  val lonOrigin = Math.toRadians(((zone - 1) * 6 - 180 + 3).toDouble())
                  val lonRad = Math.toRadians(lon)

                  val n = a / sqrt(1.0 - e2 * sin(latRad).pow(2))
                  val t = tan(latRad).pow(2)
                  val c = ep2 * cos(latRad).pow(2)
                  val bigA = cos(latRad) * (lonRad - lonOrigin)

                  val m = a * (
                      (1.0 - e2 / 4.0 - 3.0 * e2 * e2 / 64.0 - 5.0 * e2 * e2 * e2 / 256.0) * latRad -
                          (3.0 * e2 / 8.0 + 3.0 * e2 * e2 / 32.0 + 45.0 * e2 * e2 * e2 / 1024.0) * sin(2.0 * latRad) +
                          (15.0 * e2 * e2 / 256.0 + 45.0 * e2 * e2 * e2 / 1024.0) * sin(4.0 * latRad) -
                          (35.0 * e2 * e2 * e2 / 3072.0) * sin(6.0 * latRad)
                      )

                  val easting = k0 * n * (
                      bigA + (1.0 - t + c) * bigA.pow(3) / 6.0 +
                          (5.0 - 18.0 * t + t * t + 72.0 * c - 58.0 * ep2) * bigA.pow(5) / 120.0
                      ) + 500000.0

                  var northing = k0 * (
                      m + n * tan(latRad) * (
                          bigA.pow(2) / 2.0 +
                              (5.0 - t + 9.0 * c + 4.0 * c * c) * bigA.pow(4) / 24.0 +
                              (61.0 - 58.0 * t + t * t + 600.0 * c - 330.0 * ep2) * bigA.pow(6) / 720.0
                          )
                      )
                  if (lat < 0) northing += 10000000.0

                  return UtmCoord(
                      zone = zone,
                      hemisphere = if (lat >= 0) 'N' else 'S',
                      easting = easting.roundToLong(),
                      northing = northing.roundToLong(),
                  )
              }

              fun formatUtm(u: UtmCoord?): String =
                  if (u == null) "—" else "${u.zone}${u.hemisphere} ${u.easting}E ${u.northing}N"

              /** Lat/lon in the chosen format: 0 = DD, 1 = DDM, 2 = DMS. */
              fun formatLatLon(lat: Double, lon: Double, format: Int): String {
                  fun one(value: Double, positive: Char, negative: Char): String {
                      val hemi = if (value >= 0) positive else negative
                      val v = abs(value)
                      return when (format) {
                          0 -> String.format(Locale.US, "%.5f° %c", v, hemi)
                          2 -> {
                              val d = v.toInt()
                              val mFull = (v - d) * 60.0
                              val mm = mFull.toInt()
                              val s = (mFull - mm) * 60.0
                              String.format(Locale.US, "%d° %02d' %04.1f\" %c", d, mm, s, hemi)
                          }
                          else -> {
                              val d = v.toInt()
                              val mFull = (v - d) * 60.0
                              String.format(Locale.US, "%d° %06.3f' %c", d, mFull, hemi)
                          }
                      }
                  }
                  return one(lat, 'N', 'S') + "   " + one(lon, 'E', 'W')
              }

              /** Military date-time group in Zulu, e.g. 241435Z AUG 26 */
              fun dtg(timeMillis: Long): String {
                  val sdf = SimpleDateFormat("ddHHmm'Z' MMM yy", Locale.US)
                  sdf.timeZone = TimeZone.getTimeZone("UTC")
                  return sdf.format(Date(timeMillis)).uppercase(Locale.US)
              }

              fun formatAltitude(meters: Double, units: Int): String = when (units) {
                  1 -> "${(meters * 3.28084).roundToLong()} ft"
                  else -> "${meters.roundToLong()} m"
              }

              fun formatAccuracy(meters: Float, units: Int): String = when (units) {
                  1 -> "±${(meters * 3.28084).roundToLong()} ft"
                  else -> "±${meters.roundToLong()} m"
              }

              fun formatSpeed(metersPerSecond: Float, units: Int): String = when (units) {
                  1 -> String.format(Locale.US, "%.1f mph", metersPerSecond * 2.23694)
                  2 -> String.format(Locale.US, "%.1f kn", metersPerSecond * 1.94384)
                  else -> String.format(Locale.US, "%.1f km/h", metersPerSecond * 3.6)
              }

              private fun utmZone(lat: Double, lon: Double): Int {
                  var zone = (floor((lon + 180.0) / 6.0) + 1.0).toInt().coerceIn(1, 60)
                  // Norway exception
                  if (lat in 56.0..64.0 && lon in 3.0..12.0) zone = 32
                  // Svalbard exceptions
                  if (lat in 72.0..84.0) {
                      zone = when {
                          lon in 0.0..9.0 -> 31
                          lon in 9.0..21.0 -> 33
                          lon in 21.0..33.0 -> 35
                          lon in 33.0..42.0 -> 37
                          else -> zone
                      }
                  }
                  return zone
              }

              /** Grid convergence angle (degrees): grid north minus true north for this UTM zone. */
              fun gridConvergence(lat: Double, lon: Double): Double {
                  val zone = utmZone(lat, lon)
                  val lonOrigin = ((zone - 1) * 6 - 180 + 3).toDouble()
                  return Math.toDegrees(
                      atan(tan(Math.toRadians(lon - lonOrigin)) * sin(Math.toRadians(lat)))
                  )
              }

              private fun gridConvergenceForZone(lat: Double, lon: Double, zone: Int): Double {
                  val lonOrigin = ((zone - 1) * 6 - 180 + 3).toDouble()
                  return Math.toDegrees(
                      atan(tan(Math.toRadians(lon - lonOrigin)) * sin(Math.toRadians(lat)))
                  )
              }

              /** Result of a two-ray fix: the intersection plus the range from each observer. */
              data class RayFix(val lat: Double, val lon: Double, val dist1: Double, val dist2: Double)

              /**
               * Intersection of two rays given in TRUE bearings, solved in the UTM plane of
               * the first point's zone (grid bearings via per-point convergence). Null when
               * the rays are near-parallel, diverge, or the fix lands beyond 100 km — the
               * cases a map-reading instructor would also reject.
               */
              fun rayIntersection(
                  lat1: Double, lon1: Double, bearing1True: Double,
                  lat2: Double, lon2: Double, bearing2True: Double,
              ): RayFix? {
                  val zone = utmZone(lat1, lon1)
                  val north = lat1 >= 0
                  val p1 = utmForZone(lat1, lon1, zone, north)
                  val p2 = utmForZone(lat2, lon2, zone, north)
                  val g1 = Math.toRadians(bearing1True - gridConvergenceForZone(lat1, lon1, zone))
                  val g2 = Math.toRadians(bearing2True - gridConvergenceForZone(lat2, lon2, zone))
                  val d1x = sin(g1)
                  val d1y = cos(g1)
                  val d2x = sin(g2)
                  val d2y = cos(g2)
                  val cross = d1x * d2y - d1y * d2x
                  if (abs(cross) < 1e-6) return null
                  val dx = p2[0] - p1[0]
                  val dy = p2[1] - p1[1]
                  val t = (dx * d2y - dy * d2x) / cross
                  val s = (dx * d1y - dy * d1x) / cross
                  if (t <= 0.0 || s <= 0.0 || t > 100_000.0 || s > 100_000.0) return null
                  val ll = utmInverse(p1[0] + t * d1x, p1[1] + t * d1y, zone, north)
                  return RayFix(ll[0], ll[1], t, s)
              }

              data class NavInfo(val distanceMeters: Float, val bearingTrue: Float)

              /** Geodesic distance and initial true bearing between two points. */
              fun navInfo(fromLat: Double, fromLon: Double, toLat: Double, toLon: Double): NavInfo {
                  val results = FloatArray(2)
                  android.location.Location.distanceBetween(fromLat, fromLon, toLat, toLon, results)
                  return NavInfo(results[0], (results[1] + 360f) % 360f)
              }

              fun formatDistance(meters: Float, units: Int): String = when (units) {
                  1 -> {
                      val feet = meters * 3.28084f
                      if (feet < 1000f) String.format(Locale.US, "%.0f ft", feet)
                      else String.format(Locale.US, "%.2f mi", meters / 1609.344f)
                  }
                  2 -> {
                      if (meters < 1852f) String.format(Locale.US, "%.0f m", meters)
                      else String.format(Locale.US, "%.2f NM", meters / 1852f)
                  }
                  else -> {
                      if (meters < 1000f) String.format(Locale.US, "%.0f m", meters)
                      else if (meters < 10000f) String.format(Locale.US, "%.2f km", meters / 1000f)
                      else String.format(Locale.US, "%.1f km", meters / 1000f)
                  }
              }

              /** Format an angle in degrees (0..360) as degrees or NATO mils per the angle-unit setting. */
              fun formatAngle(degrees: Float, angleUnit: Int): String = when (angleUnit) {
                  1 -> String.format(Locale.US, "%.0f mils", (degrees * 6400f / 360f + 6400f) % 6400f)
                  else -> String.format(Locale.US, "%03.0f°", (degrees + 360f) % 360f)
              }

              /** Parse an MGRS string (spaces allowed, case-insensitive) to lat/lon. Null if invalid. */
              fun parseMgrs(text: String): Pair<Double, Double>? = runCatching {
                  val cleaned = text.trim().uppercase(Locale.US).replace(" ", "")
                  if (cleaned.isEmpty()) return null
                  val point = MGRS.parse(cleaned).toPoint()
                  point.latitude to point.longitude
              }.getOrNull()

              // ---- Grid-overlay math: forced-zone UTM forward and the Snyder-series inverse ----
              // Validated by roundtrip against the forward formulas above: < 1 mm error worldwide,
              // < 7 mm out to 4.5 degrees from the central meridian (grid lines never go further).

              /** UTM easting/northing of a point projected in a SPECIFIC zone (for grid drawing). */
              fun utmForZone(lat: Double, lon: Double, zone: Int, north: Boolean): DoubleArray {
                  val latRad = Math.toRadians(lat)
                  val lonOrigin = Math.toRadians(((zone - 1) * 6 - 180 + 3).toDouble())
                  val lonRad = Math.toRadians(lon)
                  val a = 6378137.0
                  val f = 1.0 / 298.257223563
                  val k0 = 0.9996
                  val e2 = f * (2.0 - f)
                  val ep2 = e2 / (1.0 - e2)
                  val n = a / sqrt(1.0 - e2 * sin(latRad).pow(2))
                  val t = tan(latRad).pow(2)
                  val c = ep2 * cos(latRad).pow(2)
                  val bigA = cos(latRad) * (lonRad - lonOrigin)
                  val m = a * (
                      (1.0 - e2 / 4.0 - 3.0 * e2 * e2 / 64.0 - 5.0 * e2 * e2 * e2 / 256.0) * latRad -
                          (3.0 * e2 / 8.0 + 3.0 * e2 * e2 / 32.0 + 45.0 * e2 * e2 * e2 / 1024.0) * sin(2.0 * latRad) +
                          (15.0 * e2 * e2 / 256.0 + 45.0 * e2 * e2 * e2 / 1024.0) * sin(4.0 * latRad) -
                          (35.0 * e2 * e2 * e2 / 3072.0) * sin(6.0 * latRad)
                      )
                  val easting = k0 * n * (
                      bigA + (1.0 - t + c) * bigA.pow(3) / 6.0 +
                          (5.0 - 18.0 * t + t * t + 72.0 * c - 58.0 * ep2) * bigA.pow(5) / 120.0
                      ) + 500000.0
                  var northing = k0 * (
                      m + n * tan(latRad) * (
                          bigA.pow(2) / 2.0 +
                              (5.0 - t + 9.0 * c + 4.0 * c * c) * bigA.pow(4) / 24.0 +
                              (61.0 - 58.0 * t + t * t + 600.0 * c - 330.0 * ep2) * bigA.pow(6) / 720.0
                          )
                      )
                  if (!north) northing += 10000000.0
                  return doubleArrayOf(easting, northing)
              }

              /** UTM easting/northing back to lat/lon (WGS84). Returns [lat, lon]. */
              fun utmInverse(easting: Double, northing: Double, zone: Int, north: Boolean): DoubleArray {
                  val a = 6378137.0
                  val f = 1.0 / 298.257223563
                  val k0 = 0.9996
                  val e2 = f * (2.0 - f)
                  val ep2 = e2 / (1.0 - e2)
                  val x = easting - 500000.0
                  val y = if (north) northing else northing - 10000000.0
                  val m = y / k0
                  val mu = m / (a * (1.0 - e2 / 4.0 - 3.0 * e2 * e2 / 64.0 - 5.0 * e2 * e2 * e2 / 256.0))
                  val e1 = (1.0 - sqrt(1.0 - e2)) / (1.0 + sqrt(1.0 - e2))
                  val phi1 = mu +
                      (3.0 * e1 / 2.0 - 27.0 * e1 * e1 * e1 / 32.0) * sin(2.0 * mu) +
                      (21.0 * e1 * e1 / 16.0 - 55.0 * e1.pow(4) / 32.0) * sin(4.0 * mu) +
                      (151.0 * e1 * e1 * e1 / 96.0) * sin(6.0 * mu) +
                      (1097.0 * e1.pow(4) / 512.0) * sin(8.0 * mu)
                  val sin1 = sin(phi1)
                  val cos1 = cos(phi1)
                  val tan1 = tan(phi1)
                  val c1 = ep2 * cos1 * cos1
                  val t1 = tan1 * tan1
                  val n1 = a / sqrt(1.0 - e2 * sin1 * sin1)
                  val r1 = a * (1.0 - e2) / (1.0 - e2 * sin1 * sin1).pow(1.5)
                  val d = x / (n1 * k0)
                  val lat = phi1 - (n1 * tan1 / r1) * (
                      d * d / 2.0 -
                          (5.0 + 3.0 * t1 + 10.0 * c1 - 4.0 * c1 * c1 - 9.0 * ep2) * d.pow(4) / 24.0 +
                          (61.0 + 90.0 * t1 + 298.0 * c1 + 45.0 * t1 * t1 - 252.0 * ep2 - 3.0 * c1 * c1) * d.pow(6) / 720.0
                      )
                  val lonOrigin = Math.toRadians(((zone - 1) * 6 - 180 + 3).toDouble())
                  val lon = lonOrigin + (
                      d -
                          (1.0 + 2.0 * t1 + c1) * d.pow(3) / 6.0 +
                          (5.0 - 2.0 * c1 + 28.0 * t1 - 3.0 * c1 * c1 + 8.0 * ep2 + 24.0 * t1 * t1) * d.pow(5) / 120.0
                      ) / cos1
                  return doubleArrayOf(Math.toDegrees(lat), Math.toDegrees(lon))
              }

              /** MGRS latitude band letter for a latitude in -80..84, e.g. 'R' for Dubai. */
              fun bandLetter(lat: Double): Char {
                  val letters = "CDEFGHJKLMNPQRSTUVWX"
                  val idx = floor((lat + 80.0) / 8.0).toInt().coerceIn(0, 19)
                  return letters[idx]
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/coords'
          cat > 'app/src/main/java/app/gridfix/android/coords/SunMoon.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.coords

          import java.util.Calendar
          import java.util.TimeZone
          import kotlin.math.acos
          import kotlin.math.asin
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.roundToInt
          import kotlin.math.sin
          import kotlin.math.tan

          /**
           * Offline sun and moon planning data: BMNT/EENT (nautical twilight), civil
           * twilight, sunrise/sunset (NOAA solar equations — validated to the minute),
           * moon phase + illumination (validated < 0.1° against eclipse epochs), and
           * approximate moonrise/set (truncated Meeus series, about ±5 minutes).
           */
          object SunMoon {

              private const val D2R = Math.PI / 180.0
              private const val R2D = 180.0 / Math.PI

              data class SunTimes(
                  val bmnt: Double?,        // UT hours, null when the sun never crosses that altitude
                  val civilDawn: Double?,
                  val sunrise: Double?,
                  val sunset: Double?,
                  val civilDusk: Double?,
                  val eent: Double?,
              )

              data class MoonInfo(
                  val phaseName: String,
                  val illuminationPct: Int,
                  val rises: List<Double>,  // UT hours within the requested day
                  val sets: List<Double>,
              )

              fun julianDay(y0: Int, m0: Int, d: Int, hourUtc: Double): Double {
                  var y = y0
                  var m = m0
                  if (m <= 2) {
                      y -= 1
                      m += 12
                  }
                  val a = y / 100
                  val b = 2 - a + a / 4
                  return (365.25 * (y + 4716)).toInt() + (30.6001 * (m + 1)).toInt() + d + b - 1524.5 + hourUtc / 24.0
              }

              fun sunTimes(y: Int, m: Int, d: Int, lat: Double, lon: Double): SunTimes = SunTimes(
                  bmnt = solarCrossing(y, m, d, lat, lon, -12.0, morning = true),
                  civilDawn = solarCrossing(y, m, d, lat, lon, -6.0, morning = true),
                  sunrise = solarCrossing(y, m, d, lat, lon, -0.833, morning = true),
                  sunset = solarCrossing(y, m, d, lat, lon, -0.833, morning = false),
                  civilDusk = solarCrossing(y, m, d, lat, lon, -6.0, morning = false),
                  eent = solarCrossing(y, m, d, lat, lon, -12.0, morning = false),
              )

              private fun solarCrossing(
                  y: Int, m: Int, d: Int, lat: Double, lon: Double, altDeg: Double, morning: Boolean,
              ): Double? {
                  var tUt = 12.0 - lon / 15.0
                  repeat(3) {
                      val jd = julianDay(y, m, d, tUt)
                      val t = (jd - 2451545.0) / 36525.0
                      val l0 = norm360(280.46646 + 36000.76983 * t + 0.0003032 * t * t)
                      val ma = 357.52911 + 35999.05029 * t - 0.0001537 * t * t
                      val e = 0.016708634 - 0.000042037 * t
                      val c = (1.914602 - 0.004817 * t) * sin(ma * D2R) +
                          (0.019993 - 0.000101 * t) * sin(2 * ma * D2R) +
                          0.000289 * sin(3 * ma * D2R)
                      val trueLong = l0 + c
                      val omega = 125.04 - 1934.136 * t
                      val lambda = trueLong - 0.00569 - 0.00478 * sin(omega * D2R)
                      val eps0 = 23.0 + 26.0 / 60.0 + 21.448 / 3600.0 - 46.815 * t / 3600.0
                      val eps = eps0 + 0.00256 * cos(omega * D2R)
                      val decl = asin(sin(eps * D2R) * sin(lambda * D2R)) * R2D
                      val yv = tan(eps * D2R / 2.0).let { it * it }
                      val eqTime = 4.0 * R2D * (
                          yv * sin(2 * l0 * D2R) - 2.0 * e * sin(ma * D2R) +
                              4.0 * e * yv * sin(ma * D2R) * cos(2 * l0 * D2R) -
                              0.5 * yv * yv * sin(4 * l0 * D2R) - 1.25 * e * e * sin(2 * ma * D2R)
                          )
                      val cosH = (sin(altDeg * D2R) - sin(lat * D2R) * sin(decl * D2R)) /
                          (cos(lat * D2R) * cos(decl * D2R))
                      if (cosH < -1.0 || cosH > 1.0) return null
                      val h = acos(cosH) * R2D
                      val solarNoonUt = 12.0 - lon / 15.0 - eqTime / 60.0
                      tUt = if (morning) solarNoonUt - h / 15.0 else solarNoonUt + h / 15.0
                  }
                  return ((tUt % 24.0) + 24.0) % 24.0
              }

              // ---------------- Moon ----------------

              /** Moon RA (deg), declination (deg), ecliptic longitude (deg). */
              private fun moonPos(jd: Double): Triple<Double, Double, Double> {
                  val t = (jd - 2451545.0) / 36525.0
                  val lp = norm360(218.3164477 + 481267.88123421 * t)
                  val dd = norm360(297.8501921 + 445267.1114034 * t)
                  val ms = norm360(357.5291092 + 35999.0502909 * t)
                  val mp = norm360(134.9633964 + 477198.8675055 * t)
                  val f = norm360(93.2720950 + 483202.0175233 * t)
                  val lon = lp +
                      6.288774 * sin(mp * D2R) +
                      1.274027 * sin((2 * dd - mp) * D2R) +
                      0.658314 * sin(2 * dd * D2R) +
                      0.213618 * sin(2 * mp * D2R) -
                      0.185116 * sin(ms * D2R) -
                      0.114332 * sin(2 * f * D2R) +
                      0.058793 * sin((2 * dd - 2 * mp) * D2R) +
                      0.057066 * sin((2 * dd - ms - mp) * D2R) +
                      0.053322 * sin((2 * dd + mp) * D2R) +
                      0.045758 * sin((2 * dd - ms) * D2R)
                  val lat = 5.128122 * sin(f * D2R) +
                      0.280602 * sin((mp + f) * D2R) +
                      0.277693 * sin((mp - f) * D2R) +
                      0.173237 * sin((2 * dd - f) * D2R) +
                      0.055413 * sin((2 * dd - mp + f) * D2R) +
                      0.046271 * sin((2 * dd - mp - f) * D2R)
                  val eps = (23.4393 - 0.0130 * t) * D2R
                  val lam = lon * D2R
                  val beta = lat * D2R
                  val ra = atan2(
                      sin(lam) * cos(eps) - tan(beta) * sin(eps),
                      cos(lam),
                  ).let { ((it * R2D) % 360.0 + 360.0) % 360.0 }
                  val dec = asin(sin(beta) * cos(eps) + cos(beta) * sin(eps) * sin(lam)) * R2D
                  return Triple(ra, dec, norm360(lon))
              }

              private fun sunEclipticLon(jd: Double): Double {
                  val t = (jd - 2451545.0) / 36525.0
                  val l0 = norm360(280.46646 + 36000.76983 * t)
                  val ma = 357.52911 + 35999.05029 * t
                  return norm360(l0 + 1.914602 * sin(ma * D2R) + 0.019993 * sin(2 * ma * D2R))
              }

              private fun gmstDeg(jd: Double): Double {
                  val t = (jd - 2451545.0) / 36525.0
                  return norm360(280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * t * t)
              }

              private fun moonAltitude(jd: Double, lat: Double, lon: Double): Double {
                  val (ra, dec, _) = moonPos(jd)
                  val lst = norm360(gmstDeg(jd) + lon)
                  val h = (lst - ra) * D2R
                  return asin(
                      sin(lat * D2R) * sin(dec * D2R) + cos(lat * D2R) * cos(dec * D2R) * cos(h)
                  ) * R2D
              }

              fun moonInfo(y: Int, m: Int, d: Int, lat: Double, lon: Double): MoonInfo {
                  val noon = julianDay(y, m, d, 12.0)
                  val elong = norm360(moonPos(noon).third - sunEclipticLon(noon))
                  val illum = ((1.0 - cos(elong * D2R)) / 2.0 * 100.0).roundToInt()
                  val name = when {
                      elong < 22.5 || elong >= 337.5 -> "New moon"
                      elong < 67.5 -> "Waxing crescent"
                      elong < 112.5 -> "First quarter"
                      elong < 157.5 -> "Waxing gibbous"
                      elong < 202.5 -> "Full moon"
                      elong < 247.5 -> "Waning gibbous"
                      elong < 292.5 -> "Last quarter"
                      else -> "Waning crescent"
                  }

                  val rises = ArrayList<Double>()
                  val sets = ArrayList<Double>()
                  val std = 0.125   // net standard altitude for the moon (parallax vs refraction)
                  var prev = moonAltitude(julianDay(y, m, d, 0.0), lat, lon) - std
                  for (i in 1..144) {
                      val tHour = i * 10.0 / 60.0
                      val cur = moonAltitude(julianDay(y, m, d, tHour), lat, lon) - std
                      if (prev <= 0 && cur > 0) rises.add(tHour - (10.0 / 60.0) * cur / (cur - prev))
                      if (prev > 0 && cur <= 0) sets.add(tHour - (10.0 / 60.0) * cur / (cur - prev))
                      prev = cur
                  }
                  return MoonInfo(name, illum, rises, sets)
              }

              // ---------------- formatting ----------------

              /** "0453" style; UT hour → local clock via the device zone's offset on that date. */
              fun formatLocal(utHours: Double?, y: Int, m: Int, d: Int): String {
                  if (utHours == null) return "----"
                  val cal = Calendar.getInstance(TimeZone.getTimeZone("UTC"))
                  cal.set(y, m - 1, d, utHours.toInt(), ((utHours % 1.0) * 60.0).roundToInt(), 0)
                  val offsetMin = TimeZone.getDefault().getOffset(cal.timeInMillis) / 60000
                  var total = (utHours * 60.0).roundToInt() + offsetMin
                  total = ((total % 1440) + 1440) % 1440
                  return String.format(java.util.Locale.US, "%02d%02d", total / 60, total % 60)
              }

              fun formatZulu(utHours: Double?): String {
                  if (utHours == null) return "----"
                  val total = ((utHours * 60.0).roundToInt() % 1440 + 1440) % 1440
                  return String.format(java.util.Locale.US, "%02d%02dZ", total / 60, total % 60)
              }

              private fun norm360(v: Double): Double = ((v % 360.0) + 360.0) % 360.0
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/WaypointRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Locale
          import java.util.UUID

          private val Context.wpStore by preferencesDataStore(name = "waypoints")

          const val DEFAULT_FOLDER = "Waypoints"
          const val DEFAULT_SYMBOL = "flag"

          data class Waypoint(
              val id: String,
              val name: String,
              val lat: Double,
              val lon: Double,
              val createdAt: Long,
              val folder: String = DEFAULT_FOLDER,
              val symbol: String = DEFAULT_SYMBOL,
              val affiliation: String = "none",
              val echelon: String = "",       // "", tm, sqd, sec, plt, co, bn, rgt, bde
              val designation: String = "",   // free-text unit designation amplifier
              val kind: String = KIND_WP,     // KIND_WP (navigation point) or KIND_UNIT (plotted unit)
              val rotation: Float = 0f,       // degrees clockwise from north; direction of fire for task symbols
          )

          const val KIND_WP = "wp"
          const val KIND_UNIT = "unit"

          /** Everything needed to create or update a waypoint. */
          data class WaypointDraft(
              val name: String,
              val lat: Double,
              val lon: Double,
              val folder: String,
              val symbol: String,
              val affiliation: String,
              val echelon: String = "",
              val designation: String = "",
              val kind: String = KIND_WP,
              val rotation: Float = 0f,
          )

          /** A waypoint folder ("overlay"): can exist empty, and can be toggled visible/hidden. */
          data class FolderInfo(val name: String, val visible: Boolean = true)

          class WaypointRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")
              private val selectedKey = stringPreferencesKey("selected")
              private val foldersKey = stringPreferencesKey("folders")

              val waypoints: Flow<List<Waypoint>> = context.wpStore.data.map { p ->
                  decode(p[listKey] ?: "[]")
              }

              val selectedId: Flow<String?> = context.wpStore.data.map { p -> p[selectedKey] }

              /** Stored folders unioned with any folder referenced by a waypoint, sorted by name. */
              val folders: Flow<List<FolderInfo>> = context.wpStore.data.map { p ->
                  val stored = decodeFolders(p[foldersKey] ?: "[]")
                  val referenced = decode(p[listKey] ?: "[]").map { it.folder }
                  val names = (stored.map { it.name } + referenced + DEFAULT_FOLDER).distinct()
                  names.map { n -> stored.firstOrNull { it.name == n } ?: FolderInfo(n) }
                      .sortedBy { it.name.lowercase(Locale.US) }
              }

              suspend fun addFolder(name: String) {
                  val clean = name.trim()
                  if (clean.isEmpty()) return
                  context.wpStore.edit { p ->
                      p[foldersKey] = encodeFolders(
                          upsertFolder(decodeFolders(p[foldersKey] ?: "[]"), clean, null)
                      )
                  }
              }

              suspend fun setFolderVisible(name: String, visible: Boolean) {
                  context.wpStore.edit { p ->
                      p[foldersKey] = encodeFolders(
                          upsertFolder(decodeFolders(p[foldersKey] ?: "[]"), name, visible)
                      )
                  }
              }

              suspend fun add(draft: WaypointDraft, nowMillis: Long): String {
                  val newId = UUID.randomUUID().toString()
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      val wp = Waypoint(
                          id = newId,
                          name = draft.name,
                          lat = draft.lat,
                          lon = draft.lon,
                          createdAt = nowMillis,
                          folder = draft.folder.ifBlank { DEFAULT_FOLDER },
                          symbol = draft.symbol.ifBlank { DEFAULT_SYMBOL },
                          affiliation = draft.affiliation,
                          echelon = draft.echelon,
                          designation = draft.designation,
                          kind = draft.kind,
                          rotation = draft.rotation,
                      )
                      p[listKey] = encode(current + wp)
                      p[foldersKey] = encodeFolders(
                          upsertFolder(decodeFolders(p[foldersKey] ?: "[]"), wp.folder, null)
                      )
                      if (p[selectedKey] == null) {
                          p[selectedKey] = wp.id
                      }
                  }
                  return newId
              }

              /** Bulk add (imports): one datastore write however many points arrive. */
              suspend fun addAll(drafts: List<WaypointDraft>, nowMillis: Long) {
                  if (drafts.isEmpty()) return
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      var folders = decodeFolders(p[foldersKey] ?: "[]")
                      val added = drafts.map { draft ->
                          folders = upsertFolder(folders, draft.folder.ifBlank { DEFAULT_FOLDER }, null)
                          Waypoint(
                              id = UUID.randomUUID().toString(),
                              name = draft.name,
                              lat = draft.lat,
                              lon = draft.lon,
                              createdAt = nowMillis,
                              folder = draft.folder.ifBlank { DEFAULT_FOLDER },
                              symbol = draft.symbol.ifBlank { DEFAULT_SYMBOL },
                              affiliation = draft.affiliation,
                              echelon = draft.echelon,
                              designation = draft.designation,
                              kind = draft.kind,
                              rotation = draft.rotation,
                          )
                      }
                      p[listKey] = encode(current + added)
                      p[foldersKey] = encodeFolders(folders)
                  }
              }

              suspend fun update(id: String, draft: WaypointDraft) {
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      p[listKey] = encode(
                          current.map {
                              if (it.id == id) it.copy(
                                  name = draft.name,
                                  lat = draft.lat,
                                  lon = draft.lon,
                                  folder = draft.folder.ifBlank { DEFAULT_FOLDER },
                                  symbol = draft.symbol.ifBlank { DEFAULT_SYMBOL },
                                  affiliation = draft.affiliation,
                                  echelon = draft.echelon,
                                  designation = draft.designation,
                                  kind = draft.kind,
                                  rotation = draft.rotation,
                              ) else it
                          }
                      )
                      p[foldersKey] = encodeFolders(
                          upsertFolder(
                              decodeFolders(p[foldersKey] ?: "[]"),
                              draft.folder.ifBlank { DEFAULT_FOLDER },
                              null,
                          )
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.wpStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      p[listKey] = encode(current.filterNot { it.id == id })
                      if (p[selectedKey] == id) {
                          p.remove(selectedKey)
                      }
                  }
              }

              suspend fun select(id: String) {
                  context.wpStore.edit { p -> p[selectedKey] = id }
              }

              private fun decode(json: String): List<Waypoint> = runCatching {
                  val arr = JSONArray(json)
                  buildList {
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          add(
                              Waypoint(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  lat = o.getDouble("lat"),
                                  lon = o.getDouble("lon"),
                                  createdAt = o.optLong("createdAt"),
                                  folder = o.optString("folder", DEFAULT_FOLDER),
                                  symbol = o.optString("symbol", DEFAULT_SYMBOL),
                                  affiliation = o.optString("affiliation", "none"),
                                  echelon = o.optString("echelon", ""),
                                  designation = o.optString("designation", ""),
                                  kind = o.optString(
                                      "kind",
                                      // migrate pre-0.5 data: NATO symbols were always units
                                      if (o.optString("symbol", "").startsWith("nato_")) KIND_UNIT else KIND_WP,
                                  ),
                                  rotation = o.optDouble("rotation", 0.0).toFloat(),
                              )
                          )
                      }
                  }
              }.getOrDefault(emptyList())

              /** Add or update a folder entry; visible == null keeps the existing visibility. */
              private fun upsertFolder(list: List<FolderInfo>, name: String, visible: Boolean?): List<FolderInfo> {
                  val existing = list.firstOrNull { it.name == name }
                  return when {
                      existing == null -> list + FolderInfo(name, visible ?: true)
                      visible == null -> list
                      else -> list.map { if (it.name == name) it.copy(visible = visible) else it }
                  }
              }

              private fun decodeFolders(json: String): List<FolderInfo> = runCatching {
                  val arr = JSONArray(json)
                  buildList {
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          add(FolderInfo(o.getString("name"), o.optBoolean("visible", true)))
                      }
                  }
              }.getOrDefault(emptyList())

              private fun encodeFolders(list: List<FolderInfo>): String {
                  val arr = JSONArray()
                  for (f in list) {
                      arr.put(JSONObject().put("name", f.name).put("visible", f.visible))
                  }
                  return arr.toString()
              }

              private fun encode(list: List<Waypoint>): String {
                  val arr = JSONArray()
                  for (w in list) {
                      arr.put(
                          JSONObject()
                              .put("id", w.id)
                              .put("name", w.name)
                              .put("lat", w.lat)
                              .put("lon", w.lon)
                              .put("createdAt", w.createdAt)
                              .put("folder", w.folder)
                              .put("symbol", w.symbol)
                              .put("affiliation", w.affiliation)
                              .put("echelon", w.echelon)
                              .put("designation", w.designation)
                              .put("kind", w.kind)
                              .put("rotation", w.rotation.toDouble())
                      )
                  }
                  return arr.toString()
              }
          }
          EOF_GRIDFIX
