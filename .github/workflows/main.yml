          /**
           * Create/edit dialog for a waypoint, shared by the Waypoints screen (preset =
           * current GPS position) and the Map screen (preset = crosshair position).
           */
          @Composable
          fun WaypointDialog(
              initial: Waypoint?,
              presetLat: Double?,
              presetLon: Double?,
              presetLabel: String,
              folderNames: List<String>,
              defaultName: String,
              onConfirm: (WaypointDraft) -> Unit,
              onDismiss: () -> Unit,
              settings: AppSettings,
              projectBases: List<Waypoint> = emptyList(),
              unitNameFor: (symbol: String, echelon: String) -> String = { _, _ -> defaultName },
          ) {
              val night = settings.nightMode
              val baseParts = remember(initial) {
                  when {
                      initial != null -> Coordinates.mgrs(initial.lat, initial.lon, 10)
                      presetLat != null && presetLon != null -> Coordinates.mgrs(presetLat, presetLon, 10)
                      else -> null
                  }
              }

              var name by remember(initial) { mutableStateOf(initial?.name ?: "") }
              var folder by remember(initial) { mutableStateOf(initial?.folder ?: DEFAULT_FOLDER) }
              var symbol by remember(initial) { mutableStateOf(initial?.symbol ?: "flag") }
              var affiliation by remember(initial) { mutableStateOf(initial?.affiliation ?: "none") }
              var echelon by remember(initial) { mutableStateOf(initial?.echelon ?: "") }
              var designation by remember(initial) { mutableStateOf(initial?.designation ?: "") }
              var kind by remember(initial) { mutableStateOf(initial?.kind ?: KIND_WP) }
              var rotation by remember(initial) { mutableStateOf(initial?.rotation ?: 0f) }
              // 0 = preset position, 1 = MGRS entry, 2 = project from a known point
              var posMode by remember(initial) { mutableStateOf(if (initial == null && presetLat != null) 0 else 1) }
              var projBaseId by remember(initial) { mutableStateOf<String?>(null) }
              var azText by remember(initial) { mutableStateOf("") }
              var distText by remember(initial) { mutableStateOf("") }
              var projMenuOpen by remember { mutableStateOf(false) }
              val northingFocus = remember { FocusRequester() }
              var gzdSquare by remember(initial) {
                  mutableStateOf(baseParts?.let { "${it.gzd} ${it.square}" } ?: "")
              }
              var easting by remember(initial) { mutableStateOf(baseParts?.easting ?: "") }
              var northing by remember(initial) { mutableStateOf(baseParts?.northing ?: "") }
              var error by remember(initial) { mutableStateOf<String?>(null) }

              val bigDigits = LocalTextStyle.current.copy(
                  fontFamily = MonoFamily,
                  fontSize = 22.sp,
                  textAlign = TextAlign.Center,
              )

              // Projection base + live result, shared by the fields and the confirm button
              val projBase: Triple<String, Double, Double>? = when {
                  projBaseId != null -> projectBases.firstOrNull { it.id == projBaseId }
                      ?.let { Triple(it.name, it.lat, it.lon) }
                  presetLat != null && presetLon != null -> Triple(presetLabel, presetLat, presetLon)
                  else -> projectBases.firstOrNull()?.let { Triple(it.name, it.lat, it.lon) }
              }
              val refLetter = when (settings.northRef) {
                  1 -> "magnetic"
                  2 -> "grid"
                  else -> "true"
              }
              val angleLabel = if (settings.angleUnit == 1) "mils" else "degrees"
              val projResult: Pair<Double, Double>? = run {
                  val base = projBase ?: return@run null
                  val az = azText.toFloatOrNull() ?: return@run null
                  val dist = distText.toFloatOrNull() ?: return@run null
                  if (dist <= 0f || dist > 200000f) return@run null
                  val deg = if (settings.angleUnit == 1) az * 360f / 6400f else az
                  val decl = GeomagneticField(
                      base.second.toFloat(), base.third.toFloat(), 0f, System.currentTimeMillis()
                  ).declination
                  val conv = Coordinates.gridConvergence(base.second, base.third).toFloat()
                  val trueDeg = when (settings.northRef) {
                      1 -> deg + decl
                      2 -> deg + conv
                      else -> deg
                  }
                  val dest = GeoPoint(base.second, base.third)
                      .destinationPoint(dist.toDouble(), (((trueDeg % 360f) + 360f) % 360f).toDouble())
                  dest.latitude to dest.longitude
              }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = {
                      Text(
                          when {
                              initial == null && kind == KIND_UNIT -> "New unit"
                              initial == null -> "New waypoint"
                              kind == KIND_UNIT -> "Edit unit"
                              else -> "Edit waypoint"
                          }
                      )
                  },
                  text = {
                      Column(
                          modifier = Modifier.verticalScroll(rememberScrollState()),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              FilterChip(
                                  selected = kind == KIND_WP,
                                  onClick = {
                                      kind = KIND_WP
                                      if (symbol.startsWith("nato_")) symbol = "flag"
                                  },
                                  label = { Text("Waypoint") },
                              )
                              FilterChip(
                                  selected = kind == KIND_UNIT,
                                  onClick = {
                                      kind = KIND_UNIT
                                      if (!symbol.startsWith("nato_")) symbol = "nato_f_unit"
                                  },
                                  label = { Text("Unit") },
                              )
                          }

                          OutlinedTextField(
                              value = name,
                              onValueChange = { name = it },
                              label = { Text("Name") },
                              placeholder = {
                                  Text(
                                      when {
                                          kind == KIND_UNIT -> unitNameFor(symbol, echelon)
                                          WaypointSymbols.isTask(symbol) -> unitNameFor(symbol, "")
                                          else -> defaultName
                                      }
                                  )
                              },
                              singleLine = true,
                          )

                          if (kind == KIND_WP) {
                              Text("Affiliation", style = MaterialTheme.typography.labelLarge)
                              Row(
                                  modifier = Modifier.horizontalScroll(rememberScrollState()),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                              ) {
                                  Affiliations.all.forEach { key ->
                                      FilterChip(
                                          selected = key == affiliation,
                                          onClick = { affiliation = key },
                                          label = { Text(Affiliations.label(key)) },
                                      )
                                  }
                              }

                              Text("Symbol", style = MaterialTheme.typography.labelLarge)
                              SymbolRow(
                                  keys = WaypointSymbols.all,
                                  selected = symbol,
                                  affiliation = affiliation,
                                  labelFor = { WaypointSymbols.label(it) },
                                  night = night,
                              ) { symbol = it }

                              Text("Tactical task", style = MaterialTheme.typography.labelLarge)
                              SymbolRow(
                                  keys = WaypointSymbols.tasks,
                                  selected = symbol,
                                  affiliation = affiliation,
                                  labelFor = { WaypointSymbols.taskLabel(it) },
                                  night = night,
                              ) { symbol = it }

                              if (WaypointSymbols.isTask(symbol) && WaypointSymbols.taskLetter(symbol) == null) {
                                  Text(
                                      "Direction of fire — ${rotation.toInt()}°",
                                      style = MaterialTheme.typography.labelLarge,
                                  )
                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(10.dp),
                                  ) {
                                      WaypointMarker(
                                          symbol = symbol,
                                          affiliation = affiliation,
                                          size = 40.dp,
                                          night = night,
                                          rotation = rotation,
                                      )
                                      Slider(
                                          value = rotation,
                                          onValueChange = { rotation = (it.toInt() % 360).toFloat() },
                                          valueRange = 0f..359f,
                                      )
                                  }
                              }
                          } else {
                              // One affiliation choice up top drives the whole grid — no
                              // repeated per-affiliation rows.
                              val unitAffs = listOf("friendly", "hostile", "neutral", "unknown")
                              val affChar = when (affiliation) {
                                  "hostile" -> "h"
                                  "neutral" -> "n"
                                  "unknown" -> "u"
                                  else -> "f"
                              }
                              Text("Affiliation", style = MaterialTheme.typography.labelLarge)
                              Row(
                                  modifier = Modifier.horizontalScroll(rememberScrollState()),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                              ) {
                                  unitAffs.forEach { key ->
                                      FilterChip(
                                          selected = (affiliation == key) || (affiliation !in unitAffs && key == "friendly"),
                                          onClick = {
                                              affiliation = key
                                              if (NatoSymbols.isNato(symbol)) {
                                                  val func = symbol.removePrefix("nato_").substringAfter("_")
                                                  val c = when (key) {
                                                      "hostile" -> "h"
                                                      "neutral" -> "n"
                                                      "unknown" -> "u"
                                                      else -> "f"
                                                  }
                                                  symbol = "nato_${c}_$func"
                                              }
                                          },
                                          label = { Text(Affiliations.label(key)) },
                                      )
                                  }
                              }

                              Text("Echelon", style = MaterialTheme.typography.labelLarge)
                              Row(
                                  modifier = Modifier.horizontalScroll(rememberScrollState()),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                              ) {
                                  Echelons.all.forEach { (key, label) ->
                                      FilterChip(
                                          selected = key == echelon,
                                          onClick = { echelon = key },
                                          label = { Text(label) },
                                      )
                                  }
                              }

                              Text("Unit symbol", style = MaterialTheme.typography.labelLarge)
                              var unitQuery by remember { mutableStateOf("") }
                              OutlinedTextField(
                                  value = unitQuery,
                                  onValueChange = { unitQuery = it.take(30) },
                                  label = {
                                      Text("Search ${NatoSymbols.functions.size + NatoSymbols.extended.size} unit types")
                                  },
                                  placeholder = { Text("e.g. mortar, airborne, supply") },
                                  singleLine = true,
                                  modifier = Modifier.fillMaxWidth(),
                              )
                              val unitResults = remember(unitQuery) {
                                  if (unitQuery.isBlank()) NatoSymbols.functions + NatoSymbols.extended
                                  else NatoSymbols.search(unitQuery)
                              }
                              if (unitResults.isEmpty()) {
                                  Text(
                                      "No matching unit types.",
                                      style = MaterialTheme.typography.bodySmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              } else {
                                  SymbolGrid(
                                      keys = unitResults.map { "nato_${affChar}_${it.first}" },
                                      selected = symbol,
                                      affiliation = if (affiliation in unitAffs) affiliation else "friendly",
                                      labelFor = { NatoSymbols.functionLabel(it) },
                                      night = night,
                                  ) {
                                      symbol = it
                                      if (affiliation !in unitAffs) affiliation = "friendly"
                                  }
                              }
                              OutlinedTextField(
                                  value = designation,
                                  onValueChange = { designation = it.take(24) },
                                  label = { Text("Unit designation (optional)") },
                                  placeholder = { Text("e.g. A/1-502") },
                                  singleLine = true,
                              )
                          }

                          Text("Folder", style = MaterialTheme.typography.labelLarge)
                          if (folderNames.isNotEmpty()) {
                              Row(
                                  modifier = Modifier.horizontalScroll(rememberScrollState()),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                              ) {
                                  folderNames.forEach { f ->
                                      FilterChip(
                                          selected = f == folder,
                                          onClick = { folder = f },
                                          label = { Text(f) },
                                      )
                                  }
                              }
                          }
                          OutlinedTextField(
                              value = folder,
                              onValueChange = { folder = it },
                              label = { Text("Folder (type to create new)") },
                              singleLine = true,
                          )

                          Text("Position", style = MaterialTheme.typography.labelLarge)
                          Row(
                              modifier = Modifier.horizontalScroll(rememberScrollState()),
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                          ) {
                              FilterChip(
                                  selected = posMode == 0,
                                  onClick = { posMode = 0 },
                                  label = { Text(presetLabel) },
                                  enabled = presetLat != null,
                              )
                              FilterChip(
                                  selected = posMode == 1,
                                  onClick = { posMode = 1 },
                                  label = { Text("MGRS grid") },
                              )
                              FilterChip(
                                  selected = posMode == 2,
                                  onClick = { posMode = 2 },
                                  label = { Text("Project") },
                                  enabled = presetLat != null || projectBases.isNotEmpty(),
                              )
                          }
                          if (posMode == 1) {
                              OutlinedTextField(
                                  value = gzdSquare,
                                  onValueChange = { v ->
                                      val cleaned = v.uppercase(Locale.US)
                                          .filter { it.isLetterOrDigit() || it == ' ' }
                                      var handled = false
                                      if (cleaned.replace(" ", "").length > 7) {
                                          // A full grid was pasted — split it into the fields
                                          val parsed = Coordinates.parseMgrs(cleaned)
                                          if (parsed != null) {
                                              val parts = Coordinates.mgrs(parsed.first, parsed.second, 10)
                                              if (parts != null && parts.easting.isNotEmpty()) {
                                                  gzdSquare = "${parts.gzd} ${parts.square}"
                                                  easting = parts.easting
                                                  northing = parts.northing
                                                  handled = true
                                              }
                                          }
                                      }
                                      if (!handled) gzdSquare = cleaned.take(7)
                                      error = null
                                  },
                                  label = { Text("Grid zone (or paste a full grid)") },
                                  placeholder = { Text("39R TM") },
                                  singleLine = true,
                                  textStyle = bigDigits,
                                  keyboardOptions = KeyboardOptions(capitalization = KeyboardCapitalization.Characters),
                                  modifier = Modifier.fillMaxWidth(),
                              )
                              Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  OutlinedTextField(
                                      value = easting,
                                      onValueChange = { v ->
                                          easting = v.filter { it.isDigit() }.take(5)
                                          error = null
                                          if (easting.length == 5) northingFocus.requestFocus()
                                      },
                                      label = { Text("Easting") },
                                      placeholder = { Text("23559") },
                                      singleLine = true,
                                      textStyle = bigDigits,
                                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                                      modifier = Modifier.weight(1f),
                                  )
                                  OutlinedTextField(
                                      value = northing,
                                      onValueChange = { v ->
                                          northing = v.filter { it.isDigit() }.take(5)
                                          error = null
                                      },
                                      label = { Text("Northing") },
                                      placeholder = { Text("96991") },
                                      singleLine = true,
                                      textStyle = bigDigits,
                                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                                      modifier = Modifier
                                          .weight(1f)
                                          .focusRequester(northingFocus),
                                  )
                              }
                          } else if (posMode == 2) {
                              Row(
                                  modifier = Modifier.clickable { projMenuOpen = true },
                                  verticalAlignment = Alignment.CenterVertically,
                              ) {
                                  Text(
                                      "From: " + (projBase?.first ?: "no point available"),
                                      style = MaterialTheme.typography.bodyMedium,
                                  )
                                  Icon(
                                      Icons.Outlined.ArrowDropDown,
                                      contentDescription = "Choose base point",
                                      tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                                  DropdownMenu(
                                      expanded = projMenuOpen,
                                      onDismissRequest = { projMenuOpen = false },
                                  ) {
                                      if (presetLat != null && presetLon != null) {
                                          DropdownMenuItem(
                                              text = { Text(presetLabel) },
                                              onClick = { projBaseId = null; projMenuOpen = false },
                                          )
                                      }
                                      projectBases.forEach { b ->
                                          DropdownMenuItem(
                                              text = { Text(b.name) },
                                              onClick = { projBaseId = b.id; projMenuOpen = false },
                                          )
                                      }
                                  }
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  OutlinedTextField(
                                      value = azText,
                                      onValueChange = { v ->
                                          azText = v.filter { it.isDigit() || it == '.' }.take(6)
                                          error = null
                                      },
                                      label = { Text("Azimuth ($angleLabel $refLetter)") },
                                      singleLine = true,
                                      textStyle = bigDigits,
                                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                                      modifier = Modifier.weight(1f),
                                  )
                                  OutlinedTextField(
                                      value = distText,
                                      onValueChange = { v ->
                                          distText = v.filter { it.isDigit() }.take(6)
                                          error = null
                                      },
                                      label = { Text("Distance (m)") },
                                      singleLine = true,
                                      textStyle = bigDigits,
                                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                                      modifier = Modifier.weight(1f),
                                  )
                              }
                              Text(
                                  projResult?.let {
                                      "→ " + (Coordinates.mgrs(it.first, it.second, 10)?.full ?: "—")
                                  } ?: "Enter azimuth and distance from the base point.",
                                  style = MaterialTheme.typography.bodySmall,
                                  fontFamily = MonoFamily,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          } else if (presetLat != null && presetLon != null) {
                              Text(
                                  "$presetLabel: " + (Coordinates.mgrs(presetLat, presetLon, 10)?.full ?: "—"),
                                  style = MaterialTheme.typography.bodySmall,
                                  fontFamily = MonoFamily,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          }
                          error?.let {
                              Text(
                                  it,
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.error,
                              )
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = {
                          val finalName = name.ifBlank {
                              when {
                                  kind == KIND_UNIT -> unitNameFor(symbol, echelon)
                                  WaypointSymbols.isTask(symbol) -> unitNameFor(symbol, "")
                                  else -> defaultName
                              }
                          }
                          val finalFolder = folder.ifBlank { DEFAULT_FOLDER }
                          // A unit's affiliation comes from its chosen symbol frame
                          val finalAffiliation = if (kind == KIND_UNIT) {
                              when (symbol.split("_").getOrNull(1)) {
                                  "f" -> "friendly"
                                  "h" -> "hostile"
                                  "n" -> "neutral"
                                  else -> "unknown"
                              }
                          } else affiliation
                          val finalEchelon = if (kind == KIND_UNIT) echelon else ""
                          val finalDesignation = if (kind == KIND_UNIT) designation.trim() else ""
                          val finalRotation =
                              if (kind == KIND_WP && WaypointSymbols.isTask(symbol) &&
                                  WaypointSymbols.taskLetter(symbol) == null
                              ) rotation else 0f
                          fun confirmAt(lat: Double, lon: Double) {
                              onConfirm(
                                  WaypointDraft(
                                      finalName, lat, lon, finalFolder, symbol, finalAffiliation,
                                      finalEchelon, finalDesignation, kind, finalRotation,
                                  )
                              )
                          }
                          when {
                              posMode == 0 && presetLat != null && presetLon != null ->
                                  confirmAt(presetLat, presetLon)
                              posMode == 2 -> {
                                  val r = projResult
                                  if (r == null) {
                                      error = "Projection needs a base point, azimuth, and distance (max 200 km)."
                                  } else {
                                      confirmAt(r.first, r.second)
                                  }
                              }
                              easting.isEmpty() || easting.length != northing.length ->
                                  error = "Easting and northing need the same number of digits."
                              else -> {
                                  val parsed = Coordinates.parseMgrs(gzdSquare + easting + northing)
                                  if (parsed == null) {
                                      error = "Couldn't read that grid — check the zone letters and digits."
                                  } else {
                                      confirmAt(parsed.first, parsed.second)
                                  }
                              }
                          }
                      }) { Text(if (initial == null) "Add" else "Save") }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) { Text("Cancel") }
                  },
              )
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/ui'
          cat > 'app/src/main/java/app/gridfix/android/ui/WaypointMarker.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.ui

          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.size
          import androidx.compose.material3.Icon
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ColorFilter
          import androidx.compose.ui.graphics.ColorMatrix
          import androidx.compose.ui.graphics.FilterQuality
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.graphics.drawscope.DrawScope
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.drawscope.rotate
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.sin
          import app.gridfix.android.ui.theme.MonoFamily

          /** MIL-STD-2525-style affiliation colors. */
          object Affiliations {
              val all = listOf("none", "friendly", "hostile", "neutral", "unknown")

              fun label(key: String): String = when (key) {
                  "friendly" -> "Friendly"
                  "hostile" -> "Hostile"
                  "neutral" -> "Neutral"
                  "unknown" -> "Unknown"
                  else -> "None"
              }

              fun color(key: String, fallback: Color): Color = when (key) {
                  "friendly" -> Color(0xFF5BC8F5)   // crystal blue
                  "hostile" -> Color(0xFFFF6B60)    // salmon red
                  "neutral" -> Color(0xFF8FE38F)    // bamboo green
                  "unknown" -> Color(0xFFF0E060)    // light yellow
                  else -> fallback
              }
          }

          /**
           * Renders a waypoint marker:
           * - NATO unit keys (nato_*) render the bundled MIL-STD-2525B symbol image
           * - tactical task keys (task_*) render drawn task glyphs or letter badges
           * - shape keys render plain drawn shapes
           * - everything else renders a material icon
           * Non-NATO markers get an affiliation frame (friendly rectangle, hostile diamond,
           * neutral square, unknown circle) except tasks, which stand alone per doctrine.
           */
          /** Night-vision red: luminance mapped onto the red channel, green/blue dropped. */
          private val NightImageFilter = ColorFilter.colorMatrix(
              ColorMatrix(
                  floatArrayOf(
                      0.35f, 0.50f, 0.15f, 0f, 30f,
                      0f, 0f, 0f, 0f, 0f,
                      0f, 0f, 0f, 0f, 0f,
                      0f, 0f, 0f, 1f, 0f,
                  )
              )
          )
          private val NightRed = Color(0xFFFF3B30)

          @Composable
          fun WaypointMarker(
              symbol: String,
              affiliation: String,
              modifier: Modifier = Modifier,
              size: Dp = 30.dp,
              echelon: String = "",
              night: Boolean = false,
              rotation: Float = 0f,
          ) {
              if (NatoSymbols.isNato(symbol)) {
                  val context = LocalContext.current
                  val res = NatoSymbols.resId(context, symbol)
                  if (res != null) {
                      Box(modifier.size(size)) {
                          Image(
                              bitmap = NatoSymbols.bitmap(context, res),
                              contentDescription = NatoSymbols.label(symbol),
                              modifier = Modifier.fillMaxSize(),
                              colorFilter = if (night) NightImageFilter else null,
                              filterQuality = FilterQuality.High,
                          )
                          EchelonMarks(
                              echelon = echelon,
                              color = if (night) NightRed
                              else Affiliations.color(affiliation, MaterialTheme.colorScheme.primary),
                              halo = MaterialTheme.colorScheme.background,
                          )
                      }
                      return
                  }
              }

              val color = if (night) NightRed
              else Affiliations.color(affiliation, MaterialTheme.colorScheme.primary)
              val isShape = WaypointSymbols.isShape(symbol)
              val isTask = WaypointSymbols.isTask(symbol)
              val taskLetter = if (isTask) WaypointSymbols.taskLetter(symbol) else null

              Box(modifier.size(size), contentAlignment = Alignment.Center) {
                  Canvas(Modifier.fillMaxSize()) {
                      val w = this.size.width
                      val h = this.size.height
                      val frameStroke = Stroke(width = w * 0.07f)
                      val glyphStroke = w * 0.08f

                      if (!isTask) {
                          when (affiliation) {
                              "friendly" -> drawRoundRect(
                                  color = color,
                                  topLeft = Offset(w * 0.04f, h * 0.20f),
                                  size = Size(w * 0.92f, h * 0.60f),
                                  cornerRadius = CornerRadius(w * 0.08f),
                                  style = frameStroke,
                              )
                              "hostile" -> {
                                  val p = Path().apply {
                                      moveTo(w / 2f, h * 0.05f)
                                      lineTo(w * 0.95f, h / 2f)
                                      lineTo(w / 2f, h * 0.95f)
                                      lineTo(w * 0.05f, h / 2f)
                                      close()
                                  }
                                  drawPath(p, color, style = frameStroke)
                              }
                              "neutral" -> drawRect(
                                  color = color,
                                  topLeft = Offset(w * 0.10f, h * 0.10f),
                                  size = Size(w * 0.80f, h * 0.80f),
                                  style = frameStroke,
                              )
                              "unknown" -> drawCircle(
                                  color = color,
                                  radius = w * 0.44f,
                                  style = frameStroke,
                              )
                          }
                      }

                      if (isShape) {
                          val s = w * 0.36f
                          when (symbol) {
                              "dot" -> drawCircle(color, radius = s * 0.45f)
                              "square" -> drawRect(
                                  color,
                                  topLeft = Offset(w / 2f - s * 0.42f, h / 2f - s * 0.42f),
                                  size = Size(s * 0.84f, s * 0.84f),
                              )
                              "triangle" -> {
                                  val p = Path().apply {
                                      moveTo(w / 2f, h / 2f - s * 0.55f)
                                      lineTo(w / 2f + s * 0.58f, h / 2f + s * 0.42f)
                                      lineTo(w / 2f - s * 0.58f, h / 2f + s * 0.42f)
                                      close()
                                  }
                                  drawPath(p, color)
                              }
                              "diamond" -> {
                                  val p = Path().apply {
                                      moveTo(w / 2f, h / 2f - s * 0.6f)
                                      lineTo(w / 2f + s * 0.6f, h / 2f)
                                      lineTo(w / 2f, h / 2f + s * 0.6f)
                                      lineTo(w / 2f - s * 0.6f, h / 2f)
                                      close()
                                  }
                                  drawPath(p, color)
                              }
                              "cross" -> rotate(45f) {
                                  val half = s * 0.6f
                                  val t = s * 0.3f
                                  drawLine(color, Offset(w / 2f - half, h / 2f), Offset(w / 2f + half, h / 2f), strokeWidth = t)
                                  drawLine(color, Offset(w / 2f, h / 2f - half), Offset(w / 2f, h / 2f + half), strokeWidth = t)
                              }
                          }
                      }

                      if (isTask && taskLetter == null) {
                          rotate(rotation) {
                          when (symbol) {
                              "task_block" -> {
                                  drawLine(color, Offset(w * 0.08f, h * 0.5f), Offset(w * 0.72f, h * 0.5f), glyphStroke)
                                  drawLine(color, Offset(w * 0.72f, h * 0.16f), Offset(w * 0.72f, h * 0.84f), glyphStroke)
                              }
                              "task_ambush" -> {
                                  // FM 1-02.2: curved position arc with rear tick marks; the arrow
                                  // rises from the arc's center of mass in the direction of fire.
                                  val p0 = Offset(w * 0.10f, h * 0.76f)
                                  val p1 = Offset(w * 0.90f, h * 0.76f)
                                  val ccx = w * 0.5f
                                  val ccy = h * 0.42f
                                  val arc = Path().apply {
                                      moveTo(p0.x, p0.y)
                                      quadraticBezierTo(ccx, ccy, p1.x, p1.y)
                                  }
                                  drawPath(arc, color, style = Stroke(glyphStroke))
                                  for (i in 1..6) {
                                      val t = i / 7f
                                      val mt = 1f - t
                                      val x = mt * mt * p0.x + 2f * mt * t * ccx + t * t * p1.x
                                      val y = mt * mt * p0.y + 2f * mt * t * ccy + t * t * p1.y
                                      val dx = 2f * mt * (ccx - p0.x) + 2f * t * (p1.x - ccx)
                                      val dy = 2f * mt * (ccy - p0.y) + 2f * t * (p1.y - ccy)
                                      val len = hypot(dx, dy)
                                      if (len > 0f) {
                                          val nx = -dy / len
                                          val ny = dx / len
                                          drawLine(
                                              color,
                                              Offset(x, y),
                                              Offset(x + nx * h * 0.11f, y + ny * h * 0.11f),
                                              glyphStroke * 0.8f,
                                          )
                                      }
                                  }
                                  val apexY = 0.25f * p0.y + 0.5f * ccy + 0.25f * p1.y
                                  drawLine(color, Offset(w * 0.5f, apexY), Offset(w * 0.5f, h * 0.14f), glyphStroke)
                                  solidHead(Offset(w * 0.5f, h * 0.08f), -90f, w * 0.15f, color)
                              }
                              "task_sbf" -> {
                                  // FM 1-02.2 support by fire: position baseline with an arm from each
                                  // end toward the enemy (solid arrowheads) and short rear flank legs.
                                  val baseY = h * 0.66f
                                  drawLine(color, Offset(w * 0.16f, baseY), Offset(w * 0.84f, baseY), glyphStroke)
                                  drawLine(color, Offset(w * 0.16f, baseY), Offset(w * 0.05f, h * 0.86f), glyphStroke)
                                  drawLine(color, Offset(w * 0.84f, baseY), Offset(w * 0.95f, h * 0.86f), glyphStroke)
                                  drawLine(color, Offset(w * 0.16f, baseY), Offset(w * 0.16f, h * 0.18f), glyphStroke)
                                  drawLine(color, Offset(w * 0.84f, baseY), Offset(w * 0.84f, h * 0.18f), glyphStroke)
                                  solidHead(Offset(w * 0.16f, h * 0.10f), -90f, w * 0.15f, color)
                                  solidHead(Offset(w * 0.84f, h * 0.10f), -90f, w * 0.15f, color)
                              }
                              "task_fix" -> {
                                  drawLine(color, Offset(w * 0.06f, h * 0.5f), Offset(w * 0.22f, h * 0.5f), glyphStroke)
                                  var x = w * 0.22f
                                  var up = true
                                  while (x < w * 0.66f) {
                                      val nx = x + w * 0.11f
                                      drawLine(
                                          color,
                                          Offset(x, if (up) h * 0.5f else h * 0.32f),
                                          Offset(nx, if (up) h * 0.32f else h * 0.5f),
                                          glyphStroke,
                                      )
                                      x = nx
                                      up = !up
                                  }
                                  drawLine(color, Offset(x, h * 0.5f), Offset(w * 0.86f, h * 0.5f), glyphStroke)
                                  arrowHead(Offset(w * 0.92f, h * 0.5f), 0f, w * 0.15f, color, glyphStroke)
                              }
                              "task_secure" -> {
                                  // FM 1-02.2: a circular arrow — the arc ENDS in the arrowhead
                                  val r = w * 0.32f
                                  drawArc(
                                      color, startAngle = -60f, sweepAngle = 300f, useCenter = false,
                                      topLeft = Offset(w / 2f - r, h / 2f - r),
                                      size = Size(2f * r, 2f * r),
                                      style = Stroke(glyphStroke),
                                  )
                                  val end = Math.toRadians(240.0)
                                  solidHead(
                                      Offset(w / 2f + r * cos(end).toFloat(), h / 2f + r * sin(end).toFloat()),
                                      240f + 90f, w * 0.15f, color,
                                  )
                              }
                              "task_occupy" -> {
                                  // Arrow enters the position; per doctrine its tip is a crossed (+) mark
                                  drawCircle(color, radius = w * 0.30f, style = Stroke(glyphStroke))
                                  drawLine(color, Offset(w * 0.05f, h * 0.95f), Offset(w * 0.45f, h * 0.55f), glyphStroke)
                                  val t = w * 0.10f
                                  drawLine(color, Offset(w * 0.45f - t, h * 0.55f - t), Offset(w * 0.45f + t, h * 0.55f + t), glyphStroke)
                                  drawLine(color, Offset(w * 0.45f - t, h * 0.55f + t), Offset(w * 0.45f + t, h * 0.55f - t), glyphStroke)
                              }
                              "task_retain" -> {
                                  // Arc with tick marks plus the entry arrow through the gap
                                  val r = w * 0.26f
                                  drawArc(
                                      color, startAngle = -50f, sweepAngle = 280f, useCenter = false,
                                      topLeft = Offset(w / 2f - r, h / 2f - r),
                                      size = Size(2f * r, 2f * r),
                                      style = Stroke(glyphStroke),
                                  )
                                  for (i in 0..9) {
                                      val ang = Math.toRadians(-50.0 + 280.0 * i / 9.0)
                                      drawLine(
                                          color,
                                          Offset(w / 2f + r * cos(ang).toFloat(), h / 2f + r * sin(ang).toFloat()),
                                          Offset(w / 2f + r * 1.40f * cos(ang).toFloat(), h / 2f + r * 1.40f * sin(ang).toFloat()),
                                          glyphStroke * 0.75f,
                                      )
                                  }
                                  drawLine(color, Offset(w / 2f, h * 0.02f), Offset(w / 2f, h * 0.28f), glyphStroke)
                                  solidHead(Offset(w / 2f, h * 0.34f), 90f, w * 0.13f, color)
                              }
                              "task_abf" -> {
                                  // Attack by fire: single arrow with angled rear legs
                                  drawLine(color, Offset(w * 0.5f, h * 0.70f), Offset(w * 0.5f, h * 0.16f), glyphStroke)
                                  solidHead(Offset(w * 0.5f, h * 0.10f), -90f, w * 0.15f, color)
                                  drawLine(color, Offset(w * 0.5f, h * 0.70f), Offset(w * 0.18f, h * 0.92f), glyphStroke)
                                  drawLine(color, Offset(w * 0.5f, h * 0.70f), Offset(w * 0.82f, h * 0.92f), glyphStroke)
                              }
                              "task_seize" -> {
                                  // Circle with a curved arrow sweeping onto it
                                  val cx = w * 0.66f
                                  val cyy = h * 0.34f
                                  drawCircle(color, radius = w * 0.16f, center = Offset(cx, cyy), style = Stroke(glyphStroke))
                                  val ar = w * 0.40f
                                  drawArc(
                                      color, startAngle = 100f, sweepAngle = 130f, useCenter = false,
                                      topLeft = Offset(cx - ar, cyy - ar),
                                      size = Size(2f * ar, 2f * ar),
                                      style = Stroke(glyphStroke),
                                  )
                                  val end = Math.toRadians(230.0)
                                  solidHead(
                                      Offset(cx + ar * cos(end).toFloat(), cyy + ar * sin(end).toFloat()),
                                      230f + 90f, w * 0.14f, color,
                                  )
                              }
                              "task_clear" -> {
                                  drawLine(color, Offset(w * 0.86f, h * 0.18f), Offset(w * 0.86f, h * 0.82f), glyphStroke)
                                  for (i in 0..2) {
                                      val y = h * (0.26f + 0.24f * i)
                                      drawLine(color, Offset(w * 0.86f, y), Offset(w * 0.24f, y), glyphStroke)
                                      solidHead(Offset(w * 0.16f, y), 180f, w * 0.13f, color)
                                  }
                              }
                              "task_destroy" -> {
                                  drawLine(color, Offset(w * 0.16f, h * 0.16f), Offset(w * 0.84f, h * 0.84f), glyphStroke)
                                  drawLine(color, Offset(w * 0.16f, h * 0.84f), Offset(w * 0.84f, h * 0.16f), glyphStroke)
                              }
                              "task_contain" -> {
                                  // Arc over the enemy, arrows down at both ends
                                  val r = w * 0.32f
                                  val cyy = h * 0.52f
                                  drawArc(
                                      color, startAngle = 180f, sweepAngle = 180f, useCenter = false,
                                      topLeft = Offset(w / 2f - r, cyy - r),
                                      size = Size(2f * r, 2f * r),
                                      style = Stroke(glyphStroke),
                                  )
                                  drawLine(color, Offset(w / 2f - r, cyy), Offset(w / 2f - r, cyy + h * 0.16f), glyphStroke)
                                  drawLine(color, Offset(w / 2f + r, cyy), Offset(w / 2f + r, cyy + h * 0.16f), glyphStroke)
                                  solidHead(Offset(w / 2f - r, cyy + h * 0.22f), 90f, w * 0.12f, color)
                                  solidHead(Offset(w / 2f + r, cyy + h * 0.22f), 90f, w * 0.12f, color)
                              }
                              "task_isolate" -> {
                                  // Circle with outward teeth; the arc ends in an arrowhead
                                  val r = w * 0.26f
                                  drawArc(
                                      color, startAngle = -70f, sweepAngle = 320f, useCenter = false,
                                      topLeft = Offset(w / 2f - r, h / 2f - r),
                                      size = Size(2f * r, 2f * r),
                                      style = Stroke(glyphStroke),
                                  )
                                  for (i in 0..7) {
                                      val ang = Math.toRadians(-60.0 + 300.0 * i / 7.0)
                                      val tp = Path().apply {
                                          moveTo(
                                              w / 2f + r * cos(ang - 0.10).toFloat(),
                                              h / 2f + r * sin(ang - 0.10).toFloat(),
                                          )
                                          lineTo(
                                              w / 2f + r * 1.35f * cos(ang).toFloat(),
                                              h / 2f + r * 1.35f * sin(ang).toFloat(),
                                          )
                                          lineTo(
                                              w / 2f + r * cos(ang + 0.10).toFloat(),
                                              h / 2f + r * sin(ang + 0.10).toFloat(),
                                          )
                                          close()
                                      }
                                      drawPath(tp, color)
                                  }
                                  val end = Math.toRadians(250.0)
                                  solidHead(
                                      Offset(w / 2f + r * cos(end).toFloat(), h / 2f + r * sin(end).toFloat()),
                                      250f + 90f, w * 0.13f, color,
                                  )
                              }
                              "task_disrupt" -> {
                                  drawLine(color, Offset(w * 0.28f, h * 0.14f), Offset(w * 0.28f, h * 0.86f), glyphStroke)
                                  val lens = floatArrayOf(0.66f, 0.86f, 0.66f)
                                  for (i in 0..2) {
                                      val y = h * (0.24f + 0.26f * i)
                                      drawLine(color, Offset(w * 0.28f, y), Offset(w * lens[i], y), glyphStroke)
                                      solidHead(Offset(w * (lens[i] + 0.06f), y), 0f, w * 0.12f, color)
                                  }
                              }
                              "task_breach" -> {
                                  drawLine(color, Offset(w * 0.32f, h * 0.12f), Offset(w * 0.32f, h * 0.38f), glyphStroke)
                                  drawLine(color, Offset(w * 0.68f, h * 0.12f), Offset(w * 0.68f, h * 0.38f), glyphStroke)
                                  drawLine(color, Offset(w * 0.32f, h * 0.62f), Offset(w * 0.32f, h * 0.88f), glyphStroke)
                                  drawLine(color, Offset(w * 0.68f, h * 0.62f), Offset(w * 0.68f, h * 0.88f), glyphStroke)
                                  drawLine(color, Offset(w * 0.06f, h * 0.5f), Offset(w * 0.82f, h * 0.5f), glyphStroke)
                                  solidHead(Offset(w * 0.90f, h * 0.5f), 0f, w * 0.14f, color)
