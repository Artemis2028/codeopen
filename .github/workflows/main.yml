          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.FilterChip
          import androidx.compose.material3.HorizontalDivider
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.OutlinedTextField
          import androidx.compose.material3.Switch
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.rememberCoroutineScope
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import app.gridfix.android.data.AppSettings
          import app.gridfix.android.data.SettingsRepository
          import kotlinx.coroutines.launch

          @Composable
          fun SettingsScreen(
              repo: SettingsRepository,
              settings: AppSettings,
              onOpenReference: () -> Unit = {},
          ) {
              val scope = rememberCoroutineScope()

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(20.dp),
              ) {
                  Text(
                      "SETTINGS",
                      style = MaterialTheme.typography.labelMedium,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                      letterSpacing = 2.sp,
                  )

                  SettingSwitch(
                      title = "Night mode",
                      subtitle = "Red-on-black display to preserve night vision",
                      checked = settings.nightMode,
                  ) { scope.launch { repo.setNightMode(it) } }

                  SettingSwitch(
                      title = "Keep screen on",
                      subtitle = "Prevent the display from sleeping while GridFix is open",
                      checked = settings.keepScreenOn,
                  ) { scope.launch { repo.setKeepScreenOn(it) } }

                  ChipGroup(
                      title = "MGRS precision",
                      options = listOf("4-digit", "6-digit", "8-digit", "10-digit"),
                      selected = when (settings.mgrsDigits) {
                          4 -> 0
                          6 -> 1
                          8 -> 2
                          else -> 3
                      },
                  ) { index -> scope.launch { repo.setMgrsDigits(listOf(4, 6, 8, 10)[index]) } }

                  ChipGroup(
                      title = "Lat/Lon format",
                      options = listOf("DD", "DDM", "DMS"),
                      selected = settings.latLonFormat,
                  ) { index -> scope.launch { repo.setLatLonFormat(index) } }

                  ChipGroup(
                      title = "Units",
                      options = listOf("Metric", "Imperial", "Nautical"),
                      selected = settings.units,
                  ) { index -> scope.launch { repo.setUnits(index) } }

                  ChipGroup(
                      title = "Angle unit",
                      options = listOf("Degrees", "Mils"),
                      selected = settings.angleUnit,
                  ) { index -> scope.launch { repo.setAngleUnit(index) } }

                  ChipGroup(
                      title = "North reference",
                      options = listOf("True", "Magnetic", "Grid"),
                      selected = settings.northRef,
                  ) { index -> scope.launch { repo.setNorthRef(index) } }

                  PaceSetting(
                      current = settings.pacePer100m,
                      onChange = { v -> scope.launch { repo.setPacePer100m(v) } },
                  )

                  HorizontalDivider(color = MaterialTheme.colorScheme.outline)

                  Column(
                      Modifier
                          .fillMaxWidth()
                          .clickable { onOpenReference() }
                  ) {
                      Text("Field reference", style = MaterialTheme.typography.bodyLarge)
                      Text(
                          "Phonetic alphabet · grid reading · pace counts · contours · symbols",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                  }

                  HorizontalDivider(color = MaterialTheme.colorScheme.outline)

                  Text(
                      "GridFix " + app.gridfix.android.BuildConfig.VERSION_NAME + "\n" +
                          "Working title — the public name is decided before launch.\n" +
                          "MGRS conversion by the NGA MGRS library (MIT license).\n\n" +
                          "GridFix is a training and recreation aid, not a primary means of navigation.",
                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
              }
          }

          @Composable
          private fun PaceSetting(current: Int, onChange: (Int) -> Unit) {
              var text by remember(current) { mutableStateOf(current.toString()) }
              Column {
                  Text("Pace count per 100 m", style = MaterialTheme.typography.titleMedium)
                  Text(
                      "Your paces for 100 m on flat ground — used on route cards. Walk a known 100 m to find it.",
                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
                  Spacer(Modifier.height(8.dp))
                  OutlinedTextField(
                      value = text,
                      onValueChange = { v ->
                          text = v.filter { it.isDigit() }.take(3)
                          text.toIntOrNull()?.let { n -> if (n in 30..200) onChange(n) }
                      },
                      singleLine = true,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                      suffix = { Text("paces") },
                  )
              }
          }

          @Composable
          private fun SettingSwitch(
              title: String,
              subtitle: String,
              checked: Boolean,
              onChange: (Boolean) -> Unit,
          ) {
              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                  Column(Modifier.weight(1f)) {
                      Text(title, style = MaterialTheme.typography.titleMedium)
                      Text(
                          subtitle,
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                  }
                  Switch(checked = checked, onCheckedChange = onChange)
              }
          }

          @Composable
          private fun ChipGroup(
              title: String,
              options: List<String>,
              selected: Int,
              onSelect: (Int) -> Unit,
          ) {
              Column {
                  Text(title, style = MaterialTheme.typography.titleMedium)
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      options.forEachIndexed { index, label ->
                          FilterChip(
                              selected = index == selected,
                              onClick = { onSelect(index) },
                              label = { Text(label) },
                          )
                      }
                  }
              }
          }
          EOF_GRIDFIX
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Sync v0.7.6 (signals pack) source from bootstrap workflow'
            git push origin HEAD:main
          fi

      - name: Guard NATO symbol assets
        run: |
          COUNT=$(ls app/src/main/res/drawable-nodpi 2>/dev/null | grep -c '^nato_' || true)
          if [ "$COUNT" -lt 52 ]; then
            echo "ERROR: expected the 52 curated NATO symbol PNGs in the repo, found $COUNT."
            echo "They were committed by the v0.2.2 bootstrap; do not delete them."
            exit 1
          fi
          echo "$COUNT NATO symbols present"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build status branch
        if: always()
        env:
          OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          mkdir -p /tmp/ci-status
          cd /tmp/ci-status
          git init -q -b ci-status
          {
            echo "outcome=$OUTCOME"
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > outcome.txt
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > buildlog.txt 2>/dev/null || echo "no log" > buildlog.txt
          if [ "$OUTCOME" = "success" ]; then
            cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" gridfix-debug.apk
          fi
          git add -A
          git -c user.email='ci@gridfix.local' -c user.name='GridFix CI' commit -qm "build ${{ github.run_number }}: $OUTCOME"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-status

      - name: Upload APK artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gridfix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest release for phone install
        if: steps.gradle.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gridfix-debug.apk
          gh release delete latest --yes || true
          git push --delete origin refs/tags/latest || true
          gh release create latest gridfix-debug.apk \
            --title "GridFix debug build ${{ github.run_number }}" \
            --notes 'On your Android phone: tap gridfix-debug.apk below, allow the install when prompted, open GridFix.'

      - name: Fail the job if the build failed
        if: steps.gradle.outcome != 'success'
        run: exit 1
