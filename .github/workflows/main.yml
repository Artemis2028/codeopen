          @Composable
          fun PositionScreen(
              fix: FixData,
              settings: AppSettings,
              repo: SettingsRepository,
              onMark: (() -> Unit)? = null,
          ) {
              val scope = rememberCoroutineScope()
              val context = LocalContext.current
              var markedAt by remember { mutableStateOf(0L) }
              var qrOpen by remember { mutableStateOf(false) }
              val speech = remember { Speech(context.applicationContext) }
              DisposableEffect(Unit) {
                  onDispose { speech.shutdown() }
              }

              // 1 Hz ticker for the clock and fix age
              val now by produceState(initialValue = System.currentTimeMillis()) {
                  while (true) {
                      value = System.currentTimeMillis()
                      delay(1000)
                  }
              }

              val loc = fix.location
              val parts = loc?.let { Coordinates.mgrs(it.latitude, it.longitude, settings.mgrsDigits) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp),
              ) {
                  // ---- Main MGRS card ----
                  Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)) {
                      Column(
                          Modifier
                              .fillMaxWidth()
                              .padding(20.dp)
                      ) {
                          Row(
                              Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically,
                          ) {
                              Text(
                                  "MGRS · WGS84",
                                  style = MaterialTheme.typography.labelMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  letterSpacing = 1.5.sp,
                              )
                              AssistChip(
                                  onClick = {
                                      val next = when (settings.mgrsDigits) {
                                          4 -> 6
                                          6 -> 8
                                          8 -> 10
                                          else -> 4
                                      }
                                      scope.launch { repo.setMgrsDigits(next) }
                                  },
                                  label = { Text("${settings.mgrsDigits}-DIGIT") },
                              )
                          }
                          Spacer(Modifier.height(10.dp))

                          if (loc == null) {
                              Text(
                                  "ACQUIRING SIGNAL",
                                  style = MaterialTheme.typography.headlineSmall,
                                  fontFamily = FontFamily.Monospace,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                              Spacer(Modifier.height(6.dp))
                              Text(
                                  "${fix.satellitesUsed}/${fix.satellitesVisible} satellites",
                                  style = MaterialTheme.typography.bodyMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                              if (!fix.gpsEnabled) {
                                  Spacer(Modifier.height(6.dp))
                                  Text(
                                      "GPS is off — enable Location in your phone's settings.",
                                      style = MaterialTheme.typography.bodyMedium,
                                      color = MaterialTheme.colorScheme.error,
                                  )
                              }
                          } else {
                              when {
                                  parts == null -> Text(
                                      "—",
                                      style = MaterialTheme.typography.headlineLarge,
                                      fontFamily = FontFamily.Monospace,
                                  )
                                  parts.square.isEmpty() -> Text(
                                      parts.full,
                                      style = MaterialTheme.typography.headlineMedium,
                                      fontFamily = FontFamily.Monospace,
                                      fontWeight = FontWeight.Bold,
                                      color = MaterialTheme.colorScheme.primary,
                                  )
                                  else -> {
                                      // Stacked land-nav layout: grid zone line, then easting
                                      // and northing on their own big lines
                                      Text(
                                          "${parts.gzd} ${parts.square}",
                                          style = MaterialTheme.typography.headlineMedium,
                                          fontFamily = FontFamily.Monospace,
                                          letterSpacing = 3.sp,
                                          color = MaterialTheme.colorScheme.onSurface,
                                      )
                                      Spacer(Modifier.height(10.dp))
                                      Text(
                                          parts.easting,
                                          fontSize = 54.sp,
                                          lineHeight = 58.sp,
                                          fontFamily = FontFamily.Monospace,
                                          fontWeight = FontWeight.Bold,
                                          letterSpacing = 6.sp,
                                          color = MaterialTheme.colorScheme.primary,
                                      )
                                      Spacer(Modifier.height(6.dp))
                                      Text(
                                          parts.northing,
                                          fontSize = 54.sp,
                                          lineHeight = 58.sp,
                                          fontFamily = FontFamily.Monospace,
                                          fontWeight = FontWeight.Bold,
                                          letterSpacing = 6.sp,
                                          color = MaterialTheme.colorScheme.primary,
                                      )
                                  }
                              }
                          }
                      }
                  }

                  // ---- Phonetic spell-out + voice + QR hand-off ----
                  if (loc != null && parts != null && parts.square.isNotEmpty()) {
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)) {
                          Row(
                              Modifier
                                  .fillMaxWidth()
                                  .padding(start = 14.dp, end = 4.dp, top = 8.dp, bottom = 8.dp),
                              verticalAlignment = Alignment.CenterVertically,
                          ) {
                              Column(Modifier.weight(1f)) {
                                  Text(
                                      "PHONETIC",
                                      style = MaterialTheme.typography.labelSmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                      letterSpacing = 1.2.sp,
                                  )
                                  Spacer(Modifier.height(4.dp))
                                  Text(
                                      Phonetic.mgrs(parts.full),
                                      style = MaterialTheme.typography.bodySmall,
                                      fontFamily = FontFamily.Monospace,
                                      color = MaterialTheme.colorScheme.onSurface,
                                  )
                              }
                              IconButton(onClick = { speech.speak(Phonetic.mgrsSpeech(parts.full)) }) {
                                  Icon(
                                      Icons.Outlined.VolumeUp,
                                      contentDescription = "Speak grid",
                                      tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                              IconButton(onClick = { qrOpen = true }) {
                                  Icon(
                                      Icons.Outlined.QrCode2,
                                      contentDescription = "Share as QR code",
                                      tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                          }
                      }
                  }

                  // ---- One-tap MARK: timestamped waypoint at the current fix ----
                  if (onMark != null) {
                      Button(
                          onClick = {
                              onMark()
                              markedAt = now
                          },
                          enabled = loc != null,
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(52.dp),
                          colors = ButtonDefaults.buttonColors(
                              containerColor = MaterialTheme.colorScheme.secondary,
                              contentColor = MaterialTheme.colorScheme.onSecondary,
                          ),
                      ) {
                          Text(
                              if (now - markedAt < 3000) "MARKED — set as Navigate target" else "MARK",
                              fontFamily = FontFamily.Monospace,
                              fontWeight = FontWeight.Bold,
                              letterSpacing = 2.sp,
                          )
                      }
                  }

                  // ---- Secondary readouts ----
                  InfoCard(
                      label = "LAT / LON",
                      value = loc?.let { Coordinates.formatLatLon(it.latitude, it.longitude, settings.latLonFormat) } ?: "—",
                      modifier = Modifier.fillMaxWidth(),
                  )
                  InfoCard(
                      label = "UTM",
                      value = loc?.let { Coordinates.formatUtm(Coordinates.utm(it.latitude, it.longitude)) } ?: "—",
                      modifier = Modifier.fillMaxWidth(),
                  )
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      InfoCard(
                          label = "ALTITUDE MSL",
                          value = if (loc != null && loc.hasAltitude()) {
                              Coordinates.formatAltitude(loc.altitude, settings.units)
                          } else "—",
                          modifier = Modifier.weight(1f),
                      )
                      InfoCard(
                          label = "ACCURACY",
                          value = if (loc != null && loc.hasAccuracy()) {
                              Coordinates.formatAccuracy(loc.accuracy, settings.units)
                          } else "—",
                          modifier = Modifier.weight(1f),
                      )
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      InfoCard(
                          label = "SPEED",
                          value = if (loc != null && loc.hasSpeed()) {
                              Coordinates.formatSpeed(loc.speed, settings.units)
                          } else "—",
                          modifier = Modifier.weight(1f),
                      )
                      InfoCard(
                          label = "HEADING",
                          value = if (loc != null && loc.hasBearing() && loc.hasSpeed() && loc.speed > 0.5f) {
                              "${loc.bearing.roundToInt()}° T"
                          } else "—",
                          modifier = Modifier.weight(1f),
                      )
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      InfoCard(
                          label = "DTG ZULU",
                          value = Coordinates.dtg(now),
                          modifier = Modifier.weight(1f),
                      )
                      InfoCard(
                          label = "FIX AGE",
                          value = loc?.let { fixAge(it, now) } ?: "—",
                          modifier = Modifier.weight(1f),
                      )
                  }
                  Text(
                      "GNSS ${fix.satellitesUsed}/${fix.satellitesVisible} SATELLITES IN FIX",
                      style = MaterialTheme.typography.labelSmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                      letterSpacing = 1.2.sp,
                      textAlign = TextAlign.Center,
                      modifier = Modifier.fillMaxWidth(),
                  )
              }

              if (qrOpen && loc != null) {
                  QrDialog(
                      title = "My position",
                      payload = geoUri(loc.latitude, loc.longitude, "Position " + Coordinates.dtg(now).take(7)),
                      caption = parts?.full ?: "",
                      onDismiss = { qrOpen = false },
                  )
              }
          }

          private fun fixAge(loc: Location, now: Long): String {
              val s = ((now - loc.time) / 1000).coerceAtLeast(0)
              return when {
                  s < 60 -> "${s}s"
                  s < 3600 -> "${s / 60}m ${s % 60}s"
                  else -> ">1h"
              }
          }

          @Composable
          private fun InfoCard(label: String, value: String, modifier: Modifier = Modifier) {
              Card(
                  modifier = modifier,
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
              ) {
                  Column(Modifier.padding(14.dp)) {
                      Text(
                          label,
                          style = MaterialTheme.typography.labelSmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          letterSpacing = 1.2.sp,
                      )
                      Spacer(Modifier.height(6.dp))
                      Text(
                          value,
                          style = MaterialTheme.typography.titleMedium,
                          fontFamily = FontFamily.Monospace,
                          color = MaterialTheme.colorScheme.onSurface,
                      )
                  }
              }
          }
