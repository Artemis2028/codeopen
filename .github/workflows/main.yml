              waypoints: List<Waypoint>,
              folders: List<FolderInfo>,
              onAdd: (WaypointDraft) -> Unit,
              onUpdate: (id: String, draft: WaypointDraft) -> Unit,
              onDelete: (String) -> Unit,
              onNavigateTo: (String) -> Unit,
              onAddFolder: (String) -> Unit,
              onSetFolderVisible: (name: String, visible: Boolean) -> Unit,
              graphics: List<TacGraphic>,
              onDeleteGraphic: (String) -> Unit,
              onClearGraphics: (folder: String) -> Unit,
              tracks: List<TrackInfo>,
              viewedTrackId: String?,
              onViewTrack: (String?) -> Unit,
              onDeleteTrack: (String) -> Unit,
              onBacktrackTrack: (TrackInfo) -> Unit,
              onShowOnMap: (Waypoint) -> Unit,
              onShowGraphicOnMap: (TacGraphic) -> Unit,
              unitNameFor: (symbol: String, echelon: String) -> String,
              onImport: (InterchangeFiles.ImportedData, onDone: (String) -> Unit) -> Unit,
              onExport: (format: String, onDone: (String?) -> Unit) -> Unit,
          )
          {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              var dialogOpen by remember { mutableStateOf(false) }
              var editing by remember { mutableStateOf<Waypoint?>(null) }
              var deleteCandidate by remember { mutableStateOf<Waypoint?>(null) }
              var deleteGraphicCandidate by remember { mutableStateOf<TacGraphic?>(null) }
              var deleteTrackCandidate by remember { mutableStateOf<TrackInfo?>(null) }
              var clearFolderCandidate by remember { mutableStateOf<String?>(null) }
              var routeCardFor by remember { mutableStateOf<TacGraphic?>(null) }
              var exportOpen by remember { mutableStateOf(false) }
              var ioMessage by remember { mutableStateOf<String?>(null) }

              val importLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri != null) {
                      scope.launch {
                          var display = "file"
                          context.contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                              val idx = cursor.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME)
                              if (idx >= 0 && cursor.moveToFirst()) cursor.getString(idx)?.let { display = it }
                          }
                          val data = withContext(Dispatchers.IO) {
                              runCatching {
                                  context.contentResolver.openInputStream(uri)?.use { stream ->
                                      InterchangeFiles.parse(display, stream)
                                  }
                              }.getOrNull()
                          }
                          when {
                              data == null -> ioMessage = "Couldn't read $display — GPX, KML, or KMZ expected"
                              data.isEmpty -> ioMessage = "Nothing importable in $display"
                              else -> onImport(data) { summary -> ioMessage = summary }
                          }
                      }
                  }
              }
              var newFolderOpen by remember { mutableStateOf(false) }
              val collapsed = remember { mutableStateMapOf<String, Boolean>() }
              val loc = fix.location
              val byFolder = waypoints.groupBy { it.folder }
              val graphicsByFolder = graphics.groupBy { it.folder }

              fun shareGpx(track: TrackInfo) {
                  scope.launch {
                      runCatching {
                          val points = TrackRepository.readPoints(context, track.id)
                          val gpx = TrackRepository.buildGpx(track.name, points)
                          val safe = track.name.replace(Regex("[^A-Za-z0-9 _-]"), "_").trim().ifBlank { "track" }
                          val file = withContext(Dispatchers.IO) {
                              val dir = File(context.cacheDir, "share").apply { mkdirs() }
                              File(dir, "$safe.gpx").apply { writeText(gpx) }
                          }
                          val uri = FileProvider.getUriForFile(
                              context, "app.gridfix.android.fileprovider", file
                          )
                          val send = android.content.Intent(android.content.Intent.ACTION_SEND).apply {
                              type = "application/gpx+xml"
                              putExtra(android.content.Intent.EXTRA_STREAM, uri)
                              addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          }
                          context.startActivity(
                              android.content.Intent.createChooser(send, "Share GPX track")
                          )
                      }
                  }
              }

              Box(Modifier.fillMaxSize()) {
                  LazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(start = 16.dp, end = 16.dp, top = 8.dp, bottom = 96.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp),
                  ) {
                      item(key = "overlays-header") {
                          Row(
                              Modifier.fillMaxWidth(),
                              verticalAlignment = Alignment.CenterVertically,
                          ) {
                              Text(
                                  "OVERLAYS",
                                  style = MaterialTheme.typography.labelMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  letterSpacing = 2.sp,
                                  modifier = Modifier.weight(1f),
                              )
                              IconButton(onClick = { importLauncher.launch(arrayOf("*/*")) }) {
                                  Icon(
                                      Icons.Outlined.FileUpload,
                                      contentDescription = "Import GPX/KML/KMZ",
                                      tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                              IconButton(onClick = { exportOpen = true }) {
                                  Icon(
                                      Icons.Outlined.FileDownload,
                                      contentDescription = "Export",
                                      tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                              TextButton(onClick = { newFolderOpen = true }) {
                                  Icon(
                                      Icons.Outlined.CreateNewFolder,
                                      contentDescription = null,
                                      modifier = Modifier.size(18.dp),
                                  )
                                  Spacer(Modifier.size(6.dp))
                                  Text("New folder")
                              }
                          }
                      }

                      ioMessage?.let { msg ->
                          item(key = "io-message") {
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clickable { ioMessage = null },
                                  colors = CardDefaults.cardColors(
                                      containerColor = MaterialTheme.colorScheme.surfaceVariant
                                  ),
                              ) {
                                  Text(
                                      msg,
                                      style = MaterialTheme.typography.bodySmall,
                                      fontFamily = FontFamily.Monospace,
                                      modifier = Modifier.padding(10.dp),
                                  )
                              }
                          }
                      }

                      folders.forEach { folder ->
                          val list = byFolder[folder.name].orEmpty()
                          val glist = graphicsByFolder[folder.name].orEmpty()
                          val isCollapsed = collapsed[folder.name] == true
                          item(key = "folder-${folder.name}") {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clickable { collapsed[folder.name] = !isCollapsed },
                                  verticalAlignment = Alignment.CenterVertically,
                              ) {
                                  Icon(
                                      if (isCollapsed || !folder.visible) Icons.Outlined.ExpandMore
                                      else Icons.Outlined.ExpandLess,
                                      contentDescription = null,
                                      tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                                  Spacer(Modifier.size(8.dp))
                                  Text(
                                      folder.name.uppercase(Locale.US),
                                      style = MaterialTheme.typography.labelMedium,
                                      color = if (folder.visible) MaterialTheme.colorScheme.primary
                                      else MaterialTheme.colorScheme.onSurfaceVariant,
                                      letterSpacing = 2.sp,
                                      modifier = Modifier.weight(1f),
                                  )
                                  Text(
                                      if (glist.isEmpty()) "${list.size}" else "${list.size} + ${glist.size}",
                                      style = MaterialTheme.typography.labelMedium,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                                  IconButton(onClick = { onSetFolderVisible(folder.name, !folder.visible) }) {
                                      Icon(
                                          if (folder.visible) Icons.Outlined.Visibility
                                          else Icons.Outlined.VisibilityOff,
                                          contentDescription = if (folder.visible) "Hide overlay" else "Show overlay",
                                          tint = if (folder.visible) MaterialTheme.colorScheme.primary
                                          else MaterialTheme.colorScheme.onSurfaceVariant,
                                      )
                                  }
                              }
                          }
                          if (folder.visible && !isCollapsed) {
                              val (wps, units) = list.partition { it.kind != KIND_UNIT }
                              items(wps, key = { it.id }) { w ->
                                  WaypointRow(
                                      w = w,
                                      loc = loc,
                                      settings = settings,
                                      onClick = { onNavigateTo(w.id) },
                                      onEdit = { editing = w; dialogOpen = true },
                                      onDelete = { deleteCandidate = w },
                                      onShowOnMap = { onShowOnMap(w) },
                                  )
                              }
                              if (units.isNotEmpty()) {
                                  item(key = "units-${folder.name}") {
                                      Text(
                                          "UNITS",
                                          style = MaterialTheme.typography.labelSmall,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                                          letterSpacing = 2.sp,
                                          modifier = Modifier.padding(start = 4.dp, top = 4.dp),
                                      )
                                  }
                              }
                              items(units, key = { it.id }) { w ->
                                  WaypointRow(
                                      w = w,
                                      loc = loc,
                                      settings = settings,
                                      onClick = { onShowOnMap(w) },
                                      onEdit = { editing = w; dialogOpen = true },
                                      onDelete = { deleteCandidate = w },
                                      onShowOnMap = { onShowOnMap(w) },
                                  )
                              }
                              items(glist, key = { "g-" + it.id }) { g ->
                                  GraphicRow(
                                      g = g,
                                      night = settings.nightMode,
                                      onClick = { onShowGraphicOnMap(g) },
                                      onCard = if (g.type == "route") {
                                          { routeCardFor = g }
                                      } else null,
                                      onDelete = { deleteGraphicCandidate = g },
                                  )
                              }
                              if (glist.size > 1) {
                                  item(key = "clear-${folder.name}") {
                                      TextButton(onClick = { clearFolderCandidate = folder.name }) {
                                          Text("Clear ${glist.size} graphics in ${folder.name}")
                                      }
                                  }
                              }
                          }
                      }

                      if (tracks.isNotEmpty()) {
                          item(key = "tracks-header") {
                              Text(
                                  "TRACKS",
                                  style = MaterialTheme.typography.labelMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  letterSpacing = 2.sp,
                                  modifier = Modifier.padding(top = 12.dp),
                              )
                          }
                          items(tracks, key = { "t-" + it.id }) { t ->
                              TrackRow(
                                  t = t,
                                  settings = settings,
                                  viewed = t.id == viewedTrackId,
                                  onView = { onViewTrack(if (t.id == viewedTrackId) null else t.id) },
                                  onShare = { shareGpx(t) },
                                  onDelete = { deleteTrackCandidate = t },
                                  onBacktrack = { onBacktrackTrack(t) },
                              )
                          }
                      }

                      if (waypoints.isEmpty()) {
                          item(key = "empty-hint") {
                              Text(
                                  "No waypoints yet — tap + to mark your current position or enter an MGRS grid.",
                                  style = MaterialTheme.typography.bodyMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  textAlign = TextAlign.Center,
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(top = 24.dp),
                              )
                          }
                      }
                  }

                  FloatingActionButton(
                      onClick = { editing = null; dialogOpen = true },
                      modifier = Modifier
                          .align(Alignment.BottomEnd)
                          .padding(20.dp),
                      containerColor = MaterialTheme.colorScheme.primary,
                      contentColor = MaterialTheme.colorScheme.onPrimary,
                  ) {
                      Icon(Icons.Filled.Add, contentDescription = "Add waypoint")
                  }
              }

              if (dialogOpen) {
                  WaypointDialog(
                      initial = editing,
                      presetLat = loc?.latitude,
                      presetLon = loc?.longitude,
                      presetLabel = "Current position",
                      folderNames = folders.map { it.name },
                      defaultName = "WP " + (waypoints.size + 1),
                      onConfirm = { draft ->
                          val target = editing
                          if (target == null) onAdd(draft) else onUpdate(target.id, draft)
                          dialogOpen = false
                      },
                      onDismiss = { dialogOpen = false },
                      settings = settings,
                      projectBases = waypoints,
                      unitNameFor = unitNameFor,
                  )
              }

              if (newFolderOpen) {
                  var folderName by remember { mutableStateOf("") }
                  AlertDialog(
                      onDismissRequest = { newFolderOpen = false },
                      title = { Text("New folder") },
                      text = {
                          OutlinedTextField(
                              value = folderName,
                              onValueChange = { folderName = it },
                              label = { Text("Folder name") },
                              singleLine = true,
                          )
                      },
                      confirmButton = {
                          TextButton(onClick = {
                              if (folderName.isNotBlank()) onAddFolder(folderName.trim())
                              newFolderOpen = false
                          }) { Text("Create") }
                      },
                      dismissButton = {
                          TextButton(onClick = { newFolderOpen = false }) { Text("Cancel") }
                      },
                  )
              }

              routeCardFor?.let { r ->
                  RouteCardDialog(
                      route = r,
                      settings = settings,
                      onDismiss = { routeCardFor = null },
                  )
              }

              if (exportOpen) {
                  AlertDialog(
                      onDismissRequest = { exportOpen = false },
                      title = { Text("Export") },
                      text = {
                          Text(
                              "GPX carries waypoints, routes, and tracks (widest app support). " +
                                  "KML carries everything including drawn graphics (Google Earth, ATAK).",
                          )
                      },
                      confirmButton = {
                          Row {
                              TextButton(onClick = {
                                  exportOpen = false
                                  onExport("gpx") { r -> ioMessage = r?.let { "Sharing $it" } ?: "Export failed" }
                              }) { Text("GPX") }
                              TextButton(onClick = {
                                  exportOpen = false
                                  onExport("kml") { r -> ioMessage = r?.let { "Sharing $it" } ?: "Export failed" }
                              }) { Text("KML") }
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { exportOpen = false }) { Text("Cancel") }
                      },
                  )
              }

              deleteTrackCandidate?.let { t ->
                  AlertDialog(
                      onDismissRequest = { deleteTrackCandidate = null },
                      title = { Text("Delete ${t.name}?") },
                      text = { Text("The recorded track and its point log will be removed permanently.") },
                      confirmButton = {
                          TextButton(onClick = {
                              onDeleteTrack(t.id)
                              deleteTrackCandidate = null
                          }) { Text("Delete") }
                      },
                      dismissButton = {
                          TextButton(onClick = { deleteTrackCandidate = null }) { Text("Cancel") }
                      },
                  )
              }

              deleteGraphicCandidate?.let { g ->
                  AlertDialog(
                      onDismissRequest = { deleteGraphicCandidate = null },
                      title = { Text("Delete ${g.name.ifBlank { GraphicTypes.label(g.type) }}?") },
                      text = { Text("This drawn graphic will be removed permanently.") },
                      confirmButton = {
                          TextButton(onClick = {
                              onDeleteGraphic(g.id)
                              deleteGraphicCandidate = null
                          }) { Text("Delete") }
                      },
                      dismissButton = {
                          TextButton(onClick = { deleteGraphicCandidate = null }) { Text("Cancel") }
                      },
                  )
              }

              clearFolderCandidate?.let { fname ->
                  val count = graphicsByFolder[fname].orEmpty().size
                  AlertDialog(
                      onDismissRequest = { clearFolderCandidate = null },
                      title = { Text("Clear $fname?") },
                      text = { Text("All $count drawn graphics in this folder will be removed permanently. Waypoints are not affected.") },
                      confirmButton = {
                          TextButton(onClick = {
                              onClearGraphics(fname)
                              clearFolderCandidate = null
                          }) { Text("Clear") }
                      },
                      dismissButton = {
                          TextButton(onClick = { clearFolderCandidate = null }) { Text("Cancel") }
                      },
                  )
              }

              deleteCandidate?.let { w ->
                  AlertDialog(
                      onDismissRequest = { deleteCandidate = null },
                      title = { Text("Delete ${w.name}?") },
                      text = { Text("This waypoint will be removed permanently.") },
                      confirmButton = {
                          TextButton(onClick = {
                              onDelete(w.id)
                              deleteCandidate = null
                          }) { Text("Delete") }
                      },
                      dismissButton = {
                          TextButton(onClick = { deleteCandidate = null }) { Text("Cancel") }
                      },
                  )
              }
          }

          @Composable
          private fun TrackRow(
              t: TrackInfo,
              settings: AppSettings,
              viewed: Boolean,
              onView: () -> Unit,
              onShare: () -> Unit,
              onDelete: () -> Unit,
              onBacktrack: () -> Unit,
          ) {
              Card(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clickable(onClick = onView),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
              ) {
                  Row(
                      Modifier
                          .fillMaxWidth()
                          .padding(start = 12.dp, top = 8.dp, bottom = 8.dp, end = 2.dp),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      Icon(
                          Icons.Outlined.Map,
                          contentDescription = if (viewed) "Hide from map" else "Show on map",
                          tint = if (viewed) MaterialTheme.colorScheme.primary
                          else MaterialTheme.colorScheme.onSurfaceVariant,
                          modifier = Modifier.size(26.dp),
                      )
                      Spacer(Modifier.size(12.dp))
                      Column(Modifier.weight(1f)) {
                          Text(t.name, style = MaterialTheme.typography.titleMedium)
                          val sdf = SimpleDateFormat("dd MMM HH:mm", Locale.US)
                          val durMin = if (t.endedAt > t.startedAt) (t.endedAt - t.startedAt) / 60000 else 0
                          Text(
                              Coordinates.formatDistance(t.distanceM.toFloat(), settings.units) +
                                  "  ·  ${durMin} min  ·  " + sdf.format(Date(t.startedAt)) +
                                  if (viewed) "  ·  ON MAP" else "",
                              style = MaterialTheme.typography.bodySmall,
                              fontFamily = FontFamily.Monospace,
                              color = if (viewed) MaterialTheme.colorScheme.primary
                              else MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                      }
                      var menuOpen by remember { mutableStateOf(false) }
                      Box {
                          IconButton(onClick = { menuOpen = true }) {
                              Icon(
                                  Icons.Outlined.MoreVert,
                                  contentDescription = "Track options",
                                  tint = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          }
                          DropdownMenu(expanded = menuOpen, onDismissRequest = { menuOpen = false }) {
                              DropdownMenuItem(
                                  text = { Text("Back-track route") },
                                  leadingIcon = { Icon(Icons.Outlined.Timeline, contentDescription = null) },
                                  onClick = { menuOpen = false; onBacktrack() },
                              )
                              DropdownMenuItem(
                                  text = { Text("Share GPX") },
                                  leadingIcon = { Icon(Icons.Outlined.Share, contentDescription = null) },
                                  onClick = { menuOpen = false; onShare() },
                              )
                              DropdownMenuItem(
                                  text = { Text("Delete") },
                                  leadingIcon = { Icon(Icons.Outlined.Delete, contentDescription = null) },
                                  onClick = { menuOpen = false; onDelete() },
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun GraphicRow(
              g: TacGraphic,
              night: Boolean,
              onClick: () -> Unit,
              onCard: (() -> Unit)?,
              onDelete: () -> Unit,
          ) {
              Card(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clickable(onClick = onClick),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
              ) {
                  Row(
                      Modifier
                          .fillMaxWidth()
                          .padding(start = 12.dp, top = 8.dp, bottom = 8.dp, end = 2.dp),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      Icon(
                          Icons.Outlined.Timeline,
                          contentDescription = null,
                          tint = if (night) Color(0xFFFF3B30)
                          else Affiliations.color(g.affiliation, MaterialTheme.colorScheme.primary),
                          modifier = Modifier.size(26.dp),
                      )
                      Spacer(Modifier.size(12.dp))
                      Column(Modifier.weight(1f)) {
                          Text(
                              g.name.ifBlank { GraphicTypes.label(g.type) },
                              style = MaterialTheme.typography.titleMedium,
                          )
                          Text(
                              "${GraphicTypes.label(g.type)} · ${g.points.size} points",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                      }
                      if (onCard != null) {
                          IconButton(onClick = onCard) {
                              Icon(
                                  Icons.Outlined.Description,
                                  contentDescription = "Route card",
                                  tint = MaterialTheme.colorScheme.primary,
                              )
                          }
                      }
                      IconButton(onClick = onDelete) {
                          Icon(
                              Icons.Outlined.Delete,
                              contentDescription = "Delete graphic",
                              tint = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                      }
                  }
              }
          }

          @Composable
          private fun WaypointRow(
              w: Waypoint,
              loc: android.location.Location?,
              settings: AppSettings,
              onClick: () -> Unit,
              onEdit: () -> Unit,
              onDelete: () -> Unit,
              onShowOnMap: () -> Unit,
          ) {
              Card(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clickable(onClick = onClick),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
              ) {
                  Row(
                      Modifier
                          .fillMaxWidth()
                          .padding(start = 12.dp, top = 12.dp, bottom = 12.dp, end = 2.dp),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      WaypointMarker(symbol = w.symbol, affiliation = w.affiliation, size = 34.dp, echelon = w.echelon, night = settings.nightMode, rotation = w.rotation)
                      Spacer(Modifier.size(12.dp))
                      Column(Modifier.weight(1f)) {
                          Text(w.name, style = MaterialTheme.typography.titleMedium)
                          Spacer(Modifier.height(2.dp))
                          Text(
                              Coordinates.mgrs(w.lat, w.lon, 8)?.full
                                  ?: String.format(Locale.US, "%.5f, %.5f", w.lat, w.lon),
                              style = MaterialTheme.typography.bodySmall,
                              fontFamily = FontFamily.Monospace,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                          if (w.kind == KIND_UNIT) {
                              val ech = Echelons.label(w.echelon).takeIf { w.echelon.isNotEmpty() }
                              Text(
                                  listOfNotNull(
                                      NatoSymbols.label(w.symbol),
                                      ech,
                                      w.designation.takeIf { it.isNotEmpty() },
                                  ).joinToString(" · "),
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          }
                      }
                      if (loc != null) {
                          val nav = Coordinates.navInfo(loc.latitude, loc.longitude, w.lat, w.lon)
                          Column(horizontalAlignment = Alignment.End) {
                              Text(
                                  Coordinates.formatDistance(nav.distanceMeters, settings.units),
                                  style = MaterialTheme.typography.titleMedium,
                                  fontFamily = FontFamily.Monospace,
                                  color = MaterialTheme.colorScheme.primary,
                              )
                              Text(
                                  Coordinates.formatAngle(nav.bearingTrue, settings.angleUnit) + " T",
                                  style = MaterialTheme.typography.bodySmall,
                                  fontFamily = FontFamily.Monospace,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          }
                      }
                      var menuOpen by remember { mutableStateOf(false) }
                      Box {
                          IconButton(onClick = { menuOpen = true }) {
                              Icon(
                                  Icons.Outlined.MoreVert,
                                  contentDescription = "Waypoint options",
                                  tint = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          }
                          DropdownMenu(expanded = menuOpen, onDismissRequest = { menuOpen = false }) {
                              DropdownMenuItem(
                                  text = { Text("Show on map") },
                                  leadingIcon = { Icon(Icons.Outlined.Map, contentDescription = null) },
                                  onClick = { menuOpen = false; onShowOnMap() },
                              )
                              DropdownMenuItem(
                                  text = { Text("Edit") },
                                  leadingIcon = { Icon(Icons.Outlined.Edit, contentDescription = null) },
                                  onClick = { menuOpen = false; onEdit() },
                              )
                              DropdownMenuItem(
                                  text = { Text("Delete") },
                                  leadingIcon = { Icon(Icons.Outlined.Delete, contentDescription = null) },
                                  onClick = { menuOpen = false; onDelete() },
                              )
                          }
                      }
                  }
              }
          }

          EOF_GRIDFIX
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Sync v0.7.1 (field skills) source from bootstrap workflow'
            git push origin HEAD:main
          fi

      - name: Guard NATO symbol assets
        run: |
          COUNT=$(ls app/src/main/res/drawable-nodpi 2>/dev/null | grep -c '^nato_' || true)
          if [ "$COUNT" -lt 52 ]; then
            echo "ERROR: expected the 52 curated NATO symbol PNGs in the repo, found $COUNT."
            echo "They were committed by the v0.2.2 bootstrap; do not delete them."
            exit 1
          fi
          echo "$COUNT NATO symbols present"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build status branch
        if: always()
        env:
          OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          mkdir -p /tmp/ci-status
          cd /tmp/ci-status
          git init -q -b ci-status
          {
            echo "outcome=$OUTCOME"
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > outcome.txt
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > buildlog.txt 2>/dev/null || echo "no log" > buildlog.txt
          if [ "$OUTCOME" = "success" ]; then
            cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" gridfix-debug.apk
          fi
          git add -A
          git -c user.email='ci@gridfix.local' -c user.name='GridFix CI' commit -qm "build ${{ github.run_number }}: $OUTCOME"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-status

      - name: Upload APK artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gridfix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest release for phone install
        if: steps.gradle.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gridfix-debug.apk
          gh release delete latest --yes || true
          git push --delete origin refs/tags/latest || true
          gh release create latest gridfix-debug.apk \
            --title "GridFix debug build ${{ github.run_number }}" \
            --notes 'On your Android phone: tap gridfix-debug.apk below, allow the install when prompted, open GridFix.'

      - name: Fail the job if the build failed
        if: steps.gradle.outcome != 'success'
        run: exit 1
