                                  "imported directly by ATAK/CivTAK.",
                          )
                      },
                      confirmButton = {
                          Row(Modifier.horizontalScroll(rememberScrollState())) {
                              TextButton(onClick = {
                                  exportOpen = false
                                  onExport("gpx") { r -> ioMessage = r?.let { "Sharing $it" } ?: "Export failed" }
                              }) { Text("GPX") }
                              TextButton(onClick = {
                                  exportOpen = false
                                  onExport("kml") { r -> ioMessage = r?.let { "Sharing $it" } ?: "Export failed" }
                              }) { Text("KML") }
                              TextButton(onClick = {
