      - name: Curate NATO symbol assets (first time only)
        run: |
          DEST=app/src/main/res/drawable-nodpi
          if [ -f "$DEST/nato_f_inf.png" ]; then
            echo "NATO symbols already curated"
            exit 0
          fi
          NZIP=$(ls | grep -iE '^nato[ _]?icons[.]zip$' | head -1 || true)
          if [ -z "$NZIP" ]; then
            echo "ERROR: NATO symbols are not curated yet and no 'Nato Icons.zip' was found in the repo root."
            echo "Upload the zip via GitHub web (Add file -> Upload files) and this step will finish the job."
            exit 1
          fi
          mkdir -p /tmp/nato "$DEST"
          unzip -oq "$NZIP" -d /tmp/nato
          curate() {
            aff="$1"; prefix="$2"; folder="$3"
            while read -r code func; do
              src=$(ls "/tmp/nato/$folder/" | grep -E "^${prefix}gp${code}-*[.]png$" | head -1)
              if [ -n "$src" ]; then
                cp "/tmp/nato/$folder/$src" "$DEST/nato_${aff}_${func}.png"
              else
                echo "WARNING: no match for $folder $code"
              fi
            done <<'CODES'
          uci inf
          uciz mechinf
          uca armor
          ucr recon
          ucf arty
          ucd airdef
          ucaa antiarmor
          uce engineer
          ucv avn
          usm medical
          uss supply
          uus signal
          uh unit
          CODES
          }
          curate f '1[.]sf' 'Friend Land'
          curate h '3[.]sh' 'Hostile Land'
          curate n '2[.]sn' 'Neutral Land'
          curate u '0[.]su' 'Unknown Land'
          COUNT=$(ls "$DEST" | grep -c '^nato_' || true)
          echo "Curated $COUNT NATO symbols"
          if [ "$COUNT" -lt 52 ]; then
            echo "ERROR: expected 52 curated symbols, got $COUNT"
            exit 1
          fi
          rm -f "$NZIP"
          git add -A
          git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm "Curate 52 NATO unit symbols into drawables; remove source zip"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build status branch
        if: always()
        env:
          OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          mkdir -p /tmp/ci-status
          cd /tmp/ci-status
          git init -q -b ci-status
          {
            echo "outcome=$OUTCOME"
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > outcome.txt
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > buildlog.txt 2>/dev/null || echo "no log" > buildlog.txt
          if [ "$OUTCOME" = "success" ]; then
            cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" gridfix-debug.apk
          fi
          git add -A
          git -c user.email='ci@gridfix.local' -c user.name='GridFix CI' commit -qm "build ${{ github.run_number }}: $OUTCOME"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-status

      - name: Upload APK artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gridfix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest release for phone install
        if: steps.gradle.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gridfix-debug.apk
          gh release delete latest --yes || true
          git push --delete origin refs/tags/latest || true
          gh release create latest gridfix-debug.apk \
            --title "GridFix debug build ${{ github.run_number }}" \
            --notes 'On your Android phone: tap gridfix-debug.apk below, allow the install when prompted, open GridFix.'

      - name: Fail the job if the build failed
        if: steps.gradle.outcome != 'success'
        run: exit 1
